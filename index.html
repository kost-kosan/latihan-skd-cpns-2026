m("TIU","Gedung 4 lantai. Perpustakaan di lantai 3. Kantin tepat di bawah perpustakaan. Aula di lantai paling atas. Ruang guru di lantai yang tersisa. Ruang guru di lantai ...",["1","2","3","4","Tidak dapat ditentukan"],0,"Lantai 4 adalah aula, lantai 3 perpustakaan, lantai 2 kantin (tepat di bawah perpustakaan), sehingga lantai yang tersisa, lantai 1, adalah ruang guru.","Penalaran analitis"),
m("TIU","Jika A=1, B=2, C=3, D=4, dan seterusnya, nilai kata KITA adalah ...",["39","40","41","42","43"],2,"K=11, I=9, T=20, A=1. Jumlahnya 11 + 9 + 20 + 1 = 41.","Penalaran analitis"),
m("TIU","Tas merah lebih berat dari tas biru. Tas biru lebih berat dari tas hijau. Tas kuning lebih ringan dari tas hijau. Tas ungu lebih berat dari tas merah. Tas yang paling ringan adalah ...",["Tas merah","Tas biru","Tas hijau","Tas kuning","Tas ungu"],3,"Urutan berat dari yang terberat: ungu > merah > biru > hijau > kuning. Jadi tas paling ringan adalah tas kuning.","Penalaran analitis"),
m("TIU","Lima kegiatan dijadwalkan Senin sampai Jumat, satu kegiatan per hari: pramuka, bakti sosial, pentas seni, olahraga, dan lomba debat. Pentas seni pada hari Rabu. Lomba debat pada hari Jumat. Pramuka pada hari Kamis. Olahraga dilaksanakan sehari sebelum bakti sosial. Bakti sosial dilaksanakan hari ...",["Senin","Selasa","Rabu","Kamis","Jumat"],1,"Rabu, Kamis, dan Jumat sudah terisi pentas seni, pramuka, dan lomba debat. Tersisa Senin dan Selasa untuk olahraga dan bakti sosial; karena olahraga sehari sebelum bakti sosial, olahraga hari Senin dan bakti sosial hari Selasa.","Penalaran analitis"),
m("TIU","Lima orang mengantre di loket. Eka berada di depan Fajar. Fajar di depan Gita. Hani tepat di belakang Gita. Indra berada di paling belakang. Siapa yang berada di urutan kedua dari depan?",["Eka","Gita","Hani","Indra","Fajar"],4,"Urutan dari depan: Eka, Fajar, Gita, Hani, Indra. Urutan kedua dari depan adalah Fajar.","Penalaran analitis"),
m("TIU","Usia Rina 4 tahun lebih tua dari Sari. Usia Sari 3 tahun lebih muda dari Tuti. Usia Tuti 25 tahun. Usia Rina adalah ...",["24 tahun","25 tahun","26 tahun","27 tahun","28 tahun"],2,"Usia Sari = 25 - 3 = 22 tahun. Usia Rina = 22 + 4 = 26 tahun.","Penalaran analitis"),
m("TIU","Rumah Ani di sebelah timur rumah Budi. Rumah Budi di sebelah utara rumah Cici. Rumah Dedi di sebelah selatan rumah Cici. Rumah yang paling selatan adalah ...",["Dedi","Ani","Budi","Cici","Tidak dapat ditentukan"],0,"Budi di utara Cici dan Ani di timur Budi, sehingga Ani dan Budi berada di utara Cici. Dedi di selatan Cici, sehingga rumah Dedi paling selatan.","Penalaran analitis"),
m("TIU","Lanjutkan deret: 45, 38, 31, 24, ...",["15","16","17","18","19"],2,"Selisihnya tetap -7: 45 - 7 = 38, 38 - 7 = 31, 31 - 7 = 24, jadi 24 - 7 = 17.","Deret angka"),
m("TIU","Lanjutkan deret: 4, 6, 10, 18, 34, ...",["62","64","65","68","66"],4,"Setiap suku dikali 2 lalu dikurangi 2: 4 x 2 - 2 = 6, 6 x 2 - 2 = 10, 10 x 2 - 2 = 18, 18 x 2 - 2 = 34, jadi 34 x 2 - 2 = 66.","Deret angka"),
m("TIU","Lanjutkan deret: 1, 8, 27, 64, ...",["125","100","110","120","130"],0,"Deretnya bilangan pangkat tiga: 1 x 1 x 1 = 1, 2 x 2 x 2 = 8, 3 x 3 x 3 = 27, 4 x 4 x 4 = 64, jadi 5 x 5 x 5 = 125.","Deret angka"),
m("TIU","Lanjutkan deret: 3, 10, 5, 12, 7, 14, ...",["8","9","11","16","18"],1,"Dua deret selang-seling: suku ganjil 3, 5, 7, ... bertambah 2; suku genap 10, 12, 14, ... bertambah 2. Suku berikutnya adalah suku ganjil: 7 + 2 = 9.","Deret angka"),
m("TIU","Lanjutkan deret: 6, 9, 15, 27, 51, ...",["95","96","97","99","98"],3,"Selisihnya 3, 6, 12, 24, lalu 48 (selisih dikali 2), jadi 51 + 48 = 99.","Deret angka"),
m("TIU","Lanjutkan deret: 2, 5, 14, 41, ...",["120","121","122","123","124"],2,"Setiap suku dikali 3 lalu dikurangi 1: 2 x 3 - 1 = 5, 5 x 3 - 1 = 14, 14 x 3 - 1 = 41, jadi 41 x 3 - 1 = 122.","Deret angka"),
m("TIU","Lanjutkan deret: 3, 4, 7, 11, 18, ...",["27","28","30","31","29"],4,"Setiap suku adalah jumlah dua suku sebelumnya: 3 + 4 = 7, 4 + 7 = 11, 7 + 11 = 18, jadi 11 + 18 = 29.","Deret angka"),
m("TIU","Lanjutkan deret: 50, 49, 46, 41, 34, ...",["25","23","24","26","27"],0,"Selisihnya -1, -3, -5, -7, lalu -9 (berkurang bilangan ganjil berurutan), jadi 34 - 9 = 25.","Deret angka"),
m("TIU","Lanjutkan deret: 12, 15, 21, 30, 42, ...",["54","57","55","56","58"],1,"Selisihnya 3, 6, 9, 12, lalu 15 (bertambah 3), jadi 42 + 15 = 57.","Deret angka"),
m("TIU","Lanjutkan deret: 1, 2, 6, 24, ...",["96","100","110","120","144"],3,"Pengalinya bertambah: 1 x 2 = 2, 2 x 3 = 6, 6 x 4 = 24, jadi 24 x 5 = 120.","Deret angka"),
m("TIU","12,5% dari 640 adalah ...",["70","75","80","85","90"],2,"12,5% sama dengan 1/8, jadi 640 : 8 = 80.","Hitungan dan persen"),
m("TIU","5/6 - 1/4 = ...",["7/12","1/3","5/12","3/4","1/2"],0,"Samakan penyebut menjadi 12: 5/6 = 10/12 dan 1/4 = 3/12, jadi 10/12 - 3/12 = 7/12.","Hitungan dan persen"),
m("TIU","Harga barang Rp150.000 mendapat diskon 30%. Harga yang dibayar adalah ...",["Rp95.000","Rp100.000","Rp102.000","Rp110.000","Rp105.000"],4,"Diskon 30% = Rp45.000, jadi 150.000 - 45.000 = Rp105.000. Cara cepat: bayar 70%, yaitu 150.000 x 70/100 = Rp105.000.","Hitungan dan persen"),
m("TIU","40% dari 250 ditambah 60 adalah ...",["150","160","170","180","200"],1,"40% dari 250 = 100, lalu 100 + 60 = 160.","Hitungan dan persen"),
m("TIU","0,6 x 35 = ...",["19","20","22","21","24"],3,"0,6 sama dengan 6/10, jadi 35 x 6 : 10 = 210 : 10 = 21.","Hitungan dan persen"),
m("TIU","Uang Rp800.000 disimpan dengan bunga tunggal 5% per tahun selama 3 tahun. Jumlah uang akhirnya ...",["Rp900.000","Rp910.000","Rp920.000","Rp940.000","Rp960.000"],2,"Bunga = 800.000 x 5/100 x 3 = Rp120.000, jadi jumlah akhirnya 800.000 + 120.000 = Rp920.000.","Hitungan dan persen"),
m("TIU","72 adalah berapa persen dari 240?",["30%","25%","28%","32%","35%"],0,"72 : 240 = 0,3 = 30%.","Hitungan dan persen"),
m("TIU","(3/4)^2 = ...",["3/8","6/8","3/16","9/8","9/16"],4,"(3/4)^2 = 3 x 3 / (4 x 4) = 9/16.","Hitungan dan persen"),
m("TIU","26 x 15 = ...",["360","390","375","380","385"],1,"26 x 15 = 26 x 10 + 26 x 5 = 260 + 130 = 390.","Hitungan dan persen"),
m("TIU","Harga Rp400.000 didiskon 25%, lalu didiskon lagi 20% dari harga setelah diskon pertama. Harga akhirnya ...",["Rp220.000","Rp230.000","Rp235.000","Rp240.000","Rp250.000"],3,"400.000 x 75/100 = 300.000, lalu 300.000 x 80/100 = 240.000. Diskon bertingkat dihitung dari harga yang sudah didiskon, bukan dijumlahkan (25% + 20% = 45% adalah salah).","Hitungan dan persen"),
m("TIU","Harga 4 lusin pensil Rp96.000. Harga 7 lusin pensil adalah ...",["Rp144.000","Rp156.000","Rp168.000","Rp172.000","Rp180.000"],2,"Harga 1 lusin = 96.000 : 4 = Rp24.000, jadi 7 lusin = 7 x 24.000 = Rp168.000.","Perbandingan dan soal cerita"),
m("TIU","Persediaan pakan untuk 15 ayam habis dalam 20 hari. Jika ayamnya 25 ekor, persediaan itu habis dalam ...",["8 hari","10 hari","11 hari","13 hari","12 hari"],4,"Perbandingan berbalik nilai: 15 x 20 = 300, lalu 300 : 25 = 12 hari. Makin banyak ayam, makin cepat habis.","Perbandingan dan soal cerita"),
m("TIU","Kereta menempuh jarak 270 km dalam waktu 3 jam. Kecepatan rata-rata kereta adalah ...",["90 km/jam","80 km/jam","85 km/jam","88 km/jam","95 km/jam"],0,"Kecepatan = jarak : waktu = 270 : 3 = 90 km/jam.","Perbandingan dan soal cerita"),
m("TIU","Rata-rata tinggi 4 siswa adalah 150 cm. Seorang siswa setinggi 160 cm bergabung dengan kelompok itu. Rata-rata tinggi 5 siswa menjadi ...",["151 cm","152 cm","153 cm","154 cm","155 cm"],1,"Jumlah tinggi 4 siswa = 4 x 150 = 600 cm. Setelah ditambah 160 cm menjadi 760 cm, rata-rata 5 siswa = 760 : 5 = 152 cm.","Perbandingan dan soal cerita"),
m("TIU","Usia Budi 5 tahun lebih muda dari usia Andi. Jumlah usia mereka 45 tahun. Usia Andi adalah ...",["20 tahun","22 tahun","24 tahun","25 tahun","30 tahun"],3,"Usia Andi = (45 + 5) : 2 = 25 tahun, usia Budi = 25 - 5 = 20 tahun, dan 25 + 20 = 45 tahun.","Perbandingan dan soal cerita"),
m("TIU","Jarak sebenarnya 12 km digambar pada peta sepanjang 6 cm. Skala peta itu adalah ...",["1 : 100.000","1 : 150.000","1 : 200.000","1 : 250.000","1 : 300.000"],2,"12 km = 1.200.000 cm. Skala = 6 : 1.200.000 = 1 : 200.000.","Perbandingan dan soal cerita"),
m("TIU","A dapat menyelesaikan suatu pekerjaan dalam 8 hari, sedangkan B dalam 12 hari. Jika A dan B bekerja bersama, pekerjaan itu selesai dalam ...",["4 hari","4,5 hari","5 hari","6 hari","4,8 hari"],4,"Dalam 1 hari A menyelesaikan 1/8 dan B 1/12, bersama 1/8 + 1/12 = 3/24 + 2/24 = 5/24. Waktu bersama = 24/5 = 4,8 hari.","Perbandingan dan soal cerita"),
m("TIU","Perbandingan siswa laki-laki dan perempuan adalah 4 : 5. Jumlah seluruh siswa 54. Jumlah siswa perempuan adalah ...",["30","24","26","28","32"],0,"Jumlah perbandingan = 4 + 5 = 9, satu bagian = 54 : 9 = 6, maka siswa perempuan = 5 x 6 = 30.","Perbandingan dan soal cerita"),
m("TIU","Sebuah toko menjual 3 buku dan 2 pensil seharga Rp31.000. Harga 1 buku Rp9.000. Harga 1 pensil adalah ...",["Rp1.500","Rp2.000","Rp2.500","Rp3.000","Rp4.000"],1,"Harga 3 buku = 3 x 9.000 = Rp27.000. Sisa untuk 2 pensil = 31.000 - 27.000 = Rp4.000, jadi 1 pensil = 4.000 : 2 = Rp2.000.","Perbandingan dan soal cerita"),
m("TIU","Mobil berangkat pukul 07.30 dengan kecepatan 50 km/jam dan menempuh jarak 125 km tanpa berhenti. Mobil itu tiba pukul ...",["09.30","09.45","10.15","10.00","10.30"],3,"Waktu tempuh = 125 : 50 = 2,5 jam. Berangkat 07.30 ditambah 2,5 jam = pukul 10.00.","Perbandingan dan soal cerita"),
t("Mesin fotokopi kantor rusak, sedangkan seorang warga membutuhkan salinan dokumen untuk melengkapi berkas layanannya. Sikapmu ...",[["Menawarkan pemindaian dokumen dengan perangkat kantor bila diizinkan prosedur, atau mengarahkan warga ke tempat fotokopi terdekat sambil menahan berkasnya agar tidak antre ulang",5],["Meminta warga kembali lain hari saat mesin sudah diperbaiki",3],["Menolak memproses berkas karena salinannya belum ada",1],["Mengarahkan warga ke tempat fotokopi terdekat dan menjelaskan berkasnya akan tetap diproses setelah salinan lengkap",4],["Meminta warga mencari sendiri tempat fotokopi tanpa penjelasan",2]],"Skor 5 memberi jalan keluar yang tetap sesuai prosedur dan tidak merugikan warga; sekadar mengarahkan (skor 4) baik tetapi kurang membantu, sementara menunda tanpa solusi atau menolak (skor rendah) membuat warga dirugikan oleh kerusakan fasilitas kantor.","Pelayanan publik"),
t("Seorang warga tunanetra ingin mengetahui isi surat keputusan yang baru diterimanya. Sikapmu ...",[["Meminta warga membawa pendamping untuk membacakan surat itu",3],["Membacakan isi surat dengan jelas dan perlahan, menawarkan penjelasan bagian yang belum dipahami, dan mencatat perlunya format yang mudah diakses untuk layanan berikutnya",5],["Menyuruh warga membaca sendiri surat itu",1],["Menyerahkan surat dan mempersilakan warga meminta bantuan orang lain di ruang tunggu",2],["Membacakan isi surat dengan jelas dan menjawab pertanyaan warga",4]],"Membacakan dengan sabar dan memastikan warga memahami isinya adalah pelayanan inklusif; meminta pendamping atau menyerahkan begitu saja membebani warga atas keterbatasan yang bukan salahnya.","Pelayanan publik"),
t("Seorang warga mengeluh karena petugas sebelumnya memberinya informasi yang berbeda tentang syarat layanan yang sama. Sikapmu ...",[["Mengatakan warga salah dengar pada penjelasan sebelumnya",2],["Memeriksa ketentuan yang benar dan menjelaskan syarat yang benar kepada warga",4],["Memeriksa ketentuan yang benar, meminta maaf atas kebingungan itu, menjelaskan syarat yang benar secara tertulis, dan menyampaikan temuan perbedaan informasi itu ke atasan agar diseragamkan",5],["Menyalahkan petugas sebelumnya di depan warga",1],["Meminta warga mengikuti penjelasan petugas terakhir tanpa memeriksa ketentuan",3]],"Skor 5 memulihkan kepercayaan warga dengan informasi yang terverifikasi dan mencegah pengulangan lewat laporan ke atasan; menyalahkan warga atau rekan tidak menyelesaikan kebingungan warga.","Pelayanan publik"),
t("Listrik padam sehingga sistem layanan tidak dapat digunakan dan dokumen warga tidak bisa dicetak. Sikapmu ...",[["Menjelaskan keadaan dan meminta warga datang kembali besok",4],["Menyuruh warga pulang dan mengurus dari awal lain kali",1],["Meminta warga menunggu di ruang tunggu tanpa kepastian waktu",3],["Menjelaskan keadaan dengan sopan, mencatat data warga dan memberi nomor prioritas atau janji pengambilan, lalu menghubunginya saat sistem pulih",5],["Menutup loket tanpa penjelasan kepada warga yang mengantre",2]],"Saat sistem terganggu, warga tetap berhak atas kepastian; mencatat dan memberi janji pengambilan yang jelas jauh lebih baik daripada menutup loket atau meminta warga mengulang dari awal.","Pelayanan publik"),
t("Seorang warga meminta didahulukan dari antrean karena harus mengejar kendaraan umum terakhir. Sikapmu ...",[["Mendahulukan warga itu tanpa dasar aturan karena merasa kasihan",2],["Menjelaskan antrean berlaku adil dan memberi tahu perkiraan gilirannya",4],["Menolak mentah-mentah tanpa penjelasan",1],["Meminta warga menunggu tanpa memberi perkiraan waktu",3],["Menjelaskan antrean berlaku adil untuk semua, memberi tahu perkiraan gilirannya, dan menawarkan alternatif sesuai prosedur seperti layanan daring atau surat kuasa bila tersedia",5]],"Keadilan antrean harus dijaga, tetapi warga tetap dibantu dengan informasi dan alternatif yang sah; mendahulukan tanpa aturan merugikan warga lain, sedangkan menolak tanpa penjelasan merusak kepercayaan.","Pelayanan publik"),
t("Seorang warga membawa anak berkebutuhan khusus yang gelisah di ruang tunggu yang ramai. Sikapmu ...",[["Menawarkan tempat tunggu yang lebih tenang bila tersedia, melayani dengan sabar tanpa terburu-buru, dan memberi prioritas hanya bila ketentuan memang mengaturnya",5],["Meminta warga menenangkan anaknya agar tidak mengganggu",2],["Melayani dengan sabar dan mempersilakan warga menunggu di kursi yang lebih sepi",4],["Meminta warga pulang dan datang saat anaknya tenang",1],["Melayani seperti biasa tanpa memperhatikan keadaan anak itu",3]],"Pelayanan ramah menyesuaikan keadaan warga tanpa melanggar aturan; mengusir atau menyuruh pulang mendiskriminasi warga yang justru membutuhkan kemudahan.","Pelayanan publik"),
t("Seorang warga hanya membawa foto KTP di HP-nya, padahal layanan yang diurus mewajibkan KTP asli. Sikapmu ...",[["Menolak dan menyuruh warga pulang tanpa penjelasan",1],["Menjelaskan aturan dengan sopan, memeriksa apakah verifikasi alternatif tersedia sesuai prosedur, dan memberi tahu langkah yang harus disiapkan bila harus kembali",5],["Menjelaskan aturan dan meminta warga membawa KTP asli pada kunjungan berikutnya",4],["Meminta warga bertanya ke loket lain tentang kemungkinan pengecualian",3],["Memproses layanan dengan foto KTP tanpa verifikasi apa pun",2]],"Aturan verifikasi identitas melindungi warga sendiri; skor 5 menjelaskan aturan sekaligus mencari jalan sah yang tersedia, bukan meloloskan tanpa verifikasi atau menolak tanpa penjelasan.","Pelayanan publik"),
t("Pesan warga masuk lewat kanal chat resmi di luar jam kerja dan menanyakan syarat suatu layanan. Sikapmu ...",[["Membalas singkat dengan tautan tanpa penjelasan",3],["Membalas di luar jam kerja dengan jawaban seadanya agar cepat selesai",1],["Menjawab pada jam kerja berikutnya dengan penjelasan syarat yang lengkap dan tautan kanal resmi, serta meminta maaf atas keterlambatan balasan",5],["Menjawab pada jam kerja berikutnya dengan penjelasan syarat yang lengkap",4],["Membiarkan pesan itu tanpa balasan sampai warga bertanya lagi",2]],"Balasan yang lengkap dan tepat waktu pada jam kerja menjaga kualitas layanan; membalas seadanya di luar jam kerja atau membiarkan pesan berisiko memberi informasi yang salah atau tidak memberi kepastian.","Pelayanan publik"),
t("Nama seorang warga salah eja pada dokumen yang sudah diterbitkan kantormu. Sikapmu ...",[["Mengatakan kesalahan itu berasal dari isian warga tanpa memeriksa",1],["Meminta warga mengajukan permohonan perbaikan tertulis tanpa penjelasan lebih lanjut",3],["Meminta warga membayar biaya cetak ulang seperti permohonan baru",2],["Meminta maaf, memeriksa sumber kesalahan, memperbaiki dokumen sesuai prosedur, memberi tahu estimasi selesainya, dan tidak membebankan biaya bila kesalahan berasal dari petugas",5],["Meminta maaf dan memperbaiki dokumen sesuai prosedur",4]],"Kesalahan pada dokumen resmi harus diperiksa sumbernya dan diperbaiki dengan kepastian waktu; membebankan biaya atau menyalahkan warga tanpa memeriksa merugikan warga dan merusak kepercayaan.","Pelayanan publik"),
t("Seorang warga kebingungan karena penjelasan prosedur memakai istilah teknis yang tidak dipahaminya. Sikapmu ...",[["Menjelaskan langkah-langkah dengan bahasa sederhana dan memastikan warga memahaminya",4],["Mengulangi penjelasan yang sama dengan istilah teknis yang sama",2],["Memberi brosur prosedur dan meminta warga membacanya sendiri",3],["Meminta warga mencari penjelasan di internet",1],["Menjelaskan langkah-langkah dengan bahasa sederhana dan berurutan, memastikan warga memahaminya, dan memberinya lembar ringkasan tertulis untuk dibawa pulang",5]],"Penjelasan yang dipahami warga adalah inti pelayanan; bahasa sederhana ditambah ringkasan tertulis memastikan warga tidak salah langkah, sementara mengulang istilah yang sama tidak membantu.","Pelayanan publik"),
t("Seorang rekan dari unit lain meminta kamu memeriksa draf suratnya sebelum dikirim ke atasan. Sikapmu ...",[["Memeriksa draf itu, memberi masukan tertulis yang jelas, dan mengembalikannya tepat waktu sesuai yang dijanjikan",5],["Menolak karena itu bukan tugas unitmu",1],["Memeriksa draf itu dan memberi masukan lisan secara singkat",4],["Menunda memeriksa sampai rekan itu mengingatkan berkali-kali",2],["Membaca sekilas dan mengatakan draf itu sudah baik tanpa masukan nyata",3]],"Membantu lintas unit dengan masukan tertulis yang tepat waktu memperkuat jejaring; menolak atau menunda merusak kerja sama, sedangkan memuji tanpa memeriksa tidak membantu kualitas surat.","Jejaring kerja"),
t("Kamu dan seorang rekan ternyata mengerjakan tugas yang sama karena pembagian tugas tidak jelas. Sikapmu ...",[["Mengajak rekan membagi ulang bagian masing-masing agar tidak tumpang tindih",4],["Mengajak rekan menyelaraskan pekerjaan, membagi ulang bagian masing-masing, dan menyampaikan pembagian itu ke koordinator agar tercatat",5],["Mengerjakan semuanya sendiri agar hasilnya seragam",2],["Menyalahkan koordinator di depan rekan tanpa mengusulkan pembagian",1],["Mengerjakan bagianmu sendiri dan membiarkan rekan mengerjakan bagiannya",3]],"Duplikasi kerja diselesaikan dengan menyelaraskan dan mencatat pembagian yang jelas; bekerja sendiri-sendiri membuang waktu, sedangkan menyalahkan koordinator tanpa solusi tidak memperbaiki apa pun.","Jejaring kerja"),
t("Tim lain ingin memakai ruang rapat yang sama pada waktu yang sama dengan timmu. Sikapmu ...",[["Mempertahankan ruang itu dengan alasan timmu lebih penting",1],["Memakai ruang itu karena timmu yang lebih dulu menjadwalkan, tanpa berdiskusi",3],["Menghubungi tim lain itu, menyepakati jadwal berbagi atau ruang alternatif, dan mencatat kesepakatan itu agar tidak bentrok lagi",5],["Mengalah begitu saja tanpa mencari ruang alternatif untuk timmu",2],["Menghubungi tim lain itu dan menyepakati jadwal berbagi",4]],"Bentrok jadwal diselesaikan dengan rundingan dan kesepakatan tertulis; mengklaim ruang tanpa diskusi atau mengalah tanpa solusi sama-sama merugikan salah satu tim.","Jejaring kerja"),
t("Seorang rekan yang akan pindah unit belum mendokumentasikan pekerjaannya. Sikapmu ...",[["Menanyakan pekerjaan itu bila ada masalah di kemudian hari",3],["Menunggu penggantinya belajar sendiri dari berkas yang ditinggalkan",2],["Membiarkan pengetahuan itu hilang karena bukan tanggung jawabmu",1],["Meminta sesi serah terima sebelum ia pindah, mendokumentasikan langkah-langkah pekerjaannya, dan membagikan catatan itu ke penggantinya",5],["Meminta sesi serah terima dan mencatat poin-poin penting pekerjaannya",4]],"Pengetahuan kerja harus didokumentasikan sebelum pemiliknya pindah; menunggu masalah muncul atau membiarkan pengetahuan hilang membebani pengganti dan mengganggu layanan.","Jejaring kerja"),
t("Seorang tenaga ahli luar yang bekerja dengan timmu tidak memahami alur birokrasi kantor. Sikapmu ...",[["Mengeluhkan ketidaktahuannya kepada rekan lain",1],["Memberinya salinan pedoman alur untuk dibaca sendiri",3],["Menjelaskan alur yang berlaku dan memberi nomor kontak unit terkait",4],["Membiarkannya mencari tahu sendiri agar cepat mandiri",2],["Menjelaskan alur yang berlaku, menjadi penghubungnya dengan unit terkait, dan menetapkan jalur komunikasi yang jelas selama proyek berjalan",5]],"Tenaga ahli luar bekerja lebih efektif bila ada penghubung yang menjelaskan alur dan jalur komunikasi; membiarkannya sendiri atau mengeluhkannya memperlambat proyek.","Jejaring kerja"),
t("Rapat koordinasi selalu molor karena tidak ada agenda yang jelas. Sikapmu ...",[["Mengusulkan agenda tertulis, notulen, dan batas waktu tiap pembahasan, lalu menawarkan diri menyusun agenda rapat berikutnya",5],["Mengusulkan agenda tertulis dan batas waktu tiap pembahasan",4],["Datang terlambat agar tidak terjebak rapat yang molor",2],["Menghadiri rapat seperti biasa dan berharap pimpinan memperbaikinya",3],["Tidak menghadiri rapat karena dianggap tidak efektif",1]],"Rapat yang efektif butuh agenda dan batas waktu; mengusulkan perbaikan sambil menawarkan diri menyusunnya lebih baik daripada mengeluh, datang terlambat, atau tidak hadir.","Jejaring kerja"),
t("Seorang rekan menghubungimu di luar jam kerja untuk urusan yang bisa menunggu sampai besok. Sikapmu ...",[["Mengabaikan pesan itu sampai keesokan harinya tanpa kabar",2],["Menanggapi dengan sopan, menyampaikan bahwa urusan itu akan dibahas pada jam kerja, dan mencatatnya agar tidak terlupa",5],["Membalas dengan nada kesal karena diganggu di luar jam kerja",1],["Menanggapi dengan sopan dan menyampaikan akan dibahas besok",4],["Membalas singkat tanpa kepastian kapan dibahas",3]],"Batasan jam kerja dijaga dengan sopan dan tetap memberi kepastian; mengabaikan tanpa kabar atau membalas dengan kesal merusak hubungan kerja.","Jejaring kerja"),
t("Dua tim mengklaim keberhasilan yang sama dalam laporan masing-masing. Sikapmu ...",[["Mengajak kedua tim memverifikasi kontribusi masing-masing berdasarkan bukti kerja",4],["Mendukung klaim timmu tanpa memeriksa bukti",2],["Mengajak kedua tim memverifikasi kontribusi masing-masing berdasarkan bukti kerja, lalu menyusun laporan bersama yang mencantumkan kontribusi keduanya secara jujur",5],["Menuduh tim lain mengambil hasil kerja timmu",1],["Membiarkan kedua laporan itu apa adanya agar tidak ribut",3]],"Klaim ganda diselesaikan dengan bukti dan laporan bersama yang jujur; mendukung klaim tanpa bukti atau menuduh tim lain merusak kepercayaan antarunit.","Jejaring kerja"),
t("Seorang pegawai mutasi dari instansi lain kesulitan memahami singkatan dan istilah internal kantormu. Sikapmu ...",[["Memintanya bertanya bila ada istilah yang tidak dipahami",3],["Menganggap ia seharusnya sudah memahami istilah itu sebelum pindah",1],["Menjelaskan istilah yang ditanyakan setiap kali ia bertanya",4],["Membuatkan daftar istilah dan singkatan yang sering dipakai, menjelaskannya, dan menemaninya selama minggu pertama sampai ia terbiasa",5],["Memintanya membaca arsip lama untuk memahami istilah itu",2]],"Pendampingan terstruktur dengan daftar istilah mempercepat adaptasi pegawai mutasi; membiarkannya belajar sendiri dari arsip atau menganggapnya sudah paham memperlambat kinerjanya.","Jejaring kerja"),
t("Kamu diminta membimbing pegawai magang yang pemalu dan jarang bertanya. Sikapmu ...",[["Memberinya tugas fotokopi dan pekerjaan ringan saja agar tidak salah",2],["Memberi tugas bertahap dan memberi umpan balik atas pekerjaannya",4],["Membiarkannya mengamati tanpa tugas yang jelas",1],["Memberi tugas dan memintanya bertanya bila kesulitan",3],["Menjadwalkan pemeriksaan rutin, memberi tugas bertahap sesuai kemampuannya, dan memberi umpan balik yang membangun atas pekerjaannya",5]],"Membimbing berarti memberi tugas bertahap, memeriksa rutin, dan memberi umpan balik; membiarkan magang tanpa tugas atau hanya memberi pekerjaan ringan tidak mengembangkan kemampuannya.","Jejaring kerja"),
t("Seorang warga meminta pelayanan dijeda sebentar karena waktu ibadahnya tiba. Sikapmu ...",[["Mempersilakan warga beribadah, menahan gilirannya agar tidak hilang, dan melanjutkan pelayanan setelah ia kembali",5],["Meminta warga menyelesaikan urusannya dulu sebelum beribadah",3],["Meminta warga antre dari awal setelah beribadah",2],["Mengatakan urusan kantor lebih penting daripada ibadahnya",1],["Mempersilakan warga beribadah dan melayaninya kembali setelah ia kembali",4]],"Menghormati waktu ibadah sambil menjaga giliran warga menunjukkan pelayanan yang menghargai keyakinan; memaksa warga memilih antara ibadah dan layanan adalah bentuk tidak menghormati perbedaan.","Sosial Budaya"),
t("Seorang rekan membawa bekal khas daerahnya, dan rekan lain mengomentari aromanya dengan sinis. Sikapmu ...",[["Diam saja agar tidak memperkeruh suasana",2],["Menegur komentar sinis itu dengan santun, mengajak menghargai makanan khas daerah, dan mengusulkan makan bersama agar saling mengenal",5],["Menegur komentar sinis itu dengan santun dan mengajak menghargai perbedaan",4],["Ikut menertawakan bekal itu",1],["Mengajak rekan pemilik bekal makan di tempat lain agar tidak dikomentari",3]],"Komentar sinis soal makanan khas daerah adalah bentuk merendahkan budaya; menegur dengan santun dan mengajak saling mengenal lebih baik daripada diam atau ikut menertawakan.","Sosial Budaya"),
t("Sosialisasi program di desa sulit dipahami warga tua karena materinya hanya berbahasa Indonesia formal. Sikapmu ...",[["Melibatkan perangkat desa sebagai penerjemah dan menyederhanakan bahasa materi",4],["Melanjutkan sosialisasi seperti biasa karena materi sudah sesuai ketentuan",1],["Melibatkan perangkat desa sebagai penerjemah, menyiapkan materi dwibahasa yang sederhana, dan memeriksa pemahaman warga sebelum menutup kegiatan",5],["Mengulangi penjelasan dengan bahasa Indonesia yang lebih pelan",3],["Membagikan materi tertulis dan meminta warga membacanya di rumah",2]],"Sosialisasi berhasil bila pesannya dipahami; materi dwibahasa dan penerjemah setempat memastikan warga tua memahami program, bukan sekadar hadir.","Sosial Budaya"),
t("Seorang warga meminta dilayani petugas perempuan karena alasan budaya dan keyakinannya. Sikapmu ...",[["Mengejek permintaan warga itu di depan warga lain",1],["Mengusahakan petugas perempuan bila tersedia sesuai jadwal",4],["Meminta warga menerima petugas yang sedang bertugas tanpa penjelasan",2],["Mengusahakan petugas perempuan bila tersedia sesuai jadwal, dan bila tidak tersedia menjelaskan dengan sopan sambil menawarkan pendamping atau jadwal lain yang sesuai",5],["Mengatakan permintaan itu tidak bisa dipenuhi karena semua petugas sama",3]],"Permintaan yang berdasar keyakinan dilayani dengan mengusahakan alternatif yang tersedia dan penjelasan sopan; mengejek atau menolak tanpa penjelasan melanggar penghormatan terhadap perbedaan.","Sosial Budaya"),
t("Di kantor barumu, rekan-rekan menyapamu dengan panggilan kekerabatan daerah yang asing bagimu. Sikapmu ...",[["Tetap memakai panggilan formal seperti biasa tanpa mempelajari panggilan setempat",3],["Menertawakan panggilan itu karena terdengar aneh bagimu",1],["Mempelajari arti panggilan itu dan memakainya dengan hormat",4],["Meminta rekan memanggilmu dengan cara daerah asalmu saja",2],["Mempelajari arti dan cara memakai panggilan itu, memakainya dengan hormat, dan menanyakan dengan sopan bila ragu",5]],"Menyesuaikan diri dengan sapaan setempat adalah bentuk menghormati budaya kerja baru; menertawakan atau memaksakan cara sendiri menghambat penerimaan di lingkungan baru.","Sosial Budaya"),
t("Seorang warga tua meminta dipanggil dengan gelar adatnya saat dilayani. Sikapmu ...",[["Memanggil warga itu dengan gelar adatnya secara hormat dan mencatatnya agar petugas lain melayaninya dengan cara yang sama",5],["Memanggil warga itu dengan gelar adatnya secara hormat",4],["Mengatakan gelar adat tidak berlaku di kantor",1],["Memanggil warga itu dengan nama biasa seperti warga lain",3],["Menanyakan gelar itu tetapi tidak memakainya saat melayani",2]],"Memanggil seseorang dengan gelar yang dihormatinya tidak mengurangi kualitas layanan; mencatatnya memastikan penghormatan itu berlanjut di layanan berikutnya.","Sosial Budaya"),
t("Seorang rekan menolak berjabat tangan karena keyakinannya, dan rekan lain tersinggung. Sikapmu ...",[["Meminta rekan yang menolak menjelaskan sendiri alasannya",3],["Menjelaskan dengan tenang bahwa penolakan itu berdasar keyakinan bukan penolakan terhadap orangnya, dan mengusulkan salam lain yang nyaman bagi keduanya",5],["Membiarkan ketersinggungan itu tanpa penjelasan",2],["Menjelaskan dengan tenang bahwa penolakan itu berdasar keyakinan",4],["Ikut menyindir rekan yang menolak berjabat tangan",1]],"Perbedaan cara bersalaman diselesaikan dengan penjelasan yang tenang dan salam alternatif; membiarkan ketersinggungan atau ikut menyindir memperlebar kesalahpahaman.","Sosial Budaya"),
t("Warga sebuah kampung enggan didata karena pengalaman buruk dengan pendataan di masa lalu. Sikapmu ...",[["Meminta perangkat desa memaksa warga agar mau didata",2],["Menjelaskan tujuan dan kerahasiaan data dengan jujur dan tidak memaksa",4],["Datang bersama tokoh setempat yang dipercaya, menjelaskan tujuan dan kerahasiaan data dengan jujur, dan tidak memaksa warga yang belum bersedia",5],["Mengancam warga yang menolak didata dengan sanksi",1],["Mendata warga yang bersedia saja tanpa menjelaskan tujuan pendataan",3]],"Kepercayaan yang rusak dipulihkan dengan tokoh setempat, penjelasan jujur, dan tanpa paksaan; memaksa atau mengancam justru mengulang pengalaman buruk yang membuat warga enggan.","Sosial Budaya"),
t("Anak-anak warga bermain di halaman kantor dan seorang petugas mengusir mereka dengan kasar. Sikapmu ...",[["Menegur cara kasar itu dengan sopan dan mengajak anak-anak ke tempat yang aman",4],["Meminta orang tua anak-anak itu membawa anaknya pulang",2],["Ikut mengusir anak-anak itu dengan kasar",1],["Menegur cara kasar itu dengan sopan, mengajak anak-anak ke sudut tunggu yang aman, dan mengusulkan sudut ramah anak di ruang tunggu",5],["Membiarkan pengusiran itu karena halaman kantor bukan tempat bermain",3]],"Anak-anak warga dilayani lingkungannya dengan cara yang ramah; menegur kekasaran dan menyediakan sudut yang aman lebih baik daripada mengusir atau membiarkan.","Sosial Budaya"),
t("Kunjungan dinas ke daerah setempat mengharuskan tamu melepas alas kaki di area adat tertentu. Sikapmu ...",[["Menolak melepas alas kaki dengan alasan urusan dinas lebih penting",1],["Mengikuti ketentuan itu dengan hormat",4],["Meminta pengecualian karena datang untuk urusan dinas",2],["Mengikuti ketentuan itu sambil mengeluh kepada rombongan",3],["Mengikuti ketentuan itu dengan hormat, menyiapkan alas kaki cadangan, dan mengingatkan rombongan agar bersikap sama",5]],"Mengikuti ketentuan adat setempat saat kunjungan dinas menunjukkan penghormatan; meminta pengecualian atau menolak merusak hubungan dengan masyarakat setempat.","Sosial Budaya"),
t("Seorang rekan memberimu file kerja lewat flashdisk pribadi yang belum dipindai. Sikapmu ...",[["Memindai flashdisk itu dengan antivirus dan meminta file dikirim ulang lewat kanal resmi kantor sebelum membukanya",5],["Menyalin file itu ke komputer kantor tanpa memindai",2],["Memakai flashdisk itu untuk komputer lain juga tanpa memindai",1],["Membuka file itu langsung karena berasal dari rekan sekantor",3],["Memindai flashdisk itu dengan antivirus sebelum membuka file",4]],"Perangkat penyimpanan pribadi wajib dipindai dan file kerja sebaiknya lewat kanal resmi; membuka langsung berisiko menyebarkan perangkat lunak berbahaya ke jaringan kantor.","TIK dan literasi digital"),
t("Sebuah akun media sosial palsu mengatasnamakan instansimu dan meminta biaya layanan dari warga. Sikapmu ...",[["Membalas akun palsu itu dengan makian di kolom komentar",1],["Melaporkan akun palsu itu, mengumumkan klarifikasi lewat kanal resmi instansi, dan mengingatkan warga agar hanya memakai kanal resmi",5],["Memberi tahu atasan dan menunggu instruksi lebih lanjut",3],["Melaporkan akun palsu itu dan mengumumkan klarifikasi lewat kanal resmi",4],["Mengabaikan akun itu karena bukan akun resmi instansi",2]],"Penipuan yang mengatasnamakan instansi harus dilaporkan dan diklarifikasi lewat kanal resmi agar warga tidak menjadi korban; mengabaikan membiarkan penipuan berlanjut.","TIK dan literasi digital"),
t("Seorang warga mengirim foto KTP lewat chat pribadi petugas agar layanannya dipercepat. Sikapmu ...",[["Menerima foto itu tetapi tidak memprosesnya sampai warga datang ke loket",3],["Menerima foto itu dan memproses layanan dari chat pribadi",2],["Menolak menerima data lewat chat pribadi, mengarahkan warga ke kanal resmi atau loket, menjelaskan risikonya, dan menghapus data itu bila terlanjur diterima",5],["Menolak menerima data lewat chat pribadi dan mengarahkan warga ke kanal resmi",4],["Meneruskan foto KTP itu ke grup kerja agar cepat diproses",1]],"Data pribadi warga tidak boleh lewat chat pribadi petugas; mengarahkan ke kanal resmi melindungi warga dari penyalahgunaan data, sedangkan meneruskan foto KTP ke grup melanggar perlindungan data.","TIK dan literasi digital"),
t("Dua situs dengan nama hampir sama muncul di hasil pencarian, dan satu di antaranya diduga palsu. Sikapmu ...",[["Membuka kedua situs dan membandingkan tampilannya",2],["Memeriksa alamat situs resmi dari sumber tepercaya dan hanya memakai situs resmi itu",4],["Memasukkan data pribadi di situs mana pun yang tampilannya meyakinkan",1],["Memeriksa alamat situs resmi instansi dari sumber tepercaya, hanya memakai situs resmi itu, dan melaporkan situs yang diduga palsu",5],["Memakai situs yang tampil paling atas di hasil pencarian",3]],"Situs palsu meniru tampilan situs resmi; alamat resmi harus diperiksa dari sumber tepercaya sebelum memasukkan data apa pun.","TIK dan literasi digital"),
t("Seorang rekan membagikan tangkapan layar rapat daring yang menampilkan data warga ke grup pribadi. Sikapmu ...",[["Menegur rekan itu dan memintanya menghapus tangkapan layar itu",4],["Memintanya menghapus tangkapan layar itu tanpa menegur atau melapor",3],["Membiarkannya karena grup itu hanya berisi rekan sekantor",2],["Ikut menyimpan tangkapan layar itu untuk berjaga-jaga",1],["Menegur rekan itu, memintanya menghapus tangkapan layar itu dari grup, dan melaporkan kejadian itu melalui kanal resmi",5]],"Data warga yang tersebar di grup pribadi harus dihapus dan dilaporkan; membiarkan atau ikut menyimpan memperluas pelanggaran perlindungan data.","TIK dan literasi digital"),
t("Seorang rekan mengusulkan layanan berbagi berkas gratis yang tidak dikenal untuk mengirim dokumen kerja berukuran besar. Sikapmu ...",[["Menolak layanan yang tidak dikenal itu, memakai kanal resmi instansi, dan mengompresi atau membagi dokumen sesuai ketentuan yang berlaku",5],["Memakai layanan itu untuk semua dokumen agar cepat terkirim",1],["Menunda pengiriman sampai ada petunjuk dari atasan",3],["Menolak layanan yang tidak dikenal itu dan memakai kanal resmi instansi",4],["Memakai layanan itu untuk dokumen yang dianggap tidak penting",2]],"Dokumen kerja tidak boleh lewat layanan tak dikenal yang keamanannya tidak terjamin; kanal resmi ditambah pengompresian sesuai ketentuan adalah jalan yang aman.","TIK dan literasi digital"),
t("Sebuah jendela pop-up di komputer kantor menampilkan peringatan lisensi kedaluwarsa dan meminta pembayaran. Sikapmu ...",[["Tidak mengklik atau membayar apa pun dan melaporkan kejadian itu ke unit TI",4],["Tidak mengklik atau membayar apa pun, menutup jendela itu dengan aman, dan melaporkan kejadian itu ke unit TI",5],["Membayar sesuai permintaan pop-up itu agar peringatan hilang",1],["Mengklik tombol peringatan itu untuk melihat penjelasannya",2],["Menutup jendela itu dan melanjutkan pekerjaan tanpa melapor",3]],"Pop-up yang meminta pembayaran sering kali penipuan; tidak mengklik dan melapor ke unit TI melindungi perangkat kantor, sedangkan membayar atau mengklik berisiko membahayakan sistem.","TIK dan literasi digital"),
t("Seorang warga mengeluh tidak menerima kode verifikasi untuk layanan daring. Sikapmu ...",[["Memberikan kode verifikasi buatan sendiri kepada warga",1],["Meminta warga mencoba lagi nanti tanpa panduan",3],["Memandu warga memeriksa nomor dan alamat surel yang terdaftar, mengirim ulang kode lewat kanal resmi, dan mengingatkan warga agar tidak memberikan kode itu kepada siapa pun",5],["Meminta warga menyebutkan kode yang diterimanya agar bisa dibantu",2],["Memandu warga memeriksa nomor dan alamat surel yang terdaftar lalu mengirim ulang kode lewat kanal resmi",4]],"Kode verifikasi tidak boleh diminta atau dibuatkan oleh petugas; panduan pemeriksaan dan pengiriman ulang lewat kanal resmi adalah bantuan yang aman.","TIK dan literasi digital"),
t("Sebuah komentar di akun resmi instansi berisi data pribadi seorang warga yang diunggah warga itu sendiri. Sikapmu ...",[["Membiarkan komentar itu karena warga yang mengunggahnya sendiri",2],["Membalas komentar itu dengan mengutip data pribadi warga tersebut",1],["Menyembunyikan atau menghapus komentar itu sesuai kewenangan dan menghubungi warga",4],["Menyembunyikan atau menghapus komentar itu sesuai kewenangan, menghubungi warga untuk menjelaskan risikonya, dan mengingatkannya agar tidak mengunggah data pribadi di ruang publik",5],["Membalas komentar itu dengan peringatan umum tanpa menghapusnya",3]],"Data pribadi di ruang publik harus segera disembunyikan dan pemiliknya diingatkan; mengutip ulang data itu memperparah penyebarannya.","TIK dan literasi digital"),
t("Seorang rekan mengajak memakai satu akun bersama untuk banyak orang agar praktis. Sikapmu ...",[["Memakai akun bersama hanya untuk tugas yang dianggap ringan",3],["Menolak ajakan itu dan memakai akun sendiri",4],["Ikut memakai akun bersama itu agar tidak merepotkan",1],["Memakai akun bersama tetapi mencatat pemakaiannya secara pribadi",2],["Menolak ajakan itu, menjelaskan bahwa setiap orang wajib memakai akunnya sendiri agar tindakannya terlacak, dan melaporkan bila praktik akun bersama itu dipaksakan",5]],"Akun bersama menghilangkan jejak pertanggungjawaban; setiap orang wajib memakai akun sendiri, dan praktik akun bersama yang dipaksakan harus dilaporkan.","TIK dan literasi digital"),
t("Seorang rekan berulang kali mengurus usaha pribadinya pada jam kerja. Sikapmu ...",[["Menegur rekan itu secara pribadi dengan baik dan melaporkannya ke atasan bila kebiasaan itu terus berlanjut",5],["Menegur rekan itu secara pribadi dengan baik",4],["Membicarakannya dengan rekan lain tanpa menegur langsung",3],["Ikut membantu usaha pribadinya pada jam kerja",1],["Mengabaikannya karena bukan urusanmu",2]],"Teguran pribadi yang baik memberi kesempatan memperbaiki diri, dan laporan ke atasan diperlukan bila berlanjut; membicarakan di belakang atau ikut membantu tidak menyelesaikan pelanggaran jam kerja.","Profesionalisme"),
t("Atasan memintamu merahasiakan kesalahan kecil dalam laporan agar tidak diketahui pimpinan. Sikapmu ...",[["Memperbaiki kesalahan itu diam-diam tanpa memberi tahu siapa pun",3],["Menolak merahasiakan kesalahan itu, mengusulkan koreksi secara jujur, dan mendokumentasikan koreksi tersebut",5],["Menolak merahasiakan dan mengusulkan koreksi secara jujur",4],["Merahasiakannya untuk sementara sambil menunggu pimpinan mengetahuinya sendiri",2],["Merahasiakannya dan membantu menutupi kesalahan itu",1]],"Kesalahan laporan harus dikoreksi secara jujur dan terdokumentasi; merahasiakan atau menutupi melanggar integritas, sekalipun kesalahan itu kecil dan atas perintah atasan.","Profesionalisme"),

  const all=Q.filter(q=>q.k===k);

/* ---- acak ber-seed untuk Simulasi CAT A-D (susunan berbeda per huruf) ---- */
function seededShuf(a,seedStr){
  let h=2166136261;for(let i=0;i<seedStr.length;i++){h^=seedStr.charCodeAt(i);h=Math.imul(h,16777619)}
  let s=h>>>0;
  const rnd=()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296};
  const arr=a.slice();
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const tmp=arr[i];arr[i]=arr[j];arr[j]=tmp}
  return arr;
}

/* ---- premium: kode aktivasi XXXX-XXXX, checksum mod31 bobot 1-7 ---- */
const ALPH="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // 31 karakter, tanpa I O 0 1 L
function codeChecksumOK(code){
  const c=String(code).toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(c.length!==8)return false;
  let s=0;
  for(let i=0;i<7;i++){const idx=ALPH.indexOf(c[i]);if(idx<0)return false;s+=idx*(i+1)}
  return ALPH.indexOf(c[7])===s%31;
}

  if(c.length>8)return{ok:false,kind:"long",msg:"Kode terlalu panjang: ada "+c.length+" karakter, padahal kode hanya 8 karakter (XXXX-XXXX). Hapus kelebihan karakternya. Bila menempel dari chat, pastikan yang disalin hanya kodenya saja, tanpa kata lain."};
  const bad=[...new Set(c.split("").filter(ch=>ALPH.indexOf(ch)<0))];
  if(bad.length)return{ok:false,kind:"chars",msg:"Karakter tidak dipakai dalam kode: "+bad.join(", ")+". Kode Siap Abdi tidak memakai huruf I, O, L dan angka 0, 1. Periksa apakah karakter itu salah ketik \u2014 misalnya O yang sebenarnya bukan bagian kode, atau 0/1 yang tertukar dengan huruf."};
  if(!codeChecksumOK(c))return{ok:false,kind:"checksum",msg:"Kode tidak cocok \u2014 pemeriksaan kode gagal. Kemungkinan besar ada satu huruf yang salah ketik. Cara paling aman: salin kode dari generator atau chat admin, lalu tempel di sini (jangan ketik manual satu-satu)."};
  return{ok:true,code:c};
}

const TRICKS=[
{tp:"Pancasila dan nilai",t:"Pancasila — Cocokkan Nilai, Bukan Bunyi Sila",inti:"Baca kasusnya dulu, tanya \u201Cnilai apa yang dilanggar/diterapkan?\u201D, baru cocokkan ke sila lewat kata kunci — jangan menghafal bunyi sila saja.",langkah:["Baca kasus, garis bawahi kata kerja/keadaannya (menolong, bermusyawarah, adil, bersatu).","Cocokkan ke kata kunci sila: 1 Ketuhanan, 2 Kemanusiaan, 3 Persatuan, 4 Kerakyatan, 5 Keadilan.","Bila dua sila terasa cocok, tanya: ini soal perasaan pada satu orang (Sila 2) atau soal kebersamaan/keadilan untuk semua (Sila 3/5)?"],contoh:"\u201CWarga desa bergotong royong memperbaiki jembatan rusak tanpa dibayar.\u201D \u2192 Sila ke-3, Persatuan Indonesia (kerja bersama untuk kepentingan bersama).",jebakan:"Kasus menolong tetangga yang sakit (empati pada satu orang) \u2192 Sila ke-2, bukan ke-3. Bedakan empati personal vs persatuan bersama."},
{tp:"UUD 1945 dan lembaga negara",t:"UUD 1945 — Pasal + 1 Kata Kunci",inti:"Hafal nomor pasal + 1 kata kunci (Pasal 27 = persamaan kedudukan, Pasal 29 = agama, Pasal 30 = pertahanan, Pasal 31 = pendidikan, Pasal 33 = perekonomian).",langkah:["Baca soal, tebak pasal dari kata kuncinya sebelum melihat opsi.","Cocokkan tebakanmu dengan opsi yang ada.","Kalau ragu antara 2 pasal, eliminasi opsi yang pasalnya jelas salah topik."],contoh:"\u201CHak warga negara atas pendidikan diatur dalam UUD 1945 Pasal \u2026\u201D \u2192 Pasal 31.",jebakan:"Pasal 27 vs Pasal 28 — Pasal 27 = persamaan kedudukan dan hak-kewajiban warga negara; Pasal 28 = kemerdekaan berserikat, berkumpul, dan berpendapat. Jangan tertukar."},
{tp:"NKRI & Bhinneka Tunggal Ika",t:"NKRI & Bhinneka — Sutasoma, Garuda 17-8-19-45, dan Pasal Pengunci NKRI",inti:"Tiga jangkar topik ini: (1) semboyan Bhinneka Tunggal Ika berasal dari kitab Sutasoma karya Mpu Tantular, (2) bulu Garuda = tanggal Proklamasi 17-8-1945 (sayap 17, ekor 8, pangkal ekor 19, leher 45), (3) bentuk NKRI dikunci Pasal 37 ayat (5) — satu-satunya hal yang tidak dapat diubah dalam UUD 1945.",langkah:["Petakan kata kunci soal: semboyan/kitab \u2192 Sutasoma; lambang/bulu Garuda \u2192 urutan 17-8-19-45; negara kepulauan \u2192 Pasal 25A; bentuk negara tidak dapat diubah \u2192 Pasal 37 ayat (5).","Bedakan tiga istilah yang sering ditukar: desentralisasi = penyerahan urusan ke daerah otonom; dekonsentrasi = pelimpahan wewenang ke gubernur sebagai wakil pemerintah pusat; tugas pembantuan = penugasan dari pusat kepada daerah.","Untuk soal keberagaman, pilih opsi yang menjaga persatuan dalam perbedaan — bukan menyeragamkan semua daerah, bukan pula memisahkan."],contoh:"\u201CBentuk negara yang tidak dapat dilakukan perubahan menurut UUD 1945 adalah \u2026\u201D \u2192 bentuk Negara Kesatuan Republik Indonesia (Pasal 37 ayat (5)).",jebakan:"Semboyan Bhinneka Tunggal Ika sering ditukar dengan kitab Negarakertagama — Negarakertagama karya Mpu Prapanca berisi sejarah Majapahit; semboyannya ada di Sutasoma. Urutan bulu Garuda juga sering ditukar: ekor 8, pangkal ekor 19 — jangan tertukar."},
{tp:"Sejarah nasional",t:"Sejarah / Nasionalisme — Taruh di Garis Waktu",inti:"Buat garis waktu: 1908, 1928, 1945 (1 Juni, 22 Juni, 17 Agt, 18 Agt), 1949, 1966, 1998. Soal sejarah paling sering menguji urutan.",langkah:["Tulis garis waktu singkat di kertas coretan sebelum menjawab soal sejarah.","Letakkan tiap peristiwa di garis itu, baru jawab urutan/sebab-akibatnya.","Jangan menghafal tahun lepas — hafal urutannya."],contoh:"Urutan peristiwa: (a) Sumpah Pemuda, (b) Proklamasi Kemerdekaan, (c) Konferensi Meja Bundar \u2192 1928 \u2192 1945 \u2192 1949.",jebakan:"1 Juni 1945 vs 22 Juni 1945 — 1 Juni = pidato Soekarno (lahirnya Pancasila), 22 Juni = Piagam Jakarta. Dua tanggal berdekatan, sering ditukar."},
{tp:"Bela Negara",t:"Bela Negara — Cari Perbuatan, Bukan Perasaan",inti:"Bela negara di soal = perbuatan nyata warga (ikut menjaga, melapor, patuh hukum, gotong royong) — bukan sekadar \u201Ccinta tanah air\u201D sebagai perasaan.",langkah:["Baca tiap opsi, tanya: \u201CApa yang DILAKUKAN tokohnya?\u201D","Pilih opsi yang berisi aksi konkret dan sesuai hukum.","Buang opsi yang hanya berisi perasaan atau slogan."],contoh:"\u201CTetangga mengajak menolak membayar pajak.\u201D \u2192 Menolak ajakan itu dan menjelaskan bahwa pajak adalah kewajiban warga negara (aksi nyata).",jebakan:"Opsi \u201Csangat mencintai tanah air\u201D tanpa aksi apa pun — terdengar benar, tapi bukan jawaban bela negara dalam soal."},
{tp:"Integritas",t:"Integritas — Tolak Sejak Awal, Walau Kecil",inti:"Pilih opsi yang menolak gratifikasi/korupsi walau kecil dan walau tidak ada yang melihat.",langkah:["Cari opsi penolakan yang tegas dan langsung.","Waspada opsi \u201Cterima dulu, lapor nanti\u201D — menerima tetap menerima.","Bila ada opsi melapor lewat jalur resmi, itu penguat (bukan pengganti penolakan)."],contoh:"\u201CRekan menawarkan 'uang rokok' agar berkasnya didahulukan.\u201D \u2192 Tolak dan laporkan sesuai prosedur.",jebakan:"\u201CTerima dulu lalu laporkan ke atasan\u201D — terdengar jujur karena melapor, tapi gratifikasinya sudah diterima. Salah."},
{tp:"Bahasa Indonesia",t:"Bahasa Indonesia — Baca di Kepala, yang Janggal Biasanya Salah",inti:"Fokus EYD + fungsi bahasa negara + kata baku. Baca kalimat keras-keras di kepala; opsi yang terdengar janggal biasanya salah ejaan/tanda baca.",langkah:["Baca tiap opsi pelan, dengarkan \u201Cbunyi\u201D-nya.","Cek ejaan dan tanda baca pada kata yang dicurigai.","Jangan terkecoh kata yang \u201Csering dipakai\u201D tapi tidak baku."],contoh:"Kata baku dari \u201Capotik\u201D adalah \u2192 apotek.",jebakan:"Kata yang lazim diucapkan sehari-hari belum tentu baku — mis. \u201Csekedar\u201D (tidak baku) vs \u201Csekadar\u201D (baku); \u201Ccidera\u201D (tidak baku) vs \u201Ccedera\u201D (baku)."},
{tp:"Sinonim dan antonim",t:"Sinonim / Antonim — Eliminasi Lawan Katanya Dulu",inti:"Untuk soal sinonim, buang dulu opsi yang berlawanan arti (dan sebaliknya untuk soal antonim).",langkah:["Tentukan arti kata soal sebisanya — bila tidak tahu, lanjut ke langkah 2.","Cari 2 opsi yang berlawanan satu sama lain; salah satunya sering jadi jawaban.","Buang opsi yang jelas berlawanan, bandingkan sisanya."],contoh:"Sinonim \u201Cabstrak\u201D \u2192 \u201Ctidak berwujud\u201D (lawannya: konkret — buang dulu opsi \u201Cnyata\u201D dan \u201Ckonkret\u201D).",jebakan:"Opsi yang \u201Cmirip bunyi\u201D tapi beda arti — mis. \u201Cabstrak\u201D vs \u201Cekstrak\u201D. Kemiripan bunyi bukan kemiripan arti."},
{tp:"Analogi",t:"Analogi — Rumuskan Hubungan dalam 1 Kalimat",inti:"Rumuskan hubungan pasangan soal dalam 1 kalimat (\u201CX adalah alat untuk Y\u201D / \u201CX bagian dari Y\u201D), lalu terapkan kalimat yang sama ke semua pilihan.",langkah:["Tulis hubungan pasangan soal dalam 1 kalimat.","Uji tiap opsi dengan kalimat yang sama persis.","Yang hubungannya identik, itu jawabannya — jangan pilih karena katanya mirip."],contoh:"\u201CDokter : Pasien = Guru : \u2026\u201D \u2192 hubungan: \u201Cprofesi melayani \u2026\u201D \u2192 Murid.",jebakan:"Memilih \u201CSekolah\u201D karena terkait guru — padahal hubungannya bukan \u201Cyang dilayani\u201D. Kata terkait \u2260 hubungan sama."},
{tp:"Logika dan silogisme",t:"Silogisme — Gambar 2 Lingkaran, Jangan Balik Premis",inti:"Gambar cepat 2 lingkaran/diagram. Premis \u201CSemua A adalah B\u201D \u2260 \u201CSemua B adalah A\u201D — kesimpulan yang membalik premis hampir selalu salah.",langkah:["Gambar diagram kecil: lingkaran A di dalam/di luar B sesuai premis.","Uji tiap kesimpulan terhadap gambar itu.","Buang kesimpulan yang membalik arah premis atau memakai kata \u201Csemua\u201D dari premis \u201Csebagian\u201D."],contoh:"\u201CSemua pegawai disiplin. Sebagian pegawai berkacamata.\u201D \u2192 kesimpulan yang pasti benar: \u201CSebagian yang berkacamata adalah pegawai disiplin.\u201D",jebakan:"\u201CSemua yang berkacamata adalah pegawai\u201D — membalik premis. Dari \u201Csebagian pegawai berkacamata\u201D tidak bisa disimpulkan apa pun tentang \u201Csemua yang berkacamata\u201D."},
{tp:"Penalaran analitis",t:"Penalaran Analitis — Buat Tabel di Kertas Coretan",inti:"Buat tabel/kotak kecil (siapa–di mana–kapan). Isi yang pasti dulu, silang yang mustahil. Jangan kerjakan dari kepala — soal ini dirancang untuk menjebak ingatan.",langkah:["Gambar tabel kecil: baris = orang/benda, kolom = posisi/waktu.","Isi fakta yang pasti, silang kombinasi yang mustahil.","Baru simpulkan dari tabel yang sudah terisi."],contoh:"\u201CP di depan Q. Q di depan S. S di depan R. Urutan dari depan?\u201D \u2192 tabel 4 posisi: P, Q, S, R.",jebakan:"Menghafal urutan di kepala sambil membaca soal — satu fakta tertukar, semua kesimpulan ikut salah. Tulis dulu, baru jawab."},
{tp:"Deret angka",t:"Deret Angka — Cek Selisih Dulu, Baru Pola Rumit",inti:"Cek urutan ini: (1) selisih, (2) rasio/kali, (3) pola selang-seling (ganjil–genap), (4) kuadrat/kubik. Sebagian besar deret CPNS selesai di langkah 1–2.",langkah:["Tulis selisih antar suku, kiri ke kanan. Bila selisih tetap \u2192 itu jawabannya.","Bila tidak, cek rasio (tiap suku dikali berapa?).","Bila belum ketemu, cek suku ganjil dan genap secara terpisah.","Baru terakhir pikirkan kuadrat/kubik."],contoh:"\u201C2, 6, 18, 54, \u2026\u201D \u2192 selisih berubah (4, 12, 36), rasio tetap \u00D73 \u2192 162.",jebakan:"Langsung menebak pola kuadrat/kubik sebelum cek selisih — buang waktu di pola rumit padahal jawabannya pola kali sederhana."},
{tp:"Hitungan dan persen",t:"Hitungan & Persen — Ubah Persen Jadi Pecahan Sederhana",inti:"Ubah persen ke pecahan sederhana (25% = 1/4, 20% = 1/5, 12,5% = 1/8). Kerjakan dengan pembulatan kasar dulu untuk eliminasi 2–3 opsi, baru hitung tepat untuk sisa opsi.",langkah:["Ubah persen ke pecahan (lihat tabel pecahan istimewa di Teknik Cepat).","Perkirakan kasar, buang opsi yang jelas terlalu besar/kecil.","Hitung tepat hanya untuk 1–2 opsi yang tersisa."],contoh:"\u201C25% dari 840 = \u2026\u201D \u2192 1/4 \u00D7 840 = 210.",jebakan:"Menghitung tepat sejak awal tanpa eliminasi (buang waktu) — atau tertukar 25% dengan 2,5% karena terburu-buru membaca soal."},
{tp:"Perbandingan dan soal cerita",t:"Perbandingan & Soal Cerita — Tulis \u201CDiketahui – Ditanya\u201D Dulu",inti:"Tulis \u201Cdiketahui – ditanya\u201D dalam 1 baris sebelum menghitung. Soal cerita gagal bukan karena hitungan sulit, tapi karena salah memetakan siapa dibanding siapa.",langkah:["Tulis 1 baris: diketahui apa, ditanya apa.","Petakan perbandingannya (A : B = \u2026) sebelum menyentuh angka.","Baru hitung — dan cek apakah jawabanmu masuk akal dengan soalnya."],contoh:"\u201CHarga 3 buku Rp45.000. Harga 5 buku?\u201D \u2192 diketahui: 3 buku = 45.000 \u2192 1 buku = 15.000 \u2192 ditanya 5 buku = Rp75.000.",jebakan:"Membalik pembilang–penyebut (menghitung 45.000 \u00F7 5 dulu) atau salah memetakan siapa dibanding siapa — hasilnya terlihat masuk akal tapi salah arah."},
{tp:"Pelayanan publik",t:"Pelayanan Publik — Selesaikan Kebutuhan Warga Dulu",inti:"Pilih opsi paling cepat melayani + paling jelas prosedurnya + tetap ramah. Urutan nilai: selesaikan kebutuhan warga > lempar ke atasan > minta warga menunggu tanpa kepastian.",langkah:["Cari opsi yang menyelesaikan kebutuhan warga (bukan sekadar menjelaskan).","Cek: apakah ada kepastian waktu/langkah berikutnya untuk warga?","Buang opsi yang meminta warga menunggu tanpa kepastian."],contoh:"\u201CSeorang warga marah karena antrean pelayanan lama.\u201D \u2192 Mendengarkan, meminta maaf atas ketidaknyamanan, menjelaskan alur, dan membantu mempercepat sesuai prosedur.",jebakan:"Opsi yang \u201Cmenjelaskan penyebab antrean\u201D saja tanpa solusi — terdengar sopan, tapi kalah dari opsi yang menjelaskan + memberi kepastian + bertindak."},
{tp:"Jejaring kerja",t:"Jejaring Kerja — Kerja Sama Aktif, Bukan Kerja Sendiri",inti:"Pilih opsi yang membangun kerja sama aktif (koordinasi, berbagi info, tawarkan bantuan) — bukan kerja sendiri dengan baik, bukan juga menyerahkan semua ke orang lain.",langkah:["Cari opsi yang melibatkan orang lain secara aktif.","Buang opsi \u201Ckerja sendiri dengan baik\u201D — di soal jejaring, itu bukan jawaban terbaik.","Buang juga opsi \u201Cserahkan semua ke orang lain\u201D — itu menghindar, bukan bekerja sama."],contoh:"\u201CRekan baru kesulitan memakai aplikasi kantor, sementara kamu sedang sibuk.\u201D \u2192 Meluangkan beberapa menit sekarang untuk menjelaskan inti, lalu membagikan panduan tertulis.",jebakan:"\u201CMengerjakan tugas rekan itu sendiri agar cepat selesai\u201D — terlihat membantu, tapi tidak membangun kemandirian rekan dan tidak membangun jejaring."},
{tp:"Sosial Budaya",t:"Sosial Budaya — Hormati Adat, Tetap Jalankan Tugas",inti:"Pilih opsi yang menghormati adat/kebiasaan setempat sambil tetap menjalankan tugas. Hindari opsi yang memaksakan cara sendiri atau yang menghindar total dari perbedaan.",langkah:["Cari opsi yang menunjukkan penyesuaian diri (mempelajari, bertanya, menyesuaikan cara).","Cek: apakah tugas tetap jalan? Opsi yang hanya \u201Cmenghormati\u201D tapi tugas mangkrak bukan jawaban terbaik.","Buang opsi yang memaksakan cara sendiri atau yang menghindar dari perbedaan."],contoh:"\u201CDitugaskan ke daerah dengan adat berbeda; warga keberatan dengan caramu bekerja.\u201D \u2192 Mempelajari adat setempat, menyesuaikan cara kerja, dan tetap menjalankan tugas sesuai aturan.",jebakan:"\u201CTetap bekerja seperti biasa, adat bukan urusan kantor\u201D — memaksakan cara sendiri; atau sebaliknya \u201Cmenyerah dan minta dipindah\u201D — menghindar total."},
{tp:"TIK dan literasi digital",t:"TIK — Aman Dulu, Cepat Kemudian",inti:"Pilih opsi yang aman dulu: cek sumber, jangan sebarkan data, gunakan kanal resmi. Di soal TIK, opsi \u201Ccepat tapi berisiko\u201D hampir selalu kalah dari \u201Cagak lambat tapi aman dan terdokumentasi\u201D.",langkah:["Cari opsi yang memverifikasi dulu sebelum menyebar/menggunakan.","Cek: apakah data pribadi dilindungi? Apakah ada jejak/dokumentasi?","Buang opsi yang mengutamakan kecepatan di atas keamanan."],contoh:"\u201CMenerima pesan berantai berisi data warga di grup kerja.\u201D \u2192 Tidak meneruskan pesan itu; verifikasi ke sumber resmi, dan laporkan bila sudah dipastikan hoaks.",jebakan:"\u201CTeruskan dulu agar cepat, nanti dikoreksi bila salah\u201D — data yang sudah tersebar tidak bisa ditarik kembali."},
{tp:"Profesionalisme",t:"Profesionalisme — Aturan + Dapat Dipertanggungjawabkan",inti:"Pilih opsi yang konsisten dengan aturan + dapat dipertanggungjawabkan secara tertulis. \u201CDemi kebaikan\u201D tanpa prosedur bukan profesionalisme.",langkah:["Cari opsi yang mengikuti prosedur dan meninggalkan jejak tertulis.","Waspada opsi yang melanggar aturan dengan alasan \u201Cdemi kebaikan\u201D atau \u201Cdemi kecepatan\u201D.","Bila ada kendala, opsi terbaik biasanya: sampaikan kendala + minta arahan + tetap berusaha menyelesaikan."],contoh:"\u201CAtasan memberi tugas di luar keahlianmu dengan tenggat dekat.\u201D \u2192 Menyampaikan kendala, meminta arahan, dan belajar cepat dari rekan atau panduan agar tetap selesai.",jebakan:"\u201CMenerima dan mengerjakan sebisanya tanpa bertanya\u201D — terlihat patuh, tapi menyembunyikan kendala yang bisa menggagalkan tugas. Atau \u201Cmenolak mentah-mentah\u201D — tidak profesional."},
{tp:"Anti radikalisme",t:"Anti-Radikalisme — Tolak dengan Damai + Lapor Jalur Resmi",inti:"Pilih opsi yang menolak paham kekerasan/ekstrem dengan cara damai + lapor lewat jalur resmi. Hindari opsi yang membalas dengan kekerasan atau yang diam saja karena \u201Cbukan urusan saya\u201D.",langkah:["Cari opsi penolakan yang tegas tapi damai (bukan konfrontasi).","Cek: apakah ada tindakan lanjut (melapor, mengedukasi)?","Buang opsi \u201Cdiam saja\u201D dan opsi \u201Cmembalas dengan kekerasan\u201D."],contoh:"\u201CRekan mengajak bergabung ke kelompok yang menolak Pancasila.\u201D \u2192 Menolak dengan tegas dan santun, lalu melaporkan ke atasan melalui jalur resmi.",jebakan:"\u201CMenolak tapi tidak melapor\u201D — kurang dari skor tertinggi karena tidak ada tindakan lanjut. Atau \u201Cikut berdebat keras agar dia kalah\u201D — membalas dengan konfrontasi, bukan cara damai."}
];
