/* ================= DIALOG AKSESIBEL =================
   Ditulis sendiri mengikuti pola WAI-ARIA APG + konsep a11y-dialog
   (github.com/KittyGiraudel/a11y-dialog, MIT): Esc menutup, Tab terkurung
   di dalam dialog, fokus kembali ke tombol pemicu setelah dialog ditutup. */
let dlgEl=null,dlgTrigger=null,dlgKeyH=null;
function closeConfirm(restore){
  if(!dlgEl)return;
  document.removeEventListener("keydown",dlgKeyH,true);
  dlgEl.remove();dlgEl=null;dlgKeyH=null;
  if(restore!==false&&dlgTrigger&&document.contains(dlgTrigger))dlgTrigger.focus();
  dlgTrigger=null;
}
function openConfirm(o){
  closeConfirm(false);
  dlgTrigger=document.activeElement;
  const ov=document.createElement("div");
  ov.className="dlgwrap";
  ov.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgt" aria-describedby="dlgb">
    <h3 id="dlgt">${o.icon?ic(o.icon):""}<span>${o.title}</span></h3>
    <p id="dlgb">${o.body}</p>
    <div class="rowbtns"><button class="btn" id="dlgno" type="button">${o.cancelLabel||"Batal"}</button><button class="btn pri" id="dlgyes" type="button">${o.okLabel}</button></div></div>`;
  document.body.appendChild(ov);
  dlgEl=ov;
  const yes=ov.querySelector("#dlgyes"),no=ov.querySelector("#dlgno");
  no.focus();
  dlgKeyH=e=>{
    if(e.key==="Escape"){e.preventDefault();closeConfirm()}
    else if(e.key==="Tab"){
      const f=[no,yes];const first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
    }
  };
  document.addEventListener("keydown",dlgKeyH,true);
  ov.addEventListener("mousedown",e=>{if(e.target===ov)closeConfirm()});
  no.onclick=()=>closeConfirm();
  yes.onclick=()=>{const cb=o.onOk;closeConfirm(false);if(cb)cb()};
}

function trikPage(){
  const prem=isPremium();
  const topicK={};Q.forEach(q=>{if(!(q.tp in topicK))topicK[q.tp]=q.k});
  const drop=(x,sub)=>{const free=x.tp===FREE_TRICK_TOPIC;
    if(prem||free)return `<details class="topdd"${free?" open":""}><summary>${esc(x.t)}</summary>${trickBodyHTML(x)}</details>`;
    return lockedRowHTML(x.t,sub)};
  const subGroup=k=>{
    const trs=TRICKS.filter(x=>topicK[x.tp]===k);
    const tes=TEKNIK.filter((x,i)=>TEKNIK_SUB[i]===k);
    const nModel=TRIK_MODEL.filter(x=>topicK[x.tp]===k).length;
    const topicBlock=x=>{
      const ms=TRIK_MODEL.filter(m=>m.tp===x.tp);
      return drop(x,"Topik "+k+": "+x.tp)+(ms.length?`<p style="margin:14px 0 2px"><b>Trik per model soal — ${esc(x.tp)}</b> <span class="mut small">${ms.length} model: cara khusus untuk tiap bentuk soal di topik ini</span></p>${ms.map(m=>drop(m,"Model soal "+k+": "+x.tp)).join("")}`:"");
    };
    return `<details class="subdd"${k==="TIU"?" open":""}><summary><b>${k}</b> &nbsp;${esc(NAMA[k])} &nbsp;<span class="mut small">${trs.length} topik · ${nModel} kartu model</span></summary>
    <p class="mut small" style="margin:10px 0 2px">Ketuk satu topik untuk membuka triknya. Di bawah tiap topik ada trik per model soal: cara khusus untuk tiap bentuk soal di topik itu, langkah demi langkah, supaya menjawab lebih cepat.</p>
    ${trs.map(topicBlock).join("")}
    ${tes.length?`<p style="margin:14px 0 2px"><b>Teknik khusus ${k}</b> <span class="mut small">\u2014 cara cepat untuk model soal ${k}</span></p>${tes.map(x=>drop(x,"Teknik cepat "+k)).join("")}`:""}
    ${k==="TWK"?`<button class="btn" id="gohafal"><span class="grow"><b>Cara Menghafal Materi TWK</b><br><span class="mut small">${HAFAL.length} teknik hafalan + rencana 14 hari</span></span><span class="arr">\u203A</span></button>`:""}
    </details>`};
  const umum=TEKNIK.filter((x,i)=>TEKNIK_SUB[i]==="ALL");

function mix(){const g={};Q.forEach(q=>(g[q.tp]=g[q.tp]||[]).push(q));const ks=shuf(Object.keys(g));ks.forEach(k=>g[k]=shuf(g[k]));const out=[];let more=true;while(more){more=false;ks.forEach(k=>{if(g[k].length){out.push(g[k].pop());more=true}})}return out}
let L=null;
function startLatihan(cfg){
  const prem=isPremium();
  let pool;
  if(cfg.mode==="SESI"){
    if(!prem)return premiumPage("Latihan per sesi adalah fitur Premium.");
    const s=getSession(cfg.k,cfg.letter);
    if(!s)return home();
    pool=shuf(s.qs.slice()); // urutan soal di dalam sesi diacak tiap mulai — tidak lagi urutan bank yang sama
  }
  else if(cfg.mode==="ALL")pool=mix();
  else if(cfg.mode==="SUB")pool=shuf(Q.filter(q=>q.k===cfg.k));
  else pool=shuf(byTopic(cfg.topic));
  const quota=!prem&&(cfg.mode==="ALL"||cfg.mode==="SUB");
  if(quota&&freeLeft()<=0)return premiumPage(jatahLatihanNote());
  const n=cfg.mode==="SESI"?pool.length:Math.min(10,pool.length);
  L={list:pool.slice(0,n).map(q=>({q,o:shuf(q.o.slice())})),i:0,sc:{TWK:0,TIU:0,TKP:0},mx:{TWK:0,TIU:0,TKP:0},ans:null,label:cfg.label,quota,topic:cfg.topic||null,earlyEnd:false,scoreKey:cfg.scoreKey||null};
  showQ();scrollTop();
}

  <p style="text-align:center;margin:0 0 4px"><strong>${tot} dari ${tm} poin</strong></p><p class="mut" style="text-align:center">${msg}</p>
  ${ks.map(k=>`<div class="row2"><span>${k}</span><span>${L.sc[k]} / ${L.mx[k]}</span></div><div class="bar" style="margin:0"><i style="width:${L.mx[k]?L.sc[k]/L.mx[k]*100:0}%"></i></div>`).join("")}</div>
  <div>${ks.map(k=>{const need=Math.ceil(PG[k]/MAXS[k]*L.mx[k]);const lewat=L.sc[k]>=need;return `<p style="margin:8px 0"><b>${k} — ${esc(NAMA[k])}:</b> skor kamu <b>${L.sc[k]} dari ${L.mx[k]} poin</b>. Nilai lulus (passing grade) subtes ${k} menurut ${PG_ACUAN} adalah ${PG[k]} dari ${MAXS[k]} poin di ujian asli. Dihitung sebanding dengan jumlah soal latihan ini, patokannya kira-kira ${need} poin — jadi untuk subtes ini kamu <b>${lewat?"sudah melewati patokan":"belum melewati patokan"}</b>.</p>`}).join("")}</div>
  <div class="disc"><b>Yang penting dipahami:</b> di SKD asli, kamu dinyatakan lolos hanya bila lolos di <b>ketiga subtes sekaligus</b> — TWK, TIU, dan TKP semuanya harus mencapai nilai lulusnya masing-masing. Satu subtes saja di bawah nilai lulus sudah membuat tidak lolos, walaupun total nilaimu besar. Latihan ini jumlah soalnya lebih sedikit dari ujian asli, jadi patokan di atas dihitung sebanding dan sifatnya perkiraan untuk belajar — bukan penilaian resmi, dan skor latihan ini bukan prediksi nilai SKD sebenarnya.</div>
  <div class="disc">Aplikasi latihan mandiri \u2014 bukan aplikasi resmi BKN dan tidak menjamin kelulusan.</div>
  ${!isPremium()?`<button class="btn yel" id="goprem"><span class="grow" style="text-align:center">Latihan tanpa batas \u2014 Premium ${HARGA}</span></button>`:""}
  <button class="btn pri" id="ag">Kembali ke beranda</button>`;
  document.getElementById("ag").onclick=home;
  const gp=document.getElementById("goprem");if(gp)gp.onclick=()=>premiumPage();
  L=null;scrollTop();
}
/* ================= SIMULASI (CAT) ================= */
let C=null,tmr=null;
const fmtT=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
/* ---- progres simulasi disimpan di perangkat: reload / halaman tertutup tidak lagi
   menghapus jawaban. Disimpan: urutan soal + urutan opsi (sebagai indeks ke bank),
   jawaban, tanda ragu, posisi soal, dan batas waktu absolut. ---- */
function saveExam(){
  if(!C)return;
  try{lsSet("skd-exam-v1",{kind:C.kind,label:C.label,scoreKey:C.scoreKey,catLetter:C.catLetter,end:C.end,cur:C.cur,ans:C.ans,flag:C.flag,
    qs:C.qs.map(it=>({qi:Q.indexOf(it.q),ord:it.o.map(o=>it.q.o.indexOf(o))}))})}catch(e){}
}
function clearExamSave(){try{localStorage.removeItem("skd-exam-v1")}catch(e){}}
function restoreExam(){
  const d=lsGet("skd-exam-v1",null);
  if(!d||!Array.isArray(d.qs)||!d.qs.length)return false;
  try{
    const qs=d.qs.map(x=>{const q=Q[x.qi];if(!q||!Array.isArray(x.ord))return null;return{q,o:x.ord.map(i=>q.o[i])}});
    if(qs.some(x=>!x||x.o.some(o=>!o)))return false;
    C={qs,ans:d.ans||{},flag:d.flag||{},cur:Math.min(Math.max(d.cur||0,0),qs.length-1),end:d.end,kind:d.kind,label:d.label,sure:false,scoreKey:d.scoreKey||null,catLetter:d.catLetter||null};
    clearInterval(tmr);tmr=setInterval(tickExam,500);
    if(Date.now()>=C.end){examFin();return true} // waktu habis saat halaman tertutup — nilai dari jawaban tersimpan
    examShow();scrollTop();return true;
  }catch(e){return false}
}
function startExam(kind,letter){
  const prem=isPremium();
  if(kind==="full"&&!prem)return premiumPage("Simulasi CAT A\u2013D (110 soal / 100 menit) adalah fitur Premium.");
  if(kind==="mini"&&!prem&&freeState().miniUsed)return premiumPage(jatahMiniNote());
  const pick=(k,n)=>shuf(Q.filter(q=>q.k===k)).slice(0,n);
  // CAT penuh: penarikan TIU WAJIB mengecualikan 3 topik figural secara eksplisit —
  // label "Simulasi v1 tanpa Figural" tetap berlaku. Simulasi Mini memakai pick() biasa
  // (undian normal), jadi soal figural boleh muncul di Mini.
  const pickSeeded=(k,n,seed)=>seededShuf(Q.filter(q=>q.k===k&&!(k==="TIU"&&FIG_TOPICS.indexOf(q.tp)>=0)),seed+"-"+k).slice(0,n);
  let qs,min,label,scoreKey=null,catLetter=null;
  if(kind==="full"){catLetter=(letter&&CAT_LETTERS.includes(letter))?letter:"A";scoreKey="CAT-"+catLetter;qs=[...pickSeeded("TWK",30,"CAT-"+catLetter),...pickSeeded("TIU",35,"CAT-"+catLetter),...pickSeeded("TKP",45,"CAT-"+catLetter)];min=100;label="Simulasi CAT "+catLetter}
  else{qs=[...pick("TWK",6),...pick("TIU",8),...pick("TKP",10)];min=22;label="Simulasi Mini"}
  // Jatah Mini gratis TIDAK lagi hangus saat simulasi dimulai — baru tercatat terpakai
  // bila simulasinya benar-benar diselesaikan (examFin). Keluar di tengah jalan = jatah utuh.
  C={qs:qs.map(q=>({q,o:shuf(q.o.slice())})),ans:{},flag:{},cur:0,end:Date.now()+min*60000,kind,label,sure:false,scoreKey,catLetter};
  clearInterval(tmr);tmr=setInterval(tickExam,500);examShow();scrollTop();
}
function tickExam(){
  if(!C)return;
  const r=Math.max(0,Math.round((C.end-Date.now())/1000)),e=document.getElementById("tm");
  if(e){e.textContent=fmtT(r);e.classList.toggle("low",r<600)}
  if(r<=0)examFin();
}
function examShow(){
  const it=C.qs[C.cur],q=it.q;
  app.innerHTML=`${qbarHTML("Soal "+(C.cur+1)+" / "+C.qs.length,`<span class="tmwrap">${ic("clock")}<span class="tm" id="tm">--:--</span></span>`)}
  <div class="qcard"><div class="qmeta"><span class="tag">${q.k}</span><span class="tag">${esc(q.tp)}</span><span class="mut small">${esc(C.label)}${C.kind==="full"?" \u00B7 Simulasi v1 tanpa Figural":""}</span></div>
  <p class="q">${esc(q.q)}</p>${figStemHTML(q,64)}
  <div class="opts">${it.o.map((o,j)=>`<button class="opt${C.ans[C.cur]===j?" sel":""}" data-j="${j}"><span class="l">${String.fromCharCode(65+j)}</span>${o.fig?`<span class="figwrap">${renderFigural(o.fig,86)}</span>`:`<span>${esc(o.t)}</span>`}</button>`).join("")}</div></div>
  <div class="rowbtns"><button class="btn" id="pv">\u2039 Sebelumnya</button><button class="btn" id="fl">${C.flag[C.cur]?"Batal ragu":"Ragu-ragu"}</button><button class="btn" id="nx2">Berikutnya \u203A</button></div>
  <h2>Navigasi soal</h2><div class="nav" role="group" aria-label="Nomor soal">${C.qs.map((x,n)=>`<button class="nb${n===C.cur?" cur":""}${C.ans[n]!==undefined?" done":""}${C.flag[n]?" flg":""}" data-n="${n}" aria-label="Soal ${n+1}">${n+1}</button>`).join("")}</div>
  <p class="mut small">Blok teal = sudah dijawab \u00B7 garis kuning di dalam = ragu-ragu \u00B7 Jawaban kosong dan salah sama-sama 0, jadi jangan kosongkan jawaban (khusus TKP, tiap opsi bernilai 1\u20135).</p>
  <button class="btn pri" id="fin">Selesai ujian</button>`;
  document.getElementById("qprog").style.width=((C.cur+1)/C.qs.length*100)+"%";
  bindExit(()=>{clearInterval(tmr);clearExamSave();C=null;home()});
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{C.ans[C.cur]=+b.dataset.j;C.sure=false;examShow()});
  app.querySelectorAll(".nb").forEach(b=>b.onclick=()=>{C.cur=+b.dataset.n;C.sure=false;examShow();scrollTop()});
  document.getElementById("pv").onclick=()=>{if(C.cur>0){C.cur--;C.sure=false;examShow();scrollTop()}};
  document.getElementById("nx2").onclick=()=>{if(C.cur<C.qs.length-1){C.cur++;C.sure=false;examShow();scrollTop()}};
  document.getElementById("fl").onclick=()=>{C.flag[C.cur]=!C.flag[C.cur];C.sure=false;examShow()};
  document.getElementById("fin").onclick=()=>{
    const total=C.qs.length,dijawab=C.qs.filter((x,n)=>C.ans[n]!==undefined).length,belum=total-dijawab;
    openConfirm({icon:"alert",title:"Selesai & nilai?",body:`Kamu sudah menjawab <b>${dijawab} dari ${total} soal</b>.${belum>0?` Masih ada <b>${belum} soal belum dijawab</b> — jawaban kosong nilainya 0, jadi sebaiknya isi dulu semua soal sebelum selesai.`:" Semua soal sudah dijawab."} Setelah selesai, nilai langsung dihitung dan simulasi tidak bisa diubah lagi.`,okLabel:"Selesai & nilai",cancelLabel:"Kembali mengerjakan",onOk:()=>examFin()});
  };
  saveExam();
  tickExam();
}
function examFin(){
  clearInterval(tmr);
  closeConfirm(false);
  clearExamSave();
  if(C&&C.kind==="mini"&&!isPremium())markMiniUsed(); // jatah Mini gratis tercatat hanya saat simulasi selesai
  const S={TWK:0,TIU:0,TKP:0};
  C.qs.forEach((it,n)=>{if(C.ans[n]!==undefined)S[it.q.k]+=it.o[C.ans[n]].p});
  const ks=["TWK","TIU","TKP"],tot=ks.reduce((a,k)=>a+S[k],0);
  const full=C.kind==="full";
  const mxs=full?MAXS:{TWK:30,TIU:40,TKP:50},mtot=ks.reduce((a,k)=>a+mxs[k],0);
  const pct=Math.round(tot/mtot*100);addHist(C.label,pct);
  if(C.scoreKey)saveLastScore(C.scoreKey,pct);
  const na=C.qs.filter((x,n)=>C.ans[n]===undefined).length;
  const allPass=full&&ks.every(k=>S[k]>=PG[k]);
  /* Baris target 450 di hasil CAT penuh (redaksi VERBATIM STRATEGI_450 Bagian 3):
     kondisi 1 skor >= 450; kondisi 2 di bawah 450 tetapi lolos PG acuan 2024 di ketiga subtes;
     kondisi 3 ada subtes di bawah PG acuan 2024. */
  const target450=(()=>{if(!full)return "";const selisih=tot>=450?tot-450:450-tot;let msg;
    if(tot>=450)msg=`Target latihanmu: 450. Skormu ${tot} — mencapai target (selisih ${selisih} poin). TWK ${S.TWK}, TIU ${S.TIU}, TKP ${S.TKP}: pertahankan ritme ini dan latih topik yang masih goyah.`;
    else if(ks.every(k=>S[k]>=PG[k]))msg=`Target latihanmu: 450. Skormu ${tot} — selisih ${selisih} poin lagi. Kamu lolos PG acuan 2024 (TWK ${S.TWK}, TIU ${S.TIU}, TKP ${S.TKP}) — lihat subtes mana yang paling jauh dari targetnya dan latih topik itu.`;
    else msg=`Target latihanmu: 450. Skormu ${tot} — selisih ${selisih} poin lagi. Ada subtes di bawah PG acuan 2024 (TWK ${S.TWK}, TIU ${S.TIU}, TKP ${S.TKP}) — kejar dulu ambang tiap subtes, baru kejar total 450.`;
    return `<p style="margin:10px 0 0"><b>${msg}</b></p>`})();
  const resultHTML=`<h1>Hasil ${esc(C.label)}</h1>
  ${full?`<div class="card"><p class="mut" style="text-align:center;margin:0">Status kelulusan simulasi (ketiga subtes harus lolos sekaligus)</p><p class="scorebig pass ${allPass?"y":"n"}">${allPass?"LOLOS":"BELUM LOLOS"}</p>
  ${ks.map(k=>{const p=S[k]>=PG[k];return `<div class="row2"><span><b>${k}</b> \u2014 passing grade ${PG[k]}</span><span><b>${S[k]}</b> / ${MAXS[k]} &nbsp;<span class="pass ${p?"y":"n"}">${p?"Lolos":"Belum"}</span></span></div><div class="bar" style="margin:0"><i style="width:${S[k]/MAXS[k]*100}%"></i></div>`}).join("")}
  <p class="mut" style="margin:10px 0 0;text-align:center">Total ${tot} poin \u00B7 ${na} soal tidak dijawab \u00B7 Simulasi v1 tanpa Figural</p>${target450}<p style="margin:10px 0 0">Cara membacanya: "passing grade" artinya nilai lulus minimal di tiap subtes — TWK (Tes Wawasan Kebangsaan) minimal 65, TIU (Tes Intelegensia Umum) minimal 80, TKP (Tes Karakteristik Pribadi) minimal 166. Kamu dinyatakan lolos hanya bila <b>ketiga subtes lolos sekaligus</b>. Satu subtes saja di bawah nilai minimalnya membuat hasil akhir <b>belum lolos</b>, walaupun total nilaimu tinggi. Angka 65/80/166 ini adalah <b>${PG_ACUAN}</b> \u2014 acuan untuk persiapan, bukan penetapan untuk seleksi berikutnya.</p><p style="margin:10px 0 0">Catatan jujur soal skor TKP: pembobotan nilai 1\u20135 per opsi di aplikasi ini adalah <b>rubrik internal bank soal</b>, karena BKN tidak menerbitkan bobot per opsi.</p></div>`
  :`<div class="card"><div class="ring">${ringSvg(pct)}</div><p style="text-align:center;margin:0 0 4px"><strong>${tot} dari ${mtot} poin</strong></p><p class="mut" style="text-align:center">${na} soal tidak dijawab.</p>
  ${ks.map(k=>`<div class="row2"><span>${k}</span><span>${S[k]} / ${mxs[k]}</span></div><div class="bar" style="margin:0"><i style="width:${S[k]/mxs[k]*100}%"></i></div>`).join("")}
  ${ks.map(k=>{const need=Math.ceil(PG[k]/MAXS[k]*mxs[k]);const lewat=S[k]>=need;return `<p style="margin:8px 0"><b>${k} — ${esc(NAMA[k])}:</b> skor kamu <b>${S[k]} dari ${mxs[k]} poin</b>. Passing grade (nilai lulus) menurut ${PG_ACUAN} adalah ${PG[k]} dari ${MAXS[k]} poin. Dihitung sebanding dengan jumlah soal mini ini, patokannya kira-kira ${need} poin — kamu <b>${lewat?"sudah melewati patokan":"belum melewati patokan"}</b>.</p>`}).join("")}
  <p class="mut" style="margin:8px 0 0">Ini simulasi mini: jumlah soalnya hanya 24, jauh lebih sedikit dari ujian asli (110 soal), jadi nilai lulus resmi tidak diterapkan mentah-mentah di sini — patokan di atas dihitung sebanding untuk bahan belajar. Di ujian asli, kamu lolos hanya bila lolos di <b>ketiga subtes sekaligus</b>: satu subtes saja di bawah nilai lulus sudah membuat tidak lolos, walaupun total nilaimu tinggi. Penilaian nilai lulus yang sebenarnya ada di Simulasi Penuh 110 soal. Semua angka passing grade di aplikasi ini adalah <b>${PG_ACUAN}</b>.</p></div>`}
  <div class="disc">Hasil simulasi ini <b>bukan prediksi nilai SKD sebenarnya</b>. Aplikasi latihan mandiri \u2014 bukan aplikasi resmi BKN dan tidak menjamin kelulusan.</div>
  <h2>Pembahasan</h2>
  ${C.qs.map((it,n)=>{const q=it.q,a=C.ans[n],best=Math.max(...it.o.map(o=>o.p)),bi=it.o.findIndex(o=>o.p===best);return `<details class="card"><summary><b>${n+1}. [${q.k}]</b> ${esc(q.q)}</summary>${figStemHTML(q,54)}<p style="margin-top:8px">Jawabanmu: ${a===undefined?"<i>tidak dijawab</i>":esc(optText(it.o[a]))+" ("+it.o[a].p+" poin)"}</p><p>Jawaban terbaik: ${esc(optText(it.o[bi]))} (${best} poin)</p><p class="mut">${esc(q.e)}</p></details>`}).join("")}
  <button class="btn pri" id="ag">Kembali ke beranda</button>`;
  /* Skeleton + spinner singkat selama nilai dihitung (momen tunggu di layar hasil CAT). */
  const lbl=C.label;
  app.innerHTML=`<h1>Menghitung nilai\u2026</h1><div class="card" style="text-align:center"><span class="spin lg" role="status" aria-label="Menghitung nilai"></span><p style="margin:12px 0 0"><b>Sedang menghitung nilai ${esc(lbl)}\u2026</b></p><p class="mut" style="margin:4px 0 0">Sebentar \u2014 jawabanmu sedang dijumlah per subtes.</p></div><div class="skel" aria-hidden="true"><div class="skl w40"></div><div class="skl w75"></div><div class="skl w55"></div><div class="skl w75"></div></div>`;
  C=null;scrollTop();
  const renderResult=()=>{app.innerHTML=resultHTML;const ag=document.getElementById("ag");if(ag)ag.onclick=home;scrollTop()};
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)renderResult();
  else setTimeout(renderResult,650);
}
/* ================= MULAI ================= */
if(typeof Q==="undefined"||!Q.length){app.innerHTML="<p style=\"padding:20px\">Bank soal gagal dimuat.</p>"}
else if(!restoreExam())home();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});}</script>
