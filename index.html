<script>
// BANK SOAL. Tambah soal dengan menyalin satu baris lalu mengganti isinya.
// Setiap baris diakhiri koma, kecuali baris terakhir sebelum "];".
//
// Soal TWK atau TIU:
//   m("TWK","Pertanyaan ...",["Pilihan A","Pilihan B","Pilihan C","Pilihan D","Pilihan E"],2,"Pembahasan ..."),
//   angka 2 = nomor jawaban benar mulai dari 0 (0=A, 1=B, 2=C, 3=D, 4=E)
//
// Soal TKP (skenario, setiap pilihan punya poin 1 sampai 5, tiap angka dipakai tepat sekali):
//   t("Skenario ...",[["Pilihan",5],["Pilihan",4],["Pilihan",3],["Pilihan",2],["Pilihan",1]],"Pembahasan ..."),
//
// Paket tryout bertambah otomatis kalau jumlah soal cukup (tiap paket: 6 TWK, 8 TIU, 10 TKP).
const m=(k,q,o,c,e,tp)=>({k,q,e,tp,o:o.map((t,i)=>({t,p:i===c?5:0}))});
const t=(q,a,e,tp)=>({k:"TKP",q,e,tp,o:a.map(([t,p])=>({t,p}))});
const Q=[
m("TWK","Sikap mendahulukan kepentingan bangsa di atas kepentingan golongan paling sesuai dengan sila ...",["Ketuhanan Yang Maha Esa","Kemanusiaan yang adil dan beradab","Persatuan Indonesia","Kerakyatan yang dipimpin oleh hikmat kebijaksanaan","Keadilan sosial bagi seluruh rakyat Indonesia"],2,"Mengutamakan kepentingan bangsa dan menjaga persatuan adalah nilai sila ke-3, Persatuan Indonesia.","Pancasila dan nilai"),
m("TWK","Ketentuan bahwa kedaulatan berada di tangan rakyat dan dilaksanakan menurut Undang-Undang Dasar tercantum dalam ...",["Pasal 1 ayat (1)","Pasal 1 ayat (2)","Pasal 1 ayat (3)","Pasal 2 ayat (1)","Pasal 3 ayat (1)"],1,"Pasal 1 ayat (2) UUD 1945 memuat ketentuan tersebut.","UUD 1945 dan lembaga negara"),
m("TWK","Semboyan Bhinneka Tunggal Ika dikutip dari kitab ...",["Negarakertagama","Sutasoma","Pararaton","Arjunawiwaha","Bharatayuddha"],1,"Frasa itu berasal dari kitab Sutasoma karya Mpu Tantular.","NKRI & Bhinneka Tunggal Ika"),

m("TWK","Bela negara berbeda dengan wajib militer karena bela negara ...",["dapat diwujudkan warga negara dalam berbagai bentuk sesuai profesinya, tidak harus menjadi tentara","hanya berlaku bagi laki-laki","wajib diikuti semua warga dengan latihan senjata","hanya berlaku saat perang","diatur oleh negara lain"],0,"Bela negara adalah hak dan kewajiban setiap warga negara yang dapat diwujudkan sesuai profesi — guru mengajar, ASN melayani, pelajar belajar — tidak harus menjadi tentara.","Bela Negara"),

m("TWK","Menurut UU No. 20 Tahun 2001, gratifikasi senilai Rp10.000.000 atau lebih yang diterima penyelenggara negara dianggap ...",["suap, kecuali dapat dibuktikan sebaliknya","hadiah yang sah","pemberian yang tidak perlu dilaporkan","tunjangan resmi","uang transport"],0,"Pasal 12B UU No. 20 Tahun 2001: gratifikasi senilai Rp10.000.000 atau lebih dianggap suap, dengan pembuktian terbalik — penerima yang harus membuktikan bahwa itu bukan suap. Gratifikasi di bawah nilai itu pun wajib dilaporkan bila berhubungan dengan jabatan.","Integritas"),
m("TWK","Penerima gratifikasi wajib melaporkannya kepada KPK paling lambat ...",["30 hari kerja sejak gratifikasi diterima","7 hari sejak gratifikasi diterima","90 hari sejak gratifikasi diterima","1 tahun sejak gratifikasi diterima","tidak ada batas waktu pelaporan"],0,"Pasal 12C UU No. 20 Tahun 2001: penerima gratifikasi wajib melaporkan kepada KPK paling lambat 30 hari kerja terhitung sejak tanggal gratifikasi diterima.","Integritas"),

m("TWK","Undang-undang yang mengatur penyelenggara negara yang bersih dan bebas dari korupsi, kolusi, dan nepotisme adalah ...",["UU No. 28 Tahun 1999","UU No. 20 Tahun 2001","UU No. 30 Tahun 2002","UU No. 31 Tahun 1999","UU No. 20 Tahun 2023"],0,"UU No. 28 Tahun 1999 tentang Penyelenggara Negara yang Bersih dan Bebas dari Korupsi, Kolusi, dan Nepotisme. UU No. 20 Tahun 2001 dan UU No. 31 Tahun 1999 mengatur pemberantasan tindak pidana korupsi.","Integritas"),

m("TWK","Atasan menawarkan uang agar kamu mempercepat berkasnya di luar antrean. Sikap yang mencerminkan integritas adalah ...",["menolak dengan sopan dan menjelaskan bahwa layanan mengikuti antrean","menerima karena nilainya kecil","menerima lalu membaginya dengan rekan","menerima tetapi tidak mempercepat","meminta atasan menyetor ke kas"],0,"Integritas berarti menolak suap sekecil apa pun, walau tidak ada yang melihat. Menjelaskan aturan antrean dengan sopan menunjukkan kejujuran sekaligus menjaga pelayanan yang adil.","Integritas"),
m("TWK","Kamu melihat rekan memalsukan tanda tangan atasan pada surat dinas. Tindakan yang tepat adalah ...",["melaporkan melalui kanal resmi disertai bukti","ikut menggunakan cara yang sama","membiarkannya karena bukan urusanmu","mengancam rekan agar berbagi keuntungan","menyebarkannya ke media sosial"],0,"Pemalsuan tanda tangan adalah pelanggaran serius. Integritas menuntut laporan melalui kanal resmi dengan bukti — bukan menyebarkannya ke media sosial, bukan pula membiarkannya.","Integritas"),
m("TWK","Seorang pengusaha menawarkan liburan gratis agar perusahaannya dimenangkan dalam tender. Sikapmu ...",["menolak tawaran itu dan melaporkannya sesuai aturan gratifikasi","menerima karena di luar jam kerja","menerima dan tetap menilai secara objektif","menerima lalu mengundurkan diri dari panitia","meminta liburan itu diganti uang"],0,"Liburan gratis dari pihak yang berkepentingan adalah gratifikasi yang berhubungan dengan jabatan. Integritas menuntut penolakan sejak awal dan pelaporan sesuai aturan, bukan menerimanya dengan alasan apa pun.","Integritas"),
m("TWK","Dalam laporan keuangan, kamu menemukan selisih kecil yang menguntungkanmu. Sikap yang berintegritas adalah ...",["melaporkan selisih itu dan mengembalikannya","mengabaikannya karena kecil","memakainya lalu melapor bila ketahuan","meminta rekan menutupinya","menganggapnya sebagai bonus"],0,"Integritas diuji justru pada hal kecil yang tidak terlihat orang lain. Selisih sekecil apa pun harus dilaporkan dan dikembalikan, bukan dianggap bonus.","Integritas"),
m("TWK","Kamu diminta atasan untuk mengubah nilai ujian peserta yang merupakan kerabatnya. Sikapmu ...",["menolak dan menjelaskan bahwa nilai harus sesuai hasil sebenarnya","mengubah sedikit saja","mengubahnya karena perintah atasan","mengubahnya lalu melapor","meminta peserta lain yang mengubah"],0,"Perintah atasan tidak membenarkan kecurangan. Nilai ujian harus sesuai hasil sebenarnya; mengubahnya adalah nepotisme dan pelanggaran integritas, apa pun alasannya.","Integritas"),
m("TWK","Sebagai panitia seleksi, kamu mengetahui salah satu peserta adalah saudaramu. Tindakan yang menjaga integritas adalah ...",["menyatakan hubungan itu dan tidak terlibat dalam penilaian peserta tersebut","merahasiakannya dan menilai seperti biasa","memberi nilai lebih tinggi","memberi nilai lebih rendah agar terlihat adil","meminta saudaramu mundur"],0,"Konflik kepentingan harus diungkapkan dan dihindari: menyatakan hubungan kekerabatan dan tidak terlibat dalam penilaian peserta itu. Memberi nilai lebih rendah agar 'terlihat adil' tetap tidak adil.","Integritas"),
m("TWK","Kamu menerima parsel Lebaran dari rekanan yang sedang mengurus izin di unitmu. Sikap yang tepat menurut aturan gratifikasi adalah ...",["menolaknya atau melaporkannya bila tidak dapat ditolak","menerima karena sudah tradisi","menerima karena nilainya kecil","menerima dan membagikannya ke rekan","menerima lalu mengembalikan setelah izin selesai"],0,"Parsel dari pihak yang sedang mengurus izin adalah gratifikasi yang berhubungan dengan jabatan, apa pun nilainya dan apa pun tradisinya. Tolak sejak awal; bila tidak dapat ditolak, laporkan ke KPK atau unit pengendali gratifikasi.","Integritas"),
m("TWK","Seorang warga memintamu mempercepat layanan dengan imbalan uang. Kamu ...",["menolak imbalan itu dan tetap melayani sesuai prosedur","menerima imbalan karena layanan memang cepat","menerima imbalan lalu melayani","menolak imbalan tetapi tetap mendahulukan warga itu","meminta warga mengurus lewat jalur lain"],0,"Menerima imbalan untuk mempercepat layanan adalah suap. Integritas berarti menolak imbalan dan melayani semua warga sesuai prosedur dan antrean yang berlaku.","Integritas"),
m("TWK","Integritas seorang ASN paling terlihat ketika ...",["ia tetap jujur meskipun tidak ada yang mengawasi","ia bekerja cepat saat diawasi atasan","ia pandai berbicara di depan umum","ia memiliki banyak relasi","ia selalu datang tepat waktu"],0,"Integritas adalah konsistensi antara nilai dan perbuatan, terutama saat tidak ada yang melihat. Bekerja baik hanya saat diawasi bukan integritas, melainkan pencitraan.","Integritas"),
m("TWK","Kamu mengetahui anggaran kegiatan digelembungkan oleh bendahara. Tindakanmu ...",["melaporkan dugaan itu melalui kanal pengaduan resmi disertai bukti","ikut menikmati selisihnya","membiarkannya karena takut","menyebarkan kabar itu tanpa bukti","meminta bendahara berbagi"],0,"Dugaan penggelembungan anggaran harus dilaporkan melalui kanal resmi dengan bukti. Membiarkannya karena takut, menyebarkan tanpa bukti, atau ikut menikmati sama-sama melanggar integritas.","Integritas"),
m("TWK","Kata yang penulisannya baku adalah ...",["apotek","apotik","praktek","obyek","kwalitas"],0,"Apotek adalah bentuk baku menurut KBBI. Bentuk tidak baku: apotik, praktek (baku: praktik), obyek (baku: objek), kwalitas (baku: kualitas).","Bahasa Indonesia"),
m("TWK","Penulisan kata yang sesuai dengan KBBI adalah ...",["praktik","praktek","resiko","sistim","nasehat"],0,"Praktik adalah bentuk baku. Bentuk tidak baku: praktek, resiko (baku: risiko), sistim (baku: sistem), nasehat (baku: nasihat).","Bahasa Indonesia"),
m("TWK","Manakah kata baku berikut ini?",["objek","obyek","ijin","aktip","kuatir"],0,"Objek adalah bentuk baku. Bentuk tidak baku: obyek, ijin (baku: izin), aktip (baku: aktif), kuatir (baku: khawatir).","Bahasa Indonesia"),
m("TWK","Kata yang ejaannya benar menurut KBBI adalah ...",["risiko","resiko","apotik","kwalitas","nasehat"],0,"Risiko adalah bentuk baku. Bentuk tidak baku: resiko, apotik (baku: apotek), kwalitas (baku: kualitas), nasehat (baku: nasihat).","Bahasa Indonesia"),
m("TWK","Di antara kata berikut, yang penulisannya baku adalah ...",["kualitas","kwalitas","praktek","obyek","ijin"],0,"Kualitas adalah bentuk baku. Bentuk tidak baku: kwalitas, praktek (baku: praktik), obyek (baku: objek), ijin (baku: izin).","Bahasa Indonesia"),
m("TWK","Penulisan kata depan 'di' yang benar adalah ...",["di rumah","dirumah","disekolah","dikantor","dipasar"],0,"Kata depan 'di' yang menunjukkan tempat ditulis terpisah dari kata yang mengikutinya: di rumah, di sekolah, di kantor, di pasar. Yang ditulis serangkai adalah awalan 'di-' pada kata kerja pasif, misalnya dibaca.","Bahasa Indonesia"),
m("TWK","Kalimat yang penulisan imbuhannya benar adalah ...",["Buku itu dibaca oleh Andi.","Buku itu di baca oleh Andi.","Surat itu di tulis oleh Budi.","Kue itu di makan oleh Sari.","Pintu itu di buka oleh Doni."],0,"Awalan 'di-' pada kata kerja pasif ditulis serangkai dengan kata dasarnya: dibaca, ditulis, dimakan, dibuka. Yang ditulis terpisah adalah kata depan 'di' yang menunjukkan tempat, misalnya di rumah.","Bahasa Indonesia"),
m("TWK","Penggunaan huruf kapital yang benar adalah ...",["Budi pergi ke Jakarta.","budi pergi ke Jakarta.","Budi Pergi Ke Jakarta.","Budi pergi ke jakarta.","Budi pergi Ke jakarta."],0,"Huruf kapital dipakai pada awal kalimat dan pada nama orang serta nama tempat: Budi, Jakarta. Kata 'pergi' dan 'ke' di tengah kalimat tidak memakai huruf kapital.","Bahasa Indonesia"),
m("TWK","Kalimat berikut yang menggunakan tanda koma dengan tepat adalah ...",["Ibu membeli beras, gula, dan minyak.","Ibu membeli, beras gula dan minyak.","Ibu, membeli beras gula dan minyak.","Ibu membeli beras gula, dan minyak.","Ibu membeli beras, gula dan, minyak."],0,"Tanda koma dipakai untuk memisahkan unsur-unsur dalam perincian: beras, gula, dan minyak. Koma tidak diletakkan sebelum kata kerja atau sesudah kata 'dan'.","Bahasa Indonesia"),
m("TWK","Penulisan singkatan gelar yang benar adalah ...",["S.Pd.","SPd","S.Pd","S Pd.","s.pd."],0,"Singkatan gelar akademik ditulis dengan huruf kapital dan tanda titik pada setiap unsurnya: S.Pd. (Sarjana Pendidikan), S.E., M.Si. Tanpa titik atau dengan huruf kecil adalah salah.","Bahasa Indonesia"),
m("TWK","Kalimat efektif adalah kalimat yang ...",["memiliki kesatuan gagasan dan susunan yang logis serta hemat kata","panjang dan menggunakan banyak kata sulit","mengandung banyak kata asing","diulang-ulang agar jelas","menggunakan kalimat pasif terus-menerus"],0,"Ciri kalimat efektif: kesatuan gagasan, kepaduan, kesejajaran bentuk, kehematan kata, dan kelogisan. Kalimat yang panjang, berulang, dan penuh kata sulit justru tidak efektif.","Bahasa Indonesia"),
m("TWK","Kalimat berikut yang efektif adalah ...",["Para siswa sedang belajar di kelas.","Para siswa-siswa sedang belajar di kelas.","Siswa-siswa itu sedang belajar di kelas-kelas.","Para siswa sedang belajar di kelas dengan sungguh-sungguh sekali sekali.","Siswa sedang belajar di kelas kelas."],0,"Kata 'para' sudah menunjukkan jamak, sehingga 'siswa-siswa' setelahnya menjadi mubazir. Kalimat efektif hemat kata dan tidak mengulang unsur yang sama.","Bahasa Indonesia"),
m("TWK","Undang-undang yang mengatur penggunaan bahasa Indonesia, bendera, lambang negara, dan lagu kebangsaan adalah ...",["UU No. 24 Tahun 2009","UU No. 20 Tahun 2003","UU No. 12 Tahun 2011","UU No. 23 Tahun 2014","UU No. 3 Tahun 2002"],0,"UU No. 24 Tahun 2009 tentang Bendera, Bahasa, dan Lambang Negara, serta Lagu Kebangsaan. UU No. 20 Tahun 2003 mengatur sistem pendidikan nasional; UU No. 12 Tahun 2011 mengatur pembentukan peraturan perundang-undangan.","Bahasa Indonesia"),
m("TWK","Dalam surat resmi pemerintah, bahasa yang wajib digunakan adalah ...",["Bahasa Indonesia","Bahasa Inggris","Bahasa daerah setempat","Bahasa Belanda","Bahasa asing mana pun"],0,"UU No. 24 Tahun 2009 mewajibkan penggunaan bahasa Indonesia dalam komunikasi resmi di lingkungan kerja pemerintah dan dalam dokumen resmi negara.","Bahasa Indonesia"),
m("TWK","Sungai di desa itu dahulu jernih dan dipenuhi ikan. Setelah pabrik berdiri di hulunya tanpa pengolah limbah, air sungai berubah keruh dan ikan-ikan mati. Warga kemudian melaporkan pabrik itu kepada pemerintah daerah. Gagasan utama bacaan di atas adalah ...",["pencemaran sungai akibat limbah pabrik","kehidupan ikan di sungai","pembangunan pabrik di desa","laporan warga kepada pemerintah","keindahan sungai desa"],0,"Seluruh isi bacaan menjelaskan perubahan sungai dari jernih menjadi keruh karena limbah pabrik. Kehidupan ikan, pembangunan pabrik, dan laporan warga hanya unsur pendukung gagasan itu.","Bahasa Indonesia"),
m("TWK","Membaca buku setiap hari melatih daya ingat dan memperkaya kosakata. Anak yang terbiasa membaca cenderung lebih mudah memahami pelajaran di sekolah. Karena itu, orang tua dianjurkan menyediakan waktu membaca bersama anak. Simpulan yang tepat dari bacaan di atas adalah ...",["kebiasaan membaca memberi manfaat bagi kemampuan belajar anak","orang tua harus membeli banyak buku","anak yang tidak membaca pasti gagal","membaca hanya bermanfaat untuk pelajaran bahasa","daya ingat hanya bisa dilatih dengan membaca"],0,"Bacaan menjelaskan manfaat membaca — daya ingat, kosakata, dan kemudahan memahami pelajaran — lalu menganjurkan orang tua membiasakannya. Bacaan tidak menyatakan anak yang tidak membaca pasti gagal atau membaca hanya bermanfaat untuk satu pelajaran.","Bahasa Indonesia"),
m("TWK","Gotong royong adalah tradisi masyarakat Indonesia untuk bekerja bersama demi kepentingan bersama. Tradisi ini mengajarkan kebersamaan, kepedulian, dan tanggung jawab sosial. Di era modern, gotong royong tetap relevan, misalnya dalam kegiatan membersihkan lingkungan dan membantu korban bencana. Pernyataan yang sesuai dengan isi bacaan adalah ...",["gotong royong mengajarkan kebersamaan dan kepedulian","gotong royong hanya dilakukan di desa","gotong royong sudah tidak relevan di era modern","gotong royong hanya untuk membersihkan lingkungan","gotong royong menggantikan peran pemerintah"],0,"Bacaan menyatakan gotong royong mengajarkan kebersamaan, kepedulian, dan tanggung jawab sosial, serta tetap relevan di era modern — tidak hanya di desa dan tidak hanya untuk membersihkan lingkungan.","Bahasa Indonesia"),
m("TWK","Ungkapan berikut yang penulisannya benar adalah ...",["terima kasih","terimakasih","terima-kasih","Terima Kasih","terimaKasih"],0,"Ungkapan 'terima kasih' terdiri atas dua kata dan ditulis terpisah. Huruf kapital hanya dipakai bila berada di awal kalimat.","Bahasa Indonesia"),
m("TWK","Kata berikut yang penulisannya sudah sesuai EYD adalah ...",["antarkota","antar kota","antar-kota","antarKota","antar kota-kota"],0,"Kata 'antar' sebagai unsur terikat ditulis serangkai dengan kata yang mengikutinya: antarkota, antarpulau, antarnegara. Bentuk terpisah atau bertanda hubung adalah salah.","Bahasa Indonesia"),
m("TWK","Kalimat berikut yang menggunakan tanda tanya dengan tepat adalah ...",["Kapan rapat dimulai?","Kapan rapat dimulai.","Kapan rapat dimulai!","Kapan rapat dimulai,","Kapan rapat dimulai"],0,"Tanda tanya dipakai di akhir kalimat tanya. Tanda titik untuk kalimat berita, tanda seru untuk seruan, dan tanda koma bukan penutup kalimat.","Bahasa Indonesia"),
m("TWK","Menurut Pasal 25A UUD 1945, Negara Kesatuan Republik Indonesia adalah negara kepulauan yang berciri ...",["nusantara","maritim","agraris","federal","kepulauan serikat"],0,"Pasal 25A UUD 1945: Negara Kesatuan Republik Indonesia adalah sebuah negara kepulauan yang berciri nusantara dengan wilayah yang batas-batas dan hak-haknya ditetapkan dengan undang-undang.","NKRI & Bhinneka Tunggal Ika"),
m("TWK","Menurut UUD 1945, hal yang tidak dapat dilakukan perubahan adalah ...",["bentuk Negara Kesatuan Republik Indonesia","sistem pemerintahan","jumlah anggota DPR","masa jabatan presiden","nama ibu kota"],0,"Pasal 37 ayat (5) UUD 1945: khusus mengenai bentuk Negara Kesatuan Republik Indonesia tidak dapat dilakukan perubahan. Pasal-pasal lain dapat diubah melalui tata cara yang diatur Pasal 37.","NKRI & Bhinneka Tunggal Ika"),
m("TWK","Usul perubahan pasal-pasal UUD 1945 dapat diajukan oleh sekurang-kurangnya ...",["1/3 dari jumlah anggota MPR","1/2 anggota DPR","2/3 anggota MPR","Presiden","1/4 anggota DPD"],0,"Pasal 37 ayat (1) UUD 1945: usul perubahan pasal-pasal UUD dapat diagendakan dalam sidang MPR apabila diajukan oleh sekurang-kurangnya 1/3 dari jumlah anggota MPR.","NKRI & Bhinneka Tunggal Ika"),
m("TWK","Jumlah bulu pada ekor Garuda Pancasila adalah ...",["8 helai","17 helai","19 helai","45 helai","7 helai"],0,"Bulu Garuda Pancasila melambangkan tanggal Proklamasi 17-8-1945: 17 helai pada setiap sayap, 8 helai pada ekor, 19 helai pada pangkal ekor, dan 45 helai pada leher.","NKRI & Bhinneka Tunggal Ika"),
m("TWK","Bulu pada leher Garuda Pancasila berjumlah ...",["45 helai","17 helai","8 helai","19 helai","21 helai"],0,"Bulu Garuda Pancasila melambangkan 17-8-1945: 17 helai pada setiap sayap, 8 helai pada ekor, 19 helai pada pangkal ekor, dan 45 helai pada leher.","NKRI & Bhinneka Tunggal Ika"),
m("TWK","Penyerahan urusan pemerintahan oleh pemerintah pusat kepada daerah otonom disebut ...",["desentralisasi","dekonsentrasi","sentralisasi","tugas pembantuan","otonomi khusus"],0,"Desentralisasi adalah penyerahan urusan pemerintahan oleh pemerintah pusat kepada daerah otonom berdasarkan asas otonomi. Dekonsentrasi adalah pelimpahan wewenang kepada gubernur sebagai wakil pemerintah pusat; tugas pembantuan adalah penugasan dari pusat kepada daerah.","NKRI & Bhinneka Tunggal Ika"),
m("TWK","Pelimpahan wewenang pemerintahan oleh pemerintah pusat kepada gubernur sebagai wakil pemerintah pusat di daerah disebut ...",["dekonsentrasi","desentralisasi","tugas pembantuan","otonomi daerah","sentralisasi"],0,"Dekonsentrasi adalah pelimpahan wewenang pemerintahan oleh pemerintah pusat kepada gubernur sebagai wakil pemerintah pusat di daerah. Berbeda dengan desentralisasi yang menyerahkan urusan kepada daerah otonom.","NKRI & Bhinneka Tunggal Ika"),
m("TWK","Penugasan dari pemerintah pusat kepada daerah untuk melaksanakan sebagian urusan pemerintahan yang menjadi kewenangan pusat disebut ...",["tugas pembantuan","desentralisasi","dekonsentrasi","otonomi","delegasi"],0,"Tugas pembantuan adalah penugasan dari pemerintah pusat kepada daerah atau dari pemerintah daerah provinsi kepada kabupaten/kota untuk melaksanakan sebagian urusan pemerintahan yang menjadi kewenangan pusat atau provinsi.","NKRI & Bhinneka Tunggal Ika"),
m("TWK","Undang-undang yang mengatur pemerintahan daerah adalah ...",["UU No. 23 Tahun 2014","UU No. 32 Tahun 2004","UU No. 22 Tahun 1999","UU No. 25 Tahun 2004","UU No. 12 Tahun 2011"],0,"UU No. 23 Tahun 2014 tentang Pemerintahan Daerah menggantikan UU No. 32 Tahun 2004. UU No. 22 Tahun 1999 adalah undang-undang pemerintahan daerah yang lebih lama lagi.","NKRI & Bhinneka Tunggal Ika"),
m("TWK","Tujuan utama otonomi daerah adalah ...",["mendekatkan pelayanan kepada masyarakat dan mempercepat kesejahteraan daerah","melepaskan daerah dari NKRI","menghapus peran pemerintah pusat","menyeragamkan semua daerah","membatasi partisipasi masyarakat"],0,"Otonomi daerah bertujuan mendekatkan pelayanan kepada masyarakat, meningkatkan kesejahteraan, dan memberi ruang partisipasi daerah — tetap dalam bingkai NKRI, bukan melepaskan daerah dari negara kesatuan.","NKRI & Bhinneka Tunggal Ika"),
m("TWK","Semboyan Bhinneka Tunggal Ika berarti ...",["berbeda-beda tetapi tetap satu","satu bahasa satu bangsa","persatuan di atas segalanya","kesatuan dalam keberagaman budaya saja","satu agama satu bangsa"],0,"Bhinneka Tunggal Ika berarti berbeda-beda tetapi tetap satu jua. Semboyan ini menegaskan bahwa keberagaman suku, agama, bahasa, dan budaya tidak memecah persatuan bangsa Indonesia.","NKRI & Bhinneka Tunggal Ika"),
m("TWK","Semboyan Bhinneka Tunggal Ika berasal dari bahasa ...",["Jawa Kuno","Sansekerta","Melayu Kuno","Bahasa Indonesia","Bahasa Belanda"],0,"Bhinneka Tunggal Ika dikutip dari Kakawin Sutasoma karya Mpu Tantular yang ditulis dalam bahasa Jawa Kuno pada masa Majapahit.","NKRI & Bhinneka Tunggal Ika"),
m("TWK","Di kantor, ada rekan dari suku dan agama yang berbeda. Sikap yang mencerminkan Bhinneka Tunggal Ika adalah ...",["menghormati perbedaan dan bekerja sama dengan baik","menghindari rekan tersebut","memaksa rekan mengikuti kebiasaanmu","membicarakan keburukan sukunya","hanya bekerja dengan yang sesuku"],0,"Bhinneka Tunggal Ika diwujudkan dengan menghormati perbedaan dan tetap bekerja sama. Menghindari, memaksa, atau hanya bekerja dengan yang sesuku bertentangan dengan persatuan.","NKRI & Bhinneka Tunggal Ika"),
m("TWK","Seorang warga menolak tetangga barunya hanya karena berbeda suku. Sikap warga itu bertentangan dengan ...",["semboyan Bhinneka Tunggal Ika dan persatuan bangsa","otonomi daerah","sistem pemerintahan","hukum adat setempat","kebebasan berusaha"],0,"Menolak tetangga karena berbeda suku adalah sikap diskriminatif yang bertentangan dengan Bhinneka Tunggal Ika — berbeda-beda tetapi tetap satu — dan dengan persatuan bangsa.","NKRI & Bhinneka Tunggal Ika"),
m("TWK","Dalam musyawarah desa, pendapat kelompok minoritas tidak didengarkan. Tindakan yang sesuai dengan nilai persatuan adalah ...",["memberi kesempatan yang sama kepada semua warga untuk menyampaikan pendapat","memutuskan berdasarkan suara kelompok terbesar saja","mengabaikan kelompok minoritas","membubarkan musyawarah","meminta kelompok minoritas pindah"],0,"Persatuan dalam musyawarah berarti semua warga — mayoritas maupun minoritas — mendapat kesempatan yang sama untuk didengar. Keputusan yang mengabaikan minoritas merusak persatuan.","NKRI & Bhinneka Tunggal Ika"),
m("TWK","Bahasa daerah adalah kekayaan bangsa. Sikap yang tepat terhadap bahasa daerah adalah ...",["melestarikan dan menghormatinya sebagai bagian dari keberagaman Indonesia","melarang penggunaannya di ruang publik","menggantinya seluruhnya dengan bahasa asing","menganggapnya menghambat persatuan","hanya dipakai dalam upacara adat"],0,"Bahasa daerah adalah bagian dari keberagaman yang dilindungi negara. Melestarikan dan menghormatinya justru memperkuat persatuan, bukan menghambatnya.","NKRI & Bhinneka Tunggal Ika"),
m("TWK","Seorang pelajar mengejek logat temannya yang berasal dari daerah lain. Perbuatan itu bertentangan dengan nilai ...",["Bhinneka Tunggal Ika","otonomi daerah","desentralisasi","ketahanan pangan","sistem ekonomi"],0,"Mengejek logat daerah lain adalah sikap yang merendahkan keberagaman. Bhinneka Tunggal Ika menuntut penghormatan terhadap perbedaan, termasuk perbedaan logat dan bahasa daerah.","NKRI & Bhinneka Tunggal Ika"),
m("TWK","Ketika ada perayaan hari besar agama lain di lingkunganmu, sikap yang mencerminkan persatuan adalah ...",["menghormati perayaan itu dan menjaga kerukunan","melarang perayaan itu","mengganggu jalannya perayaan","menghindari seluruh warga yang merayakan","memaksakan perayaan agamamu"],0,"Persatuan dalam keberagaman berarti menghormati perayaan agama lain dan menjaga kerukunan. Melarang, mengganggu, atau memaksakan perayaan sendiri merusak persatuan.","NKRI & Bhinneka Tunggal Ika"),
t("Kamu ditugaskan ke daerah yang adat istiadatnya berbeda dari daerah asalmu. Saat pertama bertugas, sikapmu ...",[["Menganggap adat setempat menghambat pekerjaan",1],["Meminta dipindah ke daerah lain",2],["Menjalankan tugas tanpa memperhatikan adat setempat",3],["Menghormati adat setempat dan menjalankan tugas seperti biasa",4],["Mempelajari adat setempat, menghormatinya, dan menyesuaikan cara kerja tanpa mengabaikan tugas",5]],"Menghormati dan mempelajari adat setempat sambil tetap menjalankan tugas adalah wujud adaptasi sosial budaya yang paling baik.","Sosial Budaya"),
t("Warga setempat mengadakan upacara adat yang menutup jalan di depan kantor layanan pada jam kerja. Sikapmu ...",[["Memarahi warga yang menutup jalan",1],["Meminta warga membatalkan upacara",2],["Menunggu upacara selesai tanpa memberi tahu pemohon",3],["Menginformasikan penutupan jalan kepada pemohon",4],["Berkoordinasi dengan tokoh adat dan warga untuk mengatur jadwal layanan alternatif, lalu menginformasikannya kepada pemohon",5]],"Menghormati upacara adat sekaligus menjaga layanan: berkoordinasi untuk solusi alternatif dan memberi informasi yang jelas kepada pemohon.","Sosial Budaya"),
t("Rekan kerja yang lebih tua menegurmu dengan cara yang menurutmu keras, padahal di daerahnya itu bentuk kepedulian. Sikapmu ...",[["Melaporkan rekan itu sebagai pelecehan",1],["Membalas dengan nada yang sama kerasnya",2],["Menghindar dari rekan itu",3],["Menanggapi dengan tenang dan tetap bekerja sama",4],["Memahami perbedaan cara berkomunikasi itu, menanggapi dengan tenang, dan membicarakan cara kerja sama yang nyaman bagi keduanya",5]],"Perbedaan gaya komunikasi antardaerah harus dipahami, bukan dibalas atau dihindari. Sikap terbaik: memahami, menanggapi tenang, dan menyepakati cara kerja sama.","Sosial Budaya"),
t("Kamu melayani warga yang memakai pakaian adat dan berbicara dengan logat kental. Sikapmu ...",[["Menertawakan cara bicara warga itu",1],["Meminta warga berbicara dengan logat yang lebih jelas",2],["Melayani dengan cepat agar segera selesai",3],["Melayani dengan ramah seperti biasa",4],["Melayani dengan ramah dan sabar, memastikan warga memahami prosedur, dan tidak membeda-bedakan layanan",5]],"Pelayanan yang baik tidak membedakan warga berdasarkan pakaian adat atau logat. Sikap terbaik: ramah, sabar, dan memastikan warga memahami prosedur.","Sosial Budaya"),
t("Di lingkungan kerja ada tradisi saling berbagi makanan saat hari besar keagamaan. Kamu yang berbeda agama ...",[["Mengejek tradisi itu",1],["Meminta tradisi itu dihentikan karena tidak sesuai agamamu",2],["Mengabaikannya",3],["Menghargai tradisi itu tanpa ikut serta",4],["Menghargai tradisi itu, ikut berbagi dengan tulus, dan menjaga hubungan baik antarpegawai",5]],"Menghargai dan ikut berbagi dalam tradisi hari besar keagamaan rekan memperkuat kebersamaan. Meminta tradisi dihentikan atau mengejeknya merusak hubungan antarpegawai.","Sosial Budaya"),
t("Timmu terdiri dari pegawai berbagai suku dan agama. Untuk memperkuat kebersamaan, tindakanmu ...",[["Mengutamakan kelompok mayoritas dalam kegiatan",1],["Melarang pembicaraan tentang suku dan agama",2],["Membiarkan masing-masing kelompok berkumpul sendiri",3],["Mengadakan acara kebersamaan sekali saja",4],["Mengusulkan kegiatan bersama yang melibatkan semua latar belakang dan menghormati hari besar masing-masing",5]],"Kebersamaan dibangun dengan kegiatan yang melibatkan semua latar belakang dan menghormati hari besar masing-masing, bukan dengan melarang perbedaan atau membiarkan kelompok terpisah.","Sosial Budaya"),
t("Kamu menemukan rekan membuat lelucon yang merendahkan suku tertentu di grup kerja. Sikapmu ...",[["Membalas dengan lelucon yang merendahkan suku lain",1],["Ikut tertawa agar tidak dianggap kaku",2],["Mendiamkannya karena hanya lelucon",3],["Menegur rekan itu secara pribadi",4],["Menegur dengan sopan, menjelaskan bahwa lelucon itu dapat menyinggung, dan mengajak rekan menghormati perbedaan",5]],"Lelucon yang merendahkan suku tertentu bukan hal sepele. Sikap terbaik: menegur dengan sopan, menjelaskan dampaknya, dan mengajak menghormati perbedaan.","Sosial Budaya"),
t("Warga lanjut usia dari daerah terpencil datang ke kantor dan tidak memahami prosedur layanan online. Sikapmu ...",[["Menolak melayani karena warga tidak paham teknologi",1],["Menyuruh warga mempelajari sendiri",2],["Meminta warga kembali bersama anaknya",3],["Menjelaskan prosedur secara singkat",4],["Membantu dengan sabar, menjelaskan prosedur dengan bahasa yang mudah dipahami, dan memandu sampai selesai",5]],"Warga lanjut usia dari daerah terpencil berhak mendapat layanan yang sama. Sikap terbaik: membantu dengan sabar dan memandu sampai selesai, bukan menyuruhnya pulang atau belajar sendiri.","Sosial Budaya"),
t("Atasanmu meminta kegiatan kantor disesuaikan dengan adat daerah setempat, padahal kamu belum memahaminya. Sikapmu ...",[["Mengkritik adat itu di depan warga",1],["Menolak karena merepotkan",2],["Menjalankan kegiatan seperti biasa tanpa penyesuaian",3],["Menyesuaikan kegiatan seadanya",4],["Mempelajari adat itu dari tokoh masyarakat setempat, lalu menyesuaikan kegiatan dengan tetap menjaga tujuan acara",5]],"Menyesuaikan kegiatan dengan adat setempat membutuhkan usaha aktif: belajar dari tokoh masyarakat, lalu menyesuaikan tanpa mengorbankan tujuan acara.","Sosial Budaya"),
t("Dalam acara kantor, makanan yang disajikan tidak sesuai dengan pantangan agama sebagian pegawai. Sikapmu sebagai panitia ...",[["Mengejek pantangan itu",1],["Menganggap pegawai itu terlalu menuntut",2],["Membiarkannya karena sudah dipesan",3],["Meminta pegawai yang berpantangan membawa makanan sendiri",4],["Menyediakan pilihan makanan yang sesuai untuk semua pegawai dan memastikan tidak ada yang terabaikan",5]],"Panitia yang baik memastikan semua pegawai dapat menikmati acara: menyediakan pilihan makanan yang sesuai dengan pantangan agama, bukan menyuruh mereka membawa makanan sendiri.","Sosial Budaya"),
t("Kamu bertugas di daerah dengan bahasa daerah yang tidak kamu kuasai. Warga kesulitan berkomunikasi denganmu. Sikapmu ...",[["Memarahi warga yang tidak bisa berbahasa Indonesia",1],["Berkomunikasi dengan isyarat seadanya",2],["Meminta warga mencari penerjemah sendiri",3],["Memakai bahasa Indonesia yang sederhana",4],["Mempelajari ungkapan dasar bahasa daerah itu, memakai bahasa Indonesia yang sederhana, dan meminta bantuan penerjemah bila perlu",5]],"Hambatan bahasa diatasi dengan usaha aktif: mempelajari ungkapan dasar bahasa daerah, memakai bahasa Indonesia yang sederhana, dan meminta bantuan penerjemah bila perlu.","Sosial Budaya"),
t("Seorang tokoh adat meminta agar keputusan kantor mempertimbangkan nilai-nilai adat setempat. Sikapmu ...",[["Menyatakan adat tidak relevan",1],["Mengabaikan tokoh adat itu",2],["Menolak karena adat bukan aturan resmi",3],["Mendengarkan masukan itu tanpa menindaklanjuti",4],["Mendengarkan masukan tokoh adat, mempertimbangkannya sesuai aturan, dan menjelaskan keputusan dengan sopan",5]],"Tokoh adat adalah bagian dari masyarakat yang dilayani. Sikap terbaik: mendengarkan, mempertimbangkan sesuai aturan, dan menjelaskan keputusan dengan sopan.","Sosial Budaya"),
t("Rekanmu merayakan hari besar keagamaannya dan mengundangmu. Sikapmu ...",[["Mengejek perayaan itu",1],["Menolak dengan alasan tidak seagama",2],["Mengabaikan undangan itu",3],["Mengucapkan selamat tanpa hadir",4],["Menghargai undangan itu, hadir dengan tulus bila memungkinkan, dan mengucapkan selamat",5]],"Menghargai undangan hari besar keagamaan rekan — hadir bila memungkinkan dan mengucapkan selamat — adalah wujud toleransi dan kebersamaan.","Sosial Budaya"),
t("Di media sosial kantor, ada komentar warga yang menggunakan bahasa daerah yang kamu tidak pahami. Sikapmu ...",[["Menghapus komentar itu",1],["Meminta warga menulis dalam bahasa Indonesia dengan nada memerintah",2],["Mengabaikan komentar itu",3],["Membalas dengan template jawaban",4],["Membalas dengan sopan, menanyakan maksudnya dengan bahasa Indonesia yang jelas, dan membantu warga itu",5]],"Komentar berbahasa daerah harus dilayani seperti komentar lainnya: membalas dengan sopan, menanyakan maksudnya dengan bahasa yang jelas, dan membantu warga itu.","Sosial Budaya"),
t("Keluarga warga yang sedang berduka meminta pelayanan ditunda karena adat berkabung. Sikapmu ...",[["Menolak melayani keluarga itu",1],["Meminta keluarga mengabaikan adatnya",2],["Tetap memaksakan jadwal semula",3],["Menunda layanan tanpa memberi kepastian jadwal",4],["Menghormati masa berkabung, menjelaskan alternatif jadwal, dan membantu mengatur layanan di waktu yang disepakati",5]],"Menghormati adat berkabung sambil menjaga layanan: memberi alternatif jadwal yang disepakati, bukan memaksakan jadwal semula atau menunda tanpa kepastian.","Sosial Budaya"),
t("Kamu melihat pegawai baru diperlakukan berbeda karena berasal dari daerah lain. Sikapmu ...",[["Menyebarkan kabar tentang asal pegawai baru itu",1],["Ikut memperlakukan berbeda agar diterima kelompok",2],["Membiarkannya karena sudah biasa",3],["Membantu pegawai baru secara pribadi",4],["Menegur perlakuan itu dengan sopan, mengajak rekan menghormati keberagaman, dan membantu pegawai baru beradaptasi",5]],"Perlakuan berbeda karena asal daerah adalah diskriminasi. Sikap terbaik: menegur dengan sopan, mengajak menghormati keberagaman, dan membantu pegawai baru beradaptasi.","Sosial Budaya"),
t("Dalam rapat, seorang rekan menyampaikan pendapat dengan cara yang dianggap tidak sopan menurut adat daerahmu, padahal di daerahnya itu biasa. Sikapmu ...",[["Membalas dengan cara yang sama tidak sopannya",1],["Menegur rekan itu di depan rapat",2],["Mengabaikan pendapat itu",3],["Menanggapi isi pendapatnya tanpa membahas caranya",4],["Memahami perbedaan gaya berkomunikasi itu, menanggapi isi pendapatnya, dan menjaga suasana rapat tetap kondusif",5]],"Cara berkomunikasi berbeda-beda antardaerah. Sikap terbaik: memahami perbedaan itu, menanggapi isi pendapatnya, dan menjaga suasana rapat tetap kondusif.","Sosial Budaya"),
t("Rekanmu membagikan video yang isinya mengajak menolak Pancasila. Sikapmu ...",[["Ikut menyebarkan video itu",1],["Menontonnya saja tanpa menyebarkan",2],["Mengabaikannya",3],["Tidak menyebarkan video itu dan melaporkannya",4],["Tidak menyebarkan video itu, menjelaskan dengan tenang mengapa Pancasila penting, dan melaporkannya melalui kanal resmi",5]],"Menolak paham yang bertentangan dengan Pancasila dilakukan dengan damai: tidak menyebarkan, menjelaskan dengan tenang, dan melapor melalui kanal resmi.","Anti radikalisme"),
t("Di grup WhatsApp kantor, seseorang menyebarkan pesan yang menghasut kebencian terhadap kelompok agama tertentu. Sikapmu ...",[["Ikut meneruskan pesan itu",1],["Membalas dengan ujaran kebencian yang sama",2],["Membiarkannya",3],["Tidak meneruskan pesan itu",4],["Tidak meneruskan pesan itu, mengingatkan anggota grup agar tidak terprovokasi, dan melaporkannya kepada admin atau atasan",5]],"Hasutan kebencian dilawan dengan tidak meneruskan, mengingatkan anggota grup agar tidak terprovokasi, dan melaporkannya. Membalas dengan kebencian yang sama hanya memperbesar permusuhan.","Anti radikalisme"),
t("Seorang teman mengajakmu mengikuti kajian yang mengajarkan bahwa kelompok agama lain adalah musuh. Sikapmu ...",[["Ikut bergabung",1],["Ikut sekali untuk melihat-lihat",2],["Menghindar tanpa penjelasan",3],["Menolak ajakan itu",4],["Menolak ajakan itu dengan sopan, menjelaskan pentingnya toleransi, dan mengajak teman berdiskusi dengan narasumber yang moderat",5]],"Ajakan yang mengajarkan permusuhan antarkelompok agama ditolak dengan sopan, disertai penjelasan tentang toleransi dan ajakan berdiskusi dengan narasumber yang moderat.","Anti radikalisme"),
t("Kamu menemukan selebaran di kantor yang berisi ajakan mengganti ideologi negara. Sikapmu ...",[["Membagikannya kepada rekan",1],["Membacanya lalu membiarkannya",2],["Membuangnya diam-diam",3],["Melaporkannya kepada atasan",4],["Tidak menyebarkannya, mengamankan selebaran itu, dan segera melaporkannya kepada atasan atau aparat",5]],"Selebaran yang mengajak mengganti ideologi negara tidak boleh disebarkan. Sikap terbaik: mengamankan barang bukti itu dan segera melaporkannya kepada atasan atau aparat.","Anti radikalisme"),
t("Seseorang di media sosial mengajakmu berdonasi untuk kelompok yang diketahui menyebarkan paham kekerasan. Sikapmu ...",[["Berdonasi dan mengajak teman ikut",1],["Berdonasi sedikit karena kasihan",2],["Mengabaikannya",3],["Menolak donasi itu",4],["Menolak donasi itu, tidak menyebarkan ajakannya, dan melaporkannya melalui kanal resmi",5]],"Donasi untuk kelompok penyebar paham kekerasan adalah dukungan terhadap kekerasan. Sikap terbaik: menolak, tidak menyebarkan ajakannya, dan melaporkannya melalui kanal resmi.","Anti radikalisme"),
t("Rekanmu menyatakan tidak mau bekerja sama dengan pegawai yang berbeda agama. Sikapmu ...",[["Mendukung sikap rekan itu",1],["Mengatur agar rekan itu tidak satu tim dengan pegawai tersebut",2],["Membiarkannya",3],["Menjelaskan bahwa kerja sama tidak memandang agama",4],["Menjelaskan bahwa kerja sama tidak memandang agama, mengajak rekan menghargai perbedaan, dan melaporkannya bila sikap itu berlanjut",5]],"Penolakan bekerja sama karena perbedaan agama adalah sikap intoleran. Sikap terbaik: menjelaskan bahwa kerja sama tidak memandang agama, mengajak menghargai perbedaan, dan melapor bila sikap itu berlanjut.","Anti radikalisme"),
t("Kamu mendengar ceramah yang isinya mengkafirkan kelompok lain dan mengajak membenci mereka. Sikapmu ...",[["Mengikuti ajakan itu",1],["Merekam dan menyebarkannya",2],["Mendengarkan sampai selesai tanpa bersikap",3],["Tidak mengikuti ajakan itu",4],["Tidak mengikuti ajakan itu, meninggalkan ceramah dengan tenang, dan melaporkannya bila disebarkan di lingkungan kerja",5]],"Ceramah yang mengkafirkan dan mengajak membenci kelompok lain tidak boleh diikuti atau disebarkan. Sikap terbaik: meninggalkannya dengan tenang dan melaporkannya bila disebarkan di lingkungan kerja.","Anti radikalisme"),
t("Seorang warga menolak upacara bendera dan menghina lambang negara di depan umum. Sikapmu ...",[["Ikut menghina lambang negara",1],["Membalas dengan menghina balik",2],["Mengabaikannya",3],["Menjelaskan makna upacara dengan sopan",4],["Tetap tenang, menjelaskan makna upacara dan lambang negara dengan sopan, dan melaporkannya melalui jalur resmi bila penghinaan berlanjut",5]],"Penghinaan terhadap lambang negara dihadapi dengan tenang: menjelaskan maknanya dengan sopan dan melapor melalui jalur resmi bila berlanjut, bukan dengan membalas menghina.","Anti radikalisme"),
t("Temanmu mengajakmu berdemonstrasi dengan cara anarkis untuk menolak kebijakan pemerintah. Sikapmu ...",[["Ikut berdemonstrasi secara anarkis",1],["Ikut menonton dari jauh",2],["Menghindar tanpa penjelasan",3],["Menolak ikut demonstrasi itu",4],["Menolak ajakan anarkis itu, menjelaskan bahwa aspirasi dapat disampaikan secara damai dan sesuai aturan, dan mengajak teman menyalurkan pendapat lewat jalur resmi",5]],"Aspirasi boleh disampaikan, tetapi tidak dengan cara anarkis. Sikap terbaik: menolak ajakan itu, menjelaskan cara menyampaikan pendapat secara damai, dan mengajak teman memakai jalur resmi.","Anti radikalisme"),
t("Di lingkunganmu ada yang menyebarkan paham bahwa negara harus diganti dengan sistem lain yang bertentangan dengan Pancasila. Sikapmu ...",[["Mendukung paham itu",1],["Mendengarkan dan mempertimbangkan paham itu",2],["Mengabaikannya karena bukan urusanmu",3],["Menolak paham itu",4],["Menolak paham itu, menjelaskan nilai Pancasila dengan tenang, dan melaporkannya melalui jalur resmi",5]],"Paham yang ingin mengganti sistem negara dan bertentangan dengan Pancasila ditolak dengan penjelasan yang tenang dan dilaporkan melalui jalur resmi, bukan didukung atau diabaikan.","Anti radikalisme"),
t("Anak buahmu terlihat mulai mengikuti kelompok yang mengajarkan intoleransi di media sosial. Sikapmu sebagai atasan ...",[["Menghukumnya tanpa penjelasan",1],["Mengawasinya tanpa menegur",2],["Membiarkannya karena urusan pribadi",3],["Menegurnya agar berhenti",4],["Mengajaknya berdiskusi dengan tenang, menjelaskan bahaya paham intoleran, dan mengarahkannya pada sumber belajar yang moderat",5]],"Atasan yang baik mencegah dengan pembinaan: berdiskusi dengan tenang, menjelaskan bahaya paham intoleran, dan mengarahkan pada sumber belajar yang moderat, bukan langsung menghukum.","Anti radikalisme"),
t("Kamu menerima tautan situs yang berisi propaganda radikal dari nomor tak dikenal. Sikapmu ...",[["Meneruskan tautan itu ke grup",1],["Membukanya karena penasaran",2],["Mengabaikannya",3],["Tidak membuka tautan itu",4],["Tidak membuka dan tidak menyebarkannya, memblokir pengirimnya, dan melaporkannya melalui kanal resmi",5]],"Tautan propaganda radikal tidak boleh dibuka apalagi disebarkan. Sikap terbaik: memblokir pengirimnya dan melaporkannya melalui kanal resmi.","Anti radikalisme"),
t("Seorang penceramah di acara kantor menyampaikan materi yang menyudutkan kelompok agama tertentu. Sikapmu sebagai panitia ...",[["Ikut menyebarkan materi itu",1],["Menyetujui materi itu",2],["Membiarkannya karena tamu",3],["Mengingatkan penceramah setelah acara",4],["Menghentikan materi yang menyudutkan itu dengan sopan, mengingatkan tentang toleransi, dan melaporkannya kepada atasan",5]],"Materi yang menyudutkan kelompok agama tertentu tidak boleh dibiarkan hanya karena pembicaranya tamu. Panitia harus menghentikannya dengan sopan, mengingatkan tentang toleransi, dan melaporkannya.","Anti radikalisme"),
t("Teman sekantormu mengajakmu memboikot produk dari kelompok agama tertentu dengan alasan kebencian. Sikapmu ...",[["Mengajak rekan lain ikut memboikot",1],["Ikut memboikot diam-diam",2],["Menghindar tanpa bersikap",3],["Menolak ajakan itu",4],["Menolak ajakan boikot itu, menjelaskan bahwa boikot berbasis kebencian merusak persatuan, dan tetap bersikap adil kepada semua pihak",5]],"Boikot yang didasari kebencian terhadap kelompok agama tertentu merusak persatuan. Sikap terbaik: menolak ajakan itu, menjelaskan dampaknya, dan tetap bersikap adil kepada semua pihak.","Anti radikalisme"),
t("Kamu melihat grafiti di fasilitas umum yang berisi ujaran kebencian terhadap suku tertentu. Sikapmu ...",[["Menambahkan grafiti serupa",1],["Memotret dan menyebarkannya ke media sosial",2],["Mengabaikannya",3],["Melaporkannya kepada pengelola",4],["Tidak ikut menyebarkannya, melaporkan temuan itu kepada pengelola atau aparat, dan mengajak warga menjaga fasilitas umum",5]],"Ujaran kebencian di fasilitas umum harus dilaporkan kepada pengelola atau aparat, bukan disebarkan atau ditambahi. Sikap terbaik juga mengajak warga menjaga fasilitas umum.","Anti radikalisme"),
t("Seorang rekan menolak hormat kepada bendera dengan alasan keyakinannya. Sikapmu ...",[["Mengejek keyakinan rekan itu di depan umum",1],["Memaksanya hormat kepada bendera",2],["Mengabaikannya",3],["Menjelaskan makna penghormatan kepada bendera",4],["Menjelaskan dengan sopan makna penghormatan kepada bendera sebagai simbol negara, menghargai keyakinannya, dan mengajaknya berdiskusi dengan tenang",5]],"Perbedaan keyakinan dihadapi dengan diskusi yang tenang: menjelaskan makna penghormatan kepada bendera sebagai simbol negara sambil menghargai keyakinan rekan, bukan dengan memaksa atau mengejek.","Anti radikalisme"),
t("Di grup keluarga, ada anggota yang menyebarkan konten yang menghasut permusuhan antaragama. Sikapmu ...",[["Ikut meneruskan konten itu",1],["Membalas dengan konten hasutan balasan",2],["Mendiamkannya",3],["Tidak meneruskan konten itu",4],["Tidak meneruskan konten itu, mengingatkan dengan sopan agar tidak menyebarkan hasutan, dan membagikan informasi yang menenangkan",5]],"Hasutan antaragama di grup keluarga dilawan dengan tidak meneruskan, mengingatkan dengan sopan, dan membagikan informasi yang menenangkan — bukan dengan hasutan balasan.","Anti radikalisme"),
t("Kamu menerima pesan berisi tautan undian berhadiah yang meminta data pribadimu. Sikapmu ...",[["Mengisi data pribadi dan membagikan tautan itu",1],["Mengklik tautan itu karena penasaran",2],["Mengabaikannya",3],["Tidak mengklik tautan itu",4],["Tidak mengklik tautan itu, memeriksa kebenarannya melalui sumber resmi, dan melaporkan pesan itu sebagai penipuan",5]],"Tautan undian berhadiah yang meminta data pribadi adalah modus penipuan. Sikap terbaik: tidak mengklik, memeriksa kebenarannya ke sumber resmi, dan melaporkan pesan itu.","TIK dan literasi digital"),
t("Kantor mewajibkanmu memakai kata sandi yang kuat dan berbeda untuk tiap aplikasi. Sikapmu ...",[["Membagikan kata sandi kepada rekan agar tidak lupa",1],["Memakai kata sandi yang mudah diingat seperti tanggal lahir",2],["Memakai satu kata sandi yang sama untuk semua aplikasi",3],["Membuat kata sandi yang kuat",4],["Membuat kata sandi yang kuat dan berbeda, menyimpannya dengan aman, dan mengaktifkan verifikasi dua langkah bila tersedia",5]],"Kata sandi yang kuat dan berbeda untuk tiap aplikasi, disimpan dengan aman, ditambah verifikasi dua langkah adalah standar keamanan yang benar.","TIK dan literasi digital"),
t("Kamu harus mengakses data kantor melalui wifi publik di kafe. Sikapmu ...",[["Membagikan kata sandi wifi kantor kepada orang lain",1],["Mengunduh data kantor ke HP pribadi lewat wifi itu",2],["Mengakses seperti biasa",3],["Mengakses seperlunya dengan hati-hati",4],["Menghindari akses data sensitif lewat wifi publik, atau memakai koneksi resmi yang aman dan memastikan perangkat terlindungi",5]],"Wifi publik tidak aman untuk data sensitif. Sikap terbaik: menghindari akses data sensitif lewat wifi publik dan memakai koneksi resmi yang aman.","TIK dan literasi digital"),
t("Rekanmu meminta kata sandi akun layanan kantor karena ia lupa kata sandinya. Sikapmu ...",[["Menulis kata sandi itu di grup kerja",1],["Membagikan kata sandi karena ia rekan dekat",2],["Membagikan kata sandi lalu memintanya segera mengganti",3],["Menolak membagikan kata sandi",4],["Menolak membagikan kata sandi dan mengarahkannya untuk mengatur ulang kata sandi melalui prosedur resmi",5]],"Kata sandi tidak boleh dibagikan kepada siapa pun, termasuk rekan dekat. Sikap terbaik: menolak dan mengarahkan rekan untuk mengatur ulang kata sandi melalui prosedur resmi.","TIK dan literasi digital"),
t("Kamu akan meninggalkan komputer kantor untuk istirahat. Sikapmu ...",[["Meninggalkan komputer dengan dokumen warga terbuka di layar",1],["Meminta rekan menjaga komputernya",2],["Membiarkannya karena hanya sebentar",3],["Mengunci layar komputer",4],["Mengunci layar komputer dan memastikan tidak ada dokumen sensitif yang terbuka",5]],"Komputer yang ditinggalkan harus dikunci layarnya dan tidak ada dokumen sensitif yang terbuka, walau hanya sebentar.","TIK dan literasi digital"),
t("Kamu menemukan berita yang meragukan di media sosial dan ingin membagikannya ke grup keluarga. Sikapmu ...",[["Membagikannya dengan tambahan yang dramatis",1],["Membagikannya karena sudah banyak yang membagikan",2],["Membagikannya dengan tambahan 'katanya'",3],["Tidak membagikannya",4],["Memeriksa kebenaran berita itu ke sumber resmi terlebih dahulu, dan hanya membagikannya bila terbukti benar",5]],"Berita yang meragukan harus diperiksa ke sumber resmi sebelum dibagikan. Membagikan dengan tambahan 'katanya' atau karena sudah viral tetap menyebarkan kemungkinan hoaks.","TIK dan literasi digital"),
t("Aplikasi yang kamu unduh dari luar toko resmi meminta akses ke seluruh kontak dan foto di HP-mu. Sikapmu ...",[["Menginstal lalu membagikannya ke rekan",1],["Menginstal dan memberi semua izin",2],["Menginstal tetapi membatasi izinnya",3],["Tidak menginstal aplikasi itu",4],["Tidak menginstal aplikasi itu, menghapusnya bila sudah terpasang, dan hanya mengunduh dari sumber resmi",5]],"Aplikasi dari luar toko resmi yang meminta akses luas ke kontak dan foto berisiko mencuri data. Sikap terbaik: tidak menginstal, menghapus bila sudah terpasang, dan hanya mengunduh dari sumber resmi.","TIK dan literasi digital"),
t("Kamu diminta mengunggah dokumen rahasia kantor ke layanan penyimpanan awan pribadi agar mudah diakses. Sikapmu ...",[["Mengunggahnya dan membagikan tautannya",1],["Mengunggahnya karena praktis",2],["Mengunggahnya sementara lalu menghapusnya",3],["Menolak mengunggahnya",4],["Menolak dan memakai layanan resmi kantor yang terjamin keamanannya, serta melaporkannya bila ada tekanan",5]],"Dokumen rahasia kantor tidak boleh diunggah ke layanan awan pribadi. Sikap terbaik: menolak, memakai layanan resmi kantor, dan melaporkannya bila ada tekanan.","TIK dan literasi digital"),
t("Kamu diminta membantu warga lanjut usia mengakses layanan online. Sikapmu ...",[["Menolak karena bukan tugasmu",1],["Mengisi data warga itu tanpa menjelaskan",2],["Meminta warga datang bersama anaknya",3],["Membantu seperlunya",4],["Membantu dengan sabar, menjelaskan langkah-langkahnya, dan menjaga kerahasiaan data warga itu",5]],"Membantu warga lanjut usia memakai layanan online berarti sabar menjelaskan langkah-langkahnya dan menjaga kerahasiaan datanya, bukan mengisi datanya tanpa penjelasan.","TIK dan literasi digital"),
t("Perangkat kantormu meminta pembaruan keamanan sistem. Sikapmu ...",[["Mematikan pembaruan otomatis selamanya",1],["Mengabaikan pemberitahuan itu",2],["Menunda pembaruan tanpa batas",3],["Memasang pembaruan saat sempat",4],["Segera memasang pembaruan resmi itu dan memastikan perangkat tetap terlindungi",5]],"Pembaruan keamanan menutup celah yang dapat dimanfaatkan peretas. Sikap terbaik: segera memasang pembaruan resmi dan memastikan perangkat tetap terlindungi.","TIK dan literasi digital"),
t("Kamu menemukan data warga yang tersimpan di komputer bersama dan dapat diakses siapa saja. Sikapmu ...",[["Membagikan data itu ke rekan",1],["Menyalin data itu untuk berjaga-jaga",2],["Membiarkannya karena bukan tanggung jawabmu",3],["Melaporkannya kepada atasan",4],["Segera melaporkannya kepada atasan atau tim keamanan informasi dan tidak menyalin atau menyebarkan data itu",5]],"Data warga yang dapat diakses siapa saja adalah risiko kebocoran data. Sikap terbaik: segera melapor kepada atasan atau tim keamanan informasi, tanpa menyalin atau menyebarkannya.","TIK dan literasi digital"),
t("Kamu memakai AI generatif untuk membantu menyusun surat dinas yang berisi data pribadi warga. Sikapmu ...",[["Mengunggah seluruh dokumen ke layanan AI gratis",1],["Memasukkan data itu dan membagikan hasilnya",2],["Memasukkan data itu karena praktis",3],["Memakai AI tanpa memasukkan data pribadi",4],["Tidak memasukkan data pribadi warga ke layanan AI, dan memakai AI hanya untuk draf umum yang tidak sensitif",5]],"Data pribadi warga tidak boleh dimasukkan ke layanan AI. AI hanya boleh dipakai untuk draf umum yang tidak mengandung data sensitif.","TIK dan literasi digital"),
t("Kamu melihat video yang tampaknya menampilkan pejabat melakukan hal memalukan, tetapi gerakannya terlihat janggal. Sikapmu ...",[["Menyebarkannya agar viral",1],["Membagikannya dengan keterangan 'katanya'",2],["Menontonnya saja",3],["Tidak menyebarkannya",4],["Tidak menyebarkannya, memeriksa keaslian video itu melalui sumber tepercaya, dan mengingatkan orang lain tentang bahaya video palsu (deepfake)",5]],"Video dengan gerakan janggal dapat berupa deepfake. Sikap terbaik: tidak menyebarkan, memeriksa keasliannya ke sumber tepercaya, dan mengingatkan orang lain tentang bahaya video palsu.","TIK dan literasi digital"),
t("Kamu harus membuat cadangan (backup) data penting kantor. Sikapmu ...",[["Menghapus data lama agar tidak menumpuk",1],["Tidak membuat cadangan karena data sudah di komputer",2],["Menyimpan cadangan di HP pribadi",3],["Membuat cadangan bila sempat",4],["Membuat cadangan secara berkala melalui sistem resmi kantor dan memastikan cadangan itu aman",5]],"Cadangan data penting harus dibuat secara berkala melalui sistem resmi kantor dan dipastikan keamanannya, bukan disimpan di HP pribadi atau tidak dibuat sama sekali.","TIK dan literasi digital")
);

m("TIU","Gedung 5 lantai. Kantor A di lantai 2. Kantor B tepat di atas A. Kantor C di lantai paling bawah. Kantor D di lantai 5. Kantor E di antara B dan D. Kantor siapa di lantai 4?",["A","B","C","D","E"],4,"A=2, B=3, C=1, D=5, maka E=4.","Penalaran analitis"),
m("TIU","Seminar diadakan 3 hari setelah lokakarya. Lokakarya tidak dilaksanakan pada hari Senin dan Kamis. Seminar jatuh pada hari Sabtu. Lokakarya dilaksanakan hari ...",["Senin","Selasa","Rabu","Kamis","Jumat"],2,"Tiga hari sebelum Sabtu adalah Rabu, dan Rabu bukan Senin atau Kamis.","Penalaran analitis"),
m("TIU","Nilai Dedi lebih tinggi dari Eko. Nilai Fajar lebih rendah dari Eko. Nilai Gita lebih tinggi dari Dedi. Nilai Hadi lebih rendah dari Fajar. Siapa yang nilainya paling rendah?",["Dedi","Eko","Fajar","Gita","Hadi"],4,"Urutan nilai: Gita > Dedi > Eko > Fajar > Hadi. Terendah adalah Hadi.","Penalaran analitis"),
m("TIU","Lima pelari mengikuti lomba. Andi finis sebelum Budi. Budi finis sebelum Candra. Dedi finis setelah Candra. Eko finis di antara Budi dan Dedi. Siapa yang finis pertama?",["Andi","Budi","Candra","Dedi","Eko"],0,"Andi finis sebelum Budi, dan Budi sebelum yang lain, jadi Andi pertama.","Penalaran analitis"),
m("TIU","Jika K=11, L=12, dan M=13, nilai kata KLM adalah ...",["33","34","35","36","37"],3,"K + L + M = 11 + 12 + 13 = 36.","Penalaran analitis"),
m("TIU","Lima buku berjajar. Buku Kuning di ujung kiri. Buku Merah di sebelah kiri Buku Biru. Buku Hijau di sebelah kanan Buku Biru. Buku Putih di antara Buku Biru dan Buku Hijau. Buku apa yang berada di tengah?",["Merah","Biru","Hijau","Kuning","Putih"],1,"Urutan buku: Kuning, Merah, Biru, Putih, Hijau. Tengah adalah Biru.","Penalaran analitis"),
m("TIU","Dari 5 siswa, nilai Ani lebih tinggi dari Budi dan Cici. Budi lebih tinggi dari Dedi. Eko lebih rendah dari Dedi tetapi lebih tinggi dari Cici. Siapa yang peringkat keempat?",["Ani","Budi","Dedi","Eko","Cici"],3,"Urutan nilai: Ani, Budi, Dedi, Eko, Cici. Keempat adalah Eko.","Penalaran analitis"),
m("TIU","Piket Senin sampai Jumat oleh A, B, C, D, dan E, satu orang per hari. B piket hari Selasa. A piket sebelum B. C piket hari Rabu. D piket setelah C tetapi sebelum E. Siapa yang piket hari Jumat?",["A","B","C","D","E"],4,"A=Senin, B=Selasa, C=Rabu, D=Kamis, E=Jumat.","Penalaran analitis"),
m("TIU","Empat orang: P, Q, R, dan S. P lebih cepat dari Q. R lebih lambat dari S. Q lebih cepat dari R. Siapa yang paling lambat?",["P","Q","R","S","Tidak dapat ditentukan"],2,"P > Q > R dan S > R, jadi R berada di bawah Q dan S, paling lambat adalah R.","Penalaran analitis"),
m("TIU","Lima orang mengantre. E berada di depan A. A tepat di depan B. F berada di antara B dan C. C berada 2 orang di belakang B. Siapa yang berada di urutan keempat?",["A","B","C","E","F"],4,"Urutan antrean: E, A, B, F, C. Keempat adalah F.","Penalaran analitis"),
m("TIU","Tinggi badan: Andi sama dengan Budi. Budi lebih pendek dari Cici. Cici sama dengan Dedi. Dedi lebih tinggi dari Eko. Siapa yang paling pendek?",["Andi","Budi","Cici","Eko","Tidak dapat ditentukan"],4,"Andi = Budi < Cici = Dedi, dan Eko < Dedi, tetapi hubungan Eko dengan Andi tidak diketahui.","Penalaran analitis"),

m("TIU","Perbandingan kelereng Andi dan Budi adalah 2 : 3. Jumlah kelereng mereka 50. Selisih kelereng Andi dan Budi adalah ...",["5","8","10","12","15"],2,"2 + 3 = 5 bagian = 50, jadi 1 bagian = 10. Selisih 3 - 2 = 1 bagian = 10.","Perbandingan dan soal cerita"),
m("TIU","Harga 3 kg apel adalah Rp45.000. Harga 7 kg apel adalah ...",["Rp85.000","Rp95.000","Rp105.000","Rp115.000","Rp125.000"],2,"Harga 1 kg = Rp45.000 : 3 = Rp15.000, jadi 7 kg = 7 x Rp15.000 = Rp105.000.","Perbandingan dan soal cerita"),

m("TIU","Rata-rata berat 5 karung adalah 60 kg. Empat karung beratnya 55 kg, 58 kg, 62 kg, dan 65 kg. Berat karung kelima adalah ...",["55 kg","58 kg","60 kg","62 kg","65 kg"],2,"Total berat 5 karung = 5 x 60 = 300 kg. Empat karung = 55 + 58 + 62 + 65 = 240 kg, jadi karung kelima = 300 - 240 = 60 kg.","Perbandingan dan soal cerita"),
m("TIU","Usia kakak berbanding usia adik adalah 4 : 7. Selisih usia mereka 12 tahun. Jumlah usia kakak dan adik adalah ...",["36 tahun","40 tahun","44 tahun","48 tahun","52 tahun"],2,"Selisih 7 - 4 = 3 bagian = 12 tahun, jadi 1 bagian = 4 tahun. Jumlah 4 + 7 = 11 bagian = 44 tahun.","Perbandingan dan soal cerita"),
m("TIU","Perbandingan uang Ani dan Budi adalah 5 : 4. Jika Ani memberi Rp10.000 kepada Budi, uang mereka menjadi sama. Uang Ani mula-mula adalah ...",["Rp80.000","Rp90.000","Rp100.000","Rp110.000","Rp120.000"],2,"Selisih uang mereka 2 x Rp10.000 = Rp20.000. Selisih perbandingan 5 - 4 = 1 bagian = Rp20.000, jadi uang Ani = 5 x Rp20.000 = Rp100.000.","Perbandingan dan soal cerita"),
t("Seorang warga datang dari jauh, tetapi layanan yang dicarinya ternyata berada di unit lain. Sikapmu ...",[["Memberi tahu alamat unit lain itu",3],["Mengantar warga ke unit yang benar dan menjelaskan syarat yang perlu dibawa",5],["Mengatakan itu bukan urusan unitmu",1],["Memberi petunjuk arah yang jelas dan nomor telepon unit tersebut",4],["Menyuruh warga bertanya sendiri di bagian informasi",2]],"Warga yang datang jauh-jauh paling terbantu bila diantar ke unit yang benar dan diberi tahu syaratnya, bukan sekadar diberi alamat.","Pelayanan publik"),
t("Seorang warga pengguna kursi roda kesulitan mencapai loket pelayanan yang tinggi. Sikapmu ...",[["Meminta rekan membantu warga naik ke loket",4],["Menyuruh warga naik sendiri ke loket",1],["Turun menemui warga dan melayaninya di tempat yang mudah dijangkau, lalu mencatat perbaikan akses",5],["Meminta warga menunggu sampai ada petugas yang luang",2],["Mengarahkan warga ke loket khusus bila tersedia",3]],"Pelayanan yang baik mendatangi warga yang kesulitan dan memperbaiki aksesnya, bukan membiarkan warga berjuang sendiri.","Pelayanan publik"),
