t("Kamu diminta menilai usulan kegiatan dari unit lain yang bersaing dengan usulan dari unitmu sendiri. Sikapmu ...",[["Menilai usulan itu secara sepintas tanpa memakai kriteria yang ditetapkan",3],["Menilai usulan itu berdasarkan kriteria yang ditetapkan, mencatat alasan penilaian secara tertulis, dan menjaga penilaian tetap objektif sekalipun bersaing dengan unitmu",5],["Memberi nilai rendah karena usulan itu bersaing dengan unitmu",2],["Menilai usulan itu berdasarkan kriteria yang ditetapkan dan mencatat alasan penilaian",4],["Memberi nilai rendah dan menyebarkan penilaian buruk tentang unit lain itu",1]],"Penilaian berbasis kriteria dan alasan tertulis menjaga objektivitas sekalipun ada persaingan antarunit; memberi nilai rendah karena persaingan menyalahgunakan kewenangan penilaian, sedangkan menyebarkan penilaian buruk merusak hubungan antarunit.","Profesionalisme"),
t("Rekan senior menolak memakai cara kerja baru yang sudah ditetapkan pimpinan. Sikapmu ...",[["Mendengarkan keberatan rekan itu, menjelaskan aturan cara baru, dan menawarkan bantuan belajar",4],["Ikut memakai cara lama agar tidak berbeda dengan rekan senior itu",2],["Mendengarkan keberatan rekan itu dengan hormat, menjelaskan aturan dan manfaat cara baru, menawarkan bantuan belajar, dan melaporkan bila penolakan itu menghambat pekerjaan tim",5],["Mengajak tim kembali memakai cara lama bersama-sama",1],["Membiarkan rekan itu memakai cara lama karena menghormati senioritas",3]],"Mendengarkan, menjelaskan, dan menawarkan bantuan menghormati senior sekaligus menegakkan aturan yang berlaku; membiarkan cara lama menghambat keseragaman kerja, sedangkan mengajak tim kembali ke cara lama menolak keputusan pimpinan.","Profesionalisme"),
// FLAG E-SKD-06: nuansa urutan skor — batas berbagi informasi internal tim untuk koordinasi antarunit; mohon validator memastikan urutan respons sudah tepat.
t("Kamu diminta merahasiakan jadwal dan informasi internal tim dari unit lain yang membutuhkannya untuk koordinasi. Sikapmu ...",[["Membagikan semua informasi tim termasuk hal yang bersifat rahasia",2],["Menanyakan dasar permintaan itu dan menjelaskan kebutuhan koordinasi antarunit",4],["Membagikan informasi tim ke pihak luar kantor yang tidak berkepentingan",1],["Menanyakan dasar permintaan itu, menjelaskan kebutuhan koordinasi antarunit, dan membagikan informasi yang memang perlu dibagikan melalui jalur resmi setelah mendapat persetujuan",5],["Merahasiakan semua informasi tim dari unit lain tanpa bertanya",3]],"Memeriksa dasar permintaan dan berbagi lewat jalur resmi menyeimbangkan kerahasiaan dan kebutuhan koordinasi; merahasiakan semua informasi menghambat kerja sama antarunit, sedangkan membagikan hal rahasia melanggar kewajiban menjaga informasi internal.","Profesionalisme"),
t("Kamu merasa kemampuanmu tertinggal dari rekan seusia dalam satu keterampilan kerja tertentu. Sikapmu ...",[["Mengaku mahir dalam keterampilan itu padahal belum mampu",1],["Menganggap kekurangan itu sebagai bakat bawaan yang tidak dapat diubah",3],["Menilai kekurangan itu secara jujur dan menyusun rencana belajar bertahap",4],["Menghindari tugas yang membutuhkan keterampilan itu",2],["Menilai kekurangan itu secara jujur, menyusun rencana belajar bertahap, berlatih secara teratur, dan meminta masukan dari rekan yang lebih mahir",5]],"Rencana belajar bertahap dan latihan teratur mengubah kekurangan menjadi kemampuan yang nyata; menghindari tugas menghambat perkembangan diri, sedangkan mengaku mahir padahal belum mampu menipu atasan dan merugikan pekerjaan.","Profesionalisme"),
t("Kamu akan pindah unit dan harus menyerahkan pekerjaanmu kepada pengganti dalam waktu yang singkat. Sikapmu ...",[["Menyusun catatan serah terima yang lengkap, menjelaskan pekerjaan yang sedang berjalan dan tenggatnya, mendampingi pengganti selama waktu yang tersedia, dan memastikan kontak lanjutan yang jelas",5],["Menyerahkan berkas tanpa penjelasan dan berharap pengganti memahami sendiri",3],["Menyusun catatan serah terima yang lengkap dan menjelaskan pekerjaan yang sedang berjalan",4],["Pindah tanpa serah terima dan tanpa memberi tahu pengganti",1],["Menyerahkan sebagian berkas dan menyimpan sisanya",2]],"Catatan lengkap dan pendampingan menjaga pekerjaan tetap berlanjut tanpa putus; menyerahkan tanpa penjelasan membebani pengganti, sedangkan pindah tanpa serah terima menelantarkan pekerjaan yang sedang berjalan.","Profesionalisme"),
t("Tetanggamu mengajak anak-anak menonton tontonan yang berisi ajakan membenci kelompok lain. Sikapmu ...",[["Menolak ajakan itu, menjelaskan kepada anak-anak dengan bahasa yang mudah dipahami tentang hidup rukun, dan memberi tahu orang tua anak-anak itu tentang isi tontonan tersebut",5],["Membiarkan anak-anak menonton tanpa menegur tetangga itu",3],["Menolak ajakan itu dan menjelaskan kepada anak-anak tentang hidup rukun",4],["Ikut mengajak anak-anak lain menonton tontonan itu",1],["Membiarkan anak-anak menonton dan menganggap tontonan itu hiburan biasa",2]],"Menolak dan menjelaskan tentang hidup rukun melindungi anak dari ajaran kebencian sejak dini; membiarkan dengan alasan hiburan membiarkan kebencian tertanam pada anak, sedangkan ikut mengajak memperluas paparan tontonan yang berisi kebencian.","Anti radikalisme"),
t("Rekanmu mengusulkan kegiatan kantor hanya diikuti pegawai dari latar belakang yang sama. Sikapmu ...",[["Mendiamkan usulan itu dan berharap tidak disetujui pimpinan",3],["Menolak usulan itu dengan sopan, menjelaskan kegiatan kantor terbuka bagi semua pegawai, dan mengusulkan kegiatan bersama yang melibatkan seluruh pegawai",5],["Mendukung usulan itu agar kegiatan terasa lebih akrab",2],["Menolak usulan itu dengan sopan dan menjelaskan kegiatan kantor terbuka bagi semua pegawai",4],["Ikut menyusun kegiatan yang mengecualikan pegawai dari latar belakang berbeda",1]],"Kegiatan bersama yang terbuka memperkuat persatuan di tempat kerja; mendukung pembatasan berdasarkan latar belakang memecah pegawai, sedangkan menyusun kegiatan yang mengecualikan mempertegas pemisahan di kantor.","Anti radikalisme"),
// FLAG E-SKD-06: nuansa urutan skor — bahasa Indonesia sebagai bahasa resmi berhadapan dengan penghormatan atas bahasa daerah; mohon validator memastikan urutan respons sudah tepat.
t("Seorang warga meminta pengumuman layanan hanya memakai satu bahasa daerah dan menolak pemakaian bahasa Indonesia. Sikapmu ...",[["Menjelaskan dengan sopan bahwa bahasa Indonesia mempersatukan semua warga dan membantu warga memahami pengumuman",4],["Mengganti pengumuman resmi hanya dengan bahasa daerah yang diminta",2],["Menjelaskan dengan sopan bahwa bahasa Indonesia mempersatukan semua warga, tetap membantu warga memahami pengumuman dengan penjelasan tambahan, dan memakai bahasa Indonesia sebagai bahasa pengumuman resmi",5],["Ikut menolak pemakaian bahasa Indonesia dalam layanan",1],["Mendiamkan permintaan itu tanpa penjelasan",3]],"Bahasa Indonesia sebagai bahasa resmi mempersatukan warga dari berbagai daerah, dan bantuan penjelasan tambahan tetap menghormati warga yang lebih nyaman dengan bahasa daerah; mengganti pengumuman resmi hanya dengan satu bahasa daerah menyulitkan warga dari daerah lain.","Anti radikalisme"),
t("Temanmu mengajakmu menyebarkan daftar nama tokoh yang dianggap musuh oleh kelompoknya. Sikapmu ...",[["Membaca daftar itu dan membicarakannya dengan teman lain",2],["Menolak menyebarkan daftar itu dan menjelaskan bahaya daftar semacam itu",4],["Ikut menyebarkan daftar itu ke banyak orang",1],["Menolak menyebarkan daftar itu, menjelaskan bahwa daftar semacam itu membahayakan orang yang namanya tercantum, dan melaporkan ajakan itu kepada pihak yang berwenang bila penyebarannya berlanjut",5],["Menyimpan daftar itu tanpa menyebarkannya",3]],"Menolak dan melaporkan melindungi orang yang namanya tercantum dari ancaman; menyimpan tanpa melapor membiarkan daftar berbahaya tetap beredar di tempat lain, sedangkan ikut menyebarkan memperbesar bahaya bagi orang yang tercantum.","Anti radikalisme"),
t("Rekanmu membanding-bandingkan hari besar keagamaan dan meremehkan perayaan kelompok lain. Sikapmu ...",[["Ikut meremehkan perayaan kelompok lain",1],["Mendiamkan perbandingan itu agar tidak timbul perdebatan",3],["Menegur dengan santun dan mengajak menghormati perayaan setiap kelompok",4],["Ikut tertawa mendengar perbandingan itu",2],["Menegur dengan santun, mengajak menghormati perayaan setiap kelompok, dan mengingatkan bahwa saling menghormati memperkuat kerja sama di kantor",5]],"Teguran santun dan ajakan menghormati menjaga hubungan baik antarpegawai yang berbeda keyakinan; ikut tertawa memberi kesan meremehkan itu dapat diterima, sedangkan ikut meremehkan memperdalam ketersinggungan antarpegawai.","Anti radikalisme"),
t("Keponakanmu pulang sekolah sambil menirukan ejekan terhadap teman yang berbeda suku. Sikapmu ...",[["Menasihati keponakanmu dengan lembut, menjelaskan bahwa ejekan menyakiti teman, dan mengajaknya meminta maaf serta berteman baik dengan teman yang diejek",5],["Mendiamkan ejekan itu karena menganggapnya candaan anak-anak",3],["Menasihati keponakanmu dengan lembut dan menjelaskan bahwa ejekan menyakiti teman",4],["Ikut mengejek teman keponakanmu itu",1],["Tertawa mendengar ejekan itu",2]],"Nasihat lembut dan ajakan meminta maaf mengajarkan anak menghormati teman yang berbeda suku; menganggap ejekan sebagai candaan membiarkan kebiasaan merendahkan tumbuh, sedangkan ikut mengejek menguatkan perilaku yang menyakiti.","Anti radikalisme"),
t("Panitia perayaan kemerdekaan mengusulkan lomba yang mengejek budaya daerah tertentu. Sikapmu ...",[["Mendiamkan usulan itu dan berharap panitia lain menolak",3],["Menolak usulan lomba itu, menjelaskan perayaan kemerdekaan seharusnya merayakan keberagaman budaya, dan mengusulkan lomba yang menghormati semua budaya daerah",5],["Membiarkan lomba itu berjalan karena dianggap menghibur",2],["Menolak usulan lomba itu dan menjelaskan perayaan kemerdekaan seharusnya merayakan keberagaman budaya",4],["Ikut menjadi peserta lomba yang mengejek budaya daerah itu",1]],"Lomba yang menghormati semua budaya membuat perayaan kemerdekaan menjadi milik semua warga; membiarkan lomba ejekan dengan alasan hiburan menyakiti warga dari daerah yang diejek, sedangkan ikut menjadi peserta mempermalukan budaya daerah di depan umum.","Anti radikalisme"),
t("Rekanmu mengajakmu menyabotase acara peresmian karena tidak setuju dengan kebijakan pimpinan. Sikapmu ...",[["Menolak ajakan sabotase itu dan menjelaskan ketidaksetujuan disampaikan lewat jalur yang sah",4],["Hadir di acara itu tetapi tidak membantu panitia sebagai bentuk protes diam-diam",2],["Menolak ajakan sabotase itu, menjelaskan ketidaksetujuan disampaikan lewat jalur yang sah, dan melaporkan rencana sabotase itu bila tetap dilanjutkan",5],["Ikut menyabotase acara peresmian itu",1],["Mendiamkan ajakan itu tanpa menolak atau melaporkan",3]],"Ketidaksetujuan yang disampaikan lewat jalur sah menjaga ketertiban dan hak semua pihak; sabotase merugikan panitia dan tamu yang tidak terlibat perselisihan, sedangkan mendiamkan rencana sabotase membiarkan gangguan terhadap acara tetap terjadi.","Anti radikalisme"),
t("Temanmu mengajakmu mengganti foto profil bersama dengan simbol kelompok yang menolak persatuan. Sikapmu ...",[["Mengganti foto profil karena tidak enak menolak teman",2],["Menolak ajakan itu dan menjelaskan pentingnya menjaga persatuan",4],["Ikut mengajak teman lain mengganti foto profil dengan simbol itu",1],["Menolak ajakan itu, menjelaskan pentingnya menjaga persatuan, dan tidak memakai simbol yang menolak persatuan di akunmu",5],["Mendiamkan ajakan itu tanpa mengganti foto profil",3]],"Menolak simbol yang menolak persatuan dan menjelaskan alasannya menjaga sikap setia pada persatuan; mengganti karena tidak enak menolak memberi dukungan nyata kepada penolakan persatuan, sedangkan mengajak teman lain memperluas dukungan itu.","Anti radikalisme"),
t("Seorang warga menolak ikut gotong royong bersama warga dari latar belakang berbeda. Sikapmu ...",[["Ikut menolak gotong royong bersama warga dari latar belakang berbeda",1],["Membiarkan warga itu tidak ikut tanpa mengajak",3],["Mengajak warga itu dengan sopan dan menjelaskan gotong royong adalah kerja bersama untuk kepentingan lingkungan",4],["Mendukung penolakan itu dengan alasan kenyamanan pribadi",2],["Mengajak warga itu dengan sopan, menjelaskan gotong royong adalah kerja bersama untuk kepentingan lingkungan, dan memberi contoh dengan ikut bekerja bersama semua warga",5]],"Ajakan sopan dan contoh bekerja bersama menunjukkan gotong royong mempersatukan warga; mendukung penolakan memecah kerja bersama di lingkungan, sedangkan ikut menolak memperluas pemisahan antarwarga.","Anti radikalisme"),
t("Rekanmu menyarankan agar penugasan yang baik mengutamakan pegawai dari satu kelompok saja. Sikapmu ...",[["Menolak saran itu, menjelaskan penugasan harus berdasarkan kemampuan dan kebutuhan kerja, dan mengusulkan kriteria penugasan yang adil dan terbuka",5],["Mendiamkan saran itu dan berharap pimpinan tidak mengikutinya",3],["Menolak saran itu dan menjelaskan penugasan harus berdasarkan kemampuan dan kebutuhan kerja",4],["Ikut menyusun daftar penugasan yang mengutamakan satu kelompok",1],["Mendukung saran itu karena merasa kelompokmu diuntungkan",2]],"Penugasan berbasis kemampuan dan kebutuhan kerja menjaga keadilan bagi semua pegawai; mengutamakan satu kelompok merugikan pegawai yang mampu tetapi berasal dari kelompok lain, sedangkan menyusun daftar yang memihak mewujudkan ketidakadilan itu.","Anti radikalisme"),
t("Temanmu mengajakmu bergabung dengan kelompok pengawas lingkungan yang main hakim sendiri terhadap pendatang baru. Sikapmu ...",[["Menolak bergabung tanpa menjelaskan alasan",3],["Menolak bergabung, menjelaskan keamanan lingkungan dijaga lewat aturan dan aparat yang berwenang, dan melaporkan kelompok itu bila tindakannya meresahkan warga",5],["Bergabung tetapi hanya ikut berjaga tanpa ikut bertindak",2],["Menolak bergabung dan menjelaskan keamanan lingkungan dijaga lewat aturan dan aparat yang berwenang",4],["Ikut menindak pendatang baru bersama kelompok itu",1]],"Keamanan lewat aturan dan aparat yang berwenang melindungi semua warga termasuk pendatang baru; ikut berjaga tanpa bertindak tetap memberi dukungan kepada kelompok main hakim sendiri, sedangkan ikut menindak melanggar hukum dan meresahkan warga.","Anti radikalisme"),
t("Di grup alumni sekolah seseorang menyebarkan cerita palsu yang menyudutkan kelompok tertentu. Sikapmu ...",[["Memeriksa kebenaran cerita itu dan meluruskan dengan sopan berbasis fakta",4],["Mengomentari cerita itu dengan candaan tanpa meluruskan",2],["Memeriksa kebenaran cerita itu, meluruskan dengan sopan berbasis fakta, dan mengingatkan anggota grup agar tidak menyebarkan cerita yang belum diperiksa",5],["Ikut menyebarkan cerita palsu itu ke grup lain",1],["Mendiamkan cerita itu karena menganggap anggota grup sudah dapat menilai sendiri",3]],"Pelurusan berbasis fakta menghentikan cerita palsu di tempat penyebarannya; mengomentari dengan candaan membiarkan cerita palsu dianggap benar, sedangkan ikut menyebarkan memperluas fitnah terhadap kelompok yang disudutkan.","Anti radikalisme"),
t("Panitia acara menerima sumbangan dengan syarat acara hanya dihadiri kelompok tertentu saja. Sikapmu ...",[["Menerima sumbangan itu dan membatasi undangan sesuai syarat",2],["Menolak syarat itu dan menjelaskan acara bersama terbuka bagi semua warga",4],["Ikut menyeleksi tamu berdasarkan kelompok sesuai syarat sumbangan",1],["Menolak syarat itu, menjelaskan acara bersama terbuka bagi semua warga, dan mengusulkan mencari sumbangan tanpa syarat yang mengecualikan warga",5],["Menerima sumbangan itu tetapi berharap syaratnya tidak ditegakkan",3]],"Acara bersama yang terbuka menjaga kebersamaan warga; menerima sumbangan dengan syarat pengecualian menjual kebersamaan demi dana, sedangkan menyeleksi tamu berdasarkan kelompok mewujudkan pengecualian itu.","Anti radikalisme"),
t("Tetanggamu membagikan buku anak yang isinya mengajarkan anak membenci teman yang berbeda keyakinan. Sikapmu ...",[["Ikut membagikan buku itu kepada banyak keluarga",1],["Menerima buku itu tetapi tidak membacakannya kepada anak",3],["Menolak membagikan buku itu dan menjelaskan isi buku itu mengajarkan kebencian kepada anak",4],["Membiarkan buku itu beredar tanpa memberi tahu orang tua lain",2],["Menolak membagikan buku itu, menjelaskan isi buku itu mengajarkan kebencian kepada anak, dan memberi tahu orang tua di lingkungan tentang isi buku tersebut agar waspada",5]],"Menolak dan memberi tahu orang tua melindungi anak dari ajaran kebencian; membiarkan beredar tanpa pemberitahuan membiarkan buku itu sampai ke banyak anak, sedangkan ikut membagikan memperluas ajaran kebencian kepada anak.","Anti radikalisme"),
t("Rekanmu mengusulkan agar kantin dan ruang bersama dipisah berdasarkan latar belakang pegawai. Sikapmu ...",[["Menolak usulan itu, menjelaskan ruang bersama adalah milik semua pegawai, dan mengusulkan aturan pemakaian bersama yang adil bagi semua pegawai",5],["Mendiamkan usulan itu dan berharap pimpinan menolak",3],["Menolak usulan itu dan menjelaskan ruang bersama adalah milik semua pegawai",4],["Ikut membuat aturan pemisahan ruang bersama berdasarkan latar belakang",1],["Mendukung pemisahan itu dengan alasan ketertiban",2]],"Ruang bersama yang terbuka bagi semua pegawai memperkuat kebersamaan; pemisahan berdasarkan latar belakang memecah pegawai dalam kehidupan sehari-hari di kantor, sedangkan membuat aturan pemisahan mewujudkan pemisahan itu secara resmi.","Anti radikalisme"),
t("Temanmu mengajakmu menolak pembangunan balai warga bersama dengan alasan tidak mau bercampur dengan warga dari latar belakang berbeda. Sikapmu ...",[["Mendiamkan ajakan itu tanpa menyatakan sikap",3],["Menolak ajakan itu, menjelaskan balai warga bermanfaat bagi semua warga, dan mendukung pembangunan balai warga bersama",5],["Mendukung penolakan itu dengan alasan balai warga belum mendesak",2],["Menolak ajakan itu dan menjelaskan balai warga bermanfaat bagi semua warga",4],["Ikut menggalang penolakan pembangunan balai warga itu",1]],"Balai warga bersama memberi ruang berkumpul bagi semua warga tanpa memandang latar belakang; menggalang penolakan dengan alasan tidak mau bercampur menolak kebersamaan warga, sedangkan mendukung penolakan dengan alasan lain tetap menghambat fasilitas bersama.","Anti radikalisme"),
t("Seorang warga mengusulkan mengganti nama jalan pahlawan nasional dengan nama tokoh kelompoknya. Sikapmu ...",[["Menolak usulan itu dengan sopan dan menjelaskan nama jalan pahlawan menghormati jasa bagi bangsa",4],["Mendukung usulan itu karena tokoh kelompok dianggap lebih berjasa",2],["Menolak usulan itu dengan sopan, menjelaskan nama jalan pahlawan menghormati jasa bagi bangsa, dan mengusulkan penghargaan bagi tokoh kelompok lewat cara lain yang tidak mengganti nama pahlawan",5],["Ikut menggalang dukungan untuk mengganti nama jalan itu",1],["Mendiamkan usulan itu dan berharap tidak disetujui",3]],"Nama jalan pahlawan adalah penghormatan atas jasa bagi bangsa yang perlu dijaga; menggantinya dengan nama tokoh kelompok menggeser penghormatan bersama, sedangkan menggalang dukungan memperluas usulan yang merugikan ingatan bersama tentang pahlawan.","Anti radikalisme"),
t("Rekanmu menyebarkan tangkapan layar percakapan yang dipotong untuk mengadu domba dua kelompok pegawai. Sikapmu ...",[["Membaca potongan itu dan mempercayainya tanpa memeriksa percakapan utuh",2],["Tidak ikut menyebarkan potongan itu dan menjelaskan kepada rekan yang terpengaruh bahwa potongan itu menyesatkan",4],["Ikut menyebarkan potongan itu ke kelompok pegawai lain",1],["Tidak ikut menyebarkan potongan itu, menjelaskan kepada rekan yang terpengaruh bahwa potongan itu menyesatkan, dan melaporkan perbuatan itu kepada atasan bila adu domba berlanjut",5],["Mendiamkan potongan itu karena menganggap rekan lain akan memahami sendiri",3]],"Penjelasan bahwa potongan menyesatkan dan laporan bila berlanjut menghentikan adu domba; mempercayai potongan tanpa memeriksa membuat adu domba berhasil, sedangkan ikut menyebarkan memperluas perselisihan antarpegawai.","Anti radikalisme"),
t("Anak muda di lingkunganmu diajak bergabung dengan perkumpulan yang menjanjikan persaudaraan tetapi syaratnya memusuhi kelompok lain. Sikapmu ...",[["Ikut mengajak anak muda lain bergabung dengan perkumpulan itu",1],["Mendiamkan ajakan itu karena menganggap anak muda dapat memilih sendiri",3],["Menasihati anak muda itu agar tidak bergabung dan menjelaskan persaudaraan sejati tidak mensyaratkan permusuhan",4],["Membiarkan anak muda itu bergabung karena perkumpulan itu terlihat kompak",2],["Menasihati anak muda itu agar tidak bergabung, menjelaskan persaudaraan sejati tidak mensyaratkan permusuhan, dan memberi tahu orang tua atau tokoh lingkungan tentang ajakan itu",5]],"Nasihat dan pemberitahuan kepada orang tua melindungi anak muda dari perkumpulan yang berkedok persaudaraan; membiarkan karena terlihat kompak mengabaikan syarat permusuhan, sedangkan ikut mengajak memperluas perkumpulan yang mengajarkan permusuhan.","Anti radikalisme"),
t("Rekanmu sengaja memanggil rekan dari daerah lain dengan julukan yang merendahkan asal daerahnya, bukan dengan nama yang benar. Sikapmu ...",[["Menegur julukan itu dengan santun, mengajak memanggil rekan itu dengan nama yang benar, dan memberi dukungan kepada rekan yang dijuluki agar merasa dihormati",5],["Mendiamkan julukan itu karena menganggapnya candaan biasa",3],["Menegur julukan itu dengan santun dan mengajak memanggil rekan itu dengan nama yang benar",4],["Ikut memanggil rekan itu dengan julukan yang merendahkan itu",1],["Ikut tertawa mendengar julukan itu",2]],"Teguran santun dan ajakan memakai nama yang benar menjaga martabat rekan dari daerah lain; menganggap julukan sebagai candaan membiarkan rekan direndahkan setiap hari, sedangkan ikut memakai julukan itu memperdalam penghinaan terhadap asal daerah rekan tersebut.","Anti radikalisme"),
t("Temanmu mengajakmu menyebarkan kabar bahwa keputusan bersama tidak sah tanpa bukti dan mengajak menolak keputusan itu dengan kekerasan. Sikapmu ...",[["Mendiamkan ajakan itu tanpa menolak atau melaporkan",3],["Menolak ajakan itu, menjelaskan keputusan bersama dihormati dan keberatan disampaikan lewat jalur yang sah tanpa kekerasan, dan melaporkan ajakan kekerasan itu bila berlanjut",5],["Membicarakan kabar itu dengan teman lain tanpa memeriksa kebenarannya",2],["Menolak ajakan itu dan menjelaskan keberatan disampaikan lewat jalur yang sah tanpa kekerasan",4],["Ikut menyebarkan kabar itu dan ikut menolak keputusan dengan kekerasan",1]],"Keberatan lewat jalur sah tanpa kekerasan menjaga keputusan bersama tetap dihormati; membicarakan kabar tanpa bukti memperluas keraguan yang tidak berdasar, sedangkan menolak dengan kekerasan melanggar hukum dan merusak ketertiban.","Anti radikalisme"),
t("Seorang warga memintamu mencoret dan tidak mencatat warga dari kelompok tertentu dalam pendataan layanan. Sikapmu ...",[["Menolak permintaan itu dan menjelaskan pendataan harus mencakup semua warga tanpa kecuali",4],["Mencatat warga dari kelompok itu secara tidak lengkap",2],["Menolak permintaan itu, menjelaskan pendataan harus mencakup semua warga tanpa kecuali, dan mencatat semua warga sesuai data yang benar",5],["Mencoret warga dari kelompok itu dari pendataan seperti diminta",1],["Menunda pencatatan warga dari kelompok itu tanpa menjelaskan alasan",3]],"Pendataan yang mencakup semua warga menjaga layanan adil bagi semua; mencatat secara tidak lengkap merugikan warga yang dicatat, sedangkan mencoret menghapus hak warga atas layanan yang seharusnya ia terima.","Anti radikalisme"),
t("Rekanmu mengusulkan agar penghargaan pegawai teladan hanya diberikan kepada pegawai dari latar belakang yang sama dengan pimpinan. Sikapmu ...",[["Mendukung usulan itu karena merasa diuntungkan",2],["Menolak usulan itu dan menjelaskan penghargaan harus berdasarkan prestasi kerja",4],["Ikut menyusun daftar calon penerima yang mengutamakan satu latar belakang",1],["Menolak usulan itu, menjelaskan penghargaan harus berdasarkan prestasi kerja, dan mengusulkan kriteria penghargaan yang adil dan terbuka bagi semua pegawai",5],["Mendiamkan usulan itu dan berharap pimpinan tidak mengikutinya",3]],"Penghargaan berbasis prestasi menghargai kerja nyata semua pegawai; mengutamakan satu latar belakang merugikan pegawai berprestasi dari latar belakang lain, sedangkan menyusun daftar yang memihak mewujudkan ketidakadilan itu.","Anti radikalisme"),
t("Temanmu mengajakmu menyanyikan yel-yel bersama yang liriknya mengajak membenci kelompok lain. Sikapmu ...",[["Ikut memimpin yel-yel yang berisi kebencian itu",1],["Diam saja saat yel-yel itu dinyanyikan tanpa ikut menyanyi",3],["Menolak ikut menyanyikan dan menjelaskan lirik itu mengajarkan kebencian",4],["Ikut menyanyikan karena tidak enak menolak teman",2],["Menolak ikut menyanyikan, menjelaskan lirik itu mengajarkan kebencian, dan mengajak menyanyikan yel-yel lain yang membangun semangat kebersamaan",5]],"Menolak dan mengajak yel-yel kebersamaan menjaga semangat bersama tanpa kebencian; ikut menyanyi karena tidak enak menolak tetap menyuarakan kebencian, sedangkan memimpin yel-yel kebencian menggerakkan orang lain untuk membenci.","Anti radikalisme"),
t("Di grup warga seseorang memakai akun anonim untuk menulis pesan permusuhan terhadap kelompok tertentu. Sikapmu ...",[["Tidak menanggapi dengan permusuhan, melaporkan akun anonim itu kepada pengelola grup dan pihak yang berwenang, dan mengajak anggota grup menjaga kerukunan warga",5],["Mendiamkan pesan itu karena pengirimnya tidak diketahui",3],["Melaporkan akun anonim itu kepada pengelola grup dan mengajak anggota grup menjaga kerukunan warga",4],["Ikut menulis pesan permusuhan di grup warga itu",1],["Membalas pesan itu dengan ejekan terhadap pengirim anonim itu",2]],"Laporan dan ajakan menjaga kerukunan menghentikan pesan permusuhan tanpa menambah permusuhan baru; membalas dengan ejekan memperkeruh grup warga, sedangkan ikut menulis permusuhan memperluas permusuhan antarwarga.","Anti radikalisme"),
t("Rekanmu mengajakmu mengikuti diskusi tertutup yang membahas cara mengganti aturan kantor dengan aturan kelompoknya. Sikapmu ...",[["Menolak mengikuti diskusi itu tanpa menjelaskan alasan",3],["Menolak mengikuti diskusi itu, menjelaskan aturan kantor berlaku bagi semua pegawai, dan melaporkan rencana itu kepada atasan bila diskusi tetap dilanjutkan",5],["Mengikuti diskusi itu sekadar mendengarkan tanpa menyatakan sikap",2],["Menolak mengikuti diskusi itu dan menjelaskan aturan kantor berlaku bagi semua pegawai",4],["Ikut menyusun rencana mengganti aturan kantor dengan aturan kelompok",1]],"Aturan kantor yang berlaku bagi semua pegawai menjaga keadilan dan ketertiban kerja; mengikuti sekadar mendengarkan memberi dukungan diam-diam pada rencana itu, sedangkan ikut menyusun rencana mewujudkan penggantian aturan bersama.","Anti radikalisme"),
t("Tetanggamu mengajak anak-anak lingkungan mengikuti kegiatan yang melarang bermain dengan anak yang berbeda keyakinan. Sikapmu ...",[["Menolak kegiatan itu dan menjelaskan anak-anak berhak bermain bersama tanpa memandang keyakinan",4],["Membiarkan anak mengikuti kegiatan itu karena kegiatannya terlihat menyenangkan",2],["Menolak kegiatan itu, menjelaskan anak-anak berhak bermain bersama tanpa memandang keyakinan, dan memberi tahu orang tua anak-anak tentang larangan dalam kegiatan itu",5],["Ikut mengajak anak lain mengikuti kegiatan yang melarang bermain bersama itu",1],["Membiarkan anak-anak mengikuti kegiatan itu tanpa menegur tetangga tersebut",3]],"Menolak dan memberi tahu orang tua melindungi anak dari pemisahan berdasarkan keyakinan; membiarkan karena terlihat menyenangkan mengabaikan larangan bermain bersama, sedangkan ikut mengajak memperluas pemisahan antar-anak.","Anti radikalisme"),
t("Rekanmu menyatakan bahwa Pancasila hanya formalitas dan tidak perlu dipedomani dalam bekerja. Sikapmu ...",[["Mengiyakan pernyataan itu agar tidak berselisih dengan rekan tersebut",2],["Menanggapi dengan tenang dan menjelaskan Pancasila sebagai dasar dan pedoman dalam bekerja",4],["Ikut menyatakan Pancasila tidak perlu dipedomani dan menyebarkan pernyataan itu",1],["Menanggapi dengan tenang, menjelaskan Pancasila sebagai dasar dan pedoman dalam bekerja, mengajak rekan itu memahami nilai Pancasila dalam tugas sehari-hari, dan melaporkan bila pernyataan itu disebarkan untuk menolak dasar negara",5],["Mendiamkan pernyataan itu agar tidak timbul perdebatan",3]],"Penjelasan tenang tentang Pancasila sebagai pedoman kerja meluruskan pernyataan yang meremehkan dasar negara; mengiyakan agar tidak berselisih memberi kesan pernyataan itu benar, sedangkan ikut menyebarkan memperluas penolakan terhadap dasar negara.","Anti radikalisme"),
t("Seorang warga mengajakmu menandatangani pernyataan dukungan untuk kelompok yang menolak keberagaman. Sikapmu ...",[["Ikut mengajak warga lain menandatangani pernyataan dukungan itu",1],["Menolak menandatangani tanpa menjelaskan alasan",3],["Menolak menandatangani dan menjelaskan keberagaman adalah kekayaan bangsa yang dijaga bersama",4],["Menandatangani karena tidak enak menolak warga itu",2],["Menolak menandatangani, menjelaskan keberagaman adalah kekayaan bangsa yang dijaga bersama, dan tidak memberikan dukungan dalam bentuk apa pun kepada kelompok itu",5]],"Menolak dan menjelaskan nilai keberagaman menjaga sikap setia pada persatuan; menandatangani karena tidak enak menolak memberi dukungan nyata kepada penolakan keberagaman, sedangkan mengajak warga lain memperluas dukungan itu.","Anti radikalisme"),
t("Temanmu mengajakmu berdebat di media sosial dengan menyerang latar belakang lawan debat, bukan argumennya. Sikapmu ...",[["Menolak cara debat itu, menjelaskan perdebatan yang sehat membahas argumen, dan memberi contoh tanggapan yang sopan dan berbasis argumen",5],["Mendiamkan ajakan itu tanpa ikut berdebat",3],["Menolak cara debat itu dan menjelaskan perdebatan yang sehat membahas argumen",4],["Ikut menyerang latar belakang lawan debat dengan kata-kata kasar",1],["Ikut berdebat dengan menyerang latar belakang lawan secara halus",2]],"Debat berbasis argumen menjaga diskusi tetap sehat dan menghormati lawan debat; menyerang latar belakang mengalihkan perdebatan menjadi penghinaan, sedangkan menyerang dengan kata kasar memperburuk perdebatan dan merusak nama baik.","Anti radikalisme"),
t("Rekanmu mengusulkan agar seragam kerja dibedakan berdasarkan kelompok pegawai agar mudah dikenali. Sikapmu ...",[["Mendiamkan usulan itu dan berharap pimpinan menolak",3],["Menolak usulan itu, menjelaskan seragam yang sama menunjukkan kesatuan pegawai, dan mengusulkan tanda pengenal berdasarkan jabatan atau tugas bila memang dibutuhkan",5],["Mendukung pembedaan seragam dengan alasan kemudahan mengenali",2],["Menolak usulan itu dan menjelaskan seragam yang sama menunjukkan kesatuan pegawai",4],["Ikut merancang seragam berbeda berdasarkan kelompok pegawai",1]],"Seragam yang sama menegaskan kesatuan pegawai tanpa memandang kelompok; membedakan seragam berdasarkan kelompok menandai perbedaan dalam keseharian kerja, sedangkan merancang pembedaan mewujudkan pemisahan itu secara nyata.","Anti radikalisme"),
t("Seorang pengunjung memuji petugas karena berasal dari suku yang sama dan merendahkan petugas lain di depannya. Sikapmu ...",[["Menanggapi dengan sopan bahwa semua petugas melayani dengan standar yang sama",4],["Tersenyum mendengar pujian itu tanpa menanggapi rendahan terhadap petugas lain",2],["Menanggapi dengan sopan bahwa semua petugas melayani dengan standar yang sama, mengajak pengunjung menghormati semua petugas, dan tetap melayani pengunjung itu dengan baik",5],["Ikut merendahkan petugas lain yang berasal dari suku berbeda",1],["Mendiamkan ucapan itu dan tetap melayani seperti biasa",3]],"Penegasan standar layanan yang sama dan ajakan menghormati semua petugas menjaga martabat rekan kerja; tersenyum tanpa menanggapi memberi kesan rendahan itu dapat diterima, sedangkan ikut merendahkan mempermalukan rekan di depan pengunjung.","Anti radikalisme"),
t("Temanmu mengajakmu mengikuti arisan yang syarat keanggotaannya menolak pergaulan dengan kelompok lain. Sikapmu ...",[["Mengikuti arisan itu tetapi tetap bergaul dengan kelompok lain secara diam-diam",2],["Menolak mengikuti arisan itu dan menjelaskan pergaulan yang baik terbuka bagi semua orang",4],["Mengikuti arisan itu dan memutuskan pergaulan dengan kelompok lain",1],["Menolak mengikuti arisan itu, menjelaskan pergaulan yang baik terbuka bagi semua orang, dan memilih perkumpulan yang tidak mensyaratkan permusuhan",5],["Menolak mengikuti arisan itu tanpa menjelaskan alasan",3]],"Menolak syarat permusuhan menjaga pergaulan tetap terbuka; mengikuti sambil bergaul diam-diam tetap mendukung perkumpulan yang mensyaratkan permusuhan, sedangkan memutuskan pergaulan mewujudkan syarat permusuhan itu.","Anti radikalisme"),
t("Rekanmu membagikan meme yang mengejek tradisi dan upacara adat daerah tertentu. Sikapmu ...",[["Ikut membagikan meme yang mengejek tradisi itu",1],["Mendiamkan meme itu karena menganggapnya lelucon",3],["Menegur dengan santun dan menjelaskan tradisi dan upacara adat patut dihormati",4],["Tertawa melihat meme itu tanpa membagikannya",2],["Menegur dengan santun, menjelaskan tradisi dan upacara adat patut dihormati, dan meminta rekan itu menghapus meme tersebut",5]],"Teguran santun dan permintaan menghapus melindungi tradisi daerah dari ejekan; menganggap meme sebagai lelucon membiarkan ejekan dianggap wajar, sedangkan ikut membagikan memperluas ejekan terhadap tradisi daerah.","Anti radikalisme"),
t("Seorang warga mengusulkan agar pos ronda hanya diisi warga dari satu kelompok saja. Sikapmu ...",[["Menolak usulan itu, menjelaskan keamanan lingkungan adalah tanggung jawab bersama semua warga, dan mengusulkan jadwal ronda yang melibatkan semua warga secara adil",5],["Mendiamkan usulan itu dan berharap warga lain menolak",3],["Menolak usulan itu dan menjelaskan keamanan lingkungan adalah tanggung jawab bersama semua warga",4],["Ikut menyusun jadwal ronda yang mengecualikan warga dari kelompok lain",1],["Mendukung usulan itu dengan alasan kekompakan kelompok",2]],"Jadwal ronda yang melibatkan semua warga menjaga keamanan bersama secara adil; mengecualikan warga dari kelompok lain memecah tanggung jawab bersama, sedangkan menyusun jadwal yang mengecualikan mewujudkan pemisahan itu.","Anti radikalisme"),
t("Rekanmu mengajakmu menonton bersama tayangan yang berisi pelatihan kekerasan terhadap kelompok lain. Sikapmu ...",[["Menolak menonton tanpa menjelaskan alasan",3],["Menolak menonton, menjelaskan tayangan kekerasan tidak boleh dijadikan tontonan bersama, dan melaporkan tayangan itu kepada pihak yang berwenang bila penyebarannya berlanjut",5],["Menonton bersama tanpa ikut mempraktikkan isi tayangan itu",2],["Menolak menonton dan menjelaskan tayangan kekerasan tidak boleh dijadikan tontonan bersama",4],["Ikut mempraktikkan pelatihan kekerasan dari tayangan itu",1]],"Menolak dan melaporkan mencegah tayangan kekerasan menyebar dan dipraktikkan; menonton bersama tanpa mempraktikkan tetap memberi penonton bagi tayangan kekerasan, sedangkan mempraktikkan mewujudkan kekerasan terhadap kelompok lain.","Anti radikalisme"),
// FLAG E-SKD-06: nuansa urutan skor — ucapan selamat hari besar terkait keyakinan pribadi; bedakan penolakan bersama yang terorganisasi dari sikap pribadi; mohon validator memastikan urutan respons sudah tepat.
t("Temanmu mengajakmu tidak mengucapkan selamat atas hari besar keagamaan kelompok lain sebagai bentuk penolakan bersama. Sikapmu ...",[["Menolak ikut dalam penolakan bersama itu dan tetap bersikap ramah kepada warga dari kelompok lain",4],["Ikut diam dalam penolakan bersama itu tanpa menyatakan sikap",2],["Menolak ikut dalam penolakan bersama itu, menjelaskan hubungan baik antarwarga dijaga dengan sikap saling menghormati, dan tetap bersikap ramah kepada warga dari kelompok lain sesuai keyakinan masing-masing",5],["Ikut mengajak banyak orang melakukan penolakan bersama itu",1],["Tidak ikut mengajak tetapi juga tidak menunjukkan sikap ramah",3]],"Menolak penolakan bersama dan tetap bersikap ramah menjaga hubungan baik antarwarga; ikut diam dalam penolakan bersama memberi dukungan diam-diam pada penolakan, sedangkan mengajak banyak orang memperluas penolakan terhadap kelompok lain.","Anti radikalisme"),
t("Di kelas pelatihan peserta lain mengajakmu membentuk kelompok belajar yang mengecualikan peserta dari latar belakang tertentu. Sikapmu ...",[["Bergabung dengan kelompok belajar itu karena materinya terlihat bagus",2],["Menolak ajakan itu dan menjelaskan kelompok belajar terbuka bagi semua peserta",4],["Ikut menyusun kelompok belajar yang mengecualikan peserta dari latar belakang tertentu",1],["Menolak ajakan itu, menjelaskan kelompok belajar terbuka bagi semua peserta, dan mengajak peserta yang dikecualikan untuk belajar bersama",5],["Mendiamkan ajakan itu dan belajar sendiri",3]],"Kelompok belajar yang terbuka memberi kesempatan belajar yang sama bagi semua peserta; bergabung karena materi bagus tetap mendukung pengecualian, sedangkan menyusun kelompok yang mengecualikan mewujudkan pemisahan dalam belajar.","Anti radikalisme"),
t("Rekanmu mengajak rekan lain keluar dari rapat bersama sebagai protes karena pimpinan berasal dari latar belakang berbeda. Sikapmu ...",[["Ikut mengajak peserta lain keluar dari rapat itu",1],["Tetap mengikuti rapat tanpa menanggapi ajakan itu",3],["Menolak ajakan itu dan tetap mengikuti rapat",4],["Keluar dari rapat bersama rekan itu agar tidak berbeda sikap",2],["Menolak ajakan itu, tetap mengikuti rapat, menjelaskan pimpinan dinilai dari kemampuan dan amanah jabatannya, dan melaporkan ajakan itu bila mengganggu jalannya rapat",5]],"Tetap mengikuti rapat dan menilai pimpinan dari kemampuan menjaga rapat tetap berjalan dan adil; keluar agar tidak berbeda sikap mendukung protes berdasarkan latar belakang, sedangkan mengajak peserta lain memperluas gangguan terhadap rapat.","Anti radikalisme"),
t("Tetanggamu mengajak mengubah jadwal kegiatan lingkungan agar kelompok tertentu tidak dapat hadir. Sikapmu ...",[["Menolak ajakan itu, menjelaskan jadwal kegiatan disusun agar semua warga dapat hadir, dan mengusulkan jadwal yang adil bagi semua warga",5],["Mendiamkan ajakan itu dan berharap jadwal tidak diubah",3],["Menolak ajakan itu dan menjelaskan jadwal kegiatan disusun agar semua warga dapat hadir",4],["Ikut mengusulkan jadwal yang sengaja menyulitkan kelompok tertentu",1],["Mendukung perubahan jadwal dengan alasan teknis tanpa membahas dampaknya",2]],"Jadwal yang adil memberi kesempatan hadir yang sama bagi semua warga; mengubah jadwal agar kelompok tertentu tidak hadir mengecualikan warga secara halus, sedangkan mengusulkan jadwal yang sengaja menyulitkan mewujudkan pengecualian itu.","Anti radikalisme"),
// FLAG E-SKD-06: nuansa urutan skor — kebebasan memilih kelompok belajar berhadapan dengan larangan bertanya dan ketertutupan; mohon validator memastikan urutan respons sudah tepat.
t("Temanmu mengajakmu mengikuti kelompok belajar agama yang hanya menerima satu aliran dan melarang anggotanya bertanya. Sikapmu ...",[["Menolak mengikuti kelompok itu tanpa menjelaskan alasan",3],["Menolak mengikuti kelompok itu, menjelaskan belajar yang sehat terbuka pada pertanyaan dan menghormati perbedaan, dan memilih kelompok belajar yang terbuka dan moderat",5],["Mengikuti kelompok itu tetapi tetap bertanya secara diam-diam",2],["Menolak mengikuti kelompok itu dan menjelaskan belajar yang sehat terbuka pada pertanyaan",4],["Mengikuti kelompok itu dan ikut melarang anggota lain bertanya",1]],"Belajar yang terbuka pada pertanyaan dan menghormati perbedaan menjaga pemahaman agama tetap sehat dan moderat; mengikuti sambil bertanya diam-diam tetap mendukung kelompok yang tertutup, sedangkan ikut melarang bertanya memperkuat penutupan itu.","Anti radikalisme"),
t("Rekanmu mengajakmu menertawakan dan menyebarkan video warga dari latar belakang berbeda saat ia kesulitan berbahasa Indonesia. Sikapmu ...",[["Menolak menertawakan dan menyebarkan video itu dan menjelaskan kesulitan berbahasa bukan bahan ejekan",4],["Menonton video itu tanpa membagikannya",2],["Menolak menertawakan dan menyebarkan video itu, menjelaskan kesulitan berbahasa bukan bahan ejekan, dan mengajak membantu warga itu memahami bahasa Indonesia",5],["Ikut menertawakan dan menyebarkan video itu",1],["Mendiamkan ajakan itu tanpa menonton video tersebut",3]],"Menolak ejekan dan mengajak membantu menjaga martabat warga yang sedang belajar bahasa Indonesia; menonton tanpa membagikan tetap memberi penonton bagi video ejekan, sedangkan ikut menyebarkan mempermalukan warga itu di depan banyak orang.","Anti radikalisme"),
t("Seorang warga meminta bantuan sosial hanya dibagikan kepada warga dari kelompoknya saja. Sikapmu ...",[["Membagikan bantuan lebih dahulu kepada kelompok warga itu",2],["Menolak permintaan itu dan menjelaskan bantuan sosial dibagikan berdasarkan syarat dan kebutuhan warga",4],["Membagikan bantuan hanya kepada warga dari kelompok itu seperti diminta",1],["Menolak permintaan itu, menjelaskan bantuan sosial dibagikan berdasarkan syarat dan kebutuhan warga tanpa memandang kelompok, dan memastikan pembagian berjalan adil sesuai data",5],["Mendiamkan permintaan itu dan membagikan bantuan sesuai data tanpa penjelasan",3]],"Pembagian berdasarkan syarat dan kebutuhan menjaga bantuan tepat sasaran bagi semua warga yang berhak; mendahulukan satu kelompok menggeser keadilan pembagian, sedangkan membagikan hanya kepada satu kelompok merampas hak warga lain yang berhak.","Anti radikalisme"),
t("Rekanmu mengajakmu membuat grup chat kerja baru yang mengecualikan rekan dari latar belakang tertentu. Sikapmu ...",[["Ikut membuat grup baru yang mengecualikan rekan dari latar belakang tertentu",1],["Mendiamkan ajakan itu dan tetap memakai grup kerja yang sudah ada",3],["Menolak membuat grup itu dan menjelaskan komunikasi kerja harus melibatkan semua anggota tim",4],["Bergabung dengan grup baru itu agar tidak ketinggalan informasi",2],["Menolak membuat grup itu, menjelaskan komunikasi kerja harus melibatkan semua anggota tim, dan tetap memakai grup kerja yang sudah ada dengan seluruh anggota tim",5]],"Komunikasi kerja yang melibatkan seluruh tim menjaga informasi dan kerja sama tetap utuh; bergabung dengan grup yang mengecualikan mendukung pemisahan tim, sedangkan membuat grup yang mengecualikan mewujudkan pemisahan itu.","Anti radikalisme"),

const FIG_TOPICS=["Figural analogi","Figural ketidaksamaan","Figural serial"];

function figParse(d){const mm=/^([OQTDGP]):([BWA])(90|180|270)?$/.exec(d);return mm?{s:mm[1],f:mm[2],r:mm[3]?+mm[3]:0}:null}
function figLabelGambar(g){
  const parts=g.map(d=>{const p=figParse(d);return p?FIG_SHAPE[p.s]+" "+FIG_FILL[p.f]+(p.r?" diputar "+p.r+" derajat":""):d});
  if(parts.length===2)return parts[0]+" di luar, "+parts[1]+" di dalam";
  return parts.join(", ");
}
function figElem(d,cx,cy,size,inner,outerF){
  const p=figParse(d);if(!p)return "";
  const ink="var(--ink)",gry="var(--mut)",pap="var(--paper)";
  const fill=p.f==="B"?ink:(p.f==="A"?gry:"none");
  /* Kontras kontekstual (Build P17): bentuk dalam ber-isi W di atas bentuk luar ber-isi B
     memakai stroke warna kertas — stroke tinta di atas isi hitam tidak terlihat. */
  const stroke=(p.f==="W"&&outerF==="B")?pap:ink;
  const sw=Math.max(2.2,Math.min(4,4*size/84)).toFixed(1);
  const st="fill:"+fill+";stroke:"+stroke+";stroke-width:"+sw;
  const h=size/2;let el="";
  if(p.s==="O")el='<circle cx="'+cx+'" cy="'+cy+'" r="'+h+'" style="'+st+'"/>';
  else if(p.s==="Q")el='<rect x="'+(cx-h)+'" y="'+(cy-h)+'" width="'+size+'" height="'+size+'" style="'+st+'"/>';
  else if(p.s==="T")el='<polygon points="'+cx+","+(cy-h)+" "+(cx+h)+","+(cy+h)+" "+(cx-h)+","+(cy+h)+'" style="'+st+'"/>';
  else if(p.s==="D")el='<polygon points="'+cx+","+(cy-h)+" "+(cx+h)+","+cy+" "+cx+","+(cy+h)+" "+(cx-h)+","+cy+'" style="'+st+'"/>';
  else if(p.s==="G")el='<line x1="'+(cx-h)+'" y1="'+cy+'" x2="'+(cx+h)+'" y2="'+cy+'" stroke-linecap="round" style="stroke:'+(p.f==="A"?gry:ink)+";stroke-width:"+(sw*2)+'"/>';
  else if(p.s==="P")el='<circle cx="'+cx+'" cy="'+cy+'" r="'+(inner?10:12)+'" style="'+st+'"/>';
  if(p.r)el='<g transform="rotate('+p.r+" "+cx+" "+cy+')">'+el+"</g>";
  return el;
}
function renderFigural(gambar,ukuran){
  const n=gambar.length;let body="";
  if(n===1)body=figElem(gambar[0],50,50,80,false);

  return '<svg viewBox="0 0 100 100" width="'+ukuran+'" height="'+ukuran+'" role="img" aria-label="'+esc(figLabelGambar(gambar))+'" style="display:block;flex:none">'+body+"</svg>";
}

}

/* ---- acak ber-seed untuk Simulasi CAT A-D (susunan berbeda per huruf) ---- */
function seededShuf(a,seedStr){
  let h=2166136261;for(let i=0;i<seedStr.length;i++){h^=seedStr.charCodeAt(i);h=Math.imul(h,16777619)}
  let s=h>>>0;
  const rnd=()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296};
  const arr=a.slice();
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const tmp=arr[i];arr[i]=arr[j];arr[j]=tmp}
  return arr;
}

const ALPH="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // 31 karakter, tanpa I O 0 1 L
function codeChecksumOK(code){
  const c=String(code).toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(c.length!==8)return false;
  let s=0;
  for(let i=0;i<7;i++){const idx=ALPH.indexOf(c[i]);if(idx<0)return false;s+=idx*(i+1)}
  return ALPH.indexOf(c[7])===s%31;
}
