/* ================= LATIHAN (umpan balik langsung) ================= */
function mix(){const g={};Q.forEach(q=>(g[q.tp]=g[q.tp]||[]).push(q));const ks=shuf(Object.keys(g));ks.forEach(k=>g[k]=shuf(g[k]));const out=[];let more=true;while(more){more=false;ks.forEach(k=>{if(g[k].length){out.push(g[k].pop());more=true}})}return out}
let L=null;
function startLatihan(cfg){
  const prem=isPremium();
  let pool;
  if(cfg.mode==="SESI"){
    if(!prem)return premiumPage("Latihan per sesi adalah fitur Premium.");
    const s=getSession(cfg.k,cfg.letter);
    if(!s)return home();
    pool=shuf(s.qs.slice()); // urutan soal di dalam sesi diacak tiap mulai — tidak lagi urutan bank yang sama
  }
  else if(cfg.mode==="ALL")pool=mix();
  else if(cfg.mode==="SUB")pool=shuf(Q.filter(q=>q.k===cfg.k));
  else pool=shuf(byTopic(cfg.topic));
  const quota=!prem&&(cfg.mode==="ALL"||cfg.mode==="SUB");
  if(quota&&freeLeft()<=0)return premiumPage(jatahLatihanNote());
  const n=cfg.mode==="SESI"?pool.length:Math.min(10,pool.length);
  L={list:pool.slice(0,n).map(q=>({q,o:shuf(q.o.slice())})),i:0,sc:{TWK:0,TIU:0,TKP:0},mx:{TWK:0,TIU:0,TKP:0},ans:null,label:cfg.label,quota,topic:cfg.topic||null,earlyEnd:false,scoreKey:cfg.scoreKey||null};
  showQ();scrollTop();
}
function qbarHTML(mid,rightHTML){
  return `<div class="qbar"><div class="r1"><button class="xbtn" id="qx">Keluar</button><span class="mid">${mid}</span><span>${rightHTML||""}</span></div><div class="bar" style="margin:0"><i id="qprog"></i></div></div>`;
}
function bindExit(fn){const b=document.getElementById("qx");b.onclick=()=>{if(b.dataset.arm){fn()}else{b.dataset.arm="1";b.textContent="Yakin keluar?"}}}
function showQ(){
  const it=L.list[L.i],q=it.q;L.ans=null;
  app.innerHTML=`${qbarHTML("Soal "+(L.i+1)+" / "+L.list.length)}
  <div class="qcard"><div class="qmeta"><span class="tag">${q.k}</span><span class="tag">${esc(q.tp)}</span></div>
  <p class="q">${esc(q.q)}</p>
  <div class="opts">${it.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="l">${String.fromCharCode(65+j)}</span><span>${esc(o.t)}</span></button>`).join("")}</div></div>
  <div id="fb"></div>`;
  document.getElementById("qprog").style.width=((L.i+1)/L.list.length*100)+"%";
  bindExit(()=>{L=null;home()});
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickLat(+b.dataset.j));
  scrollTop();
}
function pickLat(j){
  if(L.ans!==null)return;L.ans=j;
  const it=L.list[L.i],q=it.q,best=Math.max(...it.o.map(o=>o.p));
  L.sc[q.k]+=it.o[j].p;L.mx[q.k]+=best;
  if(L.quota)useFree(1);
  app.querySelectorAll(".opt").forEach((b,x)=>{b.disabled=true;if(it.o[x].p===best)b.classList.add("ok");else if(x===j)b.classList.add(it.o[x].p>0?"part":"no")});
  const tr=TRICKS.find(x=>x.tp===q.tp);
  const trOpen=isPremium()||q.tp===FREE_TRICK_TOPIC;
  document.getElementById("fb").innerHTML=`<div class="fbcard"><h3>Pembahasan \u2014 poin kamu: ${it.o[j].p} dari ${best}</h3><p style="margin:0">${esc(q.e)}</p>
  ${tr?`<button class="btn" id="trk" style="margin-bottom:0"><span class="grow"><b>Trik Cepat topik ini:</b> ${esc(tr.t)}</span><span class="arr">${trOpen?"\u203A":"\uD83D\uDD12"}</span></button><div id="trkbox"></div>`:""}</div>
  <button class="btn pri" id="nx">${L.i+1<L.list.length?"Soal berikutnya":"Lihat hasil"}</button>`;
  document.getElementById("nx").onclick=()=>{
    if(L.i+1<L.list.length){
      if(L.quota&&freeLeft()<=0){L.earlyEnd=true;return finLat()}
      L.i++;showQ();
    }else finLat();
  };
  if(tr){document.getElementById("trk").onclick=()=>{const box=document.getElementById("trkbox");if(!trOpen){box.innerHTML=`<div class="msg info">Kartu trik ini bagian dari Premium. Contoh gratis: ${FREE_TRICK_TOPIC}. <button class="lnk" id="trkgo" style="padding:4px 2px;min-height:36px">Buka Premium ${HARGA}</button></div>`;document.getElementById("trkgo").onclick=()=>premiumPage("Semua kartu Trik Cepat adalah fitur Premium.");return}box.innerHTML=trickCardHTML(tr)}}
  document.getElementById("nx").scrollIntoView({block:"nearest"});
}
function ringSvg(pct){return `<svg viewBox="0 0 120 120" width="150" height="150" role="img" aria-label="Skor ${pct} persen"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--bd)" stroke-width="3"/><circle cx="60" cy="60" r="52" fill="none" stroke="var(--teal)" stroke-width="10" stroke-dasharray="${(pct*3.267).toFixed(1)} 400" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)" font-family="Space Grotesk,sans-serif">${pct}%</text></svg>`}
function finLat(){
  const ks=["TWK","TIU","TKP"].filter(k=>L.mx[k]>0),tot=ks.reduce((a,k)=>a+L.sc[k],0),tm=ks.reduce((a,k)=>a+L.mx[k],0);
  const pct=tm?Math.round(tot/tm*100):0;addHist(L.label,pct);
  if(L.scoreKey)saveLastScore(L.scoreKey,pct);
  const msg=pct>=80?"Hasil sangat baik. Pertahankan ritme latihanmu.":pct>=60?"Cukup baik. Pelajari ulang bagian yang masih salah lewat pembahasannya.":"Masih perlu banyak latihan. Ulangi materi dasarnya dulu, lalu coba lagi.";
  app.innerHTML=`<h1>Hasil latihan</h1>
  ${L.earlyEnd?`<div class="msg info"><b>Jatah latihan gratis hari ini sudah habis</b>, jadi sesi berhenti di sini. Jatah 10 soal acak per hari ini terisi penuh lagi <b>besok</b> — besok kamu bisa latihan gratis lagi. Skor di bawah adalah hasil soal yang sempat kamu kerjakan. Premium membuka latihan tanpa batas, jadi tidak perlu menunggu besok.</div>`:""}
  <div class="card"><div class="ring">${ringSvg(pct)}</div>
  <p style="text-align:center;margin:0 0 4px"><strong>${tot} dari ${tm} poin</strong></p><p class="mut" style="text-align:center">${msg}</p>
  ${ks.map(k=>`<div class="row2"><span>${k}</span><span>${L.sc[k]} / ${L.mx[k]}</span></div><div class="bar" style="margin:0"><i style="width:${L.mx[k]?L.sc[k]/L.mx[k]*100:0}%"></i></div>`).join("")}</div>
  <div>${ks.map(k=>{const need=Math.ceil(PG[k]/MAXS[k]*L.mx[k]);const lewat=L.sc[k]>=need;return `<p style="margin:8px 0"><b>${k} — ${esc(NAMA[k])}:</b> skor kamu <b>${L.sc[k]} dari ${L.mx[k]} poin</b>. Nilai lulus resmi (passing grade) subtes ${k} adalah ${PG[k]} dari ${MAXS[k]} poin di ujian asli. Dihitung sebanding dengan jumlah soal latihan ini, patokannya kira-kira ${need} poin — jadi untuk subtes ini kamu <b>${lewat?"sudah melewati patokan":"belum melewati patokan"}</b>.</p>`}).join("")}</div>
  <div class="disc"><b>Yang penting dipahami:</b> di SKD asli, kamu dinyatakan lolos hanya bila lolos di <b>ketiga subtes sekaligus</b> — TWK, TIU, dan TKP semuanya harus mencapai nilai lulusnya masing-masing. Satu subtes saja di bawah nilai lulus sudah membuat tidak lolos, walaupun total nilaimu besar. Latihan ini jumlah soalnya lebih sedikit dari ujian asli, jadi patokan di atas dihitung sebanding dan sifatnya perkiraan untuk belajar — bukan penilaian resmi, dan skor latihan ini bukan prediksi nilai SKD sebenarnya.</div>
  <div class="disc">Aplikasi latihan mandiri \u2014 bukan aplikasi resmi BKN dan tidak menjamin kelulusan.</div>
  ${!isPremium()?`<button class="btn yel" id="goprem"><span class="grow" style="text-align:center">Latihan tanpa batas \u2014 Premium ${HARGA}</span></button>`:""}
  <button class="btn pri" id="ag">Kembali ke beranda</button>`;
  document.getElementById("ag").onclick=home;
  const gp=document.getElementById("goprem");if(gp)gp.onclick=()=>premiumPage();
  L=null;scrollTop();
}
/* ================= SIMULASI (CAT) ================= */
let C=null,tmr=null;
const fmtT=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
/* ---- progres simulasi disimpan di perangkat: reload / halaman tertutup tidak lagi
   menghapus jawaban. Disimpan: urutan soal + urutan opsi (sebagai indeks ke bank),
   jawaban, tanda ragu, posisi soal, dan batas waktu absolut. ---- */
function saveExam(){
  if(!C)return;
  try{lsSet("skd-exam-v1",{kind:C.kind,label:C.label,scoreKey:C.scoreKey,catLetter:C.catLetter,end:C.end,cur:C.cur,ans:C.ans,flag:C.flag,
    qs:C.qs.map(it=>({qi:Q.indexOf(it.q),ord:it.o.map(o=>it.q.o.indexOf(o))}))})}catch(e){}
}
function clearExamSave(){try{localStorage.removeItem("skd-exam-v1")}catch(e){}}
function restoreExam(){
  const d=lsGet("skd-exam-v1",null);
  if(!d||!Array.isArray(d.qs)||!d.qs.length)return false;
  try{
    const qs=d.qs.map(x=>{const q=Q[x.qi];if(!q||!Array.isArray(x.ord))return null;return{q,o:x.ord.map(i=>q.o[i])}});
    if(qs.some(x=>!x||x.o.some(o=>!o)))return false;
    C={qs,ans:d.ans||{},flag:d.flag||{},cur:Math.min(Math.max(d.cur||0,0),qs.length-1),end:d.end,kind:d.kind,label:d.label,sure:false,scoreKey:d.scoreKey||null,catLetter:d.catLetter||null};
    clearInterval(tmr);tmr=setInterval(tickExam,500);
    if(Date.now()>=C.end){examFin();return true} // waktu habis saat halaman tertutup — nilai dari jawaban tersimpan
    examShow();scrollTop();return true;
  }catch(e){return false}
}
function startExam(kind,letter){
  const prem=isPremium();
  if(kind==="full"&&!prem)return premiumPage("Simulasi CAT A\u2013D (110 soal / 100 menit) adalah fitur Premium.");
  if(kind==="mini"&&!prem&&freeState().miniUsed)return premiumPage(jatahMiniNote());
  const pick=(k,n)=>shuf(Q.filter(q=>q.k===k)).slice(0,n);
  const pickSeeded=(k,n,seed)=>seededShuf(Q.filter(q=>q.k===k),seed+"-"+k).slice(0,n);
  let qs,min,label,scoreKey=null,catLetter=null;
  if(kind==="full"){catLetter=(letter&&CAT_LETTERS.includes(letter))?letter:"A";scoreKey="CAT-"+catLetter;qs=[...pickSeeded("TWK",30,"CAT-"+catLetter),...pickSeeded("TIU",35,"CAT-"+catLetter),...pickSeeded("TKP",45,"CAT-"+catLetter)];min=100;label="Simulasi CAT "+catLetter}
  else{qs=[...pick("TWK",6),...pick("TIU",8),...pick("TKP",10)];min=22;label="Simulasi Mini"}
  // Jatah Mini gratis TIDAK lagi hangus saat simulasi dimulai — baru tercatat terpakai
  // bila simulasinya benar-benar diselesaikan (examFin). Keluar di tengah jalan = jatah utuh.
  C={qs:qs.map(q=>({q,o:shuf(q.o.slice())})),ans:{},flag:{},cur:0,end:Date.now()+min*60000,kind,label,sure:false,scoreKey,catLetter};
  clearInterval(tmr);tmr=setInterval(tickExam,500);examShow();scrollTop();
}
function tickExam(){
  if(!C)return;
  const r=Math.max(0,Math.round((C.end-Date.now())/1000)),e=document.getElementById("tm");
  if(e){e.textContent=fmtT(r);e.classList.toggle("low",r<600)}
  if(r<=0)examFin();
}
function examShow(){
  const it=C.qs[C.cur],q=it.q;
  app.innerHTML=`${qbarHTML("Soal "+(C.cur+1)+" / "+C.qs.length,`<span class="tm" id="tm">--:--</span>`)}
  <div class="qcard"><div class="qmeta"><span class="tag">${q.k}</span><span class="tag">${esc(q.tp)}</span><span class="mut small">${esc(C.label)}${C.kind==="full"?" \u00B7 Simulasi v1 tanpa Figural":""}</span></div>
  <p class="q">${esc(q.q)}</p>
  <div class="opts">${it.o.map((o,j)=>`<button class="opt${C.ans[C.cur]===j?" sel":""}" data-j="${j}"><span class="l">${String.fromCharCode(65+j)}</span><span>${esc(o.t)}</span></button>`).join("")}</div></div>
  <div class="rowbtns"><button class="btn" id="pv">\u2039 Sebelumnya</button><button class="btn" id="fl">${C.flag[C.cur]?"Batal ragu":"Ragu-ragu"}</button><button class="btn" id="nx2">Berikutnya \u203A</button></div>
  <h2>Navigasi soal</h2><div class="nav">${C.qs.map((x,n)=>`<button class="nb${n===C.cur?" cur":""}${C.ans[n]!==undefined?" done":""}${C.flag[n]?" flg":""}" data-n="${n}" aria-label="Soal ${n+1}">${n+1}</button>`).join("")}</div>
  <p class="mut small">Blok teal = sudah dijawab \u00B7 garis kuning di dalam = ragu-ragu \u00B7 Jawaban kosong dan salah sama-sama 0, jadi jangan kosongkan jawaban (khusus TKP, tiap opsi bernilai 1\u20135).</p>
  <button class="btn pri" id="fin">${C.sure?"Yakin selesai? Ketuk sekali lagi":"Selesai ujian"}</button>`;
  document.getElementById("qprog").style.width=((C.cur+1)/C.qs.length*100)+"%";
  bindExit(()=>{clearInterval(tmr);clearExamSave();C=null;home()});
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{C.ans[C.cur]=+b.dataset.j;C.sure=false;examShow()});
  app.querySelectorAll(".nb").forEach(b=>b.onclick=()=>{C.cur=+b.dataset.n;C.sure=false;examShow();scrollTop()});
  document.getElementById("pv").onclick=()=>{if(C.cur>0){C.cur--;C.sure=false;examShow();scrollTop()}};
  document.getElementById("nx2").onclick=()=>{if(C.cur<C.qs.length-1){C.cur++;C.sure=false;examShow();scrollTop()}};
  document.getElementById("fl").onclick=()=>{C.flag[C.cur]=!C.flag[C.cur];C.sure=false;examShow()};
  document.getElementById("fin").onclick=()=>{if(C.sure)examFin();else{C.sure=true;examShow()}};
  saveExam();
  tickExam();
}
function examFin(){
  clearInterval(tmr);
  clearExamSave();
  if(C&&C.kind==="mini"&&!isPremium())markMiniUsed(); // jatah Mini gratis tercatat hanya saat simulasi selesai
  const S={TWK:0,TIU:0,TKP:0};
  C.qs.forEach((it,n)=>{if(C.ans[n]!==undefined)S[it.q.k]+=it.o[C.ans[n]].p});
  const ks=["TWK","TIU","TKP"],tot=ks.reduce((a,k)=>a+S[k],0);
  const full=C.kind==="full";
  const mxs=full?MAXS:{TWK:30,TIU:40,TKP:50},mtot=ks.reduce((a,k)=>a+mxs[k],0);
  const pct=Math.round(tot/mtot*100);addHist(C.label,pct);
  if(C.scoreKey)saveLastScore(C.scoreKey,pct);
  const na=C.qs.filter((x,n)=>C.ans[n]===undefined).length;
  const allPass=full&&ks.every(k=>S[k]>=PG[k]);
  app.innerHTML=`<h1>Hasil ${esc(C.label)}</h1>
  ${full?`<div class="card"><p class="mut" style="text-align:center;margin:0">Status kelulusan simulasi (ketiga subtes harus lolos sekaligus)</p><p class="scorebig pass ${allPass?"y":"n"}">${allPass?"LOLOS":"BELUM LOLOS"}</p>
  ${ks.map(k=>{const p=S[k]>=PG[k];return `<div class="row2"><span><b>${k}</b> \u2014 passing grade ${PG[k]}</span><span><b>${S[k]}</b> / ${MAXS[k]} &nbsp;<span class="pass ${p?"y":"n"}">${p?"Lolos":"Belum"}</span></span></div><div class="bar" style="margin:0"><i style="width:${S[k]/MAXS[k]*100}%"></i></div>`}).join("")}
  <p class="mut" style="margin:10px 0 0;text-align:center">Total ${tot} poin \u00B7 ${na} soal tidak dijawab \u00B7 Simulasi v1 tanpa Figural</p><p style="margin:10px 0 0">Cara membacanya: "passing grade" artinya nilai lulus minimal di tiap subtes — TWK (Tes Wawasan Kebangsaan) minimal 65, TIU (Tes Intelegensia Umum) minimal 80, TKP (Tes Karakteristik Pribadi) minimal 166. Kamu dinyatakan lolos hanya bila <b>ketiga subtes lolos sekaligus</b>. Satu subtes saja di bawah nilai minimalnya membuat hasil akhir <b>belum lolos</b>, walaupun total nilaimu tinggi.</p></div>`
  :`<div class="card"><div class="ring">${ringSvg(pct)}</div><p style="text-align:center;margin:0 0 4px"><strong>${tot} dari ${mtot} poin</strong></p><p class="mut" style="text-align:center">${na} soal tidak dijawab.</p>
  ${ks.map(k=>`<div class="row2"><span>${k}</span><span>${S[k]} / ${mxs[k]}</span></div><div class="bar" style="margin:0"><i style="width:${S[k]/mxs[k]*100}%"></i></div>`).join("")}
  ${ks.map(k=>{const need=Math.ceil(PG[k]/MAXS[k]*mxs[k]);const lewat=S[k]>=need;return `<p style="margin:8px 0"><b>${k} — ${esc(NAMA[k])}:</b> skor kamu <b>${S[k]} dari ${mxs[k]} poin</b>. Passing grade (nilai lulus) resminya ${PG[k]} dari ${MAXS[k]} poin. Dihitung sebanding dengan jumlah soal mini ini, patokannya kira-kira ${need} poin — kamu <b>${lewat?"sudah melewati patokan":"belum melewati patokan"}</b>.</p>`}).join("")}
  <p class="mut" style="margin:8px 0 0">Ini simulasi mini: jumlah soalnya hanya 24, jauh lebih sedikit dari ujian asli (110 soal), jadi nilai lulus resmi tidak diterapkan mentah-mentah di sini — patokan di atas dihitung sebanding untuk bahan belajar. Di ujian asli, kamu lolos hanya bila lolos di <b>ketiga subtes sekaligus</b>: satu subtes saja di bawah nilai lulus sudah membuat tidak lolos, walaupun total nilaimu tinggi. Penilaian nilai lulus yang sebenarnya ada di Simulasi Penuh 110 soal.</p></div>`}
  <div class="disc">Hasil simulasi ini <b>bukan prediksi nilai SKD sebenarnya</b>. Aplikasi latihan mandiri \u2014 bukan aplikasi resmi BKN dan tidak menjamin kelulusan.</div>
  <h2>Pembahasan</h2>
  ${C.qs.map((it,n)=>{const q=it.q,a=C.ans[n],best=Math.max(...it.o.map(o=>o.p)),bi=it.o.findIndex(o=>o.p===best);return `<details class="card"><summary><b>${n+1}. [${q.k}]</b> ${esc(q.q)}</summary><p style="margin-top:8px">Jawabanmu: ${a===undefined?"<i>tidak dijawab</i>":esc(it.o[a].t)+" ("+it.o[a].p+" poin)"}</p><p>Jawaban terbaik: ${esc(it.o[bi].t)} (${best} poin)</p><p class="mut">${esc(q.e)}</p></details>`}).join("")}
  <button class="btn pri" id="ag">Kembali ke beranda</button>`;
  document.getElementById("ag").onclick=home;
  C=null;scrollTop();
}
/* ================= MULAI ================= */
if(typeof Q==="undefined"||!Q.length){app.innerHTML="<p style=\"padding:20px\">Bank soal gagal dimuat.</p>"}
else if(!restoreExam())home();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});}</script>
