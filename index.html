t("Laptop kantor yang kamu bawa tertinggal di ruang tunggu kendaraan dinas dan berisi berkas kerja yang belum dikunci. Sikapmu ...",[["Segera kembali mengambilnya, melaporkan kejadian itu ke unit TI dan atasan, lalu mengganti kata sandi akun kerja",5],["Kembali mengambilnya saat ada waktu luang dan tidak memberi tahu siapa pun",3],["Segera kembali mengambilnya dan memeriksa apakah ada berkas yang berubah",4],["Membiarkannya dan berharap tidak ada yang membukanya",1],["Meminta orang lain mengambilkannya tanpa menjelaskan isinya penting",2]],"Mengambil kembali perangkat, melapor, dan mengganti kata sandi melindungi data kerja dari penyalahgunaan; hanya mengambil tanpa melapor meninggalkan risiko yang tidak diketahui, sedangkan membiarkan perangkat terbuka memberi peluang data disalahgunakan.","TIK dan literasi digital"),
t("Di baki printer bersama tertinggal lembaran berisi nomor identitas warga yang dicetak rekan lain. Sikapmu ...",[["Membiarkan lembaran itu di baki printer karena bukan dokumenmu",3],["Mengamankan lembaran itu, menyerahkannya kepada rekan yang mencetak, dan mengingatkan agar dokumen berisi data warga segera diambil dari printer",5],["Membaca isi lembaran itu lalu menaruhnya kembali di baki printer",2],["Mengamankan lembaran itu dan menyerahkannya kepada rekan yang mencetak",4],["Memotret lembaran itu dan membagikannya ke grup chat",1]],"Mengamankan dokumen dan menyerahkannya langsung kepada pemiliknya mencegah data warga dilihat orang lain; membiarkan di tempat terbuka membiarkan risiko data tersebar, sedangkan memotret dan membagikan menyebarkan data pribadi warga.","TIK dan literasi digital"),
t("Kamu melihat kata sandi akun kerja rekan ditempel di kertas kecil pada layar monitornya. Sikapmu ...",[["Mengingatkan rekan itu secara pribadi agar menghapus tempelan itu dan mengganti kata sandinya",4],["Memberi tahu rekan lain tentang tempelan itu sebagai bahan candaan",2],["Mengingatkan rekan itu secara pribadi agar menghapus tempelan itu, mengganti kata sandinya, dan memakai pengelola kata sandi atau cara simpan yang aman",5],["Memakai kata sandi yang terlihat itu untuk membuka akun rekan tersebut",1],["Mendiamkannya karena itu urusan rekan tersebut",3]],"Mengingatkan secara pribadi dan menyarankan cara simpan yang aman memperbaiki kebiasaan berisiko tanpa mempermalukan rekan; mendiamkan membiarkan akun mudah disalahgunakan, sedangkan memakai kata sandi orang lain adalah penyalahgunaan akses.","TIK dan literasi digital"),
t("Akun media sosial yang memakai nama dan foto atasanmu mengirim pesan pribadi memintamu mengirim uang darurat. Sikapmu ...",[["Membalas pesan itu untuk menanyakan rincian transfer",2],["Tidak mengirim uang dan memeriksa kebenaran lewat jalur resmi",4],["Langsung mengirim uang karena takut atasan marah",1],["Tidak mengirim uang, memeriksa kebenaran lewat jalur resmi atau kontak atasan yang sudah dikenal, dan melaporkan akun penipu itu",5],["Mengabaikan pesan itu tanpa memeriksa atau melaporkan",3]],"Memeriksa lewat jalur yang sudah dikenal dan melaporkan akun penipu mencegah kerugian bagi diri sendiri dan pegawai lain; mengabaikan membiarkan penipuan berlanjut, sedangkan mengirim uang tanpa memeriksa membuat penipuan berhasil.","TIK dan literasi digital"),
t("Tengah malam kamu menerima pemberitahuan masuk ke akun surel kantor dari perangkat asing yang tidak kamu kenal. Sikapmu ...",[["Mengabaikannya dan tetap memakai kata sandi yang sama",1],["Menunggu sampai pagi untuk melihat apakah ada pemberitahuan lagi",3],["Segera mengganti kata sandi dan mengakhiri sesi perangkat asing",4],["Menghapus pemberitahuan itu dan menganggapnya kesalahan sistem",2],["Segera mengganti kata sandi, mengakhiri sesi perangkat asing, mengaktifkan verifikasi tambahan, dan melaporkan kejadian itu ke unit TI",5]],"Mengganti kata sandi, mengakhiri sesi asing, dan melapor menghentikan akses yang tidak sah dan melindungi akun lain; menunggu atau menghapus pemberitahuan memberi waktu bagi penyusup, sedangkan mengabaikan membiarkan akun tetap terbuka.","TIK dan literasi digital"),
t("Surel berisi data warga terkirim ke alamat yang salah karena salah ketik satu karakter. Sikapmu ...",[["Segera memberi tahu atasan dan unit TI, meminta penerima menghapus surel itu, dan mencatat kejadian itu sesuai prosedur insiden data",5],["Mengirim surel susulan ke alamat yang benar tanpa membahas kesalahan kirim",3],["Segera memberi tahu atasan dan meminta penerima menghapus surel itu",4],["Menyembunyikan kesalahan itu agar tidak ditegur",1],["Berharap penerima tidak membuka surel yang salah alamat itu",2]],"Melapor dan meminta penghapusan secara resmi membatasi penyebaran data warga yang salah kirim; hanya mengirim ulang membiarkan data tetap berada di pihak yang salah, sedangkan menyembunyikan menghilangkan peluang perbaikan.","TIK dan literasi digital"),
t("Timmu mulai membahas data sensitif warga di aplikasi chat pribadi karena dianggap lebih cepat daripada saluran resmi kantor. Sikapmu ...",[["Tetap mengikuti pembahasan di aplikasi pribadi agar tidak ketinggalan informasi",3],["Mengusulkan kembali memakai saluran resmi, menjelaskan risiko data tersebar di aplikasi pribadi, dan memindahkan pembahasan yang sedang berjalan ke saluran resmi",5],["Ikut membagikan data sensitif di aplikasi pribadi karena semua anggota tim melakukannya",2],["Mengusulkan kembali memakai saluran resmi dan menjelaskan risikonya",4],["Meneruskan isi pembahasan dari aplikasi pribadi ke grup lain di luar tim",1]],"Kembali ke saluran resmi melindungi data warga dan menjaga jejak pembahasan kerja; mengikuti kebiasaan yang berisiko karena alasan kecepatan mengorbankan keamanan, sedangkan meneruskan ke luar tim memperluas penyebaran data.","TIK dan literasi digital"),
t("Seorang warga memintamu mengirim hasil layanannya ke alamat surel yang belum pernah ia pakai dan belum terverifikasi. Sikapmu ...",[["Memverifikasi kepemilikan alamat surel itu sebelum mengirim hasil",4],["Mengirim hasil ke alamat itu dan ke alamat lama sekaligus agar pasti sampai",2],["Memverifikasi kepemilikan alamat surel itu lewat prosedur yang berlaku, menjelaskan risikonya, dan mengirim hasil hanya setelah verifikasi selesai",5],["Mengirim hasil tanpa memeriksa alamat itu milik siapa",1],["Mengirim hasil ke alamat itu karena warga yang memintanya sendiri",3]],"Verifikasi melindungi hasil layanan agar tidak jatuh ke pihak yang salah; mengirim atas dasar permintaan saja mengabaikan risiko salah kirim, sedangkan mengirim tanpa memeriksa sama sekali membuka peluang penyalahgunaan data warga.","TIK dan literasi digital"),
t("Nomor tak dikenal mengirim tautan pendek dan mengaku sebagai kurir paket kantor yang meminta kamu membuka tautan itu. Sikapmu ...",[["Membuka tautan itu sekadar melihat isinya",2],["Tidak membuka tautan itu dan memeriksa status paket lewat jalur resmi",4],["Membuka tautan itu dan mengikuti perintah yang muncul di dalamnya",1],["Tidak membuka tautan itu, memeriksa status paket lewat jalur resmi, dan melaporkan pesan mencurigakan itu ke unit TI",5],["Mengabaikan pesan itu tanpa memeriksa status paket",3]],"Memeriksa lewat jalur resmi dan melaporkan pesan mencurigakan mencegah jebakan tautan berbahaya; membuka tautan sekadar melihat isi tetap berisiko, sedangkan mengikuti perintah di dalamnya dapat membahayakan perangkat dan data kerja.","TIK dan literasi digital"),
t("Rekanmu merekam rapat daring lalu mengunggah potongannya ke status media sosial tanpa izin peserta rapat. Sikapmu ...",[["Ikut membagikan unggahan itu ke akunmu sendiri",1],["Mendiamkannya karena potongan yang diunggah terlihat singkat",3],["Meminta rekan itu menghapus unggahan itu dan menjelaskan aturan izin rapat",4],["Menonton dan menyukai unggahan itu karena isinya menarik",2],["Meminta rekan itu menghapus unggahan itu, menjelaskan aturan izin dan kerahasiaan rapat, dan melaporkan kejadian itu bila unggahan tidak dihapus",5]],"Meminta penghapusan dan menjelaskan aturan izin melindungi peserta rapat dan isi pembahasan kerja; mendiamkan membiarkan rekaman tanpa izin beredar, sedangkan ikut membagikan memperluas pelanggaran izin.","TIK dan literasi digital"),
// FLAG E-SKD-06: nuansa urutan skor — hak warga atas penghapusan data berhadapan dengan kewajiban penyimpanan arsip; mohon validator memastikan urutan respons sudah tepat.
t("Seorang warga meminta data pribadinya dihapus dari arsip digital lama yang sudah tidak dipakai untuk layanan. Sikapmu ...",[["Menerima permintaan itu, memeriksa ketentuan penyimpanan arsip, meneruskannya ke unit yang berwenang, dan memberi tahu warga tentang tindak lanjut dan waktunya",5],["Meminta warga datang lagi lain waktu tanpa mencatat permintaannya",3],["Menerima permintaan itu dan meneruskannya ke unit yang berwenang",4],["Menghapus arsip itu sendiri tanpa memeriksa ketentuan penyimpanan",1],["Menolak permintaan itu tanpa memeriksa ketentuannya",2]],"Memeriksa ketentuan dan meneruskan ke unit yang berwenang menghormati hak warga sekaligus menjaga kewajiban arsip; menolak tanpa memeriksa mengabaikan hak warga, sedangkan menghapus sendiri dapat melanggar ketentuan penyimpanan arsip.","TIK dan literasi digital"),
t("Berkas presentasi berisi data internal kantor terunggah ke situs berbagi berkas publik oleh rekanmu. Sikapmu ...",[["Berharap tidak ada orang luar yang menemukan berkas itu",3],["Segera memberi tahu rekan itu dan unit TI, meminta berkas diturunkan, dan mengusulkan pemeriksaan tentang data yang sempat terlihat publik",5],["Mengunduh berkas itu untuk disimpan sebagai arsip pribadi",2],["Segera memberi tahu rekan itu dan meminta berkas diturunkan",4],["Membagikan tautan berkas itu karena isinya menarik",1]],"Menurunkan berkas dan memeriksa dampaknya membatasi penyebaran data internal; berharap tidak ditemukan membiarkan data tetap terbuka, sedangkan membagikan tautan memperluas penyebaran data internal.","TIK dan literasi digital"),
t("Seseorang menelepon dan mengaku teknisi, lalu meminta akses jarak jauh ke komputer kantormu dengan alasan perbaikan mendesak. Sikapmu ...",[["Menolak memberi akses dan memverifikasi identitas penelepon lewat unit TI",4],["Memberi akses sambil mengawasi layar komputer",2],["Menolak memberi akses, memverifikasi identitas penelepon lewat unit TI melalui nomor resmi, dan melaporkan panggilan itu bila tidak dapat diverifikasi",5],["Langsung memberi akses jarak jauh karena mengaku teknisi",1],["Meminta penelepon menelepon kembali lain waktu tanpa verifikasi",3]],"Verifikasi lewat nomor resmi mencegah penyusupan yang berkedok teknisi; memberi akses sambil mengawasi tetap memberi peluang perangkat dikendalikan pihak asing, sedangkan memberi akses tanpa verifikasi membuka seluruh isi komputer kantor.","TIK dan literasi digital"),
t("Kata sandi akun kerjamu sudah dipakai bertahun-tahun dan tidak pernah diganti. Sikapmu ...",[["Menggantinya dengan kata sandi yang mudah ditebak agar mudah diingat",2],["Segera menggantinya dengan kata sandi yang kuat dan unik",4],["Memakai kata sandi yang sama untuk akun pribadi dan akun kerja agar praktis",1],["Segera menggantinya dengan kata sandi yang kuat dan unik, mengaktifkan verifikasi tambahan, dan mencatat jadwal penggantian berkala sesuai aturan kantor",5],["Tetap memakainya karena selama ini tidak ada masalah",3]],"Kata sandi yang kuat dan unik serta verifikasi tambahan mengurangi risiko akun disalahgunakan setelah dipakai lama; memakai kata sandi yang mudah ditebak atau sama untuk semua akun mempermudah penyalahgunaan bila satu akun jatuh ke pihak lain.","TIK dan literasi digital"),
t("Surel yang mengaku dari atasanmu meminta dokumen segera, tetapi alamat pengirim memakai domain yang berbeda dari domain kantor. Sikapmu ...",[["Mengirim dokumen beserta data pendukung lain yang diminta",1],["Menunda pengiriman sambil menunggu surel susulan",3],["Tidak mengirim dokumen dan memeriksa permintaan itu lewat kontak atasan yang sudah dikenal",4],["Mengirim dokumen karena isi surel terdengar mendesak",2],["Tidak mengirim dokumen, memeriksa permintaan itu lewat kontak atasan yang sudah dikenal, dan melaporkan surel palsu itu ke unit TI",5]],"Memeriksa lewat kontak yang sudah dikenal membedakan perintah asli dari surel palsu; mengirim karena terkesan mendesak mengabaikan tanda domain yang berbeda, sedangkan mengirim data tambahan memperbesar kerugian bila surel itu palsu.","TIK dan literasi digital"),
t("Saat mengakses sistem kantor muncul peringatan sertifikat keamanan tidak valid. Sikapmu ...",[["Tidak melanjutkan akses, menutup halaman itu, melaporkan peringatan itu ke unit TI, dan mengakses kembali hanya setelah dinyatakan aman",5],["Menunda pekerjaan dan mencoba lagi nanti tanpa melapor",3],["Tidak melanjutkan akses dan melaporkan peringatan itu ke unit TI",4],["Melanjutkan akses dan memasukkan kata sandi serta data sensitif",1],["Melanjutkan akses dengan mengabaikan peringatan karena pekerjaan mendesak",2]],"Berhenti dan melapor mencegah data kerja dikirim lewat sambungan yang tidak dapat dipastikan aman; mengabaikan peringatan karena mendesak mempertaruhkan data, sedangkan memasukkan kata sandi pada sambungan meragukan dapat menyerahkan akses akun.","TIK dan literasi digital"),
t("Seorang warga melapor bahwa ia ditelepon pihak yang mengaku petugas dan meminta kode verifikasi layanannya. Sikapmu ...",[["Menyuruh warga berhati-hati lain waktu tanpa membantu pengamanan akun",3],["Menjelaskan bahwa petugas tidak pernah meminta kode verifikasi, membantu warga mengamankan akunnya, dan mencatat laporan itu untuk diteruskan ke unit terkait",5],["Meminta warga menceritakan kode yang sudah ia berikan kepada penelepon itu",2],["Menjelaskan bahwa petugas tidak pernah meminta kode verifikasi dan membantu warga mengamankan akunnya",4],["Mengatakan warga salah sendiri karena mudah percaya",1]],"Penjelasan yang benar dan bantuan pengamanan akun melindungi warga dari kerugian lanjutan; meminta warga mengulang kode yang sudah diberikan menambah risiko, sedangkan menyalahkan warga tidak memperbaiki keadaan dan merusak kepercayaan pada layanan.","TIK dan literasi digital"),
t("Foto lama di media sosial pribadimu menampilkan lencana identitas kantor dengan jelas beserta nama dan nomor pegawaimu. Sikapmu ...",[["Menghapus atau menyunting foto itu agar identitas tidak terlihat",4],["Membiarkannya dan menganggap nomor pegawai bukan informasi penting",2],["Menghapus atau menyunting foto itu agar identitas tidak terlihat, memeriksa unggahan lain yang serupa, dan berhati-hati pada unggahan berikutnya",5],["Mengunggah foto serupa yang lebih jelas agar terlihat meyakinkan",1],["Membiarkannya karena foto itu sudah lama dan jarang dilihat orang",3]],"Menyunting dan memeriksa unggahan serupa mencegah identitas pegawai dipakai untuk penipuan; membiarkan dengan alasan foto lama mengabaikan jejak digital yang tetap dapat ditemukan, sedangkan mengunggah yang lebih jelas memperbesar risiko penyalahgunaan identitas.","TIK dan literasi digital"),
t("Foto ruang kerja yang diunggah rekanmu menampilkan papan di latar belakang berisi informasi internal kantor. Sikapmu ...",[["Menyukai foto itu tanpa memberi tahu rekan tersebut",2],["Memberi tahu rekan itu agar menghapus atau menyunting foto itu",4],["Ikut membagikan foto itu ke akunmu sendiri",1],["Memberi tahu rekan itu agar menghapus atau menyunting foto itu, menjelaskan informasi yang terlihat, dan mengusulkan pemeriksaan unggahan kegiatan berikutnya sebelum dibagikan",5],["Mendiamkannya karena informasi di papan terlihat kecil dan buram",3]],"Memberi tahu dan menyarankan penyuntingan mencegah informasi internal tersebar lewat latar belakang foto; mendiamkan dengan alasan gambar buram mengabaikan kemungkinan gambar diperjelas, sedangkan ikut membagikan memperluas penyebaran informasi internal.","TIK dan literasi digital"),
t("Warga bertanya tentang survei daring berhadiah yang mengatasnamakan instansimu dan meminta nomor identitas serta nomor rekening. Sikapmu ...",[["Menyarankan warga mengisi survei itu agar mendapat hadiah",1],["Menyarankan warga berhati-hati tanpa menjelaskan survei itu palsu",3],["Menjelaskan bahwa survei itu bukan dari instansi dan meminta warga tidak mengisi data",4],["Menyarankan warga mengisi sebagian data saja untuk mencoba",2],["Menjelaskan bahwa survei itu bukan dari instansi, meminta warga tidak mengisi data, dan meneruskan informasi penipuan itu ke unit terkait untuk diumumkan",5]],"Penjelasan tegas dan penerusan laporan melindungi warga dari pencurian data; menyarankan mengisi sebagian data tetap membahayakan warga, sedangkan menyarankan mengisi demi hadiah membantu penipuan berhasil.","TIK dan literasi digital"),
t("Rekanmu menyarankan mematikan perangkat lunak antivirus agar komputer kantor berjalan lebih cepat. Sikapmu ...",[["Menolak saran itu, menjelaskan fungsi perlindungan antivirus, dan melaporkan komputer yang lambat ke unit TI untuk diperiksa penyebabnya",5],["Membiarkan rekan itu mematikan antivirus di komputernya sendiri tanpa menanggapi",3],["Menolak saran itu dan menjelaskan fungsi perlindungan antivirus",4],["Mematikan antivirus dan mengajak rekan lain melakukan hal yang sama",1],["Mematikan antivirus sementara dengan rencana menyalakannya kembali nanti",2]],"Menolak dan melaporkan penyebab lambat menjaga perlindungan perangkat sekaligus mencari solusi yang benar; mematikan perlindungan sementara membuka celah serangan, sedangkan mengajak rekan lain memperluas risiko ke banyak perangkat.","TIK dan literasi digital"),
t("Rekanmu meminjam cakram keras eksternal berisi arsip kantor untuk keperluan pribadinya di rumah. Sikapmu ...",[["Meminjamkannya dengan pesan agar berhati-hati",3],["Menolak peminjaman itu, menjelaskan arsip kantor tidak boleh dibawa untuk keperluan pribadi, dan mengarahkan rekan itu memakai perangkat pribadinya sendiri",5],["Meminjamkannya tanpa mencatat siapa yang membawa dan kapan kembali",2],["Menolak peminjaman itu dan menjelaskan arsip kantor tidak boleh dibawa untuk keperluan pribadi",4],["Meminjamkannya dan ikut menyalin arsip kantor ke perangkat pribadi",1]],"Menolak peminjaman melindungi arsip kantor dari hilang dan penyalahgunaan di luar kendali kantor; meminjamkan tanpa catatan menghilangkan jejak tanggung jawab, sedangkan menyalin arsip ke perangkat pribadi menambah penyebaran data kantor.","TIK dan literasi digital"),
t("Pesan berantai mengklaim jadwal layanan kantormu berubah total dan banyak warga bertanya kebenarannya. Sikapmu ...",[["Memeriksa jadwal resmi dan menyampaikan klarifikasi kepada warga yang bertanya",4],["Meneruskan pesan berantai itu ke rekan untuk dimintai pendapat",2],["Memeriksa jadwal resmi, menyampaikan klarifikasi lewat kanal resmi kantor, dan menjawab pertanyaan warga dengan merujuk jadwal resmi itu",5],["Mengumumkan perubahan jadwal berdasarkan pesan berantai itu tanpa memeriksa",1],["Menjawab warga bahwa kamu belum tahu tanpa memeriksa jadwal resmi",3]],"Klarifikasi berbasis jadwal resmi menghentikan kebingungan warga; meneruskan pesan yang belum diperiksa memperluas kabar yang belum pasti, sedangkan mengumumkan tanpa memeriksa dapat menyesatkan banyak warga.","TIK dan literasi digital"),
t("Rekanmu meneruskan pesan suara berisi kabar bohong tentang bantuan sosial ke grup kerja. Sikapmu ...",[["Meneruskan pesan suara itu ke grup lain untuk didiskusikan",2],["Memeriksa kebenaran kabar itu di sumber resmi dan meluruskan di grup kerja dengan sopan",4],["Ikut menyebarkan pesan suara itu ke warga",1],["Memeriksa kebenaran kabar itu di sumber resmi, meluruskan di grup kerja dengan sopan, dan mengingatkan agar kabar tentang bantuan tidak diteruskan sebelum diperiksa",5],["Mengabaikan pesan suara itu karena menganggap semua anggota sudah paham",3]],"Meluruskan dengan sumber resmi di grup yang sama menghentikan kabar bohong di tempat penyebarannya; meneruskan untuk didiskusikan memperluas kabar bohong, sedangkan menyebarkannya ke warga menimbulkan antrean dan kekecewaan yang tidak perlu.","TIK dan literasi digital"),
t("Kolom komentar akun resmi instansimu dipenuhi tuduhan palsu yang memakai angka yang dipelintir tentang program kantormu. Sikapmu ...",[["Ikut membagikan tuduhan itu karena angkanya terlihat meyakinkan",1],["Mendiamkan komentar itu dengan harapan warganet tidak percaya",3],["Melaporkan komentar itu ke pengelola akun resmi dan menyiapkan data yang benar",4],["Membalas komentar itu dengan emosi dari akun pribadi",2],["Melaporkan komentar itu ke pengelola akun resmi, menyiapkan data program yang benar dari sumber resmi, dan membantu klarifikasi lewat kanal resmi",5]],"Laporan dan klarifikasi berbasis data resmi menjawab tuduhan dengan fakta; membalas dengan emosi merusak citra layanan, sedangkan ikut membagikan tuduhan palsu membantu kabar bohong menyebar lebih luas.","TIK dan literasi digital"),
t("Kamu menemukan folder bersama berisi salinan identitas warga yang dapat dibuka semua pegawai tanpa batas akses. Sikapmu ...",[["Melaporkan temuan itu ke unit TI dan atasan, mengusulkan pembatasan akses, dan tidak membuka atau menyalin berkas di dalamnya",5],["Mendiamkannya karena folder itu sudah lama ada dan belum ada masalah",3],["Melaporkan temuan itu ke unit TI dan mengusulkan pembatasan akses",4],["Menyalin berkas dari folder itu untuk keperluan pribadi",1],["Membuka beberapa berkas untuk memastikan isinya benar salinan identitas",2]],"Melapor dan mengusulkan pembatasan akses memperbaiki pengamanan data warga tanpa menambah paparan; membuka berkas tanpa keperluan menambah orang yang melihat data warga, sedangkan menyalin untuk keperluan pribadi adalah penyalahgunaan data.","TIK dan literasi digital"),
t("Atasan memintamu mengirim data warga lewat chat pribadi karena surel kantor sedang gangguan. Sikapmu ...",[["Mengirim data itu lewat chat pribadi karena atasan yang meminta",3],["Menjelaskan risiko pengiriman lewat chat pribadi, mengusulkan menunggu perbaikan atau memakai saluran resmi cadangan, dan mengirim hanya lewat saluran yang aman sesuai prosedur",5],["Mengirim data itu lewat chat pribadi dan ke beberapa kontak lain agar cepat diproses",2],["Menjelaskan risiko pengiriman lewat chat pribadi dan mengusulkan memakai saluran resmi cadangan",4],["Mengirim data itu lewat chat pribadi beserta data warga lain yang tidak diminta",1]],"Menjelaskan risiko dan memakai saluran yang aman menjaga data warga sekalipun ada gangguan teknis; mengirim karena perintah tanpa mempertimbangkan keamanan mengorbankan perlindungan data, sedangkan mengirim data tambahan memperbesar paparan yang tidak perlu.","TIK dan literasi digital"),
t("Rekan baru mengunggah foto kartu pegawai dan kode akses ruangan ke media sosial untuk merayakan hari kerja. Sikapmu ...",[["Segera memberi tahu rekan itu agar menghapus unggahan itu dan menjelaskan risikonya",4],["Memberi selamat di kolom komentar tanpa membahas unggahan itu",2],["Segera memberi tahu rekan itu agar menghapus unggahan itu, menjelaskan risiko kode akses tersebar, dan melaporkan ke unit terkait agar kode akses diganti bila perlu",5],["Ikut membagikan unggahan itu untuk memberi semangat",1],["Mendiamkannya karena rekan baru belum tahu aturan",3]],"Pemberitahuan cepat dan laporan memungkinkan kode akses diganti sebelum disalahgunakan; mendiamkan dengan alasan belum tahu aturan membiarkan celah keamanan terbuka, sedangkan ikut membagikan memperluas penyebaran kode akses.","TIK dan literasi digital"),
t("Seorang peneliti meminta data warga untuk tugas akhirnya tanpa membawa surat resmi dari kampusnya. Sikapmu ...",[["Memberikan sebagian data dengan harapan surat menyusul",2],["Menjelaskan prosedur permintaan data dan meminta surat resmi",4],["Langsung memberikan data warga karena alasannya untuk pendidikan",1],["Menjelaskan prosedur permintaan data, meminta surat resmi dan rincian data yang dibutuhkan, dan meneruskan permintaan itu ke unit yang berwenang setelah syarat lengkap",5],["Meminta peneliti itu kembali lain waktu tanpa menjelaskan prosedurnya",3]],"Prosedur dan surat resmi memastikan data warga hanya diberikan untuk keperluan yang sah dan tercatat; memberikan sebagian tanpa syarat mengabaikan perlindungan data, sedangkan memberikan langsung tanpa surat menghilangkan jejak pertanggungjawaban.","TIK dan literasi digital"),
t("Video tutorial palsu mengklaim cara cepat mendapat bantuan dan membuat banyak warga tertipu mengikuti petunjuknya. Sikapmu ...",[["Membagikan video itu karena caranya terlihat mudah",1],["Mendiamkan video itu karena bukan kewenanganmu langsung",3],["Melaporkan video itu dan menyiapkan penjelasan resmi tentang prosedur bantuan yang benar",4],["Menonton video itu dan membahasnya dengan rekan tanpa melapor",2],["Melaporkan video itu ke pengelola kanal dan unit terkait, menyiapkan penjelasan resmi tentang prosedur bantuan yang benar, dan membantu warga yang tertipu memahami langkah berikutnya",5]],"Laporan dan penjelasan resmi melindungi warga dari petunjuk palsu; mendiamkan membiarkan video palsu terus menipu warga, sedangkan membagikan membantu video palsu menjangkau lebih banyak korban.","TIK dan literasi digital"),
t("Setelah rekan menginstal permainan gratis, komputer kantor menampilkan iklan judi dan berjalan lambat. Sikapmu ...",[["Tidak memakai komputer itu untuk data penting, melaporkan kejadian itu ke unit TI, dan mengingatkan rekan agar tidak menginstal perangkat lunak tanpa izin",5],["Menutup iklan yang muncul dan melanjutkan pekerjaan seperti biasa",3],["Melaporkan kejadian itu ke unit TI dan mengingatkan rekan agar tidak menginstal perangkat lunak tanpa izin",4],["Mengklik iklan yang muncul untuk melihat penawarannya",1],["Menginstal permainan gratis serupa di komputer lain",2]],"Melapor dan tidak memakai perangkat yang bermasalah untuk data penting mencegah kerusakan dan penyebaran data meluas; menutup iklan tanpa melapor membiarkan sumber masalah tetap ada, sedangkan mengklik iklan berisiko menambah perangkat lunak berbahaya.","TIK dan literasi digital"),
t("Rekanmu memakai akun surel kantor untuk mendaftar belanja daring dan langganan promo. Sikapmu ...",[["Mendiamkannya karena pendaftaran itu memakai akun rekan sendiri",3],["Mengingatkan rekan itu agar memakai akun pribadi untuk keperluan pribadi, menjelaskan risiko surel kantor dipenuhi pesan promo dan penipuan, dan mengusulkan pemisahan akun secara tegas",5],["Ikut mendaftar promo memakai akun surel kantor",2],["Mengingatkan rekan itu agar memakai akun pribadi untuk keperluan pribadi",4],["Memakai akun surel kantor rekan itu untuk mendaftar layanan lain",1]],"Pemisahan akun kerja dan akun pribadi menjaga surel kantor tetap aman dan profesional; memakai akun kantor untuk promo membuka peluang penipuan masuk ke kotak kerja, sedangkan memakai akun orang lain adalah penyalahgunaan akses.","TIK dan literasi digital"),
t("Dokumen berisi tanda tangan atasan beredar di grup luar kantor tanpa izin. Sikapmu ...",[["Segera melapor ke atasan dan unit TI tentang peredaran dokumen itu",4],["Menyimpan salinan dokumen itu untuk berjaga-jaga",2],["Segera melapor ke atasan dan unit TI, membantu menelusuri sumber penyebaran, dan mengusulkan pengamanan dokumen bertanda tangan berikutnya",5],["Ikut meneruskan dokumen itu ke grup lain",1],["Mendiamkannya karena dokumen itu sudah terlanjur beredar",3]],"Laporan cepat memungkinkan penelusuran sumber dan pencegahan penyalahgunaan tanda tangan; menyimpan salinan tanpa keperluan menambah penyebaran, sedangkan ikut meneruskan memperluas peredaran dokumen tanpa izin.","TIK dan literasi digital"),
t("Seorang warga menulis keluhan di kolom komentar publik dan menyertakan alamat rumah lengkapnya. Sikapmu ...",[["Mengabaikan keluhan itu karena ditulis di tempat yang salah",2],["Menghubungi warga lewat jalur pribadi yang aman dan menyarankan menghapus alamat itu",4],["Menyalin alamat warga itu dan membagikannya ke grup lain",1],["Menghubungi warga lewat jalur pribadi yang aman, menyarankan menghapus alamat itu, meneruskan keluhan ke unit terkait, dan melaporkan komentar itu agar alamat disamarkan",5],["Membalas keluhan itu di kolom komentar publik tanpa membahas alamat yang tertulis",3]],"Menghubungi lewat jalur aman dan menyarankan penghapusan melindungi alamat warga dari pihak yang tidak berkepentingan; membalas di ruang publik tanpa membahas alamat membiarkan data tetap terbuka, sedangkan menyalin dan membagikan menyebarkan data pribadi warga.","TIK dan literasi digital"),
t("Rekanmu meminta verifikasi dua langkah dimatikan karena dianggap merepotkan setiap masuk ke sistem. Sikapmu ...",[["Mematikan verifikasi di akunmu sendiri juga agar sama praktisnya",1],["Membiarkan rekan itu mematikan verifikasi di akunnya sendiri",3],["Menolak mematikan verifikasi itu dan menjelaskan fungsinya melindungi akun",4],["Membantu mematikan verifikasi agar pekerjaan cepat selesai",2],["Menolak mematikan verifikasi itu, menjelaskan fungsinya melindungi akun, dan membantu rekan memahami cara masuk yang benar agar tidak merasa repot",5]],"Verifikasi tambahan melindungi akun sekalipun kata sandi diketahui pihak lain; membantu rekan memahami cara masuk menyelesaikan keluhan tanpa mengorbankan keamanan, sedangkan mematikan perlindungan menghilangkan lapisan pengaman akun.","TIK dan literasi digital"),
// FLAG E-SKD-06: nuansa urutan skor — pelaporan atas berkas kerja di laptop pribadi rekan; mohon validator memastikan tingkat pelaporan sudah proporsional.
t("Rekanmu membawa laptop pribadi berisi berkas kerja tanpa pengaman ke tempat servis tanpa memberitahumu. Sikapmu ...",[["Mengingatkan rekan itu agar memindahkan berkas kerja ke media kantor yang aman, menghapus salinan di laptop pribadi, dan melaporkan kejadian itu sesuai prosedur pengamanan data",5],["Mendiamkannya karena laptop itu milik rekan sendiri",3],["Mengingatkan rekan itu agar memindahkan berkas kerja dan menghapus salinan di laptop pribadi",4],["Ikut membawa berkas kerja di laptop pribadi tanpa pengaman",1],["Meminta rekan itu menyalin berkas kerja ke laptopmu juga",2]],"Memindahkan berkas ke media kantor yang aman dan menghapus salinan pribadi mencegah data kerja terlihat pihak luar saat servis; mendiamkan membiarkan data kerja berada di luar kendali kantor, sedangkan ikut membawa berkas tanpa pengaman menambah risiko yang sama.","TIK dan literasi digital"),
t("Pesan yang mengaku dari bank meminta kode verifikasi aplikasi penggajian pegawai. Sikapmu ...",[["Mengabaikan pesan itu tanpa memeriksa atau melapor",3],["Tidak memberikan kode itu, memeriksa kebenaran pesan lewat kanal resmi bank dan unit terkait, dan melaporkan pesan itu sebagai dugaan penipuan",5],["Membalas pesan itu untuk menanyakan alasan permintaan kode",2],["Tidak memberikan kode itu dan memeriksa kebenaran pesan lewat kanal resmi bank",4],["Memberikan kode verifikasi karena pesan mengancam akun diblokir",1]],"Kode verifikasi tidak boleh diberikan kepada pihak mana pun dan pesan semacam itu perlu diperiksa lewat kanal resmi; membalas untuk bertanya tetap memberi peluang penipu meyakinkan korban, sedangkan memberikan kode menyerahkan akses ke akun penggajian.","TIK dan literasi digital"),
t("Foto kegiatan kantor diunggah tanpa menyamarkan wajah anak-anak peserta kegiatan. Sikapmu ...",[["Meminta pengunggah menyunting atau menghapus foto itu dan menjelaskan perlindungan anak",4],["Menyukai foto itu tanpa memberi tahu pengunggahnya",2],["Meminta pengunggah menyunting atau menghapus foto itu, menjelaskan perlindungan anak, dan mengusulkan pemeriksaan foto kegiatan berikutnya sebelum dibagikan",5],["Ikut membagikan foto itu ke akunmu sendiri",1],["Mendiamkannya karena foto kegiatan dianggap dokumentasi biasa",3]],"Menyunting dan memeriksa foto kegiatan melindungi anak peserta dari paparan identitas di ruang publik; mendiamkan dengan alasan dokumentasi mengabaikan perlindungan anak, sedangkan ikut membagikan memperluas paparan wajah anak.","TIK dan literasi digital"),
t("Rekanmu menyarankan memakai versi bajakan aplikasi desain untuk materi publikasi kantor agar tidak perlu meminta anggaran. Sikapmu ...",[["Memakai versi bajakan itu untuk satu materi saja",2],["Menolak saran itu dan menjelaskan risiko hukum dan keamanan perangkat lunak bajakan",4],["Menginstal versi bajakan itu di banyak komputer kantor",1],["Menolak saran itu, menjelaskan risiko hukum dan keamanan perangkat lunak bajakan, dan mengusulkan aplikasi gratis yang sah atau pengajuan sesuai prosedur",5],["Mendiamkan saran itu dan membiarkan rekan memakainya sendiri",3]],"Aplikasi yang sah melindungi kantor dari risiko hukum dan perangkat lunak berbahaya; memakai bajakan untuk satu materi tetap melanggar aturan dan membahayakan perangkat, sedangkan menginstal di banyak komputer memperluas pelanggaran dan risiko.","TIK dan literasi digital"),
t("Surel massal ke warga terkirim dengan alamat semua penerima terlihat karena memakai kolom yang salah. Sikapmu ...",[["Menyembunyikan kesalahan itu dan berharap tidak ada penerima yang memperhatikan",1],["Mendiamkannya karena alamat surel dianggap bukan data yang terlalu sensitif",3],["Segera melapor ke atasan dan meminta maaf kepada penerima dengan penjelasan yang jujur",4],["Mengirim surel susulan yang kembali menampilkan semua alamat penerima",2],["Segera melapor ke atasan dan unit terkait, meminta maaf kepada penerima dengan penjelasan yang jujur, dan mengusulkan pemeriksaan ganda sebelum pengiriman massal berikutnya",5]],"Laporan dan permintaan maaf yang jujur memungkinkan penerima waspada terhadap penyalahgunaan alamat; mendiamkan membiarkan alamat tersebar tanpa perlindungan, sedangkan menyembunyikan menghilangkan kesempatan memperbaiki prosedur pengiriman.","TIK dan literasi digital"),
t("Aplikasi kerja meminta izin lokasi terus-menerus, termasuk di luar jam kerja. Sikapmu ...",[["Memeriksa pengaturan izin itu, membatasi izin hanya saat aplikasi dipakai untuk tugas, dan menanyakan ke unit TI bila izin itu tidak sesuai kebutuhan kerja",5],["Membiarkan izin itu karena mengikuti pengaturan bawaan aplikasi",3],["Memeriksa pengaturan izin itu dan membatasi izin hanya saat aplikasi dipakai untuk tugas",4],["Memberikan semua izin dan mengajak rekan melakukan hal yang sama",1],["Memberikan semua izin yang diminta agar aplikasi tidak bermasalah",2]],"Membatasi izin sesuai kebutuhan kerja melindungi privasi di luar jam kerja; memberikan semua izin tanpa memeriksa memberi akses lokasi yang tidak diperlukan, sedangkan mengajak rekan memperluas paparan lokasi banyak pegawai.","TIK dan literasi digital"),
t("Rekanmu meneruskan draf kebijakan yang belum final ke grup alumni untuk meminta pendapat. Sikapmu ...",[["Mendiamkannya karena anggota grup alumni dianggap dapat dipercaya",3],["Mengingatkan rekan itu bahwa draf belum final bersifat internal, meminta draf ditarik dari grup itu, dan melaporkan kejadian itu bila draf sudah tersebar luas",5],["Ikut membaca draf itu dan memberi pendapat di grup alumni",2],["Mengingatkan rekan itu bahwa draf belum final bersifat internal dan meminta draf ditarik",4],["Ikut meneruskan draf itu ke grup lain",1]],"Menarik draf yang belum final mencegah kebijakan yang belum diputuskan dianggap sebagai keputusan resmi; membaca dan memberi pendapat di grup luar tetap memperluas paparan draf internal, sedangkan ikut meneruskan memperbesar penyebaran dokumen yang belum final.","TIK dan literasi digital"),
// FLAG E-SKD-06: nuansa urutan skor — prosedur penyalinan ke perangkat milik warga dapat berbeda antarinstansi; mohon validator memastikan urutan respons sudah tepat.
t("Seorang warga meminta arsip digitalnya disalin ke perangkat penyimpanan miliknya yang tidak kamu kenal riwayatnya. Sikapmu ...",[["Menjelaskan risiko perangkat yang tidak dikenal dan menawarkan penyalinan lewat saluran resmi kantor",4],["Menyalin arsip itu dan arsip lain yang tidak diminta",2],["Menjelaskan risiko perangkat yang tidak dikenal, menawarkan penyalinan lewat saluran resmi kantor yang aman, dan memindai perangkat itu sesuai prosedur bila penyalinan memang harus dilakukan",5],["Menyalin arsip itu lalu memakai perangkat itu di komputer kantor lain tanpa pemeriksaan",1],["Menyalin arsip itu tanpa memeriksa perangkat tersebut",3]],"Penyalinan lewat saluran resmi dan pemeriksaan perangkat melindungi arsip warga dan komputer kantor dari perangkat lunak berbahaya; menyalin tanpa memeriksa mengabaikan risiko, sedangkan memakai perangkat itu di komputer lain dapat menyebarkan kerusakan.","TIK dan literasi digital"),
t("Potongan pidato pejabat beredar luas setelah dipotong sehingga maknanya berubah dan memicu kemarahan warganet. Sikapmu ...",[["Mengomentari potongan itu berdasarkan potongan yang beredar saja",2],["Mencari rekaman utuh dari sumber resmi dan membandingkan maknanya sebelum menanggapi",4],["Ikut menyebarkan potongan itu dengan tambahan komentar yang memanas",1],["Mencari rekaman utuh dari sumber resmi, membandingkan maknanya, dan membagikan klarifikasi berbasis rekaman utuh itu lewat kanal yang tepat",5],["Mendiamkan potongan itu karena menganggap warganet akan mencari sendiri rekaman utuhnya",3]],"Membandingkan dengan rekaman utuh dari sumber resmi mencegah penilaian berdasarkan potongan yang menyesatkan; mengomentari hanya dari potongan memperluas kesalahpahaman, sedangkan menyebarkan dengan komentar yang memanas menambah kemarahan yang tidak berdasar.","TIK dan literasi digital"),
t("Saat dinas luar kamu harus mengakses akun kantor dari komputer umum yang dipakai banyak orang. Sikapmu ...",[["Mengakses dari komputer umum dan membiarkan akun tetap masuk setelah selesai",1],["Mengakses dari komputer umum dan berharap tidak ada yang menyalahgunakan sesi yang tertinggal",3],["Menghindari akses dari komputer umum dan memakai perangkat resmi atau sambungan yang aman",4],["Mengakses dari komputer umum dan menyimpan kata sandi di peramban komputer itu",2],["Menghindari akses dari komputer umum bila memungkinkan, memakai perangkat resmi atau sambungan yang aman, dan bila terpaksa mengakses maka segera keluar, menghapus riwayat masuk, dan mengganti kata sandi",5]],"Menghindari komputer umum dan menutup sesi dengan benar melindungi akun kerja dari pengguna berikutnya; menyimpan kata sandi di komputer umum menyerahkan akses kepada siapa pun yang memakai komputer itu, sedangkan membiarkan akun tetap masuk membuka akun untuk disalahgunakan.","TIK dan literasi digital"),
t("Di loket layanan kamu melihat kode QR ditempeli kode lain yang mengarah ke situs yang tidak dikenal. Sikapmu ...",[["Segera melepas tempelan itu dengan hati-hati, melapor ke petugas keamanan dan unit terkait, dan memastikan kode QR resmi terpasang kembali sebelum warga memindainya",5],["Mendiamkannya karena menganggap tempelan itu mungkin dari petugas lain",3],["Segera melapor ke petugas keamanan dan memastikan warga tidak memindai kode tempelan itu",4],["Mengarahkan warga memindai kode tempelan itu karena terlihat baru",1],["Memindai kode tempelan itu untuk melihat isinya",2]],"Melepas tempelan dan melapor mencegah warga diarahkan ke situs yang tidak dikenal; memindai untuk melihat isi berisiko membuka situs berbahaya, sedangkan mengarahkan warga memindai membantu penipuan menjangkau warga.","TIK dan literasi digital"),
t("Baterai HP kerjamu hampir habis dan tersedia colokan pengisi daya umum di tempat umum. Sikapmu ...",[["Memakai colokan umum karena menganggap pengisian daya tidak berisiko",3],["Menghindari colokan umum untuk HP kerja, memakai pengisi daya dan sumber listrik sendiri yang tepercaya, dan mengaktifkan mode pengisian saja bila terpaksa memakai colokan umum",5],["Memakai colokan umum sambil membuka aplikasi kerja yang berisi data sensitif",2],["Menghindari colokan umum untuk HP kerja dan memakai pengisi daya sendiri yang tepercaya",4],["Memakai colokan umum dan mengizinkan semua permintaan akses yang muncul di layar",1]],"Pengisi daya sendiri yang tepercaya menghindari risiko colokan umum yang dapat disalahgunakan; membuka aplikasi kerja saat tersambung colokan umum menambah paparan data, sedangkan mengizinkan semua permintaan akses menyerahkan kendali perangkat.","TIK dan literasi digital"),
t("Rekanmu membiarkan fitur berbagi berkas nirkabel di HP kerjanya terbuka sehingga menerima berkas dari orang tak dikenal. Sikapmu ...",[["Mengingatkan rekan itu agar menutup fitur itu dan tidak membuka berkas dari pengirim tak dikenal",4],["Membuka berkas dari pengirim tak dikenal untuk melihat isinya",2],["Mengingatkan rekan itu agar menutup fitur itu, tidak membuka berkas dari pengirim tak dikenal, dan menghapus berkas mencurigakan yang sudah diterima",5],["Ikut menerima dan meneruskan berkas dari pengirim tak dikenal itu",1],["Mendiamkannya karena berkas yang diterima belum tentu berbahaya",3]],"Menutup fitur berbagi dan tidak membuka berkas tak dikenal mencegah perangkat lunak berbahaya masuk lewat berbagi berkas; membuka berkas untuk melihat isi tetap berisiko, sedangkan meneruskan berkas tak dikenal menyebarkan kemungkinan bahaya ke perangkat lain.","TIK dan literasi digital"),
t("Rekanmu membawa pulang tumpukan dokumen cetak berisi data warga untuk dikerjakan di rumah tanpa izin. Sikapmu ...",[["Meminta salinan dokumen itu untuk membantunya di rumah",2],["Mengingatkan rekan itu agar mengembalikan dokumen itu dan mengerjakan hanya di kantor sesuai prosedur",4],["Ikut membawa pulang dokumen berisi data warga tanpa izin",1],["Mengingatkan rekan itu agar mengembalikan dokumen itu dan mengerjakan hanya di kantor sesuai prosedur, serta melaporkan kejadian itu bila dokumen sudah dibawa pulang",5],["Mendiamkannya karena rekan itu berniat menyelesaikan pekerjaan lebih cepat",3]],"Dokumen berisi data warga harus tetap berada dalam kendali kantor sesuai prosedur; membawa pulang tanpa izin menghilangkan pengamanan kantor, sedangkan meminta salinan atau ikut membawa memperluas dokumen berisi data warga ke luar kantor.","TIK dan literasi digital"),
t("Komputer bersama yang akan kamu pakai menampilkan riwayat akses ke situs yang tidak pantas dari pengguna sebelumnya. Sikapmu ...",[["Membagikan temuan itu ke rekan lain sebagai bahan candaan",1],["Menghapus riwayat itu diam-diam tanpa melapor",3],["Tidak membuka riwayat itu lebih jauh, menutup sesi pengguna sebelumnya, dan melapor ke unit terkait",4],["Membuka riwayat itu untuk melihat situs apa saja yang diakses",2],["Tidak membuka riwayat itu lebih jauh, menutup sesi pengguna sebelumnya, melapor ke unit terkait sesuai prosedur, dan memakai komputer itu hanya setelah sesi bersih",5]],"Menutup sesi dan melapor sesuai prosedur menjaga komputer bersama tetap aman tanpa menyebarkan aib pengguna sebelumnya; membuka riwayat lebih jauh melanggar privasi, sedangkan membagikan sebagai candaan merusak nama baik dan tidak menyelesaikan pelanggaran pemakaian.","TIK dan literasi digital"),
t("Tugasmu selesai lebih cepat dan masih tersisa waktu cukup lama sebelum jam pulang. Sikapmu ...",[["Memeriksa kembali hasil kerja, membantu rekan yang membutuhkan, dan memakai sisa waktu untuk menyiapkan tugas berikutnya",5],["Menunggu jam pulang sambil membuka media sosial",3],["Memeriksa kembali hasil kerja dan menyiapkan tugas berikutnya",4],["Mengajak rekan lain berhenti bekerja karena tugasmu sudah selesai",1],["Pulang lebih awal tanpa memberi tahu atasan",2]],"Memeriksa hasil, membantu rekan, dan menyiapkan tugas berikutnya memakai waktu kerja secara produktif; menunggu jam pulang menyia-nyiakan waktu yang dibayar untuk bekerja, sedangkan mengajak rekan berhenti merugikan tim.","Profesionalisme"),
t("Saat rapat dimulai kamu sadar bahan yang kamu siapkan ternyata versi lama yang sudah diperbarui. Sikapmu ...",[["Tetap memakai versi lama dengan harapan perbedaannya tidak terlalu besar",3],["Segera mengakui kesalahan versi, menampilkan versi terbaru bila tersedia, dan meminta maaf sambil menjelaskan perubahan penting secara singkat",5],["Menyalahkan rekan yang mengirimkan berkas pembaruan karena terlambat memberi tahu",2],["Segera mengakui kesalahan versi dan menampilkan versi terbaru bila tersedia",4],["Berpura-pura versi lama itu memang versi yang benar",1]],"Mengakui kesalahan dan memakai versi terbaru menjaga keputusan rapat berbasis data yang benar; memakai versi lama berisiko menimbulkan keputusan yang keliru, sedangkan berpura-pura menyembunyikan kesalahan yang akan merugikan rapat.","Profesionalisme"),
t("Rekan senior mengkritik pekerjaanmu dengan nada pedas di depan tim. Sikapmu ...",[["Mendengarkan isi kritik dengan tenang dan memperbaiki hal yang perlu diperbaiki",4],["Membalas kritik itu dengan nada pedas di depan tim",2],["Mendengarkan isi kritik dengan tenang, mencatat hal yang perlu diperbaiki, memperbaiki pekerjaan itu, dan membahas cara penyampaian secara pribadi bila perlu",5],["Menolak semua kritik dan menyalahkan rekan senior itu di depan tim",1],["Diam saja dan tidak memperbaiki pekerjaan itu karena merasa dipermalukan",3]],"Mendengarkan isi kritik dan memperbaiki pekerjaan memisahkan cara penyampaian dari mutu kerja; membalas dengan nada pedas memperkeruh suasana tim, sedangkan menolak semua kritik menghilangkan kesempatan memperbaiki mutu.","Profesionalisme"),
t("Atasan berhalangan mendadak dan memintamu memimpin rapat yang sudah dijadwalkan. Sikapmu ...",[["Memimpin rapat tanpa mempelajari agenda dan bahan",2],["Menerima tugas itu dan memimpin rapat sesuai agenda",4],["Menolak memimpin rapat karena merasa bukan tugasmu",1],["Menerima tugas itu, mempelajari agenda dan bahan rapat dengan cepat, memimpin rapat sesuai agenda, dan melaporkan hasilnya kepada atasan",5],["Meminta rapat ditunda sampai atasan dapat hadir",3]],"Mempelajari agenda dan melaporkan hasil menunjukkan tanggung jawab atas tugas mendadak; memimpin tanpa persiapan berisiko membuat rapat tidak mencapai tujuan, sedangkan menolak tanpa alasan yang kuat mengabaikan kebutuhan tim.","Profesionalisme"),
t("Dua tugas penting memiliki tenggat pada hari yang sama dan tiap tugas membutuhkan waktu penuh. Sikapmu ...",[["Membiarkan dua tugas itu lewat tenggat tanpa kabar",1],["Mengerjakan tugas yang lebih mudah dan menunda tugas yang sulit tanpa memberi tahu",3],["Menilai urgensi tiap tugas dan memberi tahu atasan tentang benturan itu",4],["Mengerjakan tiap tugas setengah-setengah tanpa memberi tahu siapa pun",2],["Menilai urgensi dan dampak tiap tugas, memberi tahu atasan tentang benturan itu, mengusulkan urutan pengerjaan, dan mengerjakan sesuai kesepakatan",5]],"Memberi tahu atasan dan mengusulkan urutan memungkinkan keputusan yang tepat tentang benturan tenggat; mengerjakan setengah-setengah menghasilkan dua pekerjaan yang tidak memuaskan, sedangkan membiarkan lewat tenggat tanpa kabar merugikan semua pihak.","Profesionalisme"),
t("Kamu berjanji kepada warga berkasnya selesai hari ini, tetapi ternyata penyelesaian membutuhkan persetujuan pihak lain yang sedang cuti. Sikapmu ...",[["Memberi tahu warga secara jujur tentang hambatan itu, menyampaikan perkiraan waktu yang realistis, dan mengusahakan jalur persetujuan pengganti sesuai prosedur",5],["Diam saja dan berharap warga tidak menagih janji itu",3],["Memberi tahu warga secara jujur tentang hambatan itu dan menyampaikan perkiraan waktu yang realistis",4],["Berpura-pura berkas sudah selesai padahal belum",1],["Menyalahkan pihak yang cuti di hadapan warga",2]],"Kabar jujur dan usaha mencari jalur pengganti menjaga kepercayaan warga; diam dan berharap warga lupa merusak kepercayaan, sedangkan berpura-pura selesai menipu warga dan menimbulkan masalah yang lebih besar.","Profesionalisme"),
t("Atasan memuji hasil kerjamu padahal kontribusi terbesar berasal dari rekan yang sedang cuti. Sikapmu ...",[["Menerima pujian tanpa menyebut kontribusi rekan itu",3],["Menerima pujian dengan rendah hati, menjelaskan kontribusi rekan itu secara jujur, dan memastikan atasan mengetahui peran rekan tersebut",5],["Menerima pujian dan membiarkan kesan bahwa semua hasil itu karyamu sendiri",2],["Menerima pujian dan menjelaskan kontribusi rekan itu secara jujur",4],["Menambahkan cerita yang membuat peranmu terlihat lebih besar dari kenyataan",1]],"Menjelaskan kontribusi rekan secara jujur menjaga keadilan pengakuan dalam tim; membiarkan kesan keliru merampas pengakuan yang layak bagi rekan, sedangkan melebih-lebihkan peran sendiri menipu atasan.","Profesionalisme"),
t("Kamu menemukan cara kerja yang lebih cepat, tetapi belum ada petunjuk resmi yang mengaturnya. Sikapmu ...",[["Menguji cara itu dengan hati-hati dan mengusulkannya kepada atasan",4],["Mengajak seluruh tim memakai cara itu tanpa persetujuan",2],["Menguji cara itu dengan hati-hati, mencatat hasil dan risikonya, mengusulkannya kepada atasan, dan memakainya setelah mendapat persetujuan",5],["Memakai cara itu untuk semua pekerjaan dan mengabaikan cara resmi yang berlaku",1],["Memakai cara itu diam-diam untuk pekerjaanmu sendiri",3]],"Menguji dan mengusulkan secara resmi memungkinkan perbaikan cara kerja yang aman dan tercatat; memakai diam-diam menghilangkan pengawasan mutu, sedangkan mengabaikan cara resmi menimbulkan ketidakteraturan dalam tim.","Profesionalisme"),
t("Pelatihan yang kamu ikuti materinya tidak sesuai harapan dan penyampaiannya membosankan. Sikapmu ...",[["Meninggalkan pelatihan di tengah jalan tanpa izin",2],["Tetap mengikuti dengan sungguh-sungguh dan mencatat hal yang masih bermanfaat",4],["Mengajak peserta lain meninggalkan pelatihan bersama-sama",1],["Tetap mengikuti dengan sungguh-sungguh, mencatat hal yang masih bermanfaat, dan menyampaikan masukan yang membangun kepada penyelenggara setelah pelatihan",5],["Hadir secara fisik tetapi tidak memperhatikan materi",3]],"Tetap mengikuti dan memberi masukan yang membangun menghormati kesempatan belajar dan membantu penyelenggara memperbaiki pelatihan; hadir tanpa memperhatikan menyia-nyiakan waktu, sedangkan mengajak peserta lain pergi merugikan penyelenggara dan peserta lain.","Profesionalisme"),
t("Rekanmu meminta bantuan menyelesaikan tugasnya padahal tugasmu sendiri sedang menumpuk. Sikapmu ...",[["Berjanji membantu tetapi tidak pernah menepatinya",1],["Menolak dengan kasar tanpa menjelaskan alasan",3],["Menjelaskan beban tugasmu secara jujur dan menawarkan bantuan terbatas sesuai kemampuan",4],["Menerima semua permintaan bantuan dan mengorbankan tenggat tugasmu sendiri",2],["Menjelaskan beban tugasmu secara jujur, menawarkan bantuan terbatas sesuai kemampuan dan waktu yang ada, dan menyepakati waktu bantuan yang tidak mengganggu tenggatmu",5]],"Penjelasan jujur dan bantuan terbatas menyeimbangkan tanggung jawab sendiri dengan kepedulian pada rekan; berjanji tanpa menepati mengecewakan rekan dan merusak kepercayaan, sedangkan mengorbankan tenggat sendiri menimbulkan masalah baru.","Profesionalisme"),
t("Kamu salah memahami instruksi sehingga hasil kerjamu melenceng dari yang diminta atasan. Sikapmu ...",[["Segera mengakui kesalahpahaman itu, meminta klarifikasi instruksi yang benar, dan memperbaiki hasil kerja sesuai arahan yang jelas",5],["Memperbaiki hasil kerja berdasarkan dugaanmu sendiri tanpa bertanya",3],["Segera mengakui kesalahpahaman itu dan meminta klarifikasi instruksi yang benar",4],["Menyembunyikan hasil yang melenceng itu dan berharap atasan tidak memeriksa",1],["Menyalahkan instruksi atasan yang dianggap tidak jelas",2]],"Mengakui dan meminta klarifikasi memperbaiki arah kerja dengan cepat; memperbaiki berdasarkan dugaan berisiko melenceng lagi, sedangkan menyembunyikan hasil membiarkan kesalahan berlanjut sampai merugikan.","Profesionalisme"),
t("Atasan memberimu tanggung jawab baru tanpa penjelasan rinci tentang yang diharapkan. Sikapmu ...",[["Mengerjakan berdasarkan tebakan tanpa bertanya",3],["Mempelajari tugas itu dari dokumen dan rekan yang berpengalaman, menyusun pertanyaan yang jelas, meminta arahan atasan, dan melaporkan pemahamanmu untuk dikonfirmasi",5],["Menunggu atasan menjelaskan sendiri tanpa berusaha mencari tahu",2],["Mempelajari tugas itu dan meminta arahan atasan tentang hal yang belum jelas",4],["Mengabaikan tanggung jawab baru itu karena merasa tidak dijelaskan",1]],"Belajar mandiri dan meminta konfirmasi menunjukkan inisiatif sekaligus mencegah kesalahan arah; mengerjakan berdasarkan tebakan berisiko salah, sedangkan mengabaikan tanggung jawab mengingkari amanah yang diberikan.","Profesionalisme"),
t("Pada evaluasi bulanan terungkap target tim tidak tercapai karena satu bagian pekerjaan tidak dikerjakan anggota yang bertanggung jawab. Sikapmu ...",[["Membahas penyebab kegagalan secara terbuka dan menyusun rencana perbaikan bersama",4],["Menyalahkan anggota itu di depan tim tanpa membahas penyebabnya",2],["Membahas penyebab kegagalan secara terbuka dan adil, membantu anggota itu memahami hambatannya, dan menyusun rencana perbaikan bersama agar target berikutnya tercapai",5],["Melaporkan anggota itu ke atasan dengan cerita yang dilebih-lebihkan",1],["Mendiamkan kegagalan itu dan berharap target berikutnya tercapai dengan sendirinya",3]],"Pembahasan yang adil dan rencana perbaikan menyelesaikan akar masalah tanpa mempermalukan anggota tim; menyalahkan tanpa membahas penyebab merusak kerja sama, sedangkan cerita yang dilebih-lebihkan menipu atasan dan merugikan rekan.","Profesionalisme"),
t("Kamu diminta bekerja pada akhir pekan untuk acara kantor yang sudah direncanakan jauh hari. Sikapmu ...",[["Menolak tugas itu tanpa alasan yang jelas",2],["Menerima tugas itu dan menyiapkan keperluan acara dengan baik",4],["Menerima tugas itu tetapi tidak hadir pada hari acara tanpa kabar",1],["Menerima tugas itu, menyiapkan keperluan acara dengan baik, dan mengatur waktu pribadi agar tugas dan kewajiban pribadi tetap berjalan",5],["Menerima tugas itu tetapi bekerja seadanya karena merasa akhir pekan seharusnya libur",3]],"Menerima dan menyiapkan dengan baik menghormati perencanaan yang sudah dibuat jauh hari; bekerja seadanya merugikan acara, sedangkan menerima lalu tidak hadir tanpa kabar mengacaukan persiapan tim.","Profesionalisme"),
t("Fasilitas yang kamu butuhkan rusak menjelang acara penting yang kamu tangani. Sikapmu ...",[["Membatalkan acara tanpa berusaha mencari alternatif",1],["Menunggu fasilitas diperbaiki tanpa mencari alternatif",3],["Segera mencari alternatif fasilitas dan memberi tahu pihak terkait",4],["Menyalahkan petugas fasilitas di depan peserta acara",2],["Segera mencari alternatif fasilitas, memberi tahu pihak terkait tentang kendala itu, dan memastikan acara tetap berjalan dengan persiapan cadangan",5]],"Mencari alternatif dan memberi tahu pihak terkait menjaga acara tetap berjalan; menunggu tanpa alternatif membiarkan acara terancam gagal, sedangkan membatalkan tanpa usaha merugikan semua pihak yang sudah bersiap.","Profesionalisme"),
t("Seorang warga marah kepadamu atas kesalahan layanan yang bukan kamu buat. Sikapmu ...",[["Mendengarkan keluhan dengan tenang, meminta maaf atas ketidaknyamanan yang dialami, menjelaskan langkah perbaikan, dan meneruskan keluhan itu ke pihak yang menangani",5],["Menyuruh warga mengeluh langsung ke pihak yang membuat kesalahan",3],["Mendengarkan keluhan dengan tenang dan menjelaskan langkah perbaikan",4],["Mengusir warga karena dianggap mengganggu",1],["Membalas kemarahan warga dengan nada tinggi",2]],"Mendengarkan dan menjelaskan langkah perbaikan meredakan kemarahan dan menyelesaikan keluhan; menyuruh warga mengeluh ke pihak lain melempar tanggung jawab, sedangkan membalas dengan kemarahan memperburuk layanan.","Profesionalisme"),
t("Rekanmu mengajak bergosip tentang kinerja atasan baru pada jam kerja. Sikapmu ...",[["Mendengarkan gosip itu tanpa ikut menanggapi",3],["Menolak ajakan itu dengan sopan, mengajak kembali fokus pada pekerjaan, dan menilai atasan dari hasil kerja serta arahan resminya",5],["Ikut menanggapi gosip itu dengan tambahan cerita",2],["Menolak ajakan itu dengan sopan dan kembali fokus pada pekerjaan",4],["Menyebarkan gosip itu ke rekan lain dan menambahkan cerita yang belum pasti",1]],"Menolak gosip dan kembali fokus menjaga waktu kerja dan suasana tim; mendengarkan tanpa menanggapi tetap membuang waktu kerja, sedangkan menyebarkan cerita yang belum pasti merusak nama baik atasan.","Profesionalisme"),
t("Berkas sumber untuk laporan kegiatan yang kamu susun tidak ditemukan sehingga sebagian data laporan tidak lengkap. Sikapmu ...",[["Mencari data yang hilang dari sumber lain yang sah dan menjelaskan bagian yang tidak dapat dipulihkan secara jujur",4],["Mengisi bagian yang hilang dengan perkiraan tanpa keterangan",2],["Mencari data yang hilang dari sumber lain yang sah, menjelaskan bagian yang tidak dapat dipulihkan secara jujur dalam laporan, dan mengusulkan perbaikan penyimpanan data",5],["Membuat data pengganti seolah-olah data itu data yang sebenarnya",1],["Menyusun laporan hanya dari data yang ada tanpa menjelaskan kekurangannya",3]],"Mencari sumber sah dan menjelaskan kekurangan secara jujur menjaga laporan tetap dapat dipertanggungjawabkan; mengisi dengan perkiraan tanpa keterangan menyesatkan pembaca, sedangkan membuat data pengganti memalsukan laporan.","Profesionalisme"),
t("Kesempatan penugasan bergengsi dibuka dan kamu ragu apakah memenuhi syarat yang ditetapkan. Sikapmu ...",[["Mendaftar tanpa memeriksa syarat dan berharap diterima",2],["Mempelajari syarat itu dengan cermat dan menilai kemampuanmu secara jujur",4],["Mengaku memenuhi syarat padahal tidak",1],["Mempelajari syarat itu dengan cermat, menilai kemampuanmu secara jujur, menyiapkan kekurangan yang masih dapat diperbaiki, dan mendaftar bila syarat terpenuhi",5],["Tidak mendaftar karena merasa ragu tanpa memeriksa syarat itu",3]],"Penilaian jujur berbasis syarat memungkinkan keputusan yang tepat dan persiapan yang nyata; mendaftar tanpa memeriksa membuang waktu penilai, sedangkan mengaku memenuhi syarat padahal tidak menipu proses seleksi.","Profesionalisme"),
t("Kamu harus mempelajari peraturan baru yang tebal dalam waktu singkat untuk tugasmu. Sikapmu ...",[["Tidak membaca peraturan itu dan bekerja berdasarkan kebiasaan lama",1],["Membaca sekilas tanpa catatan dan berharap cukup memahami",3],["Membagi materi menjadi bagian-bagian kecil dan mempelajari bagian yang paling terkait tugas lebih dahulu",4],["Menunda membaca sampai mendekati tenggat tugas",2],["Membagi materi menjadi bagian-bagian kecil, mempelajari bagian yang paling terkait tugas lebih dahulu, mencatat hal penting, dan bertanya kepada rekan ahli tentang bagian yang sulit",5]],"Belajar bertahap dengan catatan dan bertanya tentang bagian yang sulit membangun pemahaman yang dapat dipakai untuk tugas; membaca sekilas tanpa catatan mudah terlupakan, sedangkan bekerja berdasarkan kebiasaan lama mengabaikan aturan baru yang berlaku.","Profesionalisme"),
t("Rekan yang menangani antrean hari ini sakit mendadak dan warga sudah menunggu lama. Sikapmu ...",[["Segera mengambil alih pelayanan antrean, memberi tahu warga tentang pergantian petugas, dan melayani dengan tertib sesuai urutan",5],["Meminta warga menunggu sampai ada petugas pengganti yang ditunjuk",3],["Segera mengambil alih pelayanan antrean dan memberi tahu warga tentang pergantian petugas",4],["Membiarkan antrean tanpa petugas dan berharap warga pulang sendiri",1],["Melayani warga yang kamu kenal lebih dahulu agar cepat selesai",2]],"Mengambil alih dan memberi tahu warga menjaga layanan tetap berjalan dan warga merasa dihargai; membiarkan antrean tanpa petugas menelantarkan warga, sedangkan mendahulukan kenalan melanggar keadilan antrean.","Profesionalisme"),
t("Kamu diminta mengganti jadwal cuti yang sudah disetujui karena ada tugas mendesak. Sikapmu ...",[["Menolak perubahan jadwal tanpa mendengarkan alasan urgensi",3],["Memahami urgensi tugas itu, mendiskusikan dampak perubahan jadwal secara terbuka, dan menyepakati jadwal cuti pengganti yang jelas",5],["Menerima perubahan tetapi bekerja dengan kesal dan seadanya",2],["Memahami urgensi tugas itu dan mendiskusikan dampak perubahan jadwal secara terbuka",4],["Tetap cuti tanpa memberi tahu dan mengabaikan tugas mendesak itu",1]],"Diskusi terbuka dan kesepakatan jadwal pengganti menyeimbangkan kebutuhan kantor dan hak cuti; menerima dengan kesal merugikan mutu kerja, sedangkan tetap cuti tanpa kabar mengabaikan tugas mendesak yang sudah diketahui.","Profesionalisme"),
t("Hasil evaluasi kinerjamu menurun dibanding periode sebelumnya. Sikapmu ...",[["Mempelajari catatan evaluasi dan menyusun rencana perbaikan",4],["Menyalahkan penilai karena dianggap tidak adil",2],["Mempelajari catatan evaluasi dengan tenang, mengidentifikasi penyebab penurunan, menyusun rencana perbaikan, dan meminta masukan atasan tentang rencana itu",5],["Menolak menerima hasil evaluasi dan menuntut penilaian diulang tanpa alasan",1],["Menganggap penurunan itu wajar dan tidak melakukan perubahan",3]],"Rencana perbaikan berbasis catatan evaluasi mengubah penurunan menjadi perbaikan yang terukur; menyalahkan penilai menutup kesempatan belajar, sedangkan menolak hasil tanpa alasan mengingkari proses evaluasi yang sah.","Profesionalisme"),
t("Rekanmu meninggalkan peralatan bersama dalam keadaan kotor dan rusak ringan tanpa melapor. Sikapmu ...",[["Memakai peralatan itu dalam keadaan rusak tanpa memeriksa",2],["Membersihkan peralatan itu dan memberi tahu rekan itu dengan baik",4],["Ikut meninggalkan peralatan bersama dalam keadaan kotor",1],["Membersihkan dan mengamankan peralatan itu, memberi tahu rekan itu dengan baik, dan melaporkan kerusakan ringan itu agar segera diperbaiki",5],["Membiarkan peralatan itu dalam keadaan kotor untuk pengguna berikutnya",3]],"Membersihkan, memberi tahu, dan melapor menjaga peralatan bersama tetap dapat dipakai semua orang; membiarkan kotor membebani pengguna berikutnya, sedangkan memakai peralatan rusak tanpa memeriksa berisiko menambah kerusakan.","Profesionalisme"),
t("Atasan meminta pendapatmu yang jujur tentang rencana yang ia susun, padahal kamu melihat kelemahan dalam rencana itu. Sikapmu ...",[["Menyembunyikan kelemahan itu dan membicarakannya di belakang atasan",1],["Memuji rencana itu tanpa menyebut kelemahan yang kamu lihat",3],["Menyampaikan pendapat dengan sopan dan berbasis data beserta usulan perbaikan",4],["Menyampaikan kelemahan dengan nada meremehkan di depan orang lain",2],["Menyampaikan pendapat dengan sopan dan berbasis data, menjelaskan kelemahan beserta usulan perbaikan, dan menghormati keputusan akhir atasan",5]],"Pendapat berbasis data beserta usulan perbaikan membantu atasan memperbaiki rencana; memuji tanpa menyebut kelemahan membiarkan rencana yang lemah berjalan, sedangkan membicarakannya di belakang merusak kepercayaan.","Profesionalisme"),
t("Kamu diminta mengerjakan tugas yang sama persis dengan yang sudah dikerjakan unit lain. Sikapmu ...",[["Memeriksa hasil kerja unit lain itu, memberi tahu atasan tentang duplikasi itu, dan mengusulkan koordinasi agar pekerjaan tidak dikerjakan dua kali",5],["Mengerjakan tugas itu dari awal tanpa memeriksa hasil unit lain",3],["Memeriksa hasil kerja unit lain itu dan memberi tahu atasan tentang duplikasi itu",4],["Mengabaikan tugas itu karena merasa sudah ada yang mengerjakan",1],["Menyalin hasil unit lain dan mengaku sebagai hasil kerjamu",2]],"Memeriksa dan mengusulkan koordinasi mencegah pemborosan waktu dan tenaga; mengerjakan dari awal tanpa memeriksa membuang sumber daya, sedangkan menyalin dan mengaku sebagai karya sendiri tidak jujur.","Profesionalisme"),
t("Seorang warga meminta penjelasan panjang di luar jam layanan setelah antrean dinyatakan tutup. Sikapmu ...",[["Menolak melayani karena antrean sudah tutup tanpa memberi penjelasan",3],["Melayani dengan sabar sesuai batas waktu yang wajar, menjelaskan hal penting secara ringkas, dan mengarahkan warga ke jadwal layanan berikutnya untuk penjelasan lanjutan",5],["Melayani dengan nada kesal dan jawaban yang tidak lengkap",2],["Melayani dengan sabar dan menjelaskan hal penting secara ringkas",4],["Mengusir warga dan menutup loket di hadapannya",1]],"Melayani dengan sabar dan mengarahkan ke jadwal berikutnya menyeimbangkan kebutuhan warga dan batas jam layanan; menolak tanpa penjelasan mengecewakan warga, sedangkan mengusir merusak citra layanan.","Profesionalisme"),
t("Penyedia jasa mengajakmu makan siang mewah saat proses pengadaan yang melibatkannya sedang berjalan. Sikapmu ...",[["Menolak ajakan itu dengan sopan dan menjelaskan perlunya menjaga jarak selama proses pengadaan",4],["Menerima ajakan itu dan membahas pengadaan saat makan siang",2],["Menolak ajakan itu dengan sopan, menjelaskan perlunya menjaga jarak selama proses pengadaan, dan mencatat ajakan itu bila diperlukan sesuai aturan",5],["Menerima ajakan itu dan berjanji membantu penyedia jasa itu memenangkan pengadaan",1],["Menerima ajakan itu tetapi berjanji tetap objektif",3]],"Menolak jamuan selama proses pengadaan menjaga objektivitas keputusan; menerima dengan janji tetap objektif tetap menimbulkan kesan keberpihakan, sedangkan berjanji membantu memenangkan pengadaan melanggar integritas pengadaan.","Profesionalisme"),
t("Sertifikat kompetensi yang disyaratkan untuk tugasmu akan kedaluwarsa bulan depan. Sikapmu ...",[["Tetap bekerja dengan sertifikat kedaluwarsa tanpa memberi tahu atasan",2],["Segera memeriksa syarat perpanjangan dan mendaftar perpanjangan sesuai prosedur",4],["Mengaku sertifikat masih berlaku padahal sudah kedaluwarsa",1],["Segera memeriksa syarat perpanjangan, mendaftar perpanjangan sesuai prosedur, dan memberi tahu atasan tentang jadwal perpanjangan itu",5],["Menunggu sampai sertifikat kedaluwarsa baru mengurus perpanjangan",3]],"Mengurus perpanjangan sebelum kedaluwarsa menjaga tugas tetap sah secara kompetensi; menunggu sampai kedaluwarsa menimbulkan kekosongan syarat, sedangkan mengaku masih berlaku menipu atasan dan pengguna layanan.","Profesionalisme"),
t("Rekan baru bertanya hal dasar berulang kali saat kamu sedang mengejar tenggat. Sikapmu ...",[["Menyuruh rekan itu berhenti bertanya dan mencari tahu sendiri selamanya",1],["Mengabaikan pertanyaan rekan itu tanpa penjelasan",3],["Menjawab singkat dengan sabar dan mengarahkan rekan itu ke panduan tertulis",4],["Menjawab dengan nada kesal agar rekan itu berhenti bertanya",2],["Menjawab singkat dengan sabar, mengarahkan rekan itu ke panduan tertulis, dan menyepakati waktu khusus untuk pertanyaan lanjutan setelah tenggatmu selesai",5]],"Jawaban singkat dan arahan ke panduan membantu rekan baru tanpa mengorbankan tenggat; mengabaikan membuat rekan baru kebingungan, sedangkan menjawab dengan kesal merusak hubungan kerja.","Profesionalisme"),
// FLAG E-SKD-06: nuansa urutan skor — batas pencatatan notulen untuk pembahasan sensitif; mohon validator memastikan urutan respons sudah tepat.
t("Kamu diminta menulis notulen rapat yang pembahasannya sensitif dan sebagian peserta meminta bagian tertentu tidak dicatat. Sikapmu ...",[["Mencatat keputusan dan hal penting secara akurat sesuai aturan notulen, menjelaskan bahwa keputusan harus tercatat, dan berkonsultasi dengan pimpinan rapat tentang bagian yang sensitif",5],["Tidak mencatat bagian sensitif itu tanpa berkonsultasi dengan pimpinan rapat",3],["Mencatat keputusan dan hal penting secara akurat dan menjelaskan bahwa keputusan harus tercatat",4],["Mengubah isi notulen agar sesuai keinginan sebagian peserta",1],["Mencatat semua pembahasan termasuk candaan pribadi peserta",2]],"Notulen yang akurat dan konsultasi dengan pimpinan rapat menjaga catatan keputusan tetap dapat dipertanggungjawabkan; mengubah isi sesuai keinginan peserta memalsukan catatan rapat, sedangkan mencatat candaan pribadi melanggar etika pencatatan.","Profesionalisme"),
t("Aplikasi kantor berubah tampilannya sehingga pekerjaanmu menjadi lebih lambat dari biasanya. Sikapmu ...",[["Bekerja dengan lambat tanpa berusaha mempelajari tampilan baru",3],["Mempelajari tampilan baru dari panduan resmi, bertanya kepada rekan yang sudah terbiasa, dan mencatat kesulitan yang masih dialami untuk disampaikan ke unit terkait",5],["Menyalahkan pembaruan aplikasi di depan warga yang dilayani",2],["Mempelajari tampilan baru dari panduan resmi dan bertanya kepada rekan yang sudah terbiasa",4],["Menolak memakai aplikasi baru dan kembali memakai cara lama yang sudah dilarang",1]],"Belajar dari panduan dan bertanya mempercepat penyesuaian dengan tampilan baru; bekerja lambat tanpa belajar memperpanjang masalah, sedangkan menolak aplikasi yang sudah ditetapkan melanggar aturan kerja.","Profesionalisme"),
t("Kamu ditugaskan di unit yang jauh dari domisili dan belum pernah kamu kenal sebelumnya. Sikapmu ...",[["Menerima penugasan itu dan mempelajari tugas dan lingkungan unit baru",4],["Meminta pindah kembali tanpa mencoba menjalankan tugas di unit baru",2],["Menerima penugasan itu, mempelajari tugas dan lingkungan unit baru, menjalin hubungan baik dengan rekan baru, dan mengatur perjalanan serta waktu dengan disiplin",5],["Menolak penugasan itu dan tidak hadir di unit baru",1],["Menerima penugasan tetapi bekerja dengan keluhan terus-menerus",3]],"Menerima dan mempelajari lingkungan baru menunjukkan kesiapan menjalankan amanah di mana pun ditempatkan; meminta pindah tanpa mencoba mengabaikan kebutuhan organisasi, sedangkan menolak penugasan mengingkari kewajiban sebagai pegawai.","Profesionalisme"),
t("Rekanmu mengusulkan memangkas tahap pemeriksaan kualitas agar pekerjaan cepat selesai. Sikapmu ...",[["Ikut memangkas pemeriksaan untuk pekerjaanmu sendiri agar cepat selesai",2],["Menolak pemangkasan itu dan menjelaskan fungsi pemeriksaan kualitas",4],["Menghilangkan seluruh pemeriksaan kualitas untuk semua pekerjaan tim",1],["Menolak pemangkasan itu, menjelaskan fungsi pemeriksaan kualitas, dan mengusulkan cara mempercepat pekerjaan tanpa menghilangkan pemeriksaan",5],["Membiarkan rekan itu memangkas pemeriksaan untuk bagiannya sendiri",3]],"Pemeriksaan kualitas mencegah kesalahan sampai ke pengguna layanan; memangkas demi kecepatan mengorbankan mutu, sedangkan menghilangkan seluruh pemeriksaan membiarkan kesalahan lolos tanpa kendali.","Profesionalisme"),
t("Kamu menerima dua undangan penting pada waktu yang bersamaan dari dua pihak yang berbeda. Sikapmu ...",[["Tidak menghadiri undangan mana pun tanpa memberi tahu siapa pun",1],["Menghadiri salah satu undangan tanpa memberi tahu pihak lain",3],["Menilai urgensi tiap undangan dan memberi tahu pihak yang tidak dapat dihadiri",4],["Berjanji hadir di dua undangan padahal waktunya bentrok",2],["Menilai urgensi dan peranmu dalam tiap undangan, memberi tahu pihak yang tidak dapat dihadiri, mengusulkan wakil atau jadwal pengganti, dan menghadiri undangan sesuai kesepakatan",5]],"Penilaian urgensi dan pemberitahuan memungkinkan pengaturan wakil atau jadwal pengganti; berjanji hadir di dua tempat yang bentrok menipu dua pihak, sedangkan tidak hadir tanpa kabar merugikan dua pihak.","Profesionalisme"),
t("Anggaran kegiatan tersisa sedikit padahal masih ada kebutuhan penting yang belum terpenuhi. Sikapmu ...",[["Menyusun ulang prioritas kebutuhan, menghitung ulang biaya dengan cermat, melaporkan kondisi itu ke atasan, dan mengusulkan penyesuaian kegiatan sesuai sisa anggaran",5],["Menghabiskan sisa anggaran untuk kebutuhan yang tidak mendesak",3],["Menyusun ulang prioritas kebutuhan dan melaporkan kondisi itu ke atasan",4],["Mengalihkan anggaran dari kegiatan lain tanpa izin",1],["Memakai dana pribadi tanpa catatan dengan harapan diganti nanti",2]],"Prioritas ulang dan laporan ke atasan menjaga kegiatan tetap berjalan dalam batas anggaran yang sah; mengalihkan anggaran tanpa izin melanggar aturan keuangan, sedangkan memakai dana pribadi tanpa catatan menimbulkan masalah pertanggungjawaban.","Profesionalisme"),
t("Sertifikat penghargaan untuk warga salah eja nama dan acara penyerahan akan berlangsung besok. Sikapmu ...",[["Membiarkan kesalahan eja dengan harapan warga tidak memperhatikan",3],["Segera memberi tahu penanggung jawab acara, mengurus perbaikan sertifikat itu, dan memastikan sertifikat yang benar tersedia sebelum acara dimulai",5],["Menyerahkan sertifikat yang salah eja dan meminta warga memaklumi",2],["Segera memberi tahu penanggung jawab acara dan mengurus perbaikan sertifikat itu",4],["Menyembunyikan kesalahan itu dan menyalahkan pihak percetakan di depan warga",1]],"Perbaikan segera sebelum acara menjaga penghargaan tepat bagi penerimanya; menyerahkan sertifikat yang salah eja mengecewakan warga, sedangkan menyalahkan pihak lain di depan warga tidak memperbaiki kesalahan.","Profesionalisme"),
t("Rekanmu dipuji atas ide yang sebenarnya berasal darimu dalam rapat. Sikapmu ...",[["Menjelaskan asal ide itu dengan tenang dan berbasis fakta",4],["Menuduh rekan itu mencuri ide di depan tim dengan emosi",2],["Menjelaskan asal ide itu dengan tenang dan berbasis fakta, menghargai peran rekan dalam mengembangkan ide itu, dan mengusulkan pencatatan kontribusi yang jelas di rapat berikutnya",5],["Menyebarkan cerita bahwa rekan itu selalu mencuri ide orang lain",1],["Mendiamkannya dan merasa kecewa tanpa menyampaikan apa pun",3]],"Penjelasan tenang berbasis fakta meluruskan pengakuan tanpa merusak kerja sama; menuduh dengan emosi memperkeruh suasana tim, sedangkan menyebarkan cerita merusak nama baik rekan tanpa bukti yang disampaikan secara terbuka.","Profesionalisme"),
t("Kamu diminta membimbing rekan baru padahal tugas itu tidak ada dalam tugas pokokmu. Sikapmu ...",[["Menerima tugas itu tetapi tidak pernah meluangkan waktu untuk membimbing",2],["Menerima tugas membimbing itu dan menyusun materi dasar yang dibutuhkan rekan baru",4],["Menerima tugas itu lalu memberikan arahan yang salah kepada rekan baru",1],["Menerima tugas membimbing itu, menyusun materi dasar yang dibutuhkan rekan baru, dan meluangkan waktu terjadwal tanpa mengabaikan tugas pokokmu",5],["Menolak tugas itu karena tidak ada dalam tugas pokokmu",3]],"Bimbingan terjadwal membantu rekan baru cepat mandiri tanpa mengorbankan tugas pokok; menerima tanpa pernah meluangkan waktu mengecewakan rekan baru, sedangkan memberi arahan yang salah merugikan rekan baru dan tim.","Profesionalisme"),
t("Tugas rutinmu dialihkan ke sistem otomatis sehingga peranmu berubah. Sikapmu ...",[["Mengajak rekan lain menolak sistem otomatis itu bersama-sama",1],["Menunggu arahan tanpa mempelajari sistem otomatis itu",3],["Mempelajari sistem otomatis itu dan mengembangkan keterampilan yang dibutuhkan peran baru",4],["Menolak perubahan peran dan tetap bekerja dengan cara lama",2],["Mempelajari sistem otomatis itu, memahami peran barumu, mengembangkan keterampilan yang dibutuhkan peran baru, dan membantu rekan yang masih kesulitan beradaptasi",5]],"Belajar dan mengembangkan keterampilan membuat perubahan sistem menjadi peluang peran yang lebih bernilai; menolak cara baru menghalangi perbaikan layanan, sedangkan mengajak rekan menolak menghambat perubahan untuk seluruh tim.","Profesionalisme"),
t("Kamu diminta menjadi panitia acara kantor di luar tugas pokok menjelang tenggat laporanmu. Sikapmu ...",[["Mendiskusikan beban tugas dengan atasan, menyepakati pembagian waktu yang jelas, dan menyelesaikan laporan serta tugas panitia sesuai kesepakatan",5],["Menerima tugas panitia dan mengorbankan tenggat laporan tanpa memberi tahu",3],["Mendiskusikan beban tugas dengan atasan dan menyepakati pembagian waktu yang jelas",4],["Menerima tugas panitia tetapi tidak mengerjakan laporan maupun tugas panitia",1],["Menolak tugas panitia dengan alasan yang tidak dijelaskan",2]],"Diskusi dan pembagian waktu yang jelas memungkinkan dua tanggung jawab berjalan tanpa saling mengorbankan; menerima tanpa memberi tahu mengorbankan laporan, sedangkan tidak mengerjakan laporan maupun tugas panitia merugikan tim dan acara.","Profesionalisme"),
t("Seorang warga memintamu mengisi formulirnya dengan data yang ia akui tidak benar agar lolos syarat layanan. Sikapmu ...",[["Meminta warga mengisi sendiri formulir itu tanpa menjelaskan akibat data palsu",3],["Menolak mengisi data yang tidak benar, menjelaskan syarat layanan dan akibat data palsu, dan membantu warga memahami cara memenuhi syarat secara sah",5],["Mengisi formulir itu dengan data yang tidak benar karena kasihan pada warga",2],["Menolak mengisi data yang tidak benar dan menjelaskan syarat layanan",4],["Mengisi formulir itu dengan data palsu dan membantu warga menyembunyikannya",1]],"Menolak dan menjelaskan cara yang sah melindungi warga dari akibat data palsu dan menjaga layanan tetap adil; mengisi karena kasihan tetap memalsukan dokumen, sedangkan membantu menyembunyikan memperbesar pelanggaran.","Profesionalisme"),
t("Kamu diminta mempresentasikan hasil kerja tim yang sebagian detailnya belum kamu pahami. Sikapmu ...",[["Mempelajari detail yang belum dipahami dari anggota tim yang mengerjakan",4],["Mengarang penjelasan untuk detail yang belum dipahami agar terlihat menguasai",2],["Mempelajari detail yang belum dipahami dari anggota tim yang mengerjakan, menyiapkan catatan pendukung, dan menyampaikan hal yang belum pasti secara jujur saat presentasi",5],["Menolak presentasi pada saat acara tanpa memberi tahu sebelumnya",1],["Mempresentasikan berdasarkan ringkasan umum tanpa mempelajari detail",3]],"Belajar dari anggota tim dan menyampaikan hal yang belum pasti secara jujur menjaga presentasi tetap akurat; mengarang penjelasan menipu hadirin, sedangkan menolak mendadak mengacaukan acara.","Profesionalisme"),
t("Rekanmu mengajak pulang lebih awal bersama-sama saat atasan sedang tidak ada di kantor. Sikapmu ...",[["Pulang lebih awal sekali karena menganggap tidak ada yang mengawasi",2],["Menolak ajakan itu dan tetap bekerja sampai jam pulang",4],["Pulang lebih awal dan mengajak rekan lain ikut pulang",1],["Menolak ajakan itu, tetap bekerja sampai jam pulang, dan mengingatkan rekan tentang aturan jam kerja dengan baik",5],["Mendiamkan ajakan itu tanpa menjawab dan tetap berada di kantor",3]],"Tetap bekerja sampai jam pulang dan mengingatkan aturan menjaga disiplin sekalipun tidak diawasi; pulang lebih awal karena tidak diawasi melanggar aturan jam kerja, sedangkan mengajak rekan lain memperluas pelanggaran disiplin.","Profesionalisme"),
t("Buku dan peralatan kantor hilang dari ruang penyimpanan yang kamu kelola. Sikapmu ...",[["Menyembunyikan kehilangan itu dan mengubah catatan peminjaman",1],["Mendiamkannya dengan harapan barang itu kembali sendiri",3],["Segera memeriksa catatan peminjaman dan melapor ke atasan",4],["Menyalahkan rekan pemakai ruang penyimpanan tanpa memeriksa catatan",2],["Segera memeriksa catatan peminjaman, melapor ke atasan, dan mengusulkan perbaikan pencatatan serta pengamanan ruang penyimpanan",5]],"Pemeriksaan catatan dan laporan memungkinkan penelusuran yang adil; menyalahkan tanpa memeriksa catatan menuduh tanpa dasar, sedangkan mengubah catatan menghilangkan jejak dan memperburuk kehilangan.","Profesionalisme"),
t("Atasan memintamu menyelesaikan tugas tanpa anggaran dan sumber daya yang memadai. Sikapmu ...",[["Menyusun rencana kerja sesuai sumber daya yang ada, menjelaskan keterbatasan secara jujur kepada atasan, dan mengusulkan skala kegiatan yang realistis",5],["Berjanji menyelesaikan tugas seperti biasa tanpa membahas keterbatasan",3],["Menyusun rencana kerja sesuai sumber daya yang ada dan menjelaskan keterbatasan secara jujur",4],["Mengabaikan tugas itu karena merasa sumber daya tidak memadai",1],["Mengerjakan seadanya tanpa memberi tahu atasan tentang keterbatasan",2]],"Rencana realistis dan penjelasan jujur memungkinkan atasan memutuskan skala yang masuk akal; berjanji seperti biasa tanpa membahas keterbatasan menimbulkan kegagalan yang dapat dicegah, sedangkan mengabaikan tugas mengingkari tanggung jawab.","Profesionalisme"),
