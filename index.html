const TRIK_MODEL=[
{tp:"Pancasila dan nilai",t:"Pancasila dan nilai — Pencocokan Nilai dengan Sila",inti:"Baca kasusnya dulu, tentukan nilai yang diterapkan (bukan bunyi silanya), baru cocokkan ke sila lewat kata kunci.",langkah:["Garis bawahi kata kerja atau keadaan dalam kasus (menolong, bermusyawarah, bersatu, adil).","Cocokkan ke kata kunci sila: 1 Ketuhanan, 2 Kemanusiaan, 3 Persatuan, 4 Kerakyatan, 5 Keadilan.","Bila dua sila terasa cocok, tanya: ini soal satu orang (Sila 2) atau soal kebersamaan untuk semua (Sila 3/5)?"],contoh:"\"Warga menolak pesan provokasi antardaerah dan mengajak menjaga persatuan.\" → Sila ke-3 (menjaga persatuan bersama).",jebakan:"Kasus menolong satu tetangga yang sakit → Sila ke-2 (empati personal), bukan ke-3. Bedakan empati pada satu orang dengan persatuan bersama."},
{tp:"Pancasila dan nilai",t:"Pancasila dan nilai — Penerapan dalam Kasus Sehari-hari",inti:"Soal kasus menguji perbuatan, bukan hafalan bunyi sila — cari apa yang dilakukan tokohnya, lalu tanya nilai apa yang diwujudkan perbuatan itu.",langkah:["Baca tiap opsi, tanya: \"Apa yang DILAKUKAN tokohnya?\"","Buang opsi yang hanya berisi perasaan atau slogan tanpa perbuatan.","Pilih perbuatan yang paling sesuai dengan nilai satu sila tertentu."],contoh:"\"Pemilik usaha memberi upah layak tanpa membeda-bedakan pekerja.\" → Sila ke-5 (keadilan bagi semua).",jebakan:"Opsi yang terdengar mulia tetapi perbuatannya tidak sesuai dengan sila yang ditanya — misalnya \"rajin beribadah\" untuk soal tentang keadilan upah."},
{tp:"Pancasila dan nilai",t:"Pancasila dan nilai — Urutan dan Bunyi Sila",inti:"Hafal urutan 5 sila dengan jembatan keledai, lalu jawab soal bunyi dan urutan dari hafalan itu — jangan menebak dari opsi.",langkah:["Ucapkan jembatan keledai: \"Kakekku Pergi Ke Kebun\" (Ketuhanan – Kemanusiaan – Persatuan – Kerakyatan – Keadilan).","Tulis nomor silanya di kertas coretan sebelum membaca opsi.","Cocokkan nomor itu dengan opsi yang ada."],contoh:"\"Sila yang berbunyi 'Keadilan sosial bagi seluruh rakyat Indonesia' adalah sila ...\" → kelima.",jebakan:"Bunyi sila ke-4 yang panjang (\"Kerakyatan yang dipimpin oleh hikmat kebijaksanaan dalam permusyawaratan/perwakilan\") sering dipotong di opsi — baca sampai habis sebelum memilih."},
{tp:"UUD 1945 dan lembaga negara",t:"UUD 1945 dan lembaga negara — Hafalan Pasal",inti:"Hafal nomor pasal + 1 kata kunci isinya (27 = persamaan kedudukan, 28 = berserikat, 29 = agama, 30 = pertahanan, 31 = pendidikan, 33 = perekonomian, 35 = bendera, 36 = bahasa).",langkah:["Baca soal, tebak pasal dari kata kuncinya sebelum melihat opsi.","Cocokkan tebakanmu dengan opsi yang ada.","Kalau ragu antara 2 pasal, eliminasi opsi yang pasalnya jelas salah topik."],contoh:"\"Fakir miskin dan anak terlantar dipelihara oleh negara\" → Pasal 34.",jebakan:"Pasal 27 vs Pasal 28 — Pasal 27 = persamaan kedudukan dan hak-kewajiban warga negara; Pasal 28 = kemerdekaan berserikat, berkumpul, dan berpendapat. Jangan tertukar."},
{tp:"UUD 1945 dan lembaga negara",t:"UUD 1945 dan lembaga negara — Fungsi Lembaga",inti:"Hafal 1 fungsi khas tiap lembaga (DPR = membentuk undang-undang, MK = menguji undang-undang, MA = menguji peraturan di bawah undang-undang, BPK = memeriksa keuangan negara, KY = menjaga kehormatan hakim, DPD = mewakili daerah).",langkah:["Baca soal, cari kata kerja fungsinya (membentuk, menguji, memeriksa, mengusulkan).","Cocokkan kata kerja itu dengan lembaga yang memilikinya.","Bila dua lembaga terasa mirip, tanya: apa objeknya — undang-undang (MK) atau peraturan di bawah undang-undang (MA)?"],contoh:"\"Lembaga yang menguji peraturan pemerintah terhadap undang-undang adalah ...\" → Mahkamah Agung.",jebakan:"MK vs MA — MK menguji undang-undang terhadap UUD 1945; MA menguji peraturan di bawah undang-undang terhadap undang-undang. Objek ujinya berbeda."},
{tp:"UUD 1945 dan lembaga negara",t:"UUD 1945 dan lembaga negara — Amandemen dan Perubahan UUD",inti:"Hafal angka-angka Pasal 37: usul perubahan oleh sekurang-kurangnya 1/3 anggota MPR, sidang dihadiri sekurang-kurangnya 2/3 anggota MPR, bentuk NKRI tidak dapat diubah.",langkah:["Bedakan tiga angka itu: 1/3 = mengusulkan, 2/3 = menghadiri sidang, bentuk NKRI = tidak dapat diubah.","Baca soal dengan teliti: yang ditanya usul, kehadiran sidang, atau hal yang tidak dapat diubah?","Cocokkan dengan angka yang tepat."],contoh:"\"Usul perubahan pasal UUD dapat diajukan oleh sekurang-kurangnya ...\" → 1/3 anggota MPR.",jebakan:"Menjawab 2/3 untuk soal usul perubahan — 2/3 adalah syarat kehadiran sidang, bukan syarat pengajuan usul."},
{tp:"Sejarah nasional",t:"Sejarah nasional — Garis Waktu dan Urutan Peristiwa",inti:"Buat garis waktu: 1908, 1926, 1928, 1945 (1 Juni, 22 Juni, 17 Agt, 18 Agt), 1946, 1947, 1948, 1949, 1950, 1966, 1998. Soal sejarah paling sering menguji urutan.",langkah:["Tulis garis waktu singkat di kertas coretan sebelum menjawab soal sejarah.","Letakkan tiap peristiwa di garis itu, baru jawab urutan atau sebab-akibatnya.","Jangan menghafal tahun lepas — hafal urutannya."],contoh:"\"Urutan peristiwa: (a) Sumpah Pemuda, (b) Bandung Lautan Api, (c) Kembalinya Indonesia menjadi negara kesatuan.\" → 1928 → 1946 → 1950.",jebakan:"1949 vs 1950 — 27 Desember 1949 = penyerahan kedaulatan (RIS terbentuk); 17 Agustus 1950 = RIS berakhir dan Indonesia kembali menjadi negara kesatuan."},
{tp:"Sejarah nasional",t:"Sejarah nasional — Tanggal dan Tokoh Kunci",inti:"Hafal pasangan tanggal–peristiwa dan tokoh–peristiwa yang paling sering keluar (28 Oktober 1928 = Sumpah Pemuda, 1 Maret 1949 = Serangan Umum di Yogyakarta, 23 Maret 1946 = Bandung Lautan Api, Ambarawa = Soedirman).",langkah:["Bila soal menyebut tanggal, tebak peristiwanya sebelum membaca opsi.","Bila soal menyebut peristiwa, tebak tanggal atau tokohnya sebelum membaca opsi.","Cocokkan tebakanmu dengan opsi; eliminasi tanggal yang jelas salah tahun."],contoh:"\"Pertempuran Ambarawa pada akhir 1945 dipimpin oleh ...\" → Soedirman.",jebakan:"Tanggal-tanggal 1945 yang berdekatan — 1 Juni (pidato Soekarno), 22 Juni (Piagam Jakarta), 16 Agustus (Rengasdengklok), 17 Agustus (Proklamasi), 18 Agustus (UUD disahkan). Satu tanggal tertukar, jawaban ikut salah."},
{tp:"Sejarah nasional",t:"Sejarah nasional — Perjanjian dan Isinya",inti:"Hafal perjanjian + 1 kata kunci isinya (Linggarjati = pengakuan de facto atas Jawa, Madura, Sumatra; Renville = 17 Januari 1948; Roem-Royen = 7 Mei 1949, jalan kembali ke Yogyakarta; KMB = penyerahan kedaulatan 27 Desember 1949).",langkah:["Baca soal, tebak perjanjian dari kata kunci isinya atau tanggalnya.","Cocokkan dengan opsi yang ada.","Bila ragu, letakkan perjanjian itu di garis waktu — urutannya sering membantu."],contoh:"\"Perjanjian yang membuka jalan bagi kembalinya pemerintahan RI ke Yogyakarta adalah ...\" → Roem-Royen.",jebakan:"Linggarjati vs Renville — keduanya perjanjian dengan Belanda, tetapi isi dan tanggalnya berbeda. Hafal keduanya dengan kata kunci masing-masing."},
{tp:"Bela Negara",t:"Bela Negara — Pasal dan Sistem Pertahanan",inti:"Hafal Pasal 30 per ayat: ayat (1) = hak dan kewajiban ikut serta dalam usaha pertahanan dan keamanan negara; ayat (2) = sistem pertahanan dan keamanan rakyat semesta, TNI dan Polri kekuatan utama, rakyat kekuatan pendukung; ayat (3) = TNI terdiri atas AD, AL, AU; ayat (4) = Polri menjaga keamanan dan ketertiban masyarakat.",langkah:["Baca soal, tentukan ayat mana yang ditanya dari kata kuncinya.","Cocokkan dengan hafalan per ayat itu.","Bedakan Pasal 27 ayat (3) (upaya pembelaan negara) dengan Pasal 30 ayat (1) (usaha pertahanan dan keamanan negara)."],contoh:"\"TNI terdiri atas Angkatan Darat, Angkatan Laut, dan Angkatan Udara\" → Pasal 30 ayat (3).",jebakan:"Frasa \"upaya pembelaan negara\" (Pasal 27 ayat 3) vs \"usaha pertahanan dan keamanan negara\" (Pasal 30 ayat 1) — dua pasal berbeda, jangan tertukar."},
{tp:"Bela Negara",t:"Bela Negara — Ancaman Militer dan Non-Militer",inti:"Ancaman militer = kekerasan bersenjata (agresi, invasi, pemberontakan bersenjata, sabotase, spionase). Ancaman non-militer = tanpa senjata, per bidang (ideologi, politik, ekonomi, sosial budaya, teknologi).",langkah:["Tanya: apakah ancaman itu memakai kekerasan bersenjata? Ya → militer; tidak → non-militer.","Untuk non-militer, tentukan bidangnya dari isinya (krisis ekonomi → ekonomi; paham bertentangan dengan Pancasila → ideologi).","Ancaman hibrida = gabungan militer dan non-militer."],contoh:"\"Krisis ekonomi berkepanjangan dan ketergantungan pada negara lain\" → ancaman non-militer bidang ekonomi.",jebakan:"Spionase dan sabotase terdengar \"tidak berperang\" tetapi termasuk ancaman militer karena menyasar pertahanan negara dengan cara rahasia atau merusak."},
{tp:"Bela Negara",t:"Bela Negara — Wujud dalam Kehidupan Sehari-hari",inti:"Bela negara di soal = perbuatan nyata sesuai profesi dan keadaan (melapor, menjaga lingkungan, belajar sungguh-sungguh, mengabdi sesuai profesi) — bukan sekadar perasaan cinta tanah air.",langkah:["Baca tiap opsi, tanya: \"Apa yang DILAKUKAN tokohnya?\"","Pilih opsi yang berisi aksi konkret dan sesuai hukum.","Buang opsi yang hanya berisi perasaan, slogan, atau tindakan melanggar hukum."],contoh:"\"Dokter mengabdi di daerah terpencil dan melayani masyarakat dengan sungguh-sungguh.\" → pengabdian sesuai profesi.",jebakan:"Opsi \"sangat mencintai tanah air\" tanpa aksi apa pun — terdengar benar, tapi bukan jawaban bela negara dalam soal. Cari perbuatannya."},
{tp:"Integritas",t:"Integritas — Gratifikasi dan Korupsi",inti:"Hafal angka dan rumusan kunci: gratifikasi senilai Rp10.000.000 atau lebih dianggap suap (pembuktian terbalik); gratifikasi wajib dilaporkan ke KPK paling lambat 30 hari kerja; korupsi = memperkaya diri secara melawan hukum yang merugikan keuangan negara.",langkah:["Bila soal menyebut angka, cocokan dengan hafalan angka itu (10 juta, 30 hari kerja).","Bila soal menyebut pemberian dari pihak berkepentingan, tanya: berhubungan dengan jabatan? Ya → gratifikasi, tolak atau laporkan.","Bila soal menyebut perbuatan memperkaya diri yang merugikan keuangan negara → korupsi."],contoh:"\"Pejabat menerima uang dari rekanan proyek agar perusahaannya dimenangkan.\" → suap/korupsi — tolak dan laporkan.",jebakan:"\"Gratifikasi di bawah Rp10.000.000 tidak perlu dilaporkan\" — salah. Gratifikasi yang berhubungan dengan jabatan tetap wajib dilaporkan berapa pun nilainya."},
{tp:"Integritas",t:"Integritas — Kolusi, Nepotisme, dan Konflik Kepentingan",inti:"Bedakan tiga istilah ini: kolusi = permufakatan melawan hukum dengan pihak lain; nepotisme = menguntungkan keluarga/kroni; konflik kepentingan = kepentingan pribadi memengaruhi keputusan jabatan.",langkah:["Cari siapa yang diuntungkan: pihak lain lewat persekongkolan → kolusi; keluarga/kroni → nepotisme.","Bila soalnya tentang situasi (bukan perbuatan), tanya: apakah kepentingan pribadi dapat memengaruhi keputusan? Ya → konflik kepentingan.","Jawaban untuk konflik kepentingan: ungkapkan dan hindari keterlibatan dalam keputusan itu."],contoh:"\"Pejabat memberi jabatan kepada kerabat tanpa seleksi yang semestinya.\" → nepotisme.",jebakan:"Kasus pejabat menunjuk perusahaan keluarga bisa dibaca sebagai konflik kepentingan maupun nepotisme — baca pertanyaannya: bila yang ditanya perbuatannya, jawab nepotisme; bila yang ditanya situasinya, jawab konflik kepentingan."},
{tp:"Integritas",t:"Integritas — Sikap dalam Kasus Godaan",inti:"Pilih opsi yang menolak sejak awal, walau kecil dan walau tidak ada yang melihat — lalu melapor lewat jalur resmi bila perlu.",langkah:["Cari opsi penolakan yang tegas dan langsung.","Waspada opsi \"terima dulu, lapor nanti\" — menerima tetap menerima.","Bila ada opsi melapor lewat jalur resmi, itu penguat (bukan pengganti penolakan)."],contoh:"\"Rekan meminta kamu mengisi daftar hadir untuknya padahal ia tidak masuk.\" → Tolak dengan sopan dan jelaskan aturannya.",jebakan:"\"Terima dulu lalu laporkan ke atasan\" — terdengar jujur karena melapor, tapi gratifikasi atau kecurangannya sudah terjadi. Salah."},
{tp:"Bahasa Indonesia",t:"Bahasa Indonesia — Kata Baku",inti:"Hafal pasangan baku–tidak baku yang sering keluar: apotek (bukan apotik), praktik (bukan praktek), objek (bukan obyek), risiko (bukan resiko), sistem (bukan sistim), kualitas (bukan kwalitas), nasihat (bukan nasehat), izin (bukan ijin), sekadar (bukan sekedar), cedera (bukan cidera).",langkah:["Baca tiap opsi, cari kata yang bentuknya kamu kenali sebagai baku.","Bila ragu, ucapkan kata itu pelan — bentuk baku biasanya mengikuti lafal yang lebih sederhana dan sesuai KBBI.","Jangan terkecoh kata yang sering dipakai sehari-hari tetapi tidak baku."],contoh:"\"Kata baku dari 'sekedar' adalah ...\" → sekadar.",jebakan:"Kata yang lazim diucapkan sehari-hari belum tentu baku — mis. \"nasehat\" terdengar benar, tetapi bentuk bakunya \"nasihat\"."},
{tp:"Bahasa Indonesia",t:"Bahasa Indonesia — Ejaan, Kata Depan, dan Tanda Baca",inti:"Hafal tiga aturan: kata depan 'di'/'ke' ditulis terpisah dari kata yang mengikutinya (di rumah, ke sekolah); awalan 'di-' ditulis serangkai (dibaca); huruf kapital untuk awal kalimat, nama orang, dan nama geografi.",langkah:["Tentukan dulu: itu kata depan (tempat/arah) atau awalan (kata kerja pasif)?","Kata depan → pisah; awalan → serangkai.","Untuk huruf kapital, cek tiga hal: awal kalimat, nama orang, nama tempat."],contoh:"\"Buku itu dibaca oleh Andi di rumah.\" → 'dibaca' serangkai, 'di rumah' terpisah.",jebakan:"\"dirumah\" dan \"di baca\" — dua kesalahan yang berlawanan: kata depan yang diserangkaikan dan awalan yang dipisahkan. Tentukan jenisnya dulu sebelum memilih."},
{tp:"Bahasa Indonesia",t:"Bahasa Indonesia — Kalimat Efektif dan Bacaan",inti:"Kalimat efektif = hemat kata, tidak mengulang unsur yang sama (hindari \"para siswa-siswa\", \"naik ke atas\"). Untuk bacaan, baca pertanyaannya dulu, baru cari gagasan utamanya di teks.",langkah:["Untuk kalimat efektif: cari pengulangan atau pemborosan kata, buang opsi yang mengandungnya.","Untuk bacaan: baca kalimat pertanyaan dulu, catat kata kuncinya, lalu baca teks sambil mencari kata kunci itu.","Simpulan harus didukung seluruh isi bacaan — buang simpulan yang melebih-lebihkan isi teks."],contoh:"\"Para hadirin naik ke atas panggung.\" → tidak efektif ('naik ke atas' boros kata).",jebakan:"Simpulan yang memakai kata \"pasti\", \"hanya\", atau \"selalu\" padahal teksnya tidak sekuat itu — simpulan yang melebih-lebihkan isi bacaan hampir selalu salah."},
{tp:"NKRI & Bhinneka Tunggal Ika",t:"NKRI & Bhinneka Tunggal Ika — Lambang, Bendera, dan Lagu Kebangsaan",inti:"Hafal paket angka dan pasal: bulu Garuda 17-8-19-45 (sayap-ekor-pangkal ekor-leher); Pasal 35 = bendera Sang Merah Putih; Pasal 36A = lambang Garuda Pancasila; Pasal 36B = lagu Indonesia Raya; Indonesia Raya = W. R. Supratman.",langkah:["Bila soal menyebut bagian tubuh Garuda, cocokan dengan angka 17-8-19-45.","Bila soal menyebut pasal, tebak isinya dari nomornya sebelum membaca opsi.","Bedakan Pasal 36 (bahasa negara), 36A (lambang negara), dan 36B (lagu kebangsaan)."],contoh:"\"Jumlah bulu pada pangkal ekor Garuda Pancasila adalah ...\" → 19 helai.",jebakan:"Bulu ekor (8) vs bulu pangkal ekor (19) — dua bagian berbeda yang sering tertukar. Hafal urutannya: sayap 17, ekor 8, pangkal ekor 19, leher 45."},
{tp:"NKRI & Bhinneka Tunggal Ika",t:"NKRI & Bhinneka Tunggal Ika — Otonomi Daerah dan Urusan Pemerintahan",inti:"Bedakan tiga istilah: desentralisasi = penyerahan urusan kepada daerah otonom; dekonsentrasi = pelimpahan wewenang kepada gubernur sebagai wakil pemerintah pusat; tugas pembantuan = penugasan dari pusat kepada daerah. Urusan absolut pusat: politik luar negeri, pertahanan, keamanan, yustisi, moneter dan fiskal nasional, agama.",langkah:["Cari kata kuncinya: \"daerah otonom\" → desentralisasi; \"gubernur sebagai wakil pemerintah pusat\" → dekonsentrasi; \"penugasan\" → tugas pembantuan.","Untuk urusan absolut, hafal daftarnya — bila soalnya menyebut pertahanan atau politik luar negeri, itu urusan pusat.","Otonomi daerah tetap dalam bingkai NKRI — buang opsi yang menyebut pelepasan daerah dari negara kesatuan."],contoh:"\"Penyerahan urusan pemerintahan kepada daerah otonom disebut ...\" → desentralisasi.",jebakan:"Desentralisasi vs dekonsentrasi — keduanya pelimpahan dari pusat, tetapi penerimanya berbeda: daerah otonom vs gubernur sebagai wakil pemerintah pusat."},
{tp:"NKRI & Bhinneka Tunggal Ika",t:"NKRI & Bhinneka Tunggal Ika — Keberagaman dalam Kasus",inti:"Soal kasus keberagaman selalu dijawab dengan sikap menghormati perbedaan dan tetap bekerja sama — bukan menghindar, memaksa, atau membeda-bedakan.",langkah:["Cari opsi yang menghormati perbedaan DAN tetap bertindak (bekerja sama, memberi kesempatan, menjaga kerukunan).","Buang opsi yang menghindar, memaksa orang lain mengikuti kebiasaanmu, atau membeda-bedakan layanan.","Buang juga opsi yang hanya \"menghormati\" tetapi tidak berbuat apa-apa bila ada opsi yang menghormati sekaligus bertindak."],contoh:"\"Warga berbagai suku dan agama bekerja bersama membangun pos ronda.\" → persatuan dalam keberagaman.",jebakan:"Opsi \"menghormati perbedaan dengan tidak ikut campur\" — terdengar toleran, tetapi menghindar bukan wujud persatuan. Persatuan menuntut kerja sama, bukan jarak."},
{tp:"Sinonim dan antonim",t:"Sinonim dan antonim — Model Sinonim (Cari Padanan Arti)",inti:"Cari kata yang artinya paling dekat dengan kata soal, bukan kata yang topiknya mirip.",langkah:["Ucapkan arti kata soal dengan kata-katamu sendiri sebelum melihat opsi.","Buang opsi yang artinya berlawanan atau tidak berhubungan.","Bandingkan sisa opsi: pilih yang maknanya paling sama, bukan yang paling sering didengar."],contoh:"Sinonim \"akurat\" → \"tepat\" (bukan \"cepat\" — cepat soal waktu, akurat soal ketepatan).",jebakan:"Opsi yang sering muncul bersama kata soal dalam kalimat sehari-hari, padahal artinya berbeda — mis. \"akurat\" dengan \"cepat\" (laporan akurat dan cepat) — kedekatan dalam kalimat bukan kesamaan arti."},
{tp:"Sinonim dan antonim",t:"Sinonim dan antonim — Model Antonim (Balikkan Arti, Lalu Cari)",inti:"Balikkan dulu arti kata soal di kepala, baru cari opsi yang cocok dengan arti yang dibalik itu.",langkah:["Tentukan arti kata soal, lalu sebutkan lawannya dengan kata-katamu sendiri.","Cari opsi yang cocok dengan lawan arti itu.","Bila dua opsi terasa berlawanan, pilih yang lawannya paling langsung (bukan sekadar berbeda)."],contoh:"Antonim \"hemat\" → \"boros\" (bukan \"kaya\" — kaya bukan lawan hemat, boros yang lawan hemat).",jebakan:"Opsi yang hanya \"berbeda\" tapi bukan lawan arti — mis. antonim \"hemat\" dijawab \"banyak\" — banyak bukan lawan hemat."},
{tp:"Sinonim dan antonim",t:"Sinonim dan antonim — Model Kata Serapan (Kenali Akar Katanya)",inti:"Bila kata soal terasa asing, pecah dari akar katanya atau dari kata serumpun yang sudah dikenal, baru tebak artinya.",langkah:["Cari kata serumpun yang dikenal (mis. \"objektif\" serumpun dengan \"objek\" — sesuatu yang nyata, di luar perasaan).","Tebak arti dari akar itu, lalu cocokkan dengan opsi.","Bila tetap tidak tahu, buang opsi yang jelas berlawanan dengan tebakanmu, lalu pilih yang paling masuk akal dari sisanya."],contoh:"Kata \"objektif\" serumpun dengan \"objek\" (nyata, dapat diamati) → artinya berdasarkan fakta, bukan perasaan.",jebakan:"Menebak dari bunyi yang mirip — mis. kata serapan yang bunyinya mirip kata lain padahal artinya jauh berbeda. Kemiripan bunyi bukan kemiripan arti."},
{tp:"Analogi",t:"Analogi — Model Fungsi dan Alat",inti:"Rumuskan \"alat X dipakai untuk Y\", lalu terapkan kalimat yang sama persis ke pasangan kedua.",langkah:["Tulis hubungan pasangan soal: \"X dipakai untuk Y\" atau \"X berfungsi untuk Y\".","Uji tiap opsi dengan kalimat yang sama persis.","Pilih yang hubungannya identik — jangan pilih karena bendanya terkait."],contoh:"\"Kunci : Membuka = Gunting : …\" → hubungan \"alat dipakai untuk …\" → Memotong.",jebakan:"Memilih opsi yang bendanya terkait tapi fungsinya berbeda — mis. \"Gunting : Kertas\" (kertas memang dipotong gunting, tapi hubungannya bukan alat–fungsi, melainkan alat–benda yang dikerjakan)."},
{tp:"Analogi",t:"Analogi — Model Bagian–Keseluruhan dan Jenis",inti:"Bedakan dua hubungan yang mirip: \"X bagian dari Y\" (jari–tangan) vs \"X salah satu jenis Y\" (sepeda–kendaraan) — jangan tertukar.",langkah:["Tanya: apakah X adalah potongan/bagian dari Y, atau X adalah salah satu macam dari Y?","Terapkan jenis hubungan yang sama ke pasangan kedua.","Buang opsi yang hubungannya jenis lain, walau katanya terkait."],contoh:"\"Jari : Tangan = Daun : …\" → bagian–keseluruhan → Pohon (bukan \"tumbuhan\" — pohon adalah keseluruhan yang daunnya bagian, sedangkan tumbuhan terlalu umum untuk pasangan ini).",jebakan:"Menjawab dengan kata yang masih \"bagian\" juga — mis. \"Daun : Ranting\" — ranting bukan keseluruhan dari daun, melainkan bagian lain dari pohon yang sama."},
{tp:"Analogi",t:"Analogi — Model Sebab–Akibat dan Perkembangan",inti:"Periksa arahnya: X menyebabkan Y, atau X berubah menjadi Y — hubungan yang dibalik arahnya adalah jawaban salah.",langkah:["Tentukan arahnya: sebab → akibat, atau tahap awal → tahap akhir.","Uji tiap opsi dengan arah yang sama.","Buang opsi yang arahnya terbalik (akibat → sebab, atau tahap akhir → tahap awal)."],contoh:"\"Berudu : Katak = Ulat : …\" → tahap awal → tahap akhir → Kupu-kupu.",jebakan:"Opsi yang benar bendanya tapi salah tahapnya — mis. \"Berudu : Telur\" — telur adalah tahap sebelum berudu, arahnya terbalik."},
{tp:"Logika dan silogisme",t:"Logika dan silogisme — Model Jika–Maka (Modus Ponens dan Modus Tollens)",inti:"\"Jika P maka Q\" hanya memberi dua kesimpulan yang pasti: P terjadi → Q terjadi; Q tidak terjadi → P tidak terjadi. Selain itu, tidak ada kesimpulan pasti.",langkah:["Kenali bentuknya: P (syarat) dan Q (akibat).","Bila soal menyatakan P terjadi → simpulkan Q. Bila soal menyatakan Q tidak terjadi → simpulkan P tidak terjadi.","Bila soal menyatakan Q terjadi atau P tidak terjadi → tidak ada kesimpulan pasti (jangan memaksakan)."],contoh:"\"Jika hujan, jalan basah. Jalan tidak basah.\" → Tidak hujan (modus tollens).",jebakan:"\"Jalan basah, maka hujan\" — jalan bisa basah karena disiram. Q terjadi tidak membuktikan P terjadi."},
{tp:"Logika dan silogisme",t:"Logika dan silogisme — Model Semua, Sebagian, Tidak Ada",inti:"Gambar 2 lingkaran di kepala: \"semua\" berarti lingkaran kecil di dalam lingkaran besar; \"sebagian\" berarti dua lingkaran beririsan; \"tidak ada\" berarti dua lingkaran terpisah.",langkah:["Gambar hubungan tiap premis sebagai lingkaran.","Uji tiap kesimpulan terhadap gambar itu — kesimpulan benar hanya bila pasti cocok dengan gambarnya.","Buang kesimpulan yang membalik premis (\"Semua A adalah B\" dibalik menjadi \"Semua B adalah A\") atau yang mengubah \"sebagian\" menjadi \"semua\"."],contoh:"\"Semua burung bersayap. Merpati adalah burung.\" → Merpati bersayap.",jebakan:"Dari \"Sebagian A adalah B\" lalu menyimpulkan \"Sebagian B adalah A\" memang boleh, tetapi menyimpulkan \"Semua B adalah A\" jelas salah — \"sebagian\" tidak pernah menjadi \"semua\"."},
{tp:"Logika dan silogisme",t:"Logika dan silogisme — Model Rantai dan Negasi Kuantor",inti:"Untuk rantai, sambung ujung ke ujung (A → B → C, maka A → C). Untuk negasi, hafal pasangannya: \"tidak semua\" = \"ada yang tidak\"; \"tidak ada yang tidak\" = \"semua\".",langkah:["Untuk rantai: tulis mata rantainya berurutan, lalu sambungkan ujung pertama ke ujung terakhir.","Untuk negasi: ubah kalimat bernegasi menjadi kalimat positif yang setara sebelum menyimpulkan.","Periksa tiap kata \"semua/sebagian/tidak\" di kesimpulan — satu kata kuantor yang berubah, kesimpulan bisa salah."],contoh:"\"Tidak ada siswa yang tidak membawa buku. Andi adalah siswa.\" → \"Tidak ada yang tidak membawa\" = semua membawa → Andi membawa buku.",jebakan:"Membaca \"tidak semua lulus\" sebagai \"semua tidak lulus\" — padahal artinya hanya \"ada yang tidak lulus\"; sebagian yang lain bisa saja lulus."},
{tp:"Penalaran analitis",t:"Penalaran analitis — Model Urutan dan Peringkat",inti:"Tulis urutannya sebagai garis (paling tinggi/paling cepat di ujung kiri), isi dari ujung yang pasti, baru jawab yang ditanya.",langkah:["Tulis semua perbandingan sebagai tanda > atau < dalam satu baris.","Sambungkan baris-baris itu menjadi satu urutan lengkap.","Baru jawab: paling tinggi/rendah, urutan ke berapa, atau siapa di tengah."],contoh:"\"A lebih tinggi dari B. B lebih tinggi dari C. D lebih rendah dari C.\" → A > B > C > D → paling tinggi A, paling rendah D.",jebakan:"Menggabungkan dua rantai yang tidak terhubung — mis. A > B dan C > D tanpa penghubung antara B dan C — urutan gabungannya tidak dapat dipastikan. Periksa apakah rantainya benar-benar tersambung."},
{tp:"Penalaran analitis",t:"Penalaran analitis — Model Jadwal dan Hari",inti:"Tulis 5–7 kotak hari, isi yang pasti dulu, silang hari yang dilarang, baru isi sisanya dari petunjuk \"sehari sebelum/sesudah\".",langkah:["Gambar kotak Senin sampai Jumat (atau sesuai soal).","Isi kegiatan yang harinya sudah pasti, dan silang hari yang dilarang untuk tiap kegiatan.","Gunakan petunjuk \"sehari sebelum/sesudah\" untuk mengisi kotak yang tersisa."],contoh:"\"Rapat 2 hari setelah pelatihan. Pelatihan hari Rabu.\" → rapat hari Jumat (Kamis = 1 hari setelah, Jumat = 2 hari setelah).",jebakan:"Menghitung hari dengan cara \"termasuk hari ini\" — \"2 hari setelah Rabu\" adalah Jumat, bukan Kamis. Hitung dengan lompatan hari, bukan dengan mengikutsertakan hari awal."},
{tp:"Penalaran analitis",t:"Penalaran analitis — Model Posisi (Duduk, Lantai, Antrean)",inti:"Gambar kotak posisinya (kursi berjajar, lantai gedung, atau antrean), isi dari posisi ujung dan posisi tengah yang pasti, baru isi sisanya.",langkah:["Gambar kotak sesuai jumlah posisi, beri label kiri–kanan atau bawah–atas.","Isi posisi yang pasti: ujung, tengah, \"tepat di atas/di bawah\", \"tepat di depan/di belakang\".","Isi sisa posisi dengan eliminasi: yang belum terpakai dan cocok dengan petunjuk, itulah penghuninya."],contoh:"\"Gedung 3 lantai. Toko di lantai 1. Kantor tepat di atas toko. Gudang di lantai paling atas.\" → kantor lantai 2, gudang lantai 3.",jebakan:"\"Di sebelah kanan\" dan \"tepat di sebelah kanan\" berbeda — yang pertama bisa berjarak, yang kedua harus bersebelahan langsung. Baca kata \"tepat\" baik-baik."},
{tp:"Deret angka",t:"Deret angka — Model Selisih",inti:"Tulis selisih antar suku dulu — bila selisihnya tetap, deret selesai; bila selisihnya berubah beraturan, lanjutkan pola selisihnya.",langkah:["Tulis selisih antar suku, kiri ke kanan.","Bila selisih tetap → tambah/kurangi dengan selisih itu.","Bila selisih berubah → cari pola selisihnya (bertambah tetap, dikali, atau bilangan ganjil berurutan), lalu lanjutkan."],contoh:"\"4, 7, 10, 13, …\" → selisih tetap 3 → 16.",jebakan:"Langsung menebak pola kali atau kuadrat sebelum menulis selisihnya — sebagian besar deret selesai di langkah selisih, dan menebak pola rumit duluan hanya membuang waktu."},
{tp:"Deret angka",t:"Deret angka — Model Perkalian dan Pangkat",inti:"Bila selisihnya tidak beraturan dan angkanya tumbuh cepat, cek rasio (dikali berapa) atau pola kali-lalu-tambah/kurang, baru pikirkan kuadrat dan pangkat tiga.",langkah:["Bagi tiap suku dengan suku sebelumnya — bila hasilnya tetap, itu rasionya.","Bila tidak tetap, cek pola \"kali lalu tambah/kurang tetap\" (mis. ×2 − 1, ×3 + 2).","Bila belum ketemu, cek kuadrat (1, 4, 9, 16, …) atau pangkat tiga (1, 8, 27, 64, …)."],contoh:"\"3, 9, 27, 81, …\" → rasio tetap ×3 → 243.",jebakan:"Mengira deret kali-lalu-tambah sebagai deret rasio murni — mis. \"2, 5, 11, 23, …\" (×2 + 1) dijawab dengan mengalikan 23 × 2 = 46, padahal jawabannya 23 × 2 + 1 = 47. Selalu periksa sisa tambah/kurangnya."},
{tp:"Deret angka",t:"Deret angka — Model Gabungan dan Selang-Seling",inti:"Bila satu pola tidak cocok untuk semua suku, pisahkan suku ganjil dan suku genap — sering kali ada dua deret yang diselang-seling.",langkah:["Pisahkan suku pada posisi ganjil (ke-1, 3, 5, …) dan posisi genap (ke-2, 4, 6, …).","Cari pola masing-masing deret secara terpisah.","Tentukan posisi suku yang ditanya (ganjil atau genap), lalu lanjutkan deret yang sesuai."],contoh:"\"2, 20, 4, 18, 6, 16, …\" → ganjil: 2, 4, 6 (+2); genap: 20, 18, 16 (−2); suku ke-7 ganjil → 8.",jebakan:"Melanjutkan deret yang salah — suku berikutnya harus mengikuti deret sesuai posisinya, bukan deret yang terakhir terlihat. Hitung dulu posisi suku yang ditanya."},
{tp:"Hitungan dan persen",t:"Hitungan dan persen — Model Persen ke Pecahan",inti:"Ubah persen ke pecahan sederhana (25% = 1/4, 20% = 1/5, 12,5% = 1/8, 75% = 3/4), lalu hitung dengan pembagian yang lebih mudah.",langkah:["Ubah persen menjadi pecahan sederhana.","Kalikan atau bagi sesuai soal.","Cek kewajaran: persen di bawah 100% hasilnya harus lebih kecil dari angka awal."],contoh:"\"25% dari 840\" → 1/4 × 840 = 210.",jebakan:"Tertukar 25% dengan 2,5% karena terburu-buru membaca soal — selisihnya 10 kali lipat. Baca angka persennya dua kali sebelum menghitung."},
{tp:"Hitungan dan persen",t:"Hitungan dan persen — Model Pecahan dan Desimal",inti:"Samakan penyebut dulu untuk penjumlahan/pengurangan pecahan, dan samakan jumlah angka desimal dulu untuk perkalian desimal — jangan menghitung dengan penyebut berbeda.",langkah:["Untuk tambah/kurang pecahan: samakan penyebut dengan KPK, lalu jumlahkan/kurangkan pembilangnya.","Untuk kali pecahan: kalikan pembilang dengan pembilang, penyebut dengan penyebut, lalu sederhanakan.","Untuk desimal: hitung seperti bilangan bulat, lalu letakkan koma sesuai jumlah angka di belakang koma."],contoh:"\"1/2 + 1/3\" → samakan penyebut 6: 3/6 + 2/6 = 5/6.",jebakan:"Menjumlahkan pembilang dengan pembilang dan penyebut dengan penyebut (1/2 + 1/3 dijawab 2/5) — itu salah. Penyebut harus disamakan dulu, pembilang yang dijumlahkan."},
{tp:"Hitungan dan persen",t:"Hitungan dan persen — Model Diskon Bertingkat dan Bunga Tunggal",inti:"Diskon kedua dihitung dari harga yang sudah didiskon, bukan dari harga awal; bunga tunggal dihitung dari modal awal dikali persen dikali waktu.",langkah:["Diskon bertingkat: hitung harga setelah diskon pertama, lalu hitung diskon kedua dari harga itu.","Bunga tunggal: bunga = modal × persen × waktu (tahun), lalu jumlah akhir = modal + bunga.","Jangan menjumlahkan persen diskon bertingkat (20% + 10% bukan 30% dari harga awal)."],contoh:"\"Harga Rp200.000, diskon 20% lalu 10%.\" → 200.000 × 0,8 = 160.000, lalu 160.000 × 0,9 = Rp144.000.",jebakan:"Menjumlahkan diskon (20% + 10% = 30%, lalu 200.000 × 0,7 = Rp140.000) — salah, karena diskon kedua dihitung dari Rp160.000, bukan dari Rp200.000."},
{tp:"Perbandingan dan soal cerita",t:"Perbandingan dan soal cerita — Model Perbandingan Senilai",inti:"Bila satu besaran naik, besaran lain ikut naik sebanding — cari nilai satu satuan dulu, baru kalikan ke jumlah yang ditanya.",langkah:["Tulis yang diketahui dan yang ditanya dalam satu baris.","Cari nilai satu satuan (harga 1 buah, jarak 1 jam, dan sejenisnya).","Kalikan nilai satu satuan itu dengan jumlah yang ditanya."],contoh:"\"Harga 3 buku Rp45.000. Harga 5 buku?\" → 1 buku = Rp15.000 → 5 buku = Rp75.000.",jebakan:"Membalik pembilang dan penyebut saat mencari nilai satu satuan — mis. menghitung 3 : 45.000. Selalu tanya: \"angka mana yang dibagi angka mana agar hasilnya masuk akal?\""},
{tp:"Perbandingan dan soal cerita",t:"Perbandingan dan soal cerita — Model Perbandingan Berbalik Nilai",inti:"Bila satu besaran naik, besaran lain turun — kalikan dulu kedua besaran yang diketahui (hasil kalinya tetap), lalu bagi dengan besaran baru.",langkah:["Kenali cirinya: makin banyak pekerja, makin cepat selesai; makin banyak ayam, makin cepat pakan habis.","Kalikan pasangan yang diketahui: pekerja × hari (atau ayam × hari) — hasil kalinya tetap.","Bagi hasil kali itu dengan besaran baru untuk mendapat jawaban."],contoh:"\"6 orang selesai dalam 10 hari. 12 orang?\" → 6 × 10 = 60, lalu 60 : 12 = 5 hari.",jebakan:"Memakai rumus senilai untuk soal berbalik nilai — hasilnya \"makin banyak orang, makin lama\", yang jelas tidak masuk akal. Selalu cek kewajaran arahnya sebelum menghitung."},
{tp:"Perbandingan dan soal cerita",t:"Perbandingan dan soal cerita — Model Campuran (Kecepatan, Rata-Rata, Umur)",inti:"Hafal tiga rumus dasarnya dan tulis \"diketahui – ditanya\" dulu: jarak = kecepatan × waktu; jumlah = rata-rata × banyak data; umur selisih–jumlah → yang besar = (jumlah + selisih) : 2.",langkah:["Tulis diketahui dan ditanya dalam satu baris sebelum menghitung.","Pilih rumus yang sesuai, masukkan angkanya.","Cek kewajaran jawaban terhadap soalnya (mis. rata-rata baru harus berada di antara rata-rata lama dan nilai yang masuk)."],contoh:"\"Rata-rata 4 nilai adalah 80. Nilai ke-5 adalah 90. Rata-rata 5 nilai?\" → (4 × 80 + 90) : 5 = 410 : 5 = 82.",jebakan:"Menghitung rata-rata baru dengan menjumlahkan rata-rata lama dan nilai baru lalu membagi 2 ((80 + 90) : 2 = 85) — salah, karena rata-rata lama mewakili 4 nilai, bukan 1 nilai. Jumlahkan dulu totalnya, baru bagi dengan banyak data yang baru. *21 kartu. Tanpa klaim keluar-ujian atau jaminan apa pun. Contoh mini dalam kartu ini adalah ilustrasi teknik, bukan soal bank.*"},
{tp:"Pelayanan publik",t:"Pelayanan publik — Warga Marah atau Kecewa",inti:"Dengarkan dulu, minta maaf atas ketidaknyamanannya, beri penjelasan dan kepastian langkah berikutnya — jangan membalas emosi atau melempar warga ke loket lain tanpa solusi.",langkah:["Dengarkan keluhan sampai selesai tanpa memotong, lalu minta maaf atas ketidaknyamanan yang dirasakan warga.","Jelaskan penyebabnya dengan jujur dan beri kepastian: apa yang akan dilakukan dan kapan selesainya.","Tindak lanjuti sesuai prosedur dan kabari hasilnya bila warga harus menunggu."],contoh:"\"Warga marah karena dokumennya belum selesai pada hari yang dijanjikan.\" → Mendengarkan, meminta maaf, memeriksa status dokumennya, menjelaskan penyebab keterlambatan dan tanggal selesai yang baru, lalu menghubunginya saat dokumen siap.",jebakan:"Opsi yang hanya \"menjelaskan penyebab\" tanpa kepastian waktu — terdengar sopan, tapi kalah dari opsi yang menjelaskan + memberi kepastian + menindaklanjuti."},
{tp:"Pelayanan publik",t:"Pelayanan publik — Antrean Menumpuk atau Layanan Terhambat",inti:"Beri informasi yang jelas (penyebab + perkiraan waktu), tawarkan alternatif yang sah, dan jaga keadilan antrean — jangan biarkan warga menunggu tanpa kepastian.",langkah:["Umumkan penyebab hambatan dan perkiraan waktu tunggu kepada warga yang mengantre.","Tawarkan alternatif sesuai prosedur (layanan daring, jadwal ulang dengan prioritas, loket lain yang berwenang).","Dahulukan hanya warga yang memang berhak atas prioritas menurut ketentuan, bukan karena kedekatan."],contoh:"\"Sistem antrean padam dan warga kebingungan menentukan giliran.\" → Menjelaskan keadaan, mencatat urutan giliran secara manual agar adil, dan memberi tahu perkiraan waktu tunggu tiap warga.",jebakan:"Mendahulukan warga yang paling keras protes — antrean yang adil diatur oleh ketentuan dan urutan, bukan oleh siapa yang paling lantang."},
{tp:"Pelayanan publik",t:"Pelayanan publik — Permintaan di Luar Prosedur atau Kewenangan",inti:"Jelaskan batas aturan dengan sopan, arahkan ke unit atau jalur yang berwenang beserta langkahnya — jangan menjanjikan layanan yang bukan kewenanganmu dan jangan menolak tanpa penjelasan.",langkah:["Jelaskan dengan sopan mengapa permintaan itu tidak bisa dipenuhi di unitmu.","Arahkan ke unit berwenang: nama unit, alamat atau kontaknya, dan syarat yang perlu dibawa.","Bila memungkinkan, bantu menghubungkan (telepon, surat pengantar) agar warga tidak bolak-balik."],contoh:"\"Warga meminta surat yang wewenang penerbitannya ada di dinas lain.\" → Menjelaskan kewenangan itu dengan sopan, memberi alamat dan syarat yang dibutuhkan, dan menawarkan untuk menghubungi dinas tersebut guna memastikan jam layanannya.",jebakan:"\"Menjanjikan akan diuruskan\" padahal bukan kewenanganmu — janji yang tidak bisa ditepati lebih merusak daripada penolakan yang disertai arahan jelas. ### JEJARING KERJA"},
{tp:"Jejaring kerja",t:"Jejaring kerja — Rekan Kesulitan",inti:"Bantu langsung secukupnya lalu buat rekan mandiri (panduan, penjelasan inti) — jangan mengerjakan seluruh tugasnya dan jangan membiarkannya berjuang sendiri.",langkah:["Luangkan waktu untuk menjelaskan inti kesulitan rekan itu sekarang, bukan \"nanti bila sempat\".","Beri panduan tertulis atau contoh agar rekan bisa mengulang sendiri.","Tawarkan pemeriksaan lanjutan bila ia masih kesulitan, tanpa mengambil alih tugasnya."],contoh:"\"Rekan baru tidak memahami format laporan bulanan.\" → Menjelaskan format itu dengan contoh laporan lama, membagikan templatnya, dan menawarkan untuk memeriksa draf pertamanya.",jebakan:"\"Mengerjakan laporan rekan itu agar cepat selesai\" — terlihat membantu, tapi rekan tidak belajar apa-apa dan ketergantungan berlanjut bulan depan."},
{tp:"Jejaring kerja",t:"Jejaring kerja — Konflik Tim atau Beda Pendapat",inti:"Hadapi dengan netral dan fokus pada target bersama: dengarkan kedua pihak, cari titik temu berbasis bukti, sepakati langkahnya — jangan memihak, menghindar, atau mempermalukan.",langkah:["Dengarkan pendapat tiap pihak tanpa memihak dan tanpa menyela.","Arahkan diskusi ke target tim dan bukti kerja, bukan ke perasaan pribadi.","Sepakati langkah bersama dan catat pembagiannya agar tidak terulang."],contoh:"\"Dua rekan berselisih soal siapa yang harus mengoreksi data yang salah.\" → Mengajak keduanya memeriksa sumber data bersama, membagi tugas koreksi berdasarkan bukti, dan menyepakati pemeriksaan ganda untuk data berikutnya.",jebakan:"\"Melaporkan ke atasan tanpa mencoba menengahi\" — atasan adalah jalan terakhir, bukan jalan pertama; menengahi sendiri menunjukkan jejaring yang dewasa."},
{tp:"Jejaring kerja",t:"Jejaring kerja — Berbagi Informasi dan Koordinasi Lintas Unit",inti:"Bersikap proaktif dan tertulis: hubungi langsung, jelaskan urgensi dan tenggat, tindak lanjuti, dan pastikan informasi sampai ke semua yang berkepentingan.",langkah:["Hubungi unit terkait secara langsung dan sopan, sertakan urgensi dan tenggatnya.","Kirimkan pengingat tertulis agar ada jejak dan tidak terlupakan.","Konfirmasi bahwa informasi sudah diterima dan dipahami, lalu tindak lanjuti sampai tuntas."],contoh:"\"Data dari unit lain belum juga dikirim padahal tenggat laporan besok.\" → Menghubungi penanggung jawabnya langsung, menjelaskan tenggatnya, mengirim pengingat tertulis, dan menawarkan bantuan bila ada kendala di pihaknya.",jebakan:"\"Menunggu sampai data dikirim\" atau \"mengerjakan dengan data seadanya tanpa memberi tahu\" — keduanya pasif; koordinasi yang baik bergerak duluan dan memberi kabar. ### SOSIAL BUDAYA"},
{tp:"Sosial Budaya",t:"Sosial Budaya — Adat dan Kebiasaan Daerah Berbeda",inti:"Pelajari dan hormati adat setempat, sesuaikan cara kerja, dan tetap jalankan tugas sesuai aturan — jangan memaksakan cara sendiri dan jangan menghindar dengan minta pindah.",langkah:["Pelajari adat dan kebiasaan setempat dari tokoh atau rekan setempat sebelum bertindak.","Sesuaikan cara berkomunikasi dan bekerja tanpa mengabaikan tugas dan aturan.","Bila adat dan aturan berbenturan, musyawarahkan solusinya dengan pihak terkait."],contoh:"\"Warga keberatan dengan jam kunjungan pendataan karena berbenturan dengan kegiatan adat.\" → Menanyakan jadwal kegiatan adat itu, menyesuaikan jadwal kunjungan, dan tetap menyelesaikan pendataan sesuai target.",jebakan:"\"Tetap bekerja seperti biasa, adat bukan urusan kantor\" — memaksakan cara sendiri; atau sebaliknya \"menyerah dan minta dipindah\" — menghindar total dari perbedaan."},
{tp:"Sosial Budaya",t:"Sosial Budaya — Perbedaan Agama dan Keyakinan di Tempat Kerja",inti:"Hormati perbedaan keyakinan dengan tindakan nyata (jadwal inklusif, sapaan yang menghormati, tegur olokan dengan santun) — jangan merendahkan, memaksa, atau menganggapnya bukan urusanmu.",langkah:["Sesuaikan jadwal dan kegiatan agar rekan berbeda keyakinan bisa ikut tanpa harus memilih antara tugas dan keyakinannya.","Tegur dengan santun bila ada yang merendahkan keyakinan orang lain, dan ajak menghormati perbedaan.","Jangan menjadikan keyakinan seseorang sebagai bahan lelucon atau syarat perlakuan."],contoh:"\"Rapat penting dijadwalkan bertepatan dengan hari raya salah satu rekan.\" → Mengusulkan jadwal lain agar semua dapat hadir, dan bila tidak mungkin, memastikan rekan itu mendapat ringkasan lengkap setelah rapat.",jebakan:"\"Tetap rapat lalu memberi ringkasan\" tanpa mencoba mengubah jadwal — ringkasan adalah jalan kedua; mengusahakan jadwal inklusif sejak awal menunjukkan penghormatan yang nyata."},
{tp:"Sosial Budaya",t:"Sosial Budaya — Bahasa dan Logat Berbeda",inti:"Bersabar, sederhanakan bahasa, dan cari bantuan penerjemah bila perlu — jangan menertawakan logat, memaksa berbahasa Indonesia formal, atau melayani sekadarnya.",langkah:["Berbicara pelan dengan kalimat sederhana dan periksa pemahaman lawan bicara.","Minta bantuan rekan yang memahami bahasa daerah itu bila komunikasi terhambat.","Pastikan pesan penting (prosedur, syarat, jadwal) benar-benar dipahami sebelum menutup pembicaraan."],contoh:"\"Warga tua hanya berbicara bahasa daerah saat mengurus layanan.\" → Berbicara pelan dan sederhana, meminta bantuan rekan yang memahami bahasa itu, dan memastikan warga memahami syarat yang harus dilengkapi.",jebakan:"\"Meminta warga memakai bahasa Indonesia\" tanpa bantuan apa pun — terdengar netral, tapi menutup akses layanan bagi warga yang memang tidak menguasai bahasa Indonesia formal. ### TIK DAN LITERASI DIGITAL"},
{tp:"TIK dan literasi digital",t:"TIK dan literasi digital — Pesan dan Tautan Mencurigakan",inti:"Verifikasi dulu sebelum mengklik atau menyebarkan: cek sumber resmi, jangan masukkan data, laporkan bila berbahaya — kecepatan menyebar tidak pernah mengalahkan keamanan.",langkah:["Jangan klik tautan atau lampiran dari pengirim yang tidak dikenal atau yang isinya mendesak dan janggal.","Periksa kebenarannya di sumber resmi atau tanyakan ke unit TI.","Laporkan dan luruskan dengan sopan bila pesan itu sudah menyebar ke orang lain."],contoh:"\"Pesan berantai berisi kabar pencairan dana bantuan dengan tautan yang meminta NIK.\" → Tidak mengklik tautan itu, memeriksa kebenarannya di kanal resmi instansi, dan mengingatkan pengirimnya bahwa tautan itu mencurigakan.",jebakan:"\"Meneruskan dulu untuk dimintai pendapat\" — sekali diteruskan, kabar yang belum tentu benar itu sudah menyebar; verifikasi selalu datang sebelum tombol teruskan."},
{tp:"TIK dan literasi digital",t:"TIK dan literasi digital — Data Pribadi dan Kata Sandi",inti:"Data pribadi warga dan kata sandi akun kantor tidak boleh dibagikan untuk alasan apa pun — tolak dengan sopan, jelaskan aturannya, pakai kanal resmi, dan laporkan bila diminta secara tidak sah.",langkah:["Tolak permintaan data atau kata sandi dengan sopan dan jelaskan aturan perlindungannya.","Arahkan ke jalur resmi (permohonan tertulis, kanal layanan resmi, pengaturan ulang kata sandi oleh pemilik akun).","Laporkan melalui kanal resmi bila ada yang memaksa atau bila data sudah telanjur tersebar."],contoh:"\"Rekan meminta kata sandi akun layanan kantor karena ia lupa kata sandinya.\" → Menolak memberikan kata sandi, menjelaskan bahwa tiap akun bersifat pribadi, dan mengarahkan rekan itu ke prosedur pengaturan ulang kata sandi.",jebakan:"\"Memberikan sebagian saja\" atau \"memberikan karena ia rekan sekantor\" — data yang dibagikan sebagian tetap bocor, dan kedekatan tidak mengubah aturan perlindungan data."},
{tp:"TIK dan literasi digital",t:"TIK dan literasi digital — Gangguan Teknis dan Aplikasi Baru",inti:"Antisipasi risiko teknis (cadangan, materi dikirim dulu, kabari peserta), laporkan gangguan ke unit teknis, dan bantu pengguna yang kesulitan — jangan membatalkan sepihak atau menunggu tanpa kabar.",langkah:["Siapkan rencana cadangan sebelum kegiatan (jaringan cadangan, materi terkirim, salinan berkas).","Bila gangguan terjadi, beri tahu pihak yang terdampak, jelaskan alternatifnya, dan laporkan ke unit teknis.","Kabari saat layanan pulih dan bantu pengguna yang tertinggal, terutama yang kurang terbiasa dengan teknologi."],contoh:"\"Layanan daring error saat banyak warga mengadu.\" → Meminta maaf, menjelaskan gangguan dan layanan alternatifnya, melaporkan ke tim teknis, dan mengabari warga saat layanan pulih.",jebakan:"\"Menyerahkan semua pertanyaan kepada tim TI\" tanpa memberi informasi apa pun kepada warga — warga butuh kabar dan alternatif sekarang, bukan sekadar janji bahwa tim TI sedang bekerja. ### PROFESIONALISME"},
{tp:"Profesionalisme",t:"Profesionalisme — Tugas di Luar Keahlian atau Tenggat Berat",inti:"Jujur soal kendala, minta arahan, dan belajar cepat agar tugas tetap selesai — jangan menerima diam-diam lalu gagal, dan jangan menolak mentah-mentah.",langkah:["Sampaikan kendala dan batas kemampuanmu secara jujur kepada atasan.","Minta arahan, panduan, atau pendampingan, dan belajar dari rekan yang menguasai.","Susun rencana kerja dengan tenggat antara agar kemajuan terlihat dan kendala terdeteksi sejak dini."],contoh:"\"Atasan memberi tugas penyusunan anggaran padahal kamu belum pernah menyusunnya.\" → Menyampaikan bahwa kamu belum berpengalaman, meminta contoh dan arahan, mempelajari panduannya, dan melaporkan kemajuan tiap tahap.",jebakan:"\"Menerima dan mengerjakan sebisanya tanpa bertanya\" — terlihat patuh, tapi menyembunyikan kendala yang bisa menggagalkan tugas dan baru ketahuan saat tenggat habis."},
{tp:"Profesionalisme",t:"Profesionalisme — Kesalahan Ditemukan (Sendiri, Rekan, atau Sistem)",inti:"Akui, perbaiki, laporkan, dan dokumentasikan — jangan menutupi, menyalahkan, atau menunggu sampai ada yang menyadari.",langkah:["Hentikan penyebaran dampak kesalahan itu (tahan pengiriman, beri tahu pihak yang terdampak).","Perbaiki sesuai prosedur dan laporkan kepada atasan dengan jujur.","Dokumentasikan koreksinya dan usulkan pencegahan agar kesalahan yang sama tidak terulang."],contoh:"\"Kamu menyadari ada angka yang salah pada laporan yang sudah dikirim ke pimpinan.\" → Segera melapor ke atasan, memperbaiki angkanya, mengirim revisi dengan penjelasan, dan mencatat pemeriksaan tambahan untuk laporan berikutnya.",jebakan:"\"Memperbaiki diam-diam tanpa memberi tahu\" — laporan yang sudah beredar tetap salah di tangan penerimanya; koreksi yang tidak dikomunikasikan sama dengan tidak dikoreksi."},
{tp:"Profesionalisme",t:"Profesionalisme — Tekanan Melanggar Aturan",inti:"Tolak dengan sopan, tunjukkan aturan yang berlaku, tawarkan alternatif yang sah, dan laporkan bila tekanan berlanjut — alasan \"demi kebaikan\" atau \"perintah atasan\" tidak membenarkan pelanggaran prosedur.",langkah:["Sampaikan aturan yang berlaku dengan sopan dan tanpa menuduh.","Tawarkan alternatif yang sesuai prosedur untuk kebutuhan yang sama.","Bila tekanan berlanjut, minta instruksi tertulis dan laporkan melalui jalur resmi."],contoh:"\"Seseorang menawarkan uang agar berkasnya didahulukan dari antrean.\" → Menolak dengan sopan, menjelaskan aturan antrean dan gratifikasi, dan memandu orang itu mengikuti prosedur yang benar.",jebakan:"\"Terima dulu, lapor nanti\" — menerima tetap menerima; penolakan harus terjadi sejak awal, dan laporan adalah penguatnya, bukan pengganti penolakan. ### ANTI RADIKALISME"},
{tp:"Anti radikalisme",t:"Anti radikalisme — Ajakan Bergabung Paham Ekstrem",inti:"Tolak dengan tegas dan damai, jangan berdebat keras, dan laporkan melalui jalur resmi — diam saja membiarkan ajakan itu mencari korban berikutnya.",langkah:["Tolak ajakan itu dengan tegas tetapi santun, tanpa konfrontasi.","Nyatakan pendirianmu dengan singkat: setia pada Pancasila dan hukum yang berlaku.","Laporkan ajakan itu kepada atasan atau pihak yang berwenang melalui jalur resmi."],contoh:"\"Teman mengajakmu bergabung ke kelompok yang menolak Pancasila.\" → Menolak dengan tegas dan santun, menjelaskan bahwa kamu setia pada Pancasila, dan melaporkan ajakan itu kepada atasan.",jebakan:"\"Menolak tetapi tidak melapor\" — kurang dari jawaban terbaik karena tidak ada tindakan lanjut; atau \"ikut berdebat keras agar dia kalah\" — konfrontasi bukan cara damai."},
{tp:"Anti radikalisme",t:"Anti radikalisme — Ujaran Kebencian dan Intoleransi di Sekitar",inti:"Tegur dengan santun, luruskan dengan fakta atau nilai persatuan, dan laporkan bila berlanjut — jangan ikut tertawa, menghindar total, atau membalas dengan kebencian yang sama.",langkah:["Tegur perilaku atau ucapannya dengan santun, tanpa menyerang orangnya.","Ingatkan nilai persatuan dan aturan yang berlaku di tempat kerja.","Laporkan melalui jalur resmi bila perilaku itu berulang atau menyebar."],contoh:"\"Rekan menyebarkan lelucon yang merendahkan suku tertentu di grup kerja.\" → Menegur dengan santun di grup itu, mengingatkan agar menghargai perbedaan, dan melaporkan bila lelucon serupa terus diulang.",jebakan:"\"Menghindar dari percakapan itu\" — menghindar memang tidak ikut menyebar, tapi tidak menghentikan apa pun; teguran santun adalah tindakan yang mengubah keadaan."},
{tp:"Anti radikalisme",t:"Anti radikalisme — Konten Hasutan di Media Sosial dan Grup Chat",inti:"Jangan sebarkan, verifikasi isinya, luruskan dengan sopan di tempat konten itu beredar, dan laporkan kontennya — membalas hasutan dengan hasutan hanya memperluas permusuhan.",langkah:["Jangan meneruskan konten itu, sekalipun untuk mengkritiknya — penyebaran tetap penyebaran.","Periksa kebenaran isinya di sumber tepercaya sebelum menanggapi.","Luruskan dengan sopan di grup atau forum yang sama, dan laporkan konten itu melalui fitur pelaporan atau jalur resmi."],contoh:"\"Di grup keluarga beredar video yang menghasut permusuhan antaragama.\" → Tidak meneruskannya, memeriksa kebenarannya, lalu meluruskannya dengan sopan di grup itu dan mengajak anggota grup menjaga kerukunan.",jebakan:"\"Membalas dengan konten balasan yang menyerang kelompok penghasut\" — membalas kebencian dengan kebencian membuatmu bagian dari permusuhan yang sama."},
];
const TEKNIK=[
{t:"Urutan Pengerjaan: TKP Dulu, TIU Terakhir",inti:"Kerjakan TKP dulu (\u00B115 menit, tanpa hitungan, otak masih segar) \u2192 TWK (\u00B120 menit) \u2192 TIU terakhir (\u00B145 menit); sisakan 20 menit untuk meninjau soal yang ditandai.",langkah:["Menit 0–15: selesaikan 45 soal TKP (\u00B120 detik/soal — TKP tidak butuh hitungan, hanya penilaian cepat).","Menit 15–35: kerjakan 30 soal TWK (\u00B140 detik/soal).","Menit 35–80: kerjakan 35 soal TIU (\u00B175 detik/soal — bagian tersulit, butuh otak paling segar yang tersisa).","Menit 80–100: kembali ke soal yang ditandai, periksa jawaban yang ragu."],contoh:"Peserta yang mengerjakan TIU dulu sering kehabisan waktu di TKP — padahal TKP 45 soal adalah porsi terbesar (41% soal) dan paling cepat dikerjakan bila otak segar.",jebakan:"Teknik ini memakai panel navigasi soal (pindah antar subtes). Pastikan kamu sudah berlatih pindah subtes di simulasi, bukan baru mencoba di hari ujian."},
{t:"Eliminasi — Buang 3 Opsi yang Jelas Salah Dulu",inti:"Buang 3 opsi yang jelas salah dulu sehingga peluang jawabanmu naik dari 20% menjadi 50% — lalu bandingkan 2 opsi yang tersisa.",langkah:["Baca semua opsi sebelum memilih.","Coret opsi yang jelas salah (pasal salah topik, arti berlawanan, angka mustahil).","Bandingkan 2 opsi tersisa dengan inti pertanyaan — pilih yang paling tepat, bukan yang paling \u201Cterdengar benar\u201D."],contoh:"\u201CSemboyan Bhinneka Tunggal Ika dikutip dari kitab \u2026\u201D \u2192 buang Negarakertagama (kitab sejarah), Pararaton (kitab raja-raja), Arjunawiwaha \u2192 sisa Sutasoma vs Bharatayuddha \u2192 Sutasoma.",jebakan:"Memilih opsi pertama yang \u201Cterasa benar\u201D tanpa membaca semua opsi — opsi jebakan sering ditaruh di awal."},
{t:"Jangan Kosongkan Jawaban Apa Pun",inti:"Tidak ada pengurangan nilai untuk jawaban salah — jawaban salah dan jawaban kosong sama-sama 0, tapi tebakan punya peluang benar.",langkah:["Jawab semua soal, tanpa kecuali.","Bila ragu, pilih jawaban yang paling mungkin (pakai teknik eliminasi dulu), lalu tandai untuk ditinjau.","Di 5 menit terakhir, pastikan tidak ada satu pun soal yang kosong — isi dengan tebakan terbaik."],contoh:"5 soal tersisa, waktu 2 menit — isi kelimanya dengan tebakan terbaik. 1 dari 5 itu mungkin benar (5 poin); dibiarkan kosong, 0 poin pasti.",jebakan:"Meninggalkan soal kosong karena \u201Ctakut salah\u201D — rasa takut itu keliru secara matematis: salah = kosong = 0, tebakan \u2265 0."},
{t:"Skimming — Baca Pertanyaan Dulu, Baru Teks Panjang",inti:"Untuk soal teks panjang (TKP/TWK), baca kalimat pertanyaan dulu (biasanya di akhir), baru baca teksnya dengan fokus pada yang ditanyakan.",langkah:["Lompat ke kalimat pertanyaan di akhir soal (\u201CSikapmu \u2026\u201D, \u201CYang paling tepat adalah \u2026\u201D).","Catat kata kuncinya.","Baca teks/skenario sambil mencari kata kunci itu — lewati detail yang tidak ditanya."],contoh:"Skenario TKP 5 baris tentang warga marah di antrean — baca dulu \u201CSikapmu \u2026\u201D, lalu baca skenario hanya untuk mencari: siapa yang marah, apa masalahnya, apa yang bisa kamu lakukan.",jebakan:"Membaca skenario dari awal sampai akhir tanpa tahu yang ditanya — buang 30–60 detik per soal untuk detail yang tidak dipakai."},
{t:"Aturan 1 Menit — Soal Sulit Dilewati Dulu, Tandai, Kembali Nanti",inti:"Bila 1 menit belum ketemu jalannya, tandai soal itu dan lanjut — kembali bila ada sisa waktu di 20 menit cadangan.",langkah:["Kerjakan soal; bila 60 detik belum ada jalan keluar, tandai (\u201CTandai untuk ditinjau\u201D).","Lanjut ke soal berikutnya tanpa menoleh.","Di menit 80–100, kembali ke semua soal yang ditandai dengan otak yang sudah \u201Cpanas\u201D."],contoh:"Deret angka yang polanya tidak ketemu dalam 60 detik — tandai, kerjakan soal lain. Sering kali polanya baru terlihat setelah mengerjakan soal lain.",jebakan:"Bertahan 5 menit di 1 soal (5 poin) sambil mengorbankan 3 soal lain yang bisa dikerjakan (15 poin). Satu soal tidak sebanding dengan tiga soal."},
{t:"Silogisme — \u201CSebagian + Semua = Sebagian\u201D",inti:"Bila salah satu premis memakai \u201CSebagian\u201D, kesimpulan yang pasti benar juga memakai \u201CSebagian\u201D (atau \u201CAda\u201D) — tidak pernah \u201CSemua\u201D.",langkah:["Cari kata \u201Csebagian\u201D atau \u201Cada\u201D di premis.","Buang semua kesimpulan yang memakai kata \u201Csemua\u201D.","Uji kesimpulan \u201Csebagian\u201D yang tersisa terhadap premis."],contoh:"\u201CSemua pegawai disiplin. Sebagian pegawai berkacamata.\u201D \u2192 kesimpulan yang pasti benar: \u201CSebagian yang berkacamata adalah pegawai disiplin.\u201D (Bukan \u201Csemua yang berkacamata adalah pegawai\u201D.)",jebakan:"Kesimpulan yang memakai \u201Csemua\u201D padahal premisnya \u201Csebagian\u201D — kata \u201Csemua\u201D tidak pernah lahir dari premis \u201Csebagian\u201D."},
{t:"Deret Angka — Cek Selisih Kiri ke Kanan Dulu",inti:"Selalu tulis selisih antar suku, kiri ke kanan, sebelum memikirkan pola lain.",langkah:["Tulis selisih tiap pasangan suku berurutan.","Bila selisih tetap \u2192 deret tambah/kurang, jawabannya ketemu.","Bila selisih berubah, cek selisih dari selisih itu (pola tingkat 2) atau cek rasio."],contoh:"\u201C3, 7, 11, 15, \u2026\u201D \u2192 selisih +4, +4, +4 \u2192 suku berikutnya 19.",jebakan:"Mengira pola \u00D72 (3\u21927 bukan \u00D72) padahal selisihnya tetap — kebiasaan menebak \u201Ckali\u201D duluan membuat pola tambah yang sederhana terlewat."},
{t:"Tabel Pecahan Istimewa untuk Hitung Cepat",inti:"Hafalkan tabel ini — sebagian besar soal persen dan hitung cepat selesai dalam 1 langkah bila persennya langsung diganti pecahan.",langkah:["Kenali persen di soal, ganti dengan pecahannya dari tabel.","Hitung dengan pecahan (bagi dulu, kali kemudian — angkanya lebih kecil).","Cocokkan dengan opsi; bila tidak ada yang cocok, baru hitung cara panjang."],contoh:"\u201C12,5% dari 640 = \u2026\u201D \u2192 1/8 \u00D7 640 = 80.",jebakan:"Menghitung 12,5% sebagai 125/1000 \u00D7 640 secara manual — lambat dan rawan salah koma. Hafalkan 1/8 = 12,5%.",tabel:[["1/2","50%","1/3","33,3%"],["1/4","25%","2/3","66,7%"],["3/4","75%","1/5","20%"],["1/8","12,5%","2/5","40%"],["3/8","37,5%","1/10","10%"],["1/6","16,7%","1/20","5%"]]},
{t:"Pola Analogi yang Sering Keluar: Fungsi, Bagian–Keseluruhan, Sebab–Akibat",inti:"Sebagian besar soal analogi hanya memakai 3 jenis hubungan — kenali jenisnya dulu, baru uji opsi.",langkah:["Tentukan jenis hubungan pasangan soal: fungsi (dipakai untuk apa), bagian–keseluruhan (bagian dari apa), atau sebab–akibat (menyebabkan apa).","Terapkan jenis hubungan yang sama ke tiap opsi.","Pilih opsi yang jenis hubungannya identik."],contoh:"Fungsi — \u201CKunci : Pintu\u201D (kunci dipakai untuk membuka pintu) \u2192 \u201CPulpen : Kertas\u201D (pulpen dipakai untuk menulis di kertas). Bagian–keseluruhan — \u201CJari : Tangan\u201D. Sebab–akibat — \u201CHujan : Basah\u201D.",jebakan:"Memilih opsi yang katanya mirip dengan kata soal (mis. \u201CKunci : Gembok\u201D — memang terkait, tapi hubungannya bukan fungsi \u201Cmembuka\u201D, melainkan \u201Cpasangan alat\u201D)."},
{t:"Kata Kunci TWK — Petakan Kasus ke Topik dalam 5 Detik",inti:"Hafal pemetaan kata kunci ini — sebagian besar soal TWK bisa dipetakan ke topiknya sebelum membaca opsi.",langkah:["Baca kasus, cari kata kuncinya.","Petakan: kejujuran / penolakan korupsi atau gratifikasi \u2192 Integritas.","Gotong royong, guyub, gelora persatuan (\u201CTiga G\u201D) \u2192 Sila ke-3, Persatuan Indonesia.","Bedakan Sila ke-2 (empati personal pada satu orang) vs Sila ke-5 (kesejahteraan bersama, keadilan untuk semua)."],contoh:"\u201CPejabat menolak hadiah dari rekanan proyek.\u201D \u2192 kata kunci \u201Cmenolak hadiah\u201D \u2192 Integritas.",jebakan:"\u201CMembantu tetangga yang kelaparan\u201D — empati personal \u2192 Sila ke-2, bukan ke-5. Sila ke-5 dipakai untuk kasus keadilan/kesejahteraan bersama (mis. pembagian bantuan yang merata, upah yang adil)."},
{t:"TKP — Pilih Jawaban Paling Proaktif, Solutif, Kolaboratif",inti:"Di soal TKP, skor 5 hampir selalu opsi yang bertindak duluan (proaktif), menyelesaikan masalah (solutif), dan melibatkan orang lain (kolaboratif). Hindari jawaban pasif atau menunggu perintah.",langkah:["Cari opsi yang BERTINDAK (bukan hanya menjelaskan atau menunggu).","Cek: apakah opsi itu menyelesaikan masalah dan melibatkan orang lain?","Buang opsi \u201Cmenunggu\u201D, \u201Cmembiarkan\u201D, \u201Cmenyerahkan sepenuhnya ke orang lain\u201D."],contoh:"\u201CRekan baru kesulitan memakai aplikasi kantor.\u201D \u2192 \u201CMeluangkan beberapa menit menjelaskan inti, lalu membagikan panduan tertulis\u201D (proaktif + solutif + memandirikan) — bukan \u201Cmengerjakan tugas rekan itu sendiri\u201D (tidak kolaboratif).",jebakan:"Opsi yang terdengar baik tapi pasif — \u201Cakan membantu bila diminta\u201D — menunggu diminta bukan proaktif. Skor 5 selalu bergerak duluan."}
];

{t:"Mnemonik / Jembatan Keledai — Akronim dan Kalimat Kunci",inti:"Ubah daftar yang harus dihafal menjadi 1 kata atau 1 kalimat yang mudah diingat — otak mengingat cerita lebih mudah daripada daftar.",langkah:["Ambil huruf awal tiap butir, rangkai jadi kata/kalimat.","Ucapkan kalimat itu 3 kali sambil menunjuk butir aslinya.","Uji diri: tulis butirnya dari kalimat kuncinya saja, tanpa melihat catatan."],contoh:"5 sila Pancasila: \u201CKakekku Pergi Ke Kebun\u201D \u2192 KakeTUHANan – KEmanusiaan – PERsatuan – KErakyatan – KEadilan. Pasal UUD kunci: \u201CWarga yang SAMA kedudukannya (27), berAGAMA (29), ikut BELA negara (30), SEKOLAH (31), EKONOMI bersama (33), berbahasa Indonesia (36).\u201D Tanggal 1945: \u201CLahir – Piagam – Merdeka – Sah\u201D \u2192 1 Juni lahirnya Pancasila – 22 Juni Piagam Jakarta – 17 Agustus Proklamasi – 18 Agustus UUD disahkan.",jebakan:"Mnemonik yang terlalu panjang sama sulitnya dengan daftar aslinya — 1 kalimat maksimal 7 kata. Bila kalimat kuncimu lebih panjang dari yang dihafal, buat ulang yang lebih pendek."},
{t:"Spaced Repetition — Ulang 1 Hari \u2192 3 Hari \u2192 7 Hari",inti:"Ulang materi dengan jarak yang makin jauh: besok (1 hari), 3 hari lagi, 7 hari lagi. Cara ini mengalahkan lupa jauh lebih efektif daripada mengulang 10 kali dalam sehari.",langkah:["Hari belajar = Hari 0. Tulis tanggal ulangnya di catatan: +1, +3, +7.","Tiap sesi ulang maksimal 15 menit per bab — cukup baca cepat + uji diri 5 soal.","Bila satu bab masih gagal di ulangan +7, ulangi siklusnya dari awal untuk bab itu saja."],contoh:"Pancasila dipelajari Senin \u2192 ulang Selasa (+1) \u2192 ulang Kamis (+3) \u2192 ulang Senin depan (+7). Empat sentuhan singkat mengalahkan satu sesi maraton 2 jam.",jebakan:"Mengulang materi yang sudah hafal dan mengabaikan yang belum — sesi ulang harus diawali dengan uji diri, bukan membaca ulang dari awal."},
{t:"Chunking — Kelompokkan Materi per Bab, 5–7 Butir Sekelompok",inti:"Jangan menghafal 50 pasal sekaligus. Pecah jadi kelompok kecil per bab — satu kelompok 5–7 butir, sesuai kapasitas ingatan jangka pendek.",langkah:["Bagi kisi-kisi jadi 6 bab: Pancasila, UUD, Sejarah, NKRI, Bela Negara + Integritas, Bahasa Indonesia.","Tiap bab dipecah lagi jadi kelompok 5–7 butir (mis. UUD \u2192 kelompok \u201Cpasal hak warga\u201D 27/28/29/30/31, kelompok \u201Cpasal lembaga\u201D 1/6/18/20).","Hafalkan 1 kelompok sampai lancar, baru pindah ke kelompok berikutnya."],contoh:"Pasal UUD yang sering keluar dibagi 3 kelompok: (a) hak warga — 27, 28, 29, 30, 31; (b) lembaga negara — 1, 6, 18, 20, 37; (c) perekonomian & bahasa — 33, 34, 36. Tiga kelompok kecil lebih mudah daripada 13 pasal sekaligus.",jebakan:"Menghafal urutan nomor pasal tanpa memahami isinya — soal TWK menguji isi dan penerapan, bukan urutan nomor. Tiap kelompok harus disertai 1 kata kunci isinya."},
{t:"Mind Map — Peta Konsep Pancasila–UUD–Sejarah",inti:"Gambar 1 peta konsep yang menghubungkan bab-bab TWK — otak mengingat gambar + hubungan antarbab lebih kuat daripada daftar lurus.",langkah:["Tulis \u201CPilar Negara\u201D di tengah kertas A4.","Tarik 4 cabang: Pancasila, UUD 1945, NKRI, Sejarah.","Tiap cabang bercabang lagi (Pancasila \u2192 5 sila; UUD \u2192 pasal kunci; Sejarah \u2192 garis waktu) dan hubungkan cabang yang berkaitan dengan garis + kata penghubung (mis. \u201CSila ke-3 \u2192 Pasal 25A \u2192 Bhinneka\u201D).","Baca peta itu 5 menit setiap sesi ulang — jangan membaca catatan panjang."],contoh:"Garis penghubung \u201CSila ke-1 (Ketuhanan) \u2192 Pasal 29 (agama) \u2192 Piagam Jakarta (22 Juni 1945)\u201D — tiga bab terhubung dalam satu garis, dan satu garis itu menjawab tiga jenis soal.",jebakan:"Mind map yang terlalu ramai (semua fakta dimasukkan) sama tidak bergunanya dengan catatan panjang — maksimal 5 cabang utama, maksimal 5 butir per cabang."},
{t:"Feynman — Jelaskan Kembali Seolah Mengajar",inti:"Pilih 1 topik, jelaskan keras-keras dengan kata sendiri seolah mengajar teman. Bagian yang tersendat saat menjelaskan = bagian yang belum dipahami.",langkah:["Pilih 1 topik kecil (mis. \u201Cmengapa Pasal 27 ayat 3 soal bela negara\u201D).","Jelaskan dengan kata sendiri, tanpa melihat catatan, selama 2 menit.","Bagian yang tersendat \u2192 baca ulang catatan bagian itu saja \u2192 jelaskan lagi dari awal.","Ulangi sampai penjelasanmu lancar tanpa jeda."],contoh:"\u201CPasal 27 ayat 3 bilang setiap warga negara berhak dan wajib ikut serta dalam usaha pembelaan negara. Artinya bela negara bukan cuma tugas tentara — warga biasa ikut lewat taat hukum, bayar pajak, dan gotong royong.\u201D — bila kamu bisa mengucapkan kalimat seperti itu tanpa melihat catatan, topik itu sudah dikuasai.",jebakan:"Menjelaskan dengan membaca catatan (bukan dari ingatan) — itu bukan Feynman, itu membaca. Tutup catatan dulu, baru bicara."},
