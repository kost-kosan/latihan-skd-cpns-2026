{tp:"Bahasa Indonesia",t:"Bahasa Indonesia — Baca di Kepala, yang Janggal Biasanya Salah",inti:"Fokus EYD + fungsi bahasa negara + kata baku. Baca kalimat keras-keras di kepala; opsi yang terdengar janggal biasanya salah ejaan/tanda baca.",langkah:["Baca tiap opsi pelan, dengarkan \u201Cbunyi\u201D-nya.","Cek ejaan dan tanda baca pada kata yang dicurigai.","Jangan terkecoh kata yang \u201Csering dipakai\u201D tapi tidak baku."],contoh:"Kata baku dari \u201Capotik\u201D adalah \u2192 apotek.",jebakan:"Kata yang lazim diucapkan sehari-hari belum tentu baku — mis. \u201Csekedar\u201D (tidak baku) vs \u201Csekadar\u201D (baku); \u201Ccidera\u201D (tidak baku) vs \u201Ccedera\u201D (baku)."},
{tp:"Sinonim dan antonim",t:"Sinonim / Antonim — Eliminasi Lawan Katanya Dulu",inti:"Untuk soal sinonim, buang dulu opsi yang berlawanan arti (dan sebaliknya untuk soal antonim).",langkah:["Tentukan arti kata soal sebisanya — bila tidak tahu, lanjut ke langkah 2.","Cari 2 opsi yang berlawanan satu sama lain; salah satunya sering jadi jawaban.","Buang opsi yang jelas berlawanan, bandingkan sisanya."],contoh:"Sinonim \u201Cabstrak\u201D \u2192 \u201Ctidak berwujud\u201D (lawannya: konkret — buang dulu opsi \u201Cnyata\u201D dan \u201Ckonkret\u201D).",jebakan:"Opsi yang \u201Cmirip bunyi\u201D tapi beda arti — mis. \u201Cabstrak\u201D vs \u201Cekstrak\u201D. Kemiripan bunyi bukan kemiripan arti."},
{tp:"Analogi",t:"Analogi — Rumuskan Hubungan dalam 1 Kalimat",inti:"Rumuskan hubungan pasangan soal dalam 1 kalimat (\u201CX adalah alat untuk Y\u201D / \u201CX bagian dari Y\u201D), lalu terapkan kalimat yang sama ke semua pilihan.",langkah:["Tulis hubungan pasangan soal dalam 1 kalimat.","Uji tiap opsi dengan kalimat yang sama persis.","Yang hubungannya identik, itu jawabannya — jangan pilih karena katanya mirip."],contoh:"\u201CDokter : Pasien = Guru : \u2026\u201D \u2192 hubungan: \u201Cprofesi melayani \u2026\u201D \u2192 Murid.",jebakan:"Memilih \u201CSekolah\u201D karena terkait guru — padahal hubungannya bukan \u201Cyang dilayani\u201D. Kata terkait \u2260 hubungan sama."},
{tp:"Logika dan silogisme",t:"Silogisme — Gambar 2 Lingkaran, Jangan Balik Premis",inti:"Gambar cepat 2 lingkaran/diagram. Premis \u201CSemua A adalah B\u201D \u2260 \u201CSemua B adalah A\u201D — kesimpulan yang membalik premis hampir selalu salah.",langkah:["Gambar diagram kecil: lingkaran A di dalam/di luar B sesuai premis.","Uji tiap kesimpulan terhadap gambar itu.","Buang kesimpulan yang membalik arah premis atau memakai kata \u201Csemua\u201D dari premis \u201Csebagian\u201D."],contoh:"\u201CSemua pegawai disiplin. Sebagian pegawai berkacamata.\u201D \u2192 kesimpulan yang pasti benar: \u201CSebagian yang berkacamata adalah pegawai disiplin.\u201D",jebakan:"\u201CSemua yang berkacamata adalah pegawai\u201D — membalik premis. Dari \u201Csebagian pegawai berkacamata\u201D tidak bisa disimpulkan apa pun tentang \u201Csemua yang berkacamata\u201D."},
{tp:"Penalaran analitis",t:"Penalaran Analitis — Buat Tabel di Kertas Coretan",inti:"Buat tabel/kotak kecil (siapa–di mana–kapan). Isi yang pasti dulu, silang yang mustahil. Jangan kerjakan dari kepala — soal ini dirancang untuk menjebak ingatan.",langkah:["Gambar tabel kecil: baris = orang/benda, kolom = posisi/waktu.","Isi fakta yang pasti, silang kombinasi yang mustahil.","Baru simpulkan dari tabel yang sudah terisi."],contoh:"\u201CP di depan Q. Q di depan S. S di depan R. Urutan dari depan?\u201D \u2192 tabel 4 posisi: P, Q, S, R.",jebakan:"Menghafal urutan di kepala sambil membaca soal — satu fakta tertukar, semua kesimpulan ikut salah. Tulis dulu, baru jawab."},
{tp:"Deret angka",t:"Deret Angka — Cek Selisih Dulu, Baru Pola Rumit",inti:"Cek urutan ini: (1) selisih, (2) rasio/kali, (3) pola selang-seling (ganjil–genap), (4) kuadrat/kubik. Sebagian besar deret CPNS selesai di langkah 1–2.",langkah:["Tulis selisih antar suku, kiri ke kanan. Bila selisih tetap \u2192 itu jawabannya.","Bila tidak, cek rasio (tiap suku dikali berapa?).","Bila belum ketemu, cek suku ganjil dan genap secara terpisah.","Baru terakhir pikirkan kuadrat/kubik."],contoh:"\u201C2, 6, 18, 54, \u2026\u201D \u2192 selisih berubah (4, 12, 36), rasio tetap \u00D73 \u2192 162.",jebakan:"Langsung menebak pola kuadrat/kubik sebelum cek selisih — buang waktu di pola rumit padahal jawabannya pola kali sederhana."},
{tp:"Hitungan dan persen",t:"Hitungan & Persen — Ubah Persen Jadi Pecahan Sederhana",inti:"Ubah persen ke pecahan sederhana (25% = 1/4, 20% = 1/5, 12,5% = 1/8). Kerjakan dengan pembulatan kasar dulu untuk eliminasi 2–3 opsi, baru hitung tepat untuk sisa opsi.",langkah:["Ubah persen ke pecahan (lihat tabel pecahan istimewa di Teknik Cepat).","Perkirakan kasar, buang opsi yang jelas terlalu besar/kecil.","Hitung tepat hanya untuk 1–2 opsi yang tersisa."],contoh:"\u201C25% dari 840 = \u2026\u201D \u2192 1/4 \u00D7 840 = 210.",jebakan:"Menghitung tepat sejak awal tanpa eliminasi (buang waktu) — atau tertukar 25% dengan 2,5% karena terburu-buru membaca soal."},
{tp:"Perbandingan dan soal cerita",t:"Perbandingan & Soal Cerita — Tulis \u201CDiketahui – Ditanya\u201D Dulu",inti:"Tulis \u201Cdiketahui – ditanya\u201D dalam 1 baris sebelum menghitung. Soal cerita gagal bukan karena hitungan sulit, tapi karena salah memetakan siapa dibanding siapa.",langkah:["Tulis 1 baris: diketahui apa, ditanya apa.","Petakan perbandingannya (A : B = \u2026) sebelum menyentuh angka.","Baru hitung — dan cek apakah jawabanmu masuk akal dengan soalnya."],contoh:"\u201CHarga 3 buku Rp45.000. Harga 5 buku?\u201D \u2192 diketahui: 3 buku = 45.000 \u2192 1 buku = 15.000 \u2192 ditanya 5 buku = Rp75.000.",jebakan:"Membalik pembilang–penyebut (menghitung 45.000 \u00F7 5 dulu) atau salah memetakan siapa dibanding siapa — hasilnya terlihat masuk akal tapi salah arah."},
{tp:"Pelayanan publik",t:"Pelayanan Publik — Selesaikan Kebutuhan Warga Dulu",inti:"Pilih opsi paling cepat melayani + paling jelas prosedurnya + tetap ramah. Urutan nilai: selesaikan kebutuhan warga > lempar ke atasan > minta warga menunggu tanpa kepastian.",langkah:["Cari opsi yang menyelesaikan kebutuhan warga (bukan sekadar menjelaskan).","Cek: apakah ada kepastian waktu/langkah berikutnya untuk warga?","Buang opsi yang meminta warga menunggu tanpa kepastian."],contoh:"\u201CSeorang warga marah karena antrean pelayanan lama.\u201D \u2192 Mendengarkan, meminta maaf atas ketidaknyamanan, menjelaskan alur, dan membantu mempercepat sesuai prosedur.",jebakan:"Opsi yang \u201Cmenjelaskan penyebab antrean\u201D saja tanpa solusi — terdengar sopan, tapi kalah dari opsi yang menjelaskan + memberi kepastian + bertindak."},
{tp:"Jejaring kerja",t:"Jejaring Kerja — Kerja Sama Aktif, Bukan Kerja Sendiri",inti:"Pilih opsi yang membangun kerja sama aktif (koordinasi, berbagi info, tawarkan bantuan) — bukan kerja sendiri dengan baik, bukan juga menyerahkan semua ke orang lain.",langkah:["Cari opsi yang melibatkan orang lain secara aktif.","Buang opsi \u201Ckerja sendiri dengan baik\u201D — di soal jejaring, itu bukan jawaban terbaik.","Buang juga opsi \u201Cserahkan semua ke orang lain\u201D — itu menghindar, bukan bekerja sama."],contoh:"\u201CRekan baru kesulitan memakai aplikasi kantor, sementara kamu sedang sibuk.\u201D \u2192 Meluangkan beberapa menit sekarang untuk menjelaskan inti, lalu membagikan panduan tertulis.",jebakan:"\u201CMengerjakan tugas rekan itu sendiri agar cepat selesai\u201D — terlihat membantu, tapi tidak membangun kemandirian rekan dan tidak membangun jejaring."},
{tp:"Sosial Budaya",t:"Sosial Budaya — Hormati Adat, Tetap Jalankan Tugas",inti:"Pilih opsi yang menghormati adat/kebiasaan setempat sambil tetap menjalankan tugas. Hindari opsi yang memaksakan cara sendiri atau yang menghindar total dari perbedaan.",langkah:["Cari opsi yang menunjukkan penyesuaian diri (mempelajari, bertanya, menyesuaikan cara).","Cek: apakah tugas tetap jalan? Opsi yang hanya \u201Cmenghormati\u201D tapi tugas mangkrak bukan jawaban terbaik.","Buang opsi yang memaksakan cara sendiri atau yang menghindar dari perbedaan."],contoh:"\u201CDitugaskan ke daerah dengan adat berbeda; warga keberatan dengan caramu bekerja.\u201D \u2192 Mempelajari adat setempat, menyesuaikan cara kerja, dan tetap menjalankan tugas sesuai aturan.",jebakan:"\u201CTetap bekerja seperti biasa, adat bukan urusan kantor\u201D — memaksakan cara sendiri; atau sebaliknya \u201Cmenyerah dan minta dipindah\u201D — menghindar total."},
{tp:"TIK dan literasi digital",t:"TIK — Aman Dulu, Cepat Kemudian",inti:"Pilih opsi yang aman dulu: cek sumber, jangan sebarkan data, gunakan kanal resmi. Di soal TIK, opsi \u201Ccepat tapi berisiko\u201D hampir selalu kalah dari \u201Cagak lambat tapi aman dan terdokumentasi\u201D.",langkah:["Cari opsi yang memverifikasi dulu sebelum menyebar/menggunakan.","Cek: apakah data pribadi dilindungi? Apakah ada jejak/dokumentasi?","Buang opsi yang mengutamakan kecepatan di atas keamanan."],contoh:"\u201CMenerima pesan berantai berisi data warga di grup kerja.\u201D \u2192 Tidak meneruskan pesan itu; verifikasi ke sumber resmi, dan laporkan bila sudah dipastikan hoaks.",jebakan:"\u201CTeruskan dulu agar cepat, nanti dikoreksi bila salah\u201D — data yang sudah tersebar tidak bisa ditarik kembali."},
{tp:"Profesionalisme",t:"Profesionalisme — Aturan + Dapat Dipertanggungjawabkan",inti:"Pilih opsi yang konsisten dengan aturan + dapat dipertanggungjawabkan secara tertulis. \u201CDemi kebaikan\u201D tanpa prosedur bukan profesionalisme.",langkah:["Cari opsi yang mengikuti prosedur dan meninggalkan jejak tertulis.","Waspada opsi yang melanggar aturan dengan alasan \u201Cdemi kebaikan\u201D atau \u201Cdemi kecepatan\u201D.","Bila ada kendala, opsi terbaik biasanya: sampaikan kendala + minta arahan + tetap berusaha menyelesaikan."],contoh:"\u201CAtasan memberi tugas di luar keahlianmu dengan tenggat dekat.\u201D \u2192 Menyampaikan kendala, meminta arahan, dan belajar cepat dari rekan atau panduan agar tetap selesai.",jebakan:"\u201CMenerima dan mengerjakan sebisanya tanpa bertanya\u201D — terlihat patuh, tapi menyembunyikan kendala yang bisa menggagalkan tugas. Atau \u201Cmenolak mentah-mentah\u201D — tidak profesional."},
{tp:"Anti radikalisme",t:"Anti-Radikalisme — Tolak dengan Damai + Lapor Jalur Resmi",inti:"Pilih opsi yang menolak paham kekerasan/ekstrem dengan cara damai + lapor lewat jalur resmi. Hindari opsi yang membalas dengan kekerasan atau yang diam saja karena \u201Cbukan urusan saya\u201D.",langkah:["Cari opsi penolakan yang tegas tapi damai (bukan konfrontasi).","Cek: apakah ada tindakan lanjut (melapor, mengedukasi)?","Buang opsi \u201Cdiam saja\u201D dan opsi \u201Cmembalas dengan kekerasan\u201D."],contoh:"\u201CRekan mengajak bergabung ke kelompok yang menolak Pancasila.\u201D \u2192 Menolak dengan tegas dan santun, lalu melaporkan ke atasan melalui jalur resmi.",jebakan:"\u201CMenolak tapi tidak melapor\u201D — kurang dari skor tertinggi karena tidak ada tindakan lanjut. Atau \u201Cikut berdebat keras agar dia kalah\u201D — membalas dengan konfrontasi, bukan cara damai."}
];
const TEKNIK=[
{t:"Urutan Pengerjaan: TKP Dulu, TIU Terakhir",inti:"Kerjakan TKP dulu (\u00B115 menit, tanpa hitungan, otak masih segar) \u2192 TWK (\u00B120 menit) \u2192 TIU terakhir (\u00B145 menit); sisakan 20 menit untuk meninjau soal yang ditandai.",langkah:["Menit 0–15: selesaikan 45 soal TKP (\u00B120 detik/soal — TKP tidak butuh hitungan, hanya penilaian cepat).","Menit 15–35: kerjakan 30 soal TWK (\u00B140 detik/soal).","Menit 35–80: kerjakan 35 soal TIU (\u00B175 detik/soal — bagian tersulit, butuh otak paling segar yang tersisa).","Menit 80–100: kembali ke soal yang ditandai, periksa jawaban yang ragu."],contoh:"Peserta yang mengerjakan TIU dulu sering kehabisan waktu di TKP — padahal TKP 45 soal adalah porsi terbesar (41% soal) dan paling cepat dikerjakan bila otak segar.",jebakan:"Teknik ini memakai panel navigasi soal (pindah antar subtes). Pastikan kamu sudah berlatih pindah subtes di simulasi, bukan baru mencoba di hari ujian."},
{t:"Eliminasi — Buang 3 Opsi yang Jelas Salah Dulu",inti:"Buang 3 opsi yang jelas salah dulu sehingga peluang jawabanmu naik dari 20% menjadi 50% — lalu bandingkan 2 opsi yang tersisa.",langkah:["Baca semua opsi sebelum memilih.","Coret opsi yang jelas salah (pasal salah topik, arti berlawanan, angka mustahil).","Bandingkan 2 opsi tersisa dengan inti pertanyaan — pilih yang paling tepat, bukan yang paling \u201Cterdengar benar\u201D."],contoh:"\u201CSemboyan Bhinneka Tunggal Ika dikutip dari kitab \u2026\u201D \u2192 buang Negarakertagama (kitab sejarah), Pararaton (kitab raja-raja), Arjunawiwaha \u2192 sisa Sutasoma vs Bharatayuddha \u2192 Sutasoma.",jebakan:"Memilih opsi pertama yang \u201Cterasa benar\u201D tanpa membaca semua opsi — opsi jebakan sering ditaruh di awal."},
{t:"Jangan Kosongkan Jawaban Apa Pun",inti:"Tidak ada pengurangan nilai untuk jawaban salah — jawaban salah dan jawaban kosong sama-sama 0, tapi tebakan punya peluang benar.",langkah:["Jawab semua soal, tanpa kecuali.","Bila ragu, pilih jawaban yang paling mungkin (pakai teknik eliminasi dulu), lalu tandai untuk ditinjau.","Di 5 menit terakhir, pastikan tidak ada satu pun soal yang kosong — isi dengan tebakan terbaik."],contoh:"5 soal tersisa, waktu 2 menit — isi kelimanya dengan tebakan terbaik. 1 dari 5 itu mungkin benar (5 poin); dibiarkan kosong, 0 poin pasti.",jebakan:"Meninggalkan soal kosong karena \u201Ctakut salah\u201D — rasa takut itu keliru secara matematis: salah = kosong = 0, tebakan \u2265 0."},
{t:"Skimming — Baca Pertanyaan Dulu, Baru Teks Panjang",inti:"Untuk soal teks panjang (TKP/TWK), baca kalimat pertanyaan dulu (biasanya di akhir), baru baca teksnya dengan fokus pada yang ditanyakan.",langkah:["Lompat ke kalimat pertanyaan di akhir soal (\u201CSikapmu \u2026\u201D, \u201CYang paling tepat adalah \u2026\u201D).","Catat kata kuncinya.","Baca teks/skenario sambil mencari kata kunci itu — lewati detail yang tidak ditanya."],contoh:"Skenario TKP 5 baris tentang warga marah di antrean — baca dulu \u201CSikapmu \u2026\u201D, lalu baca skenario hanya untuk mencari: siapa yang marah, apa masalahnya, apa yang bisa kamu lakukan.",jebakan:"Membaca skenario dari awal sampai akhir tanpa tahu yang ditanya — buang 30–60 detik per soal untuk detail yang tidak dipakai."},
{t:"Aturan 1 Menit — Soal Sulit Dilewati Dulu, Tandai, Kembali Nanti",inti:"Bila 1 menit belum ketemu jalannya, tandai soal itu dan lanjut — kembali bila ada sisa waktu di 20 menit cadangan.",langkah:["Kerjakan soal; bila 60 detik belum ada jalan keluar, tandai (\u201CTandai untuk ditinjau\u201D).","Lanjut ke soal berikutnya tanpa menoleh.","Di menit 80–100, kembali ke semua soal yang ditandai dengan otak yang sudah \u201Cpanas\u201D."],contoh:"Deret angka yang polanya tidak ketemu dalam 60 detik — tandai, kerjakan soal lain. Sering kali polanya baru terlihat setelah mengerjakan soal lain.",jebakan:"Bertahan 5 menit di 1 soal (5 poin) sambil mengorbankan 3 soal lain yang bisa dikerjakan (15 poin). Satu soal tidak sebanding dengan tiga soal."},
{t:"Silogisme — \u201CSebagian + Semua = Sebagian\u201D",inti:"Bila salah satu premis memakai \u201CSebagian\u201D, kesimpulan yang pasti benar juga memakai \u201CSebagian\u201D (atau \u201CAda\u201D) — tidak pernah \u201CSemua\u201D.",langkah:["Cari kata \u201Csebagian\u201D atau \u201Cada\u201D di premis.","Buang semua kesimpulan yang memakai kata \u201Csemua\u201D.","Uji kesimpulan \u201Csebagian\u201D yang tersisa terhadap premis."],contoh:"\u201CSemua pegawai disiplin. Sebagian pegawai berkacamata.\u201D \u2192 kesimpulan yang pasti benar: \u201CSebagian yang berkacamata adalah pegawai disiplin.\u201D (Bukan \u201Csemua yang berkacamata adalah pegawai\u201D.)",jebakan:"Kesimpulan yang memakai \u201Csemua\u201D padahal premisnya \u201Csebagian\u201D — kata \u201Csemua\u201D tidak pernah lahir dari premis \u201Csebagian\u201D."},
{t:"Deret Angka — Cek Selisih Kiri ke Kanan Dulu",inti:"Selalu tulis selisih antar suku, kiri ke kanan, sebelum memikirkan pola lain.",langkah:["Tulis selisih tiap pasangan suku berurutan.","Bila selisih tetap \u2192 deret tambah/kurang, jawabannya ketemu.","Bila selisih berubah, cek selisih dari selisih itu (pola tingkat 2) atau cek rasio."],contoh:"\u201C3, 7, 11, 15, \u2026\u201D \u2192 selisih +4, +4, +4 \u2192 suku berikutnya 19.",jebakan:"Mengira pola \u00D72 (3\u21927 bukan \u00D72) padahal selisihnya tetap — kebiasaan menebak \u201Ckali\u201D duluan membuat pola tambah yang sederhana terlewat."},
{t:"Tabel Pecahan Istimewa untuk Hitung Cepat",inti:"Hafalkan tabel ini — sebagian besar soal persen dan hitung cepat selesai dalam 1 langkah bila persennya langsung diganti pecahan.",langkah:["Kenali persen di soal, ganti dengan pecahannya dari tabel.","Hitung dengan pecahan (bagi dulu, kali kemudian — angkanya lebih kecil).","Cocokkan dengan opsi; bila tidak ada yang cocok, baru hitung cara panjang."],contoh:"\u201C12,5% dari 640 = \u2026\u201D \u2192 1/8 \u00D7 640 = 80.",jebakan:"Menghitung 12,5% sebagai 125/1000 \u00D7 640 secara manual — lambat dan rawan salah koma. Hafalkan 1/8 = 12,5%.",tabel:[["1/2","50%","1/3","33,3%"],["1/4","25%","2/3","66,7%"],["3/4","75%","1/5","20%"],["1/8","12,5%","2/5","40%"],["3/8","37,5%","1/10","10%"],["1/6","16,7%","1/20","5%"]]},
{t:"Pola Analogi yang Sering Keluar: Fungsi, Bagian–Keseluruhan, Sebab–Akibat",inti:"Sebagian besar soal analogi hanya memakai 3 jenis hubungan — kenali jenisnya dulu, baru uji opsi.",langkah:["Tentukan jenis hubungan pasangan soal: fungsi (dipakai untuk apa), bagian–keseluruhan (bagian dari apa), atau sebab–akibat (menyebabkan apa).","Terapkan jenis hubungan yang sama ke tiap opsi.","Pilih opsi yang jenis hubungannya identik."],contoh:"Fungsi — \u201CKunci : Pintu\u201D (kunci dipakai untuk membuka pintu) \u2192 \u201CPulpen : Kertas\u201D (pulpen dipakai untuk menulis di kertas). Bagian–keseluruhan — \u201CJari : Tangan\u201D. Sebab–akibat — \u201CHujan : Basah\u201D.",jebakan:"Memilih opsi yang katanya mirip dengan kata soal (mis. \u201CKunci : Gembok\u201D — memang terkait, tapi hubungannya bukan fungsi \u201Cmembuka\u201D, melainkan \u201Cpasangan alat\u201D)."},
{t:"Kata Kunci TWK — Petakan Kasus ke Topik dalam 5 Detik",inti:"Hafal pemetaan kata kunci ini — sebagian besar soal TWK bisa dipetakan ke topiknya sebelum membaca opsi.",langkah:["Baca kasus, cari kata kuncinya.","Petakan: kejujuran / penolakan korupsi atau gratifikasi \u2192 Integritas.","Gotong royong, guyub, gelora persatuan (\u201CTiga G\u201D) \u2192 Sila ke-3, Persatuan Indonesia.","Bedakan Sila ke-2 (empati personal pada satu orang) vs Sila ke-5 (kesejahteraan bersama, keadilan untuk semua)."],contoh:"\u201CPejabat menolak hadiah dari rekanan proyek.\u201D \u2192 kata kunci \u201Cmenolak hadiah\u201D \u2192 Integritas.",jebakan:"\u201CMembantu tetangga yang kelaparan\u201D — empati personal \u2192 Sila ke-2, bukan ke-5. Sila ke-5 dipakai untuk kasus keadilan/kesejahteraan bersama (mis. pembagian bantuan yang merata, upah yang adil)."},
{t:"TKP — Pilih Jawaban Paling Proaktif, Solutif, Kolaboratif",inti:"Di soal TKP, skor 5 hampir selalu opsi yang bertindak duluan (proaktif), menyelesaikan masalah (solutif), dan melibatkan orang lain (kolaboratif). Hindari jawaban pasif atau menunggu perintah.",langkah:["Cari opsi yang BERTINDAK (bukan hanya menjelaskan atau menunggu).","Cek: apakah opsi itu menyelesaikan masalah dan melibatkan orang lain?","Buang opsi \u201Cmenunggu\u201D, \u201Cmembiarkan\u201D, \u201Cmenyerahkan sepenuhnya ke orang lain\u201D."],contoh:"\u201CRekan baru kesulitan memakai aplikasi kantor.\u201D \u2192 \u201CMeluangkan beberapa menit menjelaskan inti, lalu membagikan panduan tertulis\u201D (proaktif + solutif + memandirikan) — bukan \u201Cmengerjakan tugas rekan itu sendiri\u201D (tidak kolaboratif).",jebakan:"Opsi yang terdengar baik tapi pasif — \u201Cakan membantu bila diminta\u201D — menunggu diminta bukan proaktif. Skor 5 selalu bergerak duluan."}
];

const HAFAL=[
{t:"Mnemonik / Jembatan Keledai — Akronim dan Kalimat Kunci",inti:"Ubah daftar yang harus dihafal menjadi 1 kata atau 1 kalimat yang mudah diingat — otak mengingat cerita lebih mudah daripada daftar.",langkah:["Ambil huruf awal tiap butir, rangkai jadi kata/kalimat.","Ucapkan kalimat itu 3 kali sambil menunjuk butir aslinya.","Uji diri: tulis butirnya dari kalimat kuncinya saja, tanpa melihat catatan."],contoh:"5 sila Pancasila: \u201CKakekku Pergi Ke Kebun\u201D \u2192 KakeTUHANan – KEmanusiaan – PERsatuan – KErakyatan – KEadilan. Pasal UUD kunci: \u201CWarga yang SAMA kedudukannya (27), berAGAMA (29), ikut BELA negara (30), SEKOLAH (31), EKONOMI bersama (33), berbahasa Indonesia (36).\u201D Tanggal 1945: \u201CLahir – Piagam – Merdeka – Sah\u201D \u2192 1 Juni lahirnya Pancasila – 22 Juni Piagam Jakarta – 17 Agustus Proklamasi – 18 Agustus UUD disahkan.",jebakan:"Mnemonik yang terlalu panjang sama sulitnya dengan daftar aslinya — 1 kalimat maksimal 7 kata. Bila kalimat kuncimu lebih panjang dari yang dihafal, buat ulang yang lebih pendek."},
{t:"Spaced Repetition — Ulang 1 Hari \u2192 3 Hari \u2192 7 Hari",inti:"Ulang materi dengan jarak yang makin jauh: besok (1 hari), 3 hari lagi, 7 hari lagi. Cara ini mengalahkan lupa jauh lebih efektif daripada mengulang 10 kali dalam sehari.",langkah:["Hari belajar = Hari 0. Tulis tanggal ulangnya di catatan: +1, +3, +7.","Tiap sesi ulang maksimal 15 menit per bab — cukup baca cepat + uji diri 5 soal.","Bila satu bab masih gagal di ulangan +7, ulangi siklusnya dari awal untuk bab itu saja."],contoh:"Pancasila dipelajari Senin \u2192 ulang Selasa (+1) \u2192 ulang Kamis (+3) \u2192 ulang Senin depan (+7). Empat sentuhan singkat mengalahkan satu sesi maraton 2 jam.",jebakan:"Mengulang materi yang sudah hafal dan mengabaikan yang belum — sesi ulang harus diawali dengan uji diri, bukan membaca ulang dari awal."},
{t:"Chunking — Kelompokkan Materi per Bab, 5–7 Butir Sekelompok",inti:"Jangan menghafal 50 pasal sekaligus. Pecah jadi kelompok kecil per bab — satu kelompok 5–7 butir, sesuai kapasitas ingatan jangka pendek.",langkah:["Bagi kisi-kisi jadi 6 bab: Pancasila, UUD, Sejarah, NKRI, Bela Negara + Integritas, Bahasa Indonesia.","Tiap bab dipecah lagi jadi kelompok 5–7 butir (mis. UUD \u2192 kelompok \u201Cpasal hak warga\u201D 27/28/29/30/31, kelompok \u201Cpasal lembaga\u201D 1/6/18/20).","Hafalkan 1 kelompok sampai lancar, baru pindah ke kelompok berikutnya."],contoh:"Pasal UUD yang sering keluar dibagi 3 kelompok: (a) hak warga — 27, 28, 29, 30, 31; (b) lembaga negara — 1, 6, 18, 20, 37; (c) perekonomian & bahasa — 33, 34, 36. Tiga kelompok kecil lebih mudah daripada 13 pasal sekaligus.",jebakan:"Menghafal urutan nomor pasal tanpa memahami isinya — soal TWK menguji isi dan penerapan, bukan urutan nomor. Tiap kelompok harus disertai 1 kata kunci isinya."},
{t:"Mind Map — Peta Konsep Pancasila–UUD–Sejarah",inti:"Gambar 1 peta konsep yang menghubungkan bab-bab TWK — otak mengingat gambar + hubungan antarbab lebih kuat daripada daftar lurus.",langkah:["Tulis \u201CPilar Negara\u201D di tengah kertas A4.","Tarik 4 cabang: Pancasila, UUD 1945, NKRI, Sejarah.","Tiap cabang bercabang lagi (Pancasila \u2192 5 sila; UUD \u2192 pasal kunci; Sejarah \u2192 garis waktu) dan hubungkan cabang yang berkaitan dengan garis + kata penghubung (mis. \u201CSila ke-3 \u2192 Pasal 25A \u2192 Bhinneka\u201D).","Baca peta itu 5 menit setiap sesi ulang — jangan membaca catatan panjang."],contoh:"Garis penghubung \u201CSila ke-1 (Ketuhanan) \u2192 Pasal 29 (agama) \u2192 Piagam Jakarta (22 Juni 1945)\u201D — tiga bab terhubung dalam satu garis, dan satu garis itu menjawab tiga jenis soal.",jebakan:"Mind map yang terlalu ramai (semua fakta dimasukkan) sama tidak bergunanya dengan catatan panjang — maksimal 5 cabang utama, maksimal 5 butir per cabang."},
{t:"Feynman — Jelaskan Kembali Seolah Mengajar",inti:"Pilih 1 topik, jelaskan keras-keras dengan kata sendiri seolah mengajar teman. Bagian yang tersendat saat menjelaskan = bagian yang belum dipahami.",langkah:["Pilih 1 topik kecil (mis. \u201Cmengapa Pasal 27 ayat 3 soal bela negara\u201D).","Jelaskan dengan kata sendiri, tanpa melihat catatan, selama 2 menit.","Bagian yang tersendat \u2192 baca ulang catatan bagian itu saja \u2192 jelaskan lagi dari awal.","Ulangi sampai penjelasanmu lancar tanpa jeda."],contoh:"\u201CPasal 27 ayat 3 bilang setiap warga negara berhak dan wajib ikut serta dalam usaha pembelaan negara. Artinya bela negara bukan cuma tugas tentara — warga biasa ikut lewat taat hukum, bayar pajak, dan gotong royong.\u201D — bila kamu bisa mengucapkan kalimat seperti itu tanpa melihat catatan, topik itu sudah dikuasai.",jebakan:"Menjelaskan dengan membaca catatan (bukan dari ingatan) — itu bukan Feynman, itu membaca. Tutup catatan dulu, baru bicara."},
{t:"Flashcard — 1 Fakta per Kartu",inti:"1 kartu = 1 fakta. Depan kartu pertanyaan, belakang kartu jawaban. Cocok untuk tanggal dan pasal yang sering keluar.",langkah:["Buat kartu dari kertas kecil atau aplikasi flashcard gratis: depan = pertanyaan (\u201CPasal berapa yang mengatur bahasa negara?\u201D), belakang = jawaban (\u201CPasal 36\u201D).","Kocok, jawab 20 kartu per hari (\u00B110 menit).","Pisahkan kartu yang sudah dijawab benar 3 kali berturut-turut — jangan buang waktu mengulang yang sudah hafal."],contoh:"5 kartu awal: (1) \u201CBahasa negara diatur pasal?\u201D \u2192 36. (2) \u201CSumpah Pemuda tahun?\u201D \u2192 1928. (3) \u201CPasal 27 ayat 3 tentang?\u201D \u2192 bela negara. (4) \u201CPiagam Jakarta tanggal?\u201D \u2192 22 Juni 1945. (5) \u201CSila ke-4?\u201D \u2192 Kerakyatan.",jebakan:"Kartu yang berisi 2–3 fakta sekaligus (\u201CSebutkan pasal 27, 28, 29 beserta isinya\u201D) — kartu seperti itu tidak bisa dijawab benar/salah dengan cepat. Satu kartu, satu fakta."},

  const full=C.kind==="full";
  const mxs=full?MAXS:{TWK:30,TIU:40,TKP:50},mtot=ks.reduce((a,k)=>a+mxs[k],0);
  const pct=Math.round(tot/mtot*100);addHist(C.label,pct);
  if(C.scoreKey)saveLastScore(C.scoreKey,pct);
  const na=C.qs.filter((x,n)=>C.ans[n]===undefined).length;
  const allPass=full&&ks.every(k=>S[k]>=PG[k]);
  app.innerHTML=`<h1>Hasil ${esc(C.label)}</h1>
  ${full?`<div class="card"><p class="mut" style="text-align:center;margin:0">Status kelulusan simulasi (ketiga subtes harus lolos sekaligus)</p><p class="scorebig pass ${allPass?"y":"n"}">${allPass?"LOLOS":"BELUM LOLOS"}</p>
  ${ks.map(k=>{const p=S[k]>=PG[k];return `<div class="row2"><span><b>${k}</b> \u2014 passing grade ${PG[k]}</span><span><b>${S[k]}</b> / ${MAXS[k]} &nbsp;<span class="pass ${p?"y":"n"}">${p?"Lolos":"Belum"}</span></span></div><div class="bar" style="margin:0"><i style="width:${S[k]/MAXS[k]*100}%"></i></div>`}).join("")}
  <p class="mut" style="margin:10px 0 0;text-align:center">Total ${tot} poin \u00B7 ${na} soal tidak dijawab \u00B7 Simulasi v1 tanpa Figural</p></div>`
  :`<div class="card"><div class="ring">${ringSvg(pct)}</div><p style="text-align:center;margin:0 0 4px"><strong>${tot} dari ${mtot} poin</strong></p><p class="mut" style="text-align:center">${na} soal tidak dijawab.</p>
  ${ks.map(k=>`<div class="row2"><span>${k}</span><span>${S[k]} / ${mxs[k]}</span></div><div class="bar" style="margin:0"><i style="width:${S[k]/mxs[k]*100}%"></i></div>`).join("")}
  <p class="mut" style="margin:8px 0 0">Ini simulasi mini (24 soal), jadi ambang passing grade resmi tidak diterapkan di sini. Passing grade hanya dinilai di Simulasi Penuh.</p></div>`}
  <div class="disc">Hasil simulasi ini <b>bukan prediksi nilai SKD sebenarnya</b>. Aplikasi latihan mandiri \u2014 bukan aplikasi resmi BKN dan tidak menjamin kelulusan.</div>
  <h2>Pembahasan</h2>
  ${C.qs.map((it,n)=>{const q=it.q,a=C.ans[n],best=Math.max(...it.o.map(o=>o.p)),bi=it.o.findIndex(o=>o.p===best);return `<details class="card"><summary><b>${n+1}. [${q.k}]</b> ${esc(q.q)}</summary><p style="margin-top:8px">Jawabanmu: ${a===undefined?"<i>tidak dijawab</i>":esc(it.o[a].t)+" ("+it.o[a].p+" poin)"}</p><p>Jawaban terbaik: ${esc(it.o[bi].t)} (${best} poin)</p><p class="mut">${esc(q.e)}</p></details>`}).join("")}
  <button class="btn pri" id="ag">Kembali ke beranda</button>`;
  document.getElementById("ag").onclick=home;
  C=null;scrollTop();
}
/* ================= MULAI ================= */
if(typeof Q==="undefined"||!Q.length){app.innerHTML="<p style=\"padding:20px\">Bank soal gagal dimuat.</p>"}
else home();
</script>
